<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>איפוס סיסמה — שקוף בחזית CRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .logo { font-size: 36px; margin-bottom: 8px; }
    h1 { font-size: 22px; color: #1e293b; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }
    label { display: block; text-align: right; font-size: 13px; color: #475569; margin-bottom: 6px; font-weight: 600; }
    .field { margin-bottom: 16px; }
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      text-align: right;
      direction: ltr;
    }
    input[type="password"]:focus { border-color: #6366f1; }
    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 13px; display: none; }
    .msg.error { color: #dc2626; }
    .msg.success { color: #16a34a; }
    a.back { display: block; margin-top: 16px; font-size: 13px; color: #6366f1; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎭</div>
    <h1>שקוף בחזית CRM</h1>
    <p class="sub">הגדרת סיסמה חדשה</p>

    <div id="formArea">
      <div class="field">
        <label>סיסמה חדשה</label>
        <input type="password" id="pw1" placeholder="לפחות 6 תווים..." />
      </div>
      <div class="field">
        <label>אימות סיסמה</label>
        <input type="password" id="pw2" placeholder="הכנס שוב את הסיסמה..." onkeydown="if(event.key==='Enter')reset()" />
      </div>
      <button class="btn" id="submitBtn" onclick="reset()">שמור סיסמה</button>
    </div>

    <div class="msg" id="msg"></div>
    <a class="back" href="/login">חזרה לכניסה</a>
  </div>

  <script>
    const token = location.pathname.split('/').pop();

    async function reset() {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      const msg = document.getElementById('msg');
      msg.style.display = 'none';

      if (pw1.length < 6) { showMsg('הסיסמה חייבת להכיל לפחות 6 תווים', 'error'); return; }
      if (pw1 !== pw2)    { showMsg('הסיסמאות אינן תואמות', 'error'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'שומר...';

      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw1 }),
      });
      const data = await res.json();
      btn.disabled = false;
      btn.textContent = 'שמור סיסמה';

      if (res.ok) {
        document.getElementById('formArea').style.display = 'none';
        showMsg('✅ הסיסמה עודכנה בהצלחה! מעביר לכניסה...', 'success');
        setTimeout(() => { window.location.href = '/login'; }, 2500);
      } else {
        showMsg(data.error || 'שגיאה באיפוס הסיסמה', 'error');
      }
    }

    function showMsg(text, type) {
      const msg = document.getElementById('msg');
      msg.className = `msg ${type}`;
      msg.textContent = text;
      msg.style.display = 'block';
    }
  </script>
</body>
</html>
