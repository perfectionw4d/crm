      </div>

      {/* Filters */}
      <div style={{display:'flex',gap:10,marginBottom:18,flexWrap:'wrap'}}>
        <input className="inp" placeholder="חיפוש..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:160,maxWidth:280}}/>
        <select className="inp" value={filterType} onChange={e=>setFilterType(e.target.value)} style={{width:'auto',minWidth:140}}>
          <option value="all">כל הסוגים</option>
          {Object.entries(PROJ_TYPES).map(([k,v])=><option key={k} value={k}>{v.emoji} {v.lbl}</option>)}
        </select>
        <select className="inp" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{width:'auto',minWidth:120}}>
          <option value="all">כל הסטטוסים</option>
          {Object.entries(PROJ_STATUS).map(([k,v])=><option key={k} value={k}>{v.lbl}</option>)}
        </select>
      </div>

      {filtered.length===0&&(
        <div style={{textAlign:'center',padding:'60px 0',color:'#94a3b8'}}>
          <div style={{fontSize:48,marginBottom:12}}>📁</div>
          <div style={{fontSize:16,marginBottom:8}}>אין פרויקטים עדיין</div>
          <button className="btn btn-primary" onClick={()=>setAddModal(true)}>צור פרויקט ראשון</button>
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:14}}>
        {filtered.map(proj=>{
          const pt = getProjType(proj.type);
          const ps = getProjStatus(proj.status);
          const subCount = projects.filter(p=>p.parentProjectId===proj.id).length;
          const prodCount = (proj.products||[]).length;
          const projContactIds = proj.contactIds || (proj.contactId ? [proj.contactId] : []);
          const projClients = projContactIds.map(id => contacts.find(c=>c.id===id)).filter(Boolean);
          return (
            <div key={proj.id} className="card" style={{padding:18,cursor:'pointer',transition:'box-shadow .15s'}}
              onClick={()=>onView(proj.id)}
              onMouseEnter={e=>e.currentTarget.style.boxShadow='0 4px 16px rgba(0,0,0,.12)'}
              onMouseLeave={e=>e.currentTarget.style.boxShadow=''}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:22}}>{pt.emoji}</span>
                  <div>
                    <div style={{fontWeight:700,fontSize:15}}>{proj.name}</div>
                    <div style={{fontSize:12,color:'#94a3b8'}}>{pt.lbl}</div>
                  </div>
                </div>
                <span className="badge" style={{background:ps.bg,color:ps.cl,fontSize:11}}>{ps.lbl}</span>
              </div>
              {proj.notes&&<div style={{fontSize:12,color:'#64748b',marginBottom:10,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{proj.notes}</div>}
              <div style={{display:'flex',gap:12,fontSize:12,color:'#94a3b8',flexWrap:'wrap'}}>
                {proj.dueDate&&<span>🏁 {proj.dueDate}</span>}
                {projClients.length>0&&<span>👤 {projClients.map(c=>c.name).join(', ')}</span>}
                {subCount>0&&<span>📂 {subCount} תת-פרויקטים</span>}
                {prodCount>0&&<span>🛒 {prodCount} מוצרים</span>}
              </div>
            </div>
          );
        })}
      </div>

      {addModal&&<ProjectModal contacts={contacts} projects={projects} onSave={d=>{onAdd(d);setAddModal(false);}} onClose={()=>setAddModal(false)}/>}
    </div>
  );
}

// ─── Projects Strip (Dashboard widget) ───────────────────────────────────────
function ProjectsStrip({ projects=[], tasks=[], go }) {
  const [collapsed, setCollapsed] = useState(false);

  const activeProjects = projects
    .filter(p => p.status === 'active')
    .sort((a,b) => (a.dueDate||'9999').localeCompare(b.dueDate||'9999'));

  if (activeProjects.length === 0) return null;

  const getProgress = (proj) => {
    const pts = tasks.filter(t => t.projectId === proj.id);
    if (pts.length === 0) return 0;
    return Math.round(pts.filter(t => t.completed).length / pts.length * 100);
  };

  const fmtDue = (d) => {
    if (!d) return null;
    try {
      return new Date(d + 'T12:00:00').toLocaleDateString('he-IL', { day:'numeric', month:'short' });
    } catch { return d; }
  };

  const isOverdue = (d) => d && d < new Date().toISOString().split('T')[0];

  if (collapsed) return (
    <div className="card" style={{padding:'12px 20px',marginBottom:20,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:17}}>📁</span>
        <span style={{fontWeight:700,fontSize:15}}>פרויקטים פעילים</span>
        <span className="badge" style={{background:'#eef2ff',color:'#4f46e5'}}>{activeProjects.length}</span>
      </div>
      <button className="btn btn-secondary btn-sm" onClick={()=>setCollapsed(false)}>הצג ▼</button>
    </div>
  );

  return (
    <div className="card" style={{padding:0,marginBottom:20,overflow:'hidden'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px',borderBottom:'1px solid #f1f5f9'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:17}}>📁</span>
          <span style={{fontWeight:700,fontSize:15}}>פרויקטים פעילים</span>
          <span className="badge" style={{background:'#eef2ff',color:'#4f46e5'}}>{activeProjects.length}</span>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary btn-sm" onClick={()=>go('projects')}>כל הפרויקטים</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCollapsed(true)}>▲</button>
        </div>
      </div>

      {/* Project rows */}
      <div style={{padding:'8px 0'}}>
        {activeProjects.map((proj, i) => {
          const progress = getProgress(proj);
          const pt = getProjType(proj.type);
          const due = fmtDue(proj.dueDate);
          const overdue = isOverdue(proj.dueDate);
          const projTasks = tasks.filter(t => t.projectId === proj.id);
          const doneTasks = projTasks.filter(t => t.completed).length;

          return (
            <div key={proj.id}
              onClick={() => go('project-detail', proj.id)}
              style={{
                display:'flex', alignItems:'center', gap:14,
                padding:'11px 18px',
                borderBottom: i < activeProjects.length-1 ? '1px solid #f8fafc' : 'none',
                cursor:'pointer', transition:'background .12s',
              }}
              onMouseEnter={e=>e.currentTarget.style.background='#f8fafc'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>

              {/* Emoji */}
              <span style={{fontSize:18,flexShrink:0}}>{pt.emoji}</span>

              {/* Name */}
              <div style={{minWidth:0,flex:'0 0 200px'}}>
                <div style={{fontWeight:600,fontSize:14,color:'#1e293b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {proj.name}
                </div>
                <div style={{fontSize:11,color:'#94a3b8',marginTop:1}}>
                  {doneTasks}/{projTasks.length} משימות
                </div>
              </div>

              {/* Progress bar */}
              <div style={{flex:1,minWidth:80}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:11,color:'#64748b'}}></span>
                  <span style={{fontSize:12,fontWeight:700,color: progress===100?'#16a34a':'#4f46e5'}}>{progress}%</span>
                </div>
                <div style={{background:'#e2e8f0',borderRadius:99,height:7,overflow:'hidden'}}>
                  <div style={{
                    width: progress+'%',
                    background: progress===100 ? '#16a34a' : progress>60 ? '#4f46e5' : progress>30 ? '#d97706' : '#e2e8f0',
                    height:'100%', borderRadius:99, transition:'width .4s',
                    minWidth: progress>0?4:0,
                  }}/>
                </div>
              </div>

              {/* Due date */}
              <div style={{flexShrink:0,textAlign:'left',minWidth:70}}>
                {due && (
                  <span style={{
                    fontSize:12, fontWeight:600,
                    color: overdue ? '#dc2626' : '#64748b',
                    background: overdue ? '#fee2e2' : '#f1f5f9',
                    padding:'2px 8px', borderRadius:20,
                  }}>
                    {overdue ? '⚠️ ' : '🏁 '}{due}
                  </span>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({ data, go, onNew, onEditTask, onUpdateTask, wa }) {
  const { orgs, contacts, tasks, shows=[], quotes: allQuotes=[] } = data;
  const todayStr = today();
  const allItems = [...orgs.map(o=>({...o,_k:'org'})), ...contacts.map(c=>({...c,_k:'contact'}))];
  const stats = {
    total: allItems.length,
    leads: allItems.filter(i=>i.status==='lead').length,
    warm:  allItems.filter(i=>i.status==='warm').length,
    booked:allItems.filter(i=>i.status==='booked').length,
    vip:   allItems.filter(i=>i.status==='vip').length,
    followUps: allItems.filter(i=>i.nextFollowUp && i.nextFollowUp<=todayStr).length,
    pendingTasks: tasks.filter(t=>!t.completed && t.type!=='event').length,
    todayEvents: tasks.filter(t=>t.type==='event' && !t.completed && t.dueDate===todayStr).length,
  };
  const followUps = allItems.filter(i=>i.nextFollowUp).sort((a,b)=>a.nextFollowUp.localeCompare(b.nextFollowUp)).slice(0,5);

  // Open quotes (draft/sent/viewed)
  const OPEN_Q_ST = ['draft','sent','viewed'];
  const Q_ST_LABELS = { draft:{lbl:'טיוטה',bg:'#f1f5f9',cl:'#64748b'}, sent:{lbl:'נשלחה',bg:'#eff6ff',cl:'#3b82f6'}, viewed:{lbl:'נצפתה 👁️',bg:'#fef3c7',cl:'#d97706'}, approved:{lbl:'אושרה ✅',bg:'#f0fdf4',cl:'#16a34a'}, rejected:{lbl:'נדחתה',bg:'#fff1f2',cl:'#e11d48'} };
  const [dashQStatuses, setDashQStatuses] = React.useState({});
  const openQuotes = allQuotes
    .filter(q => OPEN_Q_ST.includes(dashQStatuses[q.id] || q.status || 'draft'))
    .sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  const openQuotesNetTotal = openQuotes.reduce((s,q) => s + (q.price||0), 0);
  const changeQStatus = async (id, status) => {
    try {
      await api.put(`/api/quotes/${id}/status`, { status });
      setDashQStatuses(p => ({ ...p, [id]: status }));
    } catch(e) { alert('שגיאה: ' + e.message); }
  };

  // WhatsApp unread (conversations where last msg is incoming)
  const [waDashMsgs, setWaDashMsgs] = React.useState([]);
  React.useEffect(() => {
    api.get('/api/wa/messages').then(d => setWaDashMsgs(Array.isArray(d)?d:[])).catch(()=>{});
    const id = setInterval(() => {
      api.get('/api/wa/messages').then(d => setWaDashMsgs(Array.isArray(d)?d:[])).catch(()=>{});
    }, 30000);
    return () => clearInterval(id);
  }, []);
  // Group by phone, count conversations where last message is received (= waiting for reply)
  const waUnanswered = React.useMemo(() => {
    const byPhone = {};
    waDashMsgs.forEach(m => {
      const k = m.rawPhone || m.phone || '?';
      if (!byPhone[k]) byPhone[k] = [];
      byPhone[k].push(m);
    });
    return Object.values(byPhone).filter(msgs => {
      const last = msgs.reduce((l,m) => m.timestamp>(l?.timestamp||0)?m:l, null);
      return last?.direction === 'received';
    }).length;
  }, [waDashMsgs]);

  // Recent emails
  const [recentEmails, setRecentEmails] = React.useState(null);
  const [emailsNoAuth, setEmailsNoAuth] = React.useState(false);
  const [emailsError, setEmailsError] = React.useState(null);
  const [emailsLoading, setEmailsLoading] = React.useState(false);
  const loadRecentEmails = async () => {
    setEmailsLoading(true); setEmailsError(null);
    try {
      const r = await fetch('/api/emails/recent');
      const d = await r.json();
      setEmailsNoAuth(!!d.noAuth);
      setEmailsError(d.error || null);
      setRecentEmails(d.emails || []);
    } catch(e) { setRecentEmails([]); setEmailsError(e.message); }
    finally { setEmailsLoading(false); }
  };
  React.useEffect(() => { loadRecentEmails(); }, []);

  // Dashboard email bulk select
  const [dashDismissed, setDashDismissed] = React.useState(new Set());
  const [dashSelected,  setDashSelected]  = React.useState(new Set());

  // Active contacts — last 14 days
  const twoWeeksAgo = new Date(); twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
  const twoWeeksStr = twoWeeksAgo.toISOString().split('T')[0];
  const activeContacts = contacts.filter(c => {
    if (c.createdAt && c.createdAt >= twoWeeksStr) return true;
    if (c.updatedAt && c.updatedAt >= twoWeeksStr) return true;
    if ((c.conversations||[]).some(cv => cv.date && cv.date >= twoWeeksStr)) return true;
    return false;
  }).sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0, 20);

  const fmtEmailDate = (dateStr) => {
    if (!dateStr) return '';
    try {
      const d = new Date(dateStr); const now = new Date();
      const diffDays = Math.floor((now - d) / 86400000);
      if (diffDays === 0) return d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
      if (diffDays < 7)  return d.toLocaleDateString('he-IL', {weekday:'short'});
      return d.toLocaleDateString('he-IL', {day:'numeric',month:'short'});
    } catch { return ''; }
  };
  const acctColor = (email) => {
    const palette = ['#4f46e5','#0891b2','#059669','#d97706','#dc2626','#7c3aed'];
    let h = 0; for (const ch of (email||'')) h = (h*31+ch.charCodeAt(0))&0xffff;
    return palette[h % palette.length];
  };
  const acctLabel = (email) => (email||'').split('@')[0] || email;

  // Today's conversation follow-ups
  const convFollowUps = [
    ...orgs.flatMap(o=>(o.conversations||[]).filter(cv=>cv.followUpDate===todayStr).map(cv=>({...cv,entityName:o.name,entityType:'org',entityId:o.id}))),
    ...contacts.flatMap(c=>(c.conversations||[]).filter(cv=>cv.followUpDate===todayStr).map(cv=>({...cv,entityName:c.name,entityType:'contact',entityId:c.id}))),
  ];

  // Today's events only
  const todayEvents = tasks.filter(t=>!t.completed && t.type==='event' && t.dueDate===todayStr);

  // Pending tasks — only נפתחה / בביצוע (or legacy without taskStatus)
  const pendingTasks = tasks.filter(t=>!t.completed && t.type!=='event' && t.dueDate
    && (!t.taskStatus || t.taskStatus==='נפתחה' || t.taskStatus==='בביצוע'))
    .sort((a,b)=>b.dueDate.localeCompare(a.dueDate))
    .slice(0,6);

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
        <div><h1 style={{fontSize:24,fontWeight:700}}>לוח בקרה</h1><p style={{color:'#64748b',fontSize:14,marginTop:2}}>ברוך הבא, ירון!</p></div>
        <button className="btn btn-primary" onClick={onNew}><I n="plus" s={15} c="#fff"/>הוסף חדש</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:14,marginBottom:16}}>
        {[
          ['person','אנשי קשר',stats.total,'#4f46e5','#eef2ff'],
          ['bell','מעקבים היום',stats.followUps,'#d97706','#fef3c7',stats.followUps>0],
          ['check','משימות פתוחות',stats.pendingTasks,'#0891b2','#cffafe'],
          ['calendar','פגישות היום',stats.todayEvents,'#7c3aed','#f3e8ff',stats.todayEvents>0],
          ['building','ארגונים',orgs.length,'#059669','#dcfce7'],
        ].map(([ic,lb,vl,cl,bg,urg])=>(
          <div key={lb} className="stat-card" style={{borderRight:urg?`3px solid ${cl}`:'3px solid transparent'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:38,height:38,background:bg,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <I n={ic} s={18} c={cl}/>
              </div>
              <div><div style={{fontSize:22,fontWeight:700}}>{vl}</div><div style={{fontSize:12,color:'#64748b'}}>{lb}</div></div>
            </div>
          </div>
        ))}
        {/* WhatsApp unanswered card */}
        <div className="stat-card" onClick={()=>go('wa')} style={{borderRight:waUnanswered>0?'3px solid #22c55e':'3px solid transparent',cursor:'pointer'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:38,height:38,background:'#dcfce7',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>
              📲
            </div>
            <div>
              <div style={{fontSize:22,fontWeight:700,color:waUnanswered>0?'#16a34a':'#1e293b'}}>{waUnanswered}</div>
              <div style={{fontSize:12,color:'#64748b'}}>ווטסאפ ממתינים</div>
              {waUnanswered>0 && <div style={{fontSize:11,color:'#166534',fontWeight:600}}>ממתין לתשובה</div>}
            </div>
          </div>
        </div>
        {/* Open quotes summary card */}
        <div className="stat-card" onClick={()=>go('quotes')} style={{borderRight:openQuotes.length>0?'3px solid #d97706':'3px solid transparent',cursor:'pointer'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:38,height:38,background:'#fef3c7',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <I n="doc" s={18} c="#d97706"/>
            </div>
            <div>
              <div style={{fontSize:22,fontWeight:700,color:openQuotes.length>0?'#d97706':'#1e293b'}}>{openQuotes.length}</div>
              <div style={{fontSize:12,color:'#64748b'}}>הצעות פתוחות</div>
              {openQuotes.length>0 && <div style={{fontSize:11,color:'#92400e',fontWeight:600}}>{openQuotesNetTotal.toLocaleString()} ₪ ללא מע"מ</div>}
            </div>
          </div>
        </div>
      </div>

      {/* ── Pipeline ────────────────────────────────────────────────────── */}
      <PipelineBoard contacts={contacts} quotes={allQuotes} onRefresh={()=>{}}/>

      {/* ── Projects Strip ──────────────────────────────────────────────── */}
      <ProjectsStrip projects={data.projects||[]} tasks={tasks} go={go}/>

      {/* ── Calendar ────────────────────────────────────────────────────── */}

      {/* ── WhatsApp Inbox ──────────────────────────────────────────────── */}

        <div style={{padding:'14px 20px',borderBottom:'1.5px solid #e2e8f0',display:'flex',justifyContent:'space-between',alignItems:'center',background:'#f0fdf4'}}>
          <h3 style={{fontSize:15,fontWeight:700,margin:0,color:'#166534',display:'flex',alignItems:'center',gap:8}}>
            📲 WhatsApp — תיבת הודעות
            {waUnanswered>0 && <span style={{background:'#22c55e',color:'white',borderRadius:10,padding:'1px 8px',fontSize:12,fontWeight:700,marginRight:8}}>{waUnanswered}</span>}
          </h3>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <span style={{fontSize:11,padding:'3px 10px',borderRadius:10,fontWeight:700,
              background:wa?.status==='ready'?'#dcfce7':'#fee2e2',
              color:wa?.status==='ready'?'#166534':'#dc2626'}}>
              {wa?.status==='ready'?'● מחובר':'● לא מחובר'}
            </span>
            <button className="btn btn-secondary btn-sm" onClick={()=>go('wa')} style={{fontSize:12}}>
              📲 כל הוואטסאפ →
            </button>
          </div>
        </div>
        <WaConversations contacts={contacts} waReady={wa?.status==='ready'}/>

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>

              📄 הצעות מחיר פתוחות ({openQuotes.length}) · {openQuotesNetTotal.toLocaleString()} ₪ ללא מע"מ
            </h3>
            <button className="btn btn-secondary btn-sm" onClick={()=>go('quotes')} style={{fontSize:12}}>כל ההצעות →</button>

                    {q.showName && <span> · {q.showName}</span>}

                  </div>
                </div>

                    paddingLeft:18,backgroundImage:"url(\"data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e\")",

      {convFollowUps.length>0 && (
        <div className="card" style={{padding:18,marginBottom:20,borderRight:'3px solid #7c3aed'}}>
          <h3 style={{fontSize:15,fontWeight:700,marginBottom:10,display:'flex',alignItems:'center',gap:8,color:'#7c3aed'}}>
            <I n="bell" s={15} c="#7c3aed"/>שיחות מעקב להיום ({convFollowUps.length})
          </h3>
          {convFollowUps.map(cv=>(
            <div key={cv.id+cv.entityId} onClick={()=>go(cv.entityType==='org'?'org-detail':'contact-detail',cv.entityId)}

                <span style={{fontSize:13,fontWeight:600}}>{cv.entityName}</span>

              </div>

        <div className="card" style={{padding:20}}>
          <h3 style={{fontSize:15,fontWeight:700,marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
            <I n="calendar" s={15} c="#7c3aed"/>📅 פגישות היום
          </h3>
          {todayEvents.length===0
            ? <p style={{color:'#94a3b8',fontSize:13}}>אין פגישות היום</p>
            : todayEvents.map(t=>(
              <div key={t.id} onClick={()=>onEditTask&&onEditTask(t)} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'7px 0',cursor:'pointer',borderBottom:'1px solid #f1f5f9'}}>
                <span style={{fontSize:16,marginTop:1}}>🎭</span>

                  <div style={{fontSize:13,fontWeight:600}}>{t.title}</div>
                  {t.startDateTime && <div style={{fontSize:12,color:'#64748b'}}>⏰ {fmtDT(t.startDateTime)}</div>}
                  {t.location && <div style={{fontSize:12,color:'#64748b'}}>📍 {t.location}</div>}
                </div>
              </div>

        </div>

        {/* Pending Tasks (newest → oldest, no-date at top) */}
        <div className="card" style={{padding:20}}>
          <h3 style={{fontSize:15,fontWeight:700,marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
            <I n="check" s={15} c="#4f46e5"/>📋 משימות פתוחות
          </h3>
          {pendingTasks.length===0

            : pendingTasks.map(t=>(
              <div key={t.id} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'7px 0',borderBottom:'1px solid #f1f5f9'}}>
                <input type="checkbox" checked={!!t.completed}
                  onChange={e=>{e.stopPropagation();onUpdateTask&&onUpdateTask(t.id,{...t,completed:e.target.checked,taskStatus:'הושלמה'});}}
                  style={{width:16,height:16,cursor:'pointer',accentColor:'#4f46e5',flexShrink:0,marginTop:2}}/>

                  <div style={{fontSize:13,fontWeight:600}}>{t.title}</div>
                  <div style={{fontSize:12,color:t.dueDate<todayStr?'#dc2626':'#64748b',display:'flex',gap:8,alignItems:'center'}}>
                    🗓 {fmtD(t.dueDate)}

      </div>

      {/* Recent Emails */}
      {(()=>{
        const visibleRecent = (recentEmails||[]).filter(em=>!dashDismissed.has(em.id));
        const visibleIds    = visibleRecent.map(em=>em.id);
        const toggleDash    = id => setDashSelected(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
        const toggleAllDash = () => setDashSelected(s=>s.size===visibleIds.length?new Set():new Set(visibleIds));
        const dismissDash   = () => { setDashDismissed(s=>new Set([...s,...dashSelected])); setDashSelected(new Set()); };
        return (
        <div className="card" style={{padding:20,marginBottom:20}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <h3 style={{fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:8}}>📧 מיילים אחרונים</h3>
            <button className="btn btn-secondary btn-sm" onClick={loadRecentEmails} disabled={emailsLoading} style={{fontSize:12}}>
              {emailsLoading ? '⏳' : '🔄 רענן'}
            </button>
          </div>
          {emailsLoading && <div style={{textAlign:'center',padding:20,color:'#94a3b8'}}>⏳ טוען מיילים...</div>}
          {!emailsLoading && emailsNoAuth && (
            <div style={{textAlign:'center',padding:16,color:'#92400e',background:'#fef3c7',borderRadius:8,fontSize:13}}>

              <br/><button className="btn btn-primary btn-sm" style={{marginTop:8,fontSize:12}} onClick={()=>go('settings')}>← הגדרות → חיבור לגוגל</button>
            </div>
          )}
          {!emailsLoading && emailsError && (
            <p style={{color:'#dc2626',fontSize:12,background:'#fef2f2',padding:'8px 12px',borderRadius:8}}>⚠️ שגיאה: {emailsError}</p>
          )}
          {!emailsLoading && !emailsNoAuth && !emailsError && recentEmails!==null && visibleRecent.length===0 && (
            <p style={{color:'#94a3b8',fontSize:13}}>לא נמצאו מיילים</p>
          )}
          {!emailsLoading && visibleRecent.length>0 && (
            <div>
              {/* Bulk bar */}
              {dashSelected.size>0 && (
                <div style={{background:'#4f46e5',color:'#fff',padding:'7px 12px',borderRadius:8,marginBottom:8,display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontWeight:700,fontSize:13}}>{dashSelected.size} נבחרו</span>
                  <button onClick={()=>setDashSelected(new Set())}
                    style={{background:'rgba(255,255,255,0.2)',border:'none',color:'#fff',cursor:'pointer',borderRadius:6,padding:'2px 8px',fontSize:12}}>✕</button>
                  <button onClick={dismissDash}
                    style={{marginRight:'auto',background:'#ef4444',border:'none',color:'#fff',cursor:'pointer',borderRadius:6,padding:'3px 12px',fontSize:12,fontWeight:600}}>
                    🗑️ הסתר נבחרים
                  </button>
                </div>
              )}
              {/* Select-all header */}
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'3px 4px 7px',borderBottom:'2px solid #f1f5f9',marginBottom:4}}>
                <input type="checkbox"
                  checked={visibleIds.length>0&&dashSelected.size===visibleIds.length}
                  ref={el=>{if(el) el.indeterminate=dashSelected.size>0&&dashSelected.size<visibleIds.length;}}
                  onChange={toggleAllDash} style={{cursor:'pointer',width:14,height:14}}/>
                <span style={{fontSize:12,color:'#94a3b8'}}>{dashSelected.size>0?`${dashSelected.size} נבחרו`:'בחר הכל'}</span>
              </div>
              {visibleRecent.slice(0,10).map(em=>{
                const isSel = dashSelected.has(em.id);
                return (
                  <div key={em.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 4px',borderBottom:'1px solid #f1f5f9',
                    background:isSel?'#eef2ff':'transparent',transition:'background 0.1s'}}
                    onMouseEnter={e=>{if(!isSel) e.currentTarget.style.background='#f8fafc';}}
                    onMouseLeave={e=>{if(!isSel) e.currentTarget.style.background='transparent';}}>
                    <input type="checkbox" checked={isSel} onChange={()=>toggleDash(em.id)}
                      style={{cursor:'pointer',width:14,height:14,flexShrink:0}}/>
                    <span style={{fontSize:15,flexShrink:0}}>{em.direction==='out'?'📤':'📥'}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2,flexWrap:'wrap'}}>
                        <span style={{fontWeight:600,fontSize:13,color:'#1e293b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:260}}>{em.subject}</span>
                        {em.account && (
                          <span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:acctColor(em.account)+'22',color:acctColor(em.account),fontWeight:600,border:`1px solid ${acctColor(em.account)}44`,whiteSpace:'nowrap'}}>
                            {acctLabel(em.account)}
                          </span>
                        )}
                      </div>
                      <div style={{fontSize:11,color:'#94a3b8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{em.direction==='in'?em.from:`אל: ${em.to}`}</div>
                    </div>
                    <div style={{fontSize:11,color:'#94a3b8',whiteSpace:'nowrap',flexShrink:0}}>{fmtEmailDate(em.date)}</div>
                    <a href={`https://mail.google.com/mail/u/?authuser=${encodeURIComponent(em.account||'')}#search/${em.id}`}
                      target="_blank" rel="noreferrer"
                      style={{fontSize:13,color:'#4f46e5',textDecoration:'none',flexShrink:0}} title="פתח ב-Gmail">↗</a>
                  </div>
                );
              })}
            </div>
          )}
        </div>
        );
      })()}

      {/* Active contacts — last 14 days */}
      <div className="card" style={{padding:20}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <h3 style={{fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:8}}>
            👥 אנשי קשר פעילים — שבועיים אחרונים
            <span style={{fontSize:12,color:'#94a3b8',fontWeight:400}}>({activeContacts.length})</span>
          </h3>
          <button className="btn btn-secondary btn-sm" style={{fontSize:12}} onClick={()=>go('contacts')}>כל אנשי הקשר ←</button>
        </div>
        {activeContacts.length===0
          ? <p style={{color:'#94a3b8',fontSize:13}}>אין פעילות חדשה בשבועיים האחרונים</p>
          : (
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead>
                  <tr>
                    <th style={{padding:'8px 12px',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'2px solid #f1f5f9',background:'#f8fafc',textAlign:'right'}}>שם פרטי</th>
                    <th style={{padding:'8px 12px',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'2px solid #f1f5f9',background:'#f8fafc',textAlign:'right'}}>שם משפחה</th>
                    <th style={{padding:'8px 12px',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'2px solid #f1f5f9',background:'#f8fafc',textAlign:'right'}}>טלפון</th>
                    <th style={{padding:'8px 12px',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'2px solid #f1f5f9',background:'#f8fafc',textAlign:'right'}}>מייל</th>
                    <th style={{padding:'8px 12px',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'2px solid #f1f5f9',background:'#f8fafc',textAlign:'right'}}>סטטוס</th>
                    <th style={{padding:'8px 12px',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'2px solid #f1f5f9',background:'#f8fafc',textAlign:'right'}}>נוצר</th>
                  </tr>
                </thead>
                <tbody>
                  {activeContacts.map(c => {
                    const nameParts = (c.name||'').trim().split(/\s+/);
                    const firstName = nameParts[0]||''; const lastName = nameParts.slice(1).join(' ')||'';
                    return (
                      <tr key={c.id} onClick={()=>go('contact-detail',c.id)}
                        style={{cursor:'pointer',borderBottom:'1px solid #f1f5f9',transition:'background 0.1s'}}
                        onMouseEnter={e=>e.currentTarget.style.background='#f8fafc'}
                        onMouseLeave={e=>e.currentTarget.style.background=''}>
                        <td style={{padding:'9px 12px',fontSize:14,fontWeight:600}}>{firstName||'—'}</td>
                        <td style={{padding:'9px 12px',fontSize:14}}>{lastName||'—'}</td>
                        <td style={{padding:'9px 12px',fontSize:13,color:'#475569'}}>{c.phone||'—'}</td>
                        <td style={{padding:'9px 12px',fontSize:13,color:'#475569',maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.email||'—'}</td>
                        <td style={{padding:'9px 12px'}}><SBadge s={c.status}/></td>
                        <td style={{padding:'9px 12px',fontSize:12,color:'#94a3b8',whiteSpace:'nowrap'}}>{fmtD(c.createdAt)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )
        }
      </div>


    </div>
  );
}

// ─── Conversations View ──────────────────────────────────────────────────────
function ConversationsView({ data, go }) {
  const [filter, setFilter] = useState('all'); // all / today / future / with-followup
  const todayStr = today();
  const BORDER = { call:'#4f46e5', email:'#0891b2', meeting:'#059669', whatsapp:'#22c55e', other:'#f59e0b' };

  const allConvs = [
    ...data.orgs.flatMap(o=>(o.conversations||[]).map(cv=>({...cv,entityType:'org',entityId:o.id,entityName:o.name}))),
    ...data.contacts.flatMap(c=>(c.conversations||[]).map(cv=>({...cv,entityType:'contact',entityId:c.id,entityName:c.name}))),
  ].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const filtered = allConvs.filter(cv=>{
    if (filter==='today')        return cv.followUpDate===todayStr;
    if (filter==='future')       return cv.followUpDate && cv.followUpDate>todayStr;
    if (filter==='with-followup') return !!cv.followUpDate;
    return true;
  });

  const cnt = f => f==='today' ? allConvs.filter(c=>c.followUpDate===todayStr).length
    : f==='future'       ? allConvs.filter(c=>c.followUpDate&&c.followUpDate>todayStr).length
    : f==='with-followup'? allConvs.filter(c=>!!c.followUpDate).length
    : allConvs.length;

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h1 style={{fontSize:24,fontWeight:700}}>כל השיחות</h1>
      </div>
      <div className="card" style={{padding:14,marginBottom:14}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <FBtn l="הכל" a={filter==='all'} onClick={()=>setFilter('all')} cnt={cnt('all')}/>
          <FBtn l="🔔 מעקב היום" a={filter==='today'} onClick={()=>setFilter('today')} cnt={cnt('today')}/>
          <FBtn l="⏳ מעקב עתידי" a={filter==='future'} onClick={()=>setFilter('future')} cnt={cnt('future')}/>
          <FBtn l="📞 עם מעקב" a={filter==='with-followup'} onClick={()=>setFilter('with-followup')} cnt={cnt('with-followup')}/>
        </div>
      </div>
      <div className="card" style={{padding:14}}>
        {filtered.length===0 ? <EmptyState icon="note" msg="אין שיחות"/> : filtered.map(cv=>(
          <div key={cv.id+cv.entityId} className="conv-line" style={{borderRightColor:BORDER[cv.type]||'#cbd5e1',marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                <span style={{fontSize:13,fontWeight:600,color:'#4f46e5'}}>{CONV_T[cv.type]||cv.type}</span>
                <span style={{fontSize:12,color:'#94a3b8'}}>{fmtD(cv.date)}</span>
                <span onClick={()=>go(cv.entityType==='org'?'org-detail':'contact-detail',cv.entityId)}
                  style={{fontSize:12,color:'#7c3aed',background:'#f3e8ff',padding:'1px 8px',borderRadius:10,cursor:'pointer'}}>
                  {cv.entityType==='org'?'🏢':'👤'} {cv.entityName}
                </span>
              </div>
            </div>
            <p style={{fontSize:13,color:'#475569',lineHeight:1.6,margin:0}}>{cv.content}</p>
            {cv.followUpDate && (
              <div style={{marginTop:8,padding:'6px 10px',background:'#f3e8ff',borderRadius:6,fontSize:12,color:'#7c3aed',display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                <span>📞</span>
                <span>מעקב: {fmtD(cv.followUpDate)}{cv.followUpTime?` בשעה ${cv.followUpTime}`:''}</span>
                {cv.followUpDate===todayStr && <span style={{background:'#7c3aed',color:'#fff',padding:'1px 6px',borderRadius:8,fontSize:11}}>היום!</span>}
                {cv.followUpDate<todayStr && <span style={{background:'#dc2626',color:'#fff',padding:'1px 6px',borderRadius:8,fontSize:11}}>באיחור</span>}
                {cv.followUpNotes && <span style={{color:'#6b21a8'}}>— {cv.followUpNotes}</span>}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Organizations List ───────────────────────────────────────────────────────
function OrgsList({ orgs, contacts, go, onAdd }) {

  const [sf, setSf] = useState('all');
  const ctx = useContext(ListsCtx);
  const allSt = ctx ? ctx.allStatus() : STATUS;
  const filtered = orgs.filter(o=>{
    const m=!q||o.name.toLowerCase().includes(q.toLowerCase())||(o.city||'').includes(q);
    return m && (sf==='all'||o.status===sf);
  });
  const cCount = id => contacts.filter(c=>c.organizationId===id).length;
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h1 style={{fontSize:24,fontWeight:700}}>ארגונים</h1>
        <button className="btn btn-primary" onClick={onAdd}><I n="plus" s={15} c="#fff"/>ארגון חדש</button>
      </div>
      <div className="card" style={{padding:16,marginBottom:14}}>
        <div style={{position:'relative',marginBottom:10}}>
          <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)'}}>
            <I n="search" s={15} c="#94a3b8"/>
          </span>
          <input className="inp" placeholder="חיפוש ארגון..." value={q} onChange={e=>setQ(e.target.value)} style={{paddingRight:36}}/>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <FBtn l="הכל" a={sf==='all'} onClick={()=>setSf('all')} cnt={orgs.length}/>
          {Object.entries(allSt).map(([k,v])=><FBtn key={k} l={v.lbl} a={sf===k} onClick={()=>setSf(k)} cnt={orgs.filter(o=>o.status===k).length} bg={v.bg} cl={v.cl}/>)}
        </div>
      </div>
      <div className="card">
        <div style={{padding:'10px 16px',borderBottom:'1px solid #f1f5f9',fontSize:13,color:'#64748b'}}>{filtered.length} ארגונים</div>
        {filtered.length===0 ? <EmptyState icon="building" msg="לא נמצאו ארגונים"/> : filtered.map(o=>(
          <div key={o.id} className="row" onClick={()=>go('org-detail',o.id)}>
            <Av name={o.name} sz={40} isOrg/>
            <div style={{flex:1,marginRight:12}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontWeight:600,fontSize:15}}>{o.name}</span>
                {o.tags?.map(t=><span key={t} className="pill" style={{fontSize:11}}>{t}</span>)}
              </div>
              <div style={{display:'flex',gap:12,marginTop:2,flexWrap:'wrap'}}>
                {o.industry && <span style={{fontSize:12,color:'#64748b'}}>🏭 {o.industry}</span>}
                {o.phone    && <span style={{fontSize:12,color:'#64748b'}}>📞 {o.phone}</span>}
                {o.city     && <span style={{fontSize:12,color:'#64748b'}}>📍 {o.city}</span>}
                <span style={{fontSize:12,color:'#7c3aed'}}>👤 {cCount(o.id)} אנשי קשר</span>
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
              <SBadge s={o.status}/>
              {o.nextFollowUp && <span style={{fontSize:11,color:o.nextFollowUp<=today()?'#dc2626':'#94a3b8'}}>🗓 {fmtD(o.nextFollowUp)}</span>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Organization Detail ──────────────────────────────────────────────────────
function OrgDetail({ org, contacts, tasks, go, onEdit, onDelete, onUpdate, onAddContact, onAddConv, onEditConv, onAddShow, onEditShow, onDelConv, onDelShow, onEmailClick, onWaClick, onEditTask }) {
  const [tab, setTab] = useState('info');
  const [editNotes, setEditNotes] = useState(false);
  const [notesV, setNotesV] = useState(org.notes||'');
  const orgContacts = contacts.filter(c=>c.organizationId===org.id);
  const orgTasks    = tasks.filter(t=>t.organizationId===org.id);

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
        <button className="btn btn-secondary btn-sm" onClick={()=>go('orgs')}><I n="back" s={14}/>חזרה</button>
        <h2 style={{fontSize:20,fontWeight:700,flex:1}}>{org.name}</h2>
        <button className="btn btn-secondary btn-sm" onClick={onEdit}><I n="edit" s={14}/>ערוך</button>
        <button className="btn btn-danger btn-sm" onClick={onDelete}><I n="trash" s={14}/>מחק</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'260px 1fr',gap:18}}>
        <div>
          <div className="card" style={{padding:18,marginBottom:14}}>
            <div style={{textAlign:'center',marginBottom:14}}>
              <Av name={org.name} sz={60} isOrg/>
              <h3 style={{marginTop:10,fontWeight:700,fontSize:17}}>{org.name}</h3>
              {org.industry && <p style={{color:'#64748b',fontSize:13}}>{org.industry}</p>}
              <div style={{marginTop:8}}><SBadge s={org.status}/></div>
            </div>
            {org.phone && <IL icon="📞" val={org.phone} href={`tel:${org.phone}`}/>}
            {org.phone && <IL icon="💬" val="WhatsApp" onClick={()=>onWaClick&&onWaClick({name:org.name,phone:org.phone})}/>}
            {org.email && <IL icon="📧" val={org.email} onClick={()=>onEmailClick&&onEmailClick(org.email)}/>}
            {org.city  && <IL icon="📍" val={org.city}/>}
            {org.source && <IL icon="🔗" val={`מקור: ${org.source}`}/>}
          </div>
          <div className="card" style={{padding:14,marginBottom:14}}>
            <div className="lbl" style={{marginBottom:7}}>שנה סטטוס</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
              {Object.entries((useContext(ListsCtx)||{allStatus:()=>STATUS}).allStatus()).map(([k,v])=>(
                <button key={k} onClick={()=>onUpdate({status:k})} className="badge"
                  style={{background:org.status===k?v.cl:v.bg,color:org.status===k?'#fff':v.cl,border:'none',cursor:'pointer',fontSize:12,padding:'4px 10px'}}>
                  {v.lbl}
                </button>
              ))}
            </div>
          </div>
          <div className="card" style={{padding:14}}>
            <div className="lbl" style={{marginBottom:6}}>📅 מועד מעקב</div>
            <input type="date" className="inp" value={org.nextFollowUp||''} onChange={e=>onUpdate({nextFollowUp:e.target.value})} style={{fontSize:13}}/>
          </div>
        </div>
        <div className="card">
          <div style={{borderBottom:'1px solid #f1f5f9',padding:'0 14px',display:'flex',gap:2}}>
            <button className={`tab-btn${tab==='info'?' on':''}`} onClick={()=>setTab('info')}>📋 מידע</button>
            <button className={`tab-btn${tab==='contacts'?' on':''}`} onClick={()=>setTab('contacts')}>👤 אנשי קשר ({orgContacts.length})</button>
            <button className={`tab-btn${tab==='conversations'?' on':''}`} onClick={()=>setTab('conversations')}>💬 שיחות ({org.conversations?.length||0})</button>
            <button className={`tab-btn${tab==='shows'?' on':''}`} onClick={()=>setTab('shows')}>🎭 מופעים ({org.showHistory?.length||0})</button>
            <button className={`tab-btn${tab==='tasks'?' on':''}`} onClick={()=>setTab('tasks')}>✅ משימות ({orgTasks.length})</button>
          </div>
          <div style={{padding:18}}>
            {tab==='info' && (
              <div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div className="lbl">הערות</div>
                  {!editNotes
                    ? <button className="btn btn-secondary btn-xs" onClick={()=>{setNotesV(org.notes||'');setEditNotes(true);}}>ערוך</button>
                    : <div style={{display:'flex',gap:6}}>
                        <button className="btn btn-primary btn-xs" onClick={()=>{onUpdate({notes:notesV});setEditNotes(false);}}>שמור</button>
                        <button className="btn btn-secondary btn-xs" onClick={()=>setEditNotes(false)}>ביטול</button>
                      </div>
                  }
                </div>
                {editNotes
                  ? <textarea className="inp" rows={5} value={notesV} onChange={e=>setNotesV(e.target.value)} style={{resize:'vertical'}}/>
                  : <div style={{background:'#f8fafc',borderRadius:8,padding:12,fontSize:14,color:org.notes?'#1e293b':'#94a3b8',minHeight:70,lineHeight:1.6}}>{org.notes||'אין הערות...'}</div>
                }
                {org.tags?.length>0 && <div style={{marginTop:14}}><div className="lbl" style={{marginBottom:6}}>תגיות</div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{org.tags.map(t=><span key={t} className="pill">{t}</span>)}</div></div>}
              </div>
            )}
            {tab==='contacts' && (
              <div>
                <button className="btn btn-primary btn-sm" onClick={onAddContact} style={{marginBottom:14}}><I n="plus" s={14} c="#fff"/>הוסף איש קשר לארגון</button>
                {orgContacts.length===0 ? <EmptyState icon="person" msg="אין אנשי קשר לארגון זה"/> : orgContacts.map(c=>(
                  <div key={c.id} className="row" onClick={()=>go('contact-detail',c.id)} style={{borderRadius:8,marginBottom:4,border:'1px solid #f1f5f9'}}>
                    <Av name={c.name} sz={36}/>
                    <div style={{flex:1,marginRight:10}}>
                      <div style={{fontWeight:600,fontSize:14}}>{c.name}</div>
                      <div style={{fontSize:12,color:'#64748b'}}>{c.role||''} {c.phone?'· '+c.phone:''}</div>
                    </div>
                    <SBadge s={c.status}/>
                  </div>
                ))}
              </div>
            )}
            {tab==='conversations' && <ConvTab items={org.conversations||[]} onAdd={onAddConv} onDel={onDelConv} onEdit={onEditConv}/>}
            {tab==='shows' && <ShowTab items={org.showHistory||[]} onAdd={onAddShow} onEdit={onEditShow} onDel={onDelShow} contacts={contacts} onWaClick={onWaClick}/>}
            {tab==='tasks' && <TasksTab tasks={orgTasks} onGoTasks={()=>go('tasks')} onEdit={onEditTask}/>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Contacts List ────────────────────────────────────────────────────────────
function ContactsList({ contacts, orgs, go, onAdd, onUpdate, onDupScan, onDelete, onEdit, onEmailClick, onImport, onBulkStatus, onBulkDelete }) {
  const [q, setQ] = useState('');
  const [sf, setSf] = useState('all');
  const [tf, setTf] = useState('all');
  const [sortCol, setSortCol] = useState('firstName');
  const [sortDir, setSortDir] = useState('asc');
  const [quickEditId, setQuickEditId] = useState(null);
  const [qForm, setQForm] = useState({});
  const [statusPicker, setStatusPicker] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [bulkStatusVal, setBulkStatusVal] = useState('');
  const ctx = useContext(ListsCtx);
  const allSt = ctx ? ctx.allStatus() : STATUS;

  const toggleSelect = (id, e) => { e.stopPropagation(); setSelected(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; }); };
  const toggleAll = () => setSelected(s => s.size===sorted.length ? new Set() : new Set(sorted.map(c=>c.id)));
  const clearSelection = () => { setSelected(new Set()); setBulkStatusVal(''); };

  const handleBulkStatus = async (status) => {
    if (!status || !selected.size) return;
    await onBulkStatus && onBulkStatus([...selected], status);
    clearSelection();
  };
  const handleBulkDelete = async () => {
    if (!selected.size) return;
    if (!window.confirm(`למחוק ${selected.size} אנשי קשר? פעולה זו אינה הפיכה.`)) return;
    await onBulkDelete && onBulkDelete([...selected]);
    clearSelection();
  };

  const splitName = (name='') => {
    const parts = (name||'').trim().split(/\s+/);
    return { firstName: parts[0]||'', lastName: parts.slice(1).join(' ')||'' };
  };

  const openQuickEdit = (e, c) => {
    e.stopPropagation();
    const {firstName, lastName} = splitName(c.name);
    setQForm({ firstName, lastName, phone: c.phone||'', email: c.email||'', birthday: c.birthday||'' });
    setQuickEditId(quickEditId===c.id ? null : c.id);
  };

  const saveQuickEdit = (e, c) => {
    e.stopPropagation();
    const name = [qForm.firstName, qForm.lastName].filter(Boolean).join(' ') || c.name;
    onUpdate && onUpdate(c.id, { ...c, name, phone: qForm.phone, email: qForm.email, birthday: qForm.birthday });
    setQuickEditId(null);
  };

  const filtered = contacts.filter(c=>{
    const qm=!q||c.name.toLowerCase().includes(q.toLowerCase())||(c.phone||'').includes(q)||(c.city||'').includes(q)||(c.email||'').toLowerCase().includes(q.toLowerCase());
    const sm=sf==='all'||c.status===sf;
    const tm=tf==='all'||(tf==='linked'&&c.organizationId)||(tf==='standalone'&&!c.organizationId);
    return qm&&sm&&tm;
  });

  const sorted = [...filtered].sort((a,b)=>{
    const {firstName:af,lastName:al}=splitName(a.name);
    const {firstName:bf,lastName:bl}=splitName(b.name);
    let va='',vb='';
    if(sortCol==='firstName'){va=af;vb=bf;}
    else if(sortCol==='lastName'){va=al;vb=bl;}
    else if(sortCol==='phone'){va=a.phone||'';vb=b.phone||'';}
    else if(sortCol==='email'){va=a.email||'';vb=b.email||'';}
    const cmp=va.localeCompare(vb,'he');
    return sortDir==='asc'?cmp:-cmp;
  });

  const handleSort = col => {
    if(sortCol===col) setSortDir(d=>d==='asc'?'desc':'asc');
    else{setSortCol(col);setSortDir('asc');}
  };

  const SortHdr = ({col,lbl}) => {
    const active=sortCol===col;
    return (
      <th onClick={()=>handleSort(col)} style={{cursor:'pointer',userSelect:'none',padding:'10px 12px',textAlign:'right',fontSize:13,color:active?'#4f46e5':'#64748b',fontWeight:active?700:500,whiteSpace:'nowrap',borderBottom:'2px solid #f1f5f9',background:'#f8fafc'}}>
        {lbl} <span style={{fontSize:11}}>{active?(sortDir==='asc'?'▲':'▼'):'⇅'}</span>
      </th>
    );
  };

  const iconBtn = (title, onClick, children, color='#64748b') => (
    <button onClick={onClick} title={title} style={{background:'none',border:'none',cursor:'pointer',padding:'4px 5px',borderRadius:6,color,display:'inline-flex',alignItems:'center',transition:'background 0.1s'}}
      onMouseEnter={e=>e.currentTarget.style.background='#f1f5f9'}
      onMouseLeave={e=>e.currentTarget.style.background='none'}>
      {children}
    </button>
  );

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h1 style={{fontSize:24,fontWeight:700}}>אנשי קשר</h1>
        <div style={{display:'flex',gap:8}}>
          {onDupScan&&<button className="btn btn-secondary" onClick={onDupScan} title="סריקת כפילויות לפי טלפון"><I n="search" s={14} c="#475569"/>בדוק כפילויות</button>}
          {onImport&&<button className="btn btn-secondary" onClick={onImport} title="ייבוא מ-Excel / XLS"><I n="plus" s={14} c="#475569"/>ייבוא מ-Excel</button>}
          <button className="btn btn-primary" onClick={onAdd}><I n="plus" s={15} c="#fff"/>איש קשר חדש</button>
        </div>
      </div>
      <div className="card" style={{padding:16,marginBottom:14}}>
        <div style={{position:'relative',marginBottom:10}}>
          <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)'}}><I n="search" s={15} c="#94a3b8"/></span>
          <input className="inp" placeholder="חיפוש לפי שם, טלפון, עיר..." value={q} onChange={e=>setQ(e.target.value)} style={{paddingRight:36}}/>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
          <FBtn l="הכל" a={sf==='all'} onClick={()=>setSf('all')} cnt={contacts.length}/>
          {Object.entries(allSt).map(([k,v])=><FBtn key={k} l={v.lbl} a={sf===k} onClick={()=>setSf(k)} cnt={contacts.filter(c=>c.status===k).length} bg={v.bg} cl={v.cl}/>)}
        </div>
        <div style={{display:'flex',gap:6}}>
          <FBtn l="כולם" a={tf==='all'} onClick={()=>setTf('all')}/>
          <FBtn l="משויך לארגון" a={tf==='linked'} onClick={()=>setTf(tf==='linked'?'all':'linked')}/>
          <FBtn l="עצמאי" a={tf==='standalone'} onClick={()=>setTf(tf==='standalone'?'all':'standalone')}/>
        </div>
      </div>
      {selected.size > 0 && (
        <div style={{background:'#4f46e5',color:'#fff',padding:'10px 16px',borderRadius:10,marginBottom:10,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <span style={{fontWeight:700,fontSize:14}}>{selected.size} נבחרו</span>
          <button onClick={clearSelection} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'#fff',cursor:'pointer',borderRadius:6,padding:'3px 10px',fontSize:13}}>✕ ביטול</button>
          <div style={{marginRight:'auto',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <select value={bulkStatusVal}
              onChange={e=>{ setBulkStatusVal(e.target.value); if(e.target.value) handleBulkStatus(e.target.value); }}
              style={{padding:'5px 10px',borderRadius:6,border:'none',fontSize:13,cursor:'pointer',background:'rgba(255,255,255,0.15)',color:'#fff'}}>
              <option value="">🏷️ שנה סטטוס...</option>
              {Object.entries(allSt).map(([k,v])=><option key={k} value={k} style={{color:'#1e293b',background:'#fff'}}>{v.lbl}</option>)}
            </select>
            <button onClick={handleBulkDelete}
              style={{background:'#ef4444',border:'none',color:'#fff',cursor:'pointer',borderRadius:6,padding:'5px 14px',fontSize:13,fontWeight:600}}>
              🗑️ מחק נבחרים
            </button>
          </div>
        </div>
      )}
      <div className="card" style={{overflowX:'auto'}}>
        <div style={{padding:'10px 16px',borderBottom:'1px solid #f1f5f9',fontSize:13,color:'#64748b'}}>{sorted.length} אנשי קשר{selected.size>0 && <span style={{color:'#4f46e5',fontWeight:600,marginRight:8}}>• {selected.size} נבחרו</span>}</div>
        {sorted.length===0 ? <EmptyState icon="person" msg="לא נמצאו אנשי קשר"/> : (
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead>
              <tr>
                <th style={{padding:'10px 12px',borderBottom:'2px solid #f1f5f9',background:'#f8fafc',width:36,textAlign:'center'}}>
                  <input type="checkbox"
                    checked={sorted.length>0 && selected.size===sorted.length}
                    ref={el=>{ if(el) el.indeterminate=selected.size>0&&selected.size<sorted.length; }}
                    onChange={toggleAll}
                    style={{cursor:'pointer',width:15,height:15}}/>
                </th>
                <SortHdr col="firstName" lbl="שם פרטי"/>
                <SortHdr col="lastName" lbl="שם משפחה"/>
                <SortHdr col="phone" lbl="טלפון"/>
                <SortHdr col="email" lbl="מייל"/>
                <th style={{padding:'10px 12px',fontSize:13,color:'#64748b',fontWeight:500,borderBottom:'2px solid #f1f5f9',background:'#f8fafc',textAlign:'right'}}>סטטוס</th>
                <th style={{padding:'10px 12px',borderBottom:'2px solid #f1f5f9',background:'#f8fafc',textAlign:'center',whiteSpace:'nowrap',fontSize:12,color:'#94a3b8'}}>פעולות</th>
              </tr>
            </thead>
            <tbody>
              {sorted.map(c=>{
                const {firstName,lastName}=splitName(c.name);
                const isQE = quickEditId===c.id;
                return (
                  <React.Fragment key={c.id}>
                    <tr onClick={()=>{ if(statusPicker) { setStatusPicker(null); return; } go('contact-detail',c.id); }}
                      style={{cursor:'pointer',borderBottom: isQE ? 'none' : '1px solid #f1f5f9',transition:'background 0.1s', background: selected.has(c.id) ? '#eef2ff' : isQE ? '#f0f4ff' : ''}}
                      onMouseEnter={e=>{ if(!isQE&&!selected.has(c.id)) e.currentTarget.style.background='#f8fafc'; }}
                      onMouseLeave={e=>{ if(!isQE&&!selected.has(c.id)) e.currentTarget.style.background=''; }}>
                      <td style={{padding:'8px 12px',textAlign:'center'}} onClick={e=>toggleSelect(c.id,e)}>
                        <input type="checkbox" checked={selected.has(c.id)} onChange={e=>toggleSelect(c.id,e)}
                          onClick={e=>e.stopPropagation()} style={{cursor:'pointer',width:15,height:15}}/>
                      </td>
                      <td style={{padding:'10px 12px',fontSize:14,fontWeight:600}}>{firstName||'—'}</td>
                      <td style={{padding:'10px 12px',fontSize:14}}>{lastName||'—'}</td>
                      <td style={{padding:'10px 12px',fontSize:13,color:'#475569'}}>{c.phone||'—'}</td>
                      <td style={{padding:'10px 12px',fontSize:13}} onClick={e=>e.stopPropagation()}>
                        {c.email
                          ? <span onClick={()=>onEmailClick&&onEmailClick(c.email)}
                              style={{color:'#4f46e5',cursor:'pointer',textDecoration:'underline',fontSize:13}}
                              title={`שלח מייל ל-${c.email}`}>{c.email}</span>
                          : <span style={{color:'#94a3b8'}}>—</span>}
                      </td>
                      <td style={{padding:'10px 12px'}} onClick={e=>e.stopPropagation()}>
                        <div style={{position:'relative'}}>
                          <div onClick={e=>{e.stopPropagation();setStatusPicker(statusPicker===c.id?null:c.id);}} style={{cursor:'pointer'}} title="לחץ לשינוי סטטוס">
                            <SBadge s={c.status}/>
                          </div>
                          {statusPicker===c.id && (
                            <div style={{position:'absolute',top:'100%',right:0,zIndex:200,background:'#fff',border:'1px solid #e2e8f0',borderRadius:10,boxShadow:'0 4px 20px rgba(0,0,0,.12)',padding:8,minWidth:150,marginTop:4}}
                              onClick={e=>e.stopPropagation()}>
                              {Object.entries(allSt).map(([k,v])=>(
                                <button key={k} onClick={()=>{onUpdate&&onUpdate(c.id,{...c,status:k});setStatusPicker(null);}}
                                  style={{display:'block',width:'100%',textAlign:'right',background:c.status===k?v.cl:v.bg,color:c.status===k?'#fff':v.cl,border:'none',cursor:'pointer',fontSize:12,padding:'5px 10px',marginBottom:2,borderRadius:6,fontWeight:c.status===k?700:400}}>
                                  {v.lbl}
                                </button>
                              ))}
                            </div>
                          )}
                        </div>
                      </td>
                      <td style={{padding:'8px 10px',textAlign:'center',whiteSpace:'nowrap'}} onClick={e=>e.stopPropagation()}>
                        {iconBtn('צפה בכרטיס', e=>{e.stopPropagation();go('contact-detail',c.id);}, <I n="person" s={15} c="#4f46e5"/>, '#4f46e5')}
                        {onEdit && iconBtn('עריכה מלאה', e=>{e.stopPropagation();onEdit(c);}, <I n="edit" s={15} c="#0ea5e9"/>, '#0ea5e9')}
                        {iconBtn(isQE?'סגור עריכה מהירה':'עריכה מהירה', e=>openQuickEdit(e,c),
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={isQE?'#f59e0b':'#10b981'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>,
                          isQE?'#f59e0b':'#10b981')}
                        {onDelete && iconBtn('מחק', e=>{e.stopPropagation();onDelete(c.id);}, <I n="trash" s={15} c="#ef4444"/>, '#ef4444')}
                      </td>
                    </tr>
                    {isQE && (
                      <tr style={{background:'#f0f4ff',borderBottom:'2px solid #c7d2fe'}}>
                        <td colSpan={7} style={{padding:'12px 16px'}} onClick={e=>e.stopPropagation()}>
                          <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                            <div style={{display:'flex',flexDirection:'column',gap:2,minWidth:120}}>
                              <label style={{fontSize:11,color:'#6366f1',fontWeight:600}}>שם פרטי</label>
                              <input className="inp" value={qForm.firstName} onChange={e=>setQForm(f=>({...f,firstName:e.target.value}))}
                                style={{padding:'5px 9px',fontSize:13,height:32}} placeholder="שם פרטי"/>
                            </div>
                            <div style={{display:'flex',flexDirection:'column',gap:2,minWidth:140}}>
                              <label style={{fontSize:11,color:'#6366f1',fontWeight:600}}>שם משפחה</label>
                              <input className="inp" value={qForm.lastName} onChange={e=>setQForm(f=>({...f,lastName:e.target.value}))}
                                style={{padding:'5px 9px',fontSize:13,height:32}} placeholder="שם משפחה"/>
                            </div>
                            <div style={{display:'flex',flexDirection:'column',gap:2,minWidth:140}}>
                              <label style={{fontSize:11,color:'#6366f1',fontWeight:600}}>טלפון</label>
                              <input className="inp" value={qForm.phone} onChange={e=>setQForm(f=>({...f,phone:e.target.value}))}
                                style={{padding:'5px 9px',fontSize:13,height:32}} placeholder="טלפון" dir="ltr"/>
                            </div>
                            <div style={{display:'flex',flexDirection:'column',gap:2,flex:1,minWidth:180}}>
                              <label style={{fontSize:11,color:'#6366f1',fontWeight:600}}>מייל</label>
                              <input className="inp" value={qForm.email} onChange={e=>setQForm(f=>({...f,email:e.target.value}))}
                                style={{padding:'5px 9px',fontSize:13,height:32}} placeholder="כתובת מייל" dir="ltr"/>
                            </div>
                            <div style={{display:'flex',flexDirection:'column',gap:2,minWidth:200}}>
                              <label style={{fontSize:11,color:'#6366f1',fontWeight:600}}>🎂 יום הולדת</label>
                              <BirthdayPicker value={qForm.birthday} onChange={v=>setQForm(f=>({...f,birthday:v}))}/>
                            </div>
                            <div style={{display:'flex',gap:6,alignItems:'flex-end',paddingTop:16}}>
                              <button className="btn btn-primary btn-sm" onClick={e=>saveQuickEdit(e,c)} style={{padding:'5px 14px',fontSize:13}}>שמור</button>
                              <button className="btn btn-secondary btn-sm" onClick={e=>{e.stopPropagation();setQuickEditId(null);}} style={{padding:'5px 14px',fontSize:13}}>ביטול</button>
                            </div>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ─── Contact Detail ───────────────────────────────────────────────────────────
function ContactDetail({ contact: c, orgs, contacts, tasks, standaloneShows=[], quotes=[], orders=[], go, onEdit, onDelete, onUpdate, onAddConv, onEditConv, onAddShow, onEditShow, onDelConv, onDelShow, onEmailClick, onWaClick, onEditTask, onOrderCreated }) {
  const [tab, setTab] = useState('info');
  const [editNotes, setEditNotes] = useState(false);
  const [notesV, setNotesV] = useState(c.notes||'');
  const [newNoteText, setNewNoteText] = useState('');
  const [addingNote, setAddingNote] = useState(false);

  const notesLog = Array.isArray(c.notesLog) ? [...c.notesLog].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)) : [];

  const fmtNoteDate = (iso) => {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'}) + ' · ' +
             d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    } catch { return ''; }
  };

  const saveNewNote = () => {
    if (!newNoteText.trim()) return;
    const entry = { id: Date.now().toString(36), text: newNoteText.trim(), createdAt: new Date().toISOString() };
    const updated = [entry, ...(c.notesLog||[])];
    onUpdate({ notesLog: updated });
    setNewNoteText(''); setAddingNote(false);
  };

  const deleteNote = (id) => {
    if (!confirm('למחוק הערה זו?')) return;
    onUpdate({ notesLog: (c.notesLog||[]).filter(n=>n.id!==id) });
  };
  const [emails, setEmails] = useState(null); // null=טרם נטען, []=ריק
  const [emailsLoading, setEmailsLoading] = useState(false);
  const [expandedEmail, setExpandedEmail] = useState(null);
  const [accounts, setAccounts] = useState(null);
  const [showAcctMgr, setShowAcctMgr] = useState(false);
  const [acctLoading, setAcctLoading] = useState(false);
  const [dismissedEmails, setDismissedEmails] = useState(new Set());
  const [selectedEmails, setSelectedEmails] = useState(new Set());
  const [emailSigs, setEmailSigs] = useState([]);
  const [selEmailSig, setSelEmailSig] = useState('default');
  const toggleEmailSelect = (id, e) => { e && e.stopPropagation(); setSelectedEmails(s => { const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; }); };
  const toggleAllEmails = (visibleIds) => setSelectedEmails(s => s.size===visibleIds.length ? new Set() : new Set(visibleIds));
  const dismissSelected = () => { setDismissedEmails(s => new Set([...s,...selectedEmails])); setSelectedEmails(new Set()); setExpandedEmail(null); };
  // Load signatures for email compose
  useEffect(()=>{
    api.get('/api/signatures').then(list=>{
      const eSigs = list.filter(s => s.channel === 'email' || s.channel === 'both');
      setEmailSigs(eSigs);
      const def = eSigs.find(s=>s.isDefault);
      if (def) setSelEmailSig(def.id);
    }).catch(()=>{});
  },[]);

  const org = orgs.find(o=>o.id===c.organizationId);
  const cTasks = tasks.filter(t=>t.contactId===c.id);
  const myStandaloneShows = standaloneShows.filter(sh=>(sh.participantContactIds||[]).includes(c.id));
  const cQuotes  = quotes.filter(q=>q.contactId===c.id);
  const cOrders  = orders.filter(o=>o.contactId===c.id);

  const loadEmails = async () => {
    if (emailsLoading) return;
    setEmailsLoading(true);
    try {
      const r = await fetch(`/api/contacts/${c.id}/emails`);
      const d = await r.json();
      setEmails(d.emails || []);
    } catch { setEmails([]); }
    finally { setEmailsLoading(false); }
  };

  const loadAccounts = async () => {
    try {
      const r = await fetch('/api/auth/accounts');
      const d = await r.json();
      setAccounts(d.accounts || []);
    } catch { setAccounts([]); }
  };

  const deleteAccount = async (email) => {
    if (!confirm(`למחוק את החשבון ${email}?`)) return;
    setAcctLoading(true);
    try {
      await fetch(`/api/auth/accounts/${encodeURIComponent(email)}`, { method:'DELETE' });
      await loadAccounts();
      setEmails(null); // force reload emails
    } catch {}
    setAcctLoading(false);
  };

  // short label like "tony.zebra" from "tony.zebra@gmail.com"
  const acctLabel = (email) => (email||'').split('@')[0] || email;
  const acctColor = (email) => {
    const palette = ['#4f46e5','#0891b2','#059669','#d97706','#dc2626','#7c3aed'];
    let h = 0; for (const ch of email) h = (h*31+ch.charCodeAt(0))&0xffff;
    return palette[h % palette.length];
  };

  const fmtEmailDate = (dateStr) => {
    if (!dateStr) return '';
    try {
      const d = new Date(dateStr);
      const now = new Date();
      const diffDays = Math.floor((now - d) / 86400000);
      if (diffDays === 0) return d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
      if (diffDays < 7)  return d.toLocaleDateString('he-IL', {weekday:'short'});
      return d.toLocaleDateString('he-IL', {day:'numeric',month:'short'});
    } catch { return ''; }
  };
  const nameParts = (c.name||'').trim().split(/\s+/);
  const firstName = nameParts[0]||'';
  const lastName  = nameParts.slice(1).join(' ')||'';
  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
        <button className="btn btn-secondary btn-sm" onClick={()=>go('contacts')}><I n="back" s={14}/>חזרה</button>
        <h2 style={{fontSize:20,fontWeight:700,flex:1}}>{c.name}</h2>
        <button className="btn btn-secondary btn-sm" onClick={onEdit}><I n="edit" s={14}/>ערוך</button>
        <button className="btn btn-danger btn-sm" onClick={onDelete}><I n="trash" s={14}/>מחק</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'260px 1fr',gap:18}}>
        <div>
          <div className="card" style={{padding:18,marginBottom:14}}>
            <div style={{textAlign:'center',marginBottom:14}}>
              <Av name={c.name} sz={60}/>
              <h3 style={{marginTop:10,fontWeight:700,fontSize:17}}>{c.name}</h3>
              {c.role && <p style={{color:'#64748b',fontSize:13}}>{c.role}</p>}
              <div style={{marginTop:8}}><SBadge s={c.status}/></div>
            </div>
            {org && (
              <div onClick={()=>go('org-detail',org.id)} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:'#f3e8ff',borderRadius:8,cursor:'pointer',marginBottom:10}}>
                <I n="building" s={15} c="#7c3aed"/>
                <span style={{fontSize:13,fontWeight:600,color:'#7c3aed'}}>{org.name}</span>
              </div>
            )}
            {c.phone && <IL icon="📞" val={c.phone} href={`tel:${c.phone}`}/>}
            {(c.extraPhones||[]).map((p,i)=> p ? <IL key={i} icon="📞" val={p} href={`tel:${p}`}/> : null)}
            {c.phone && <IL icon="💬" val="WhatsApp" onClick={()=>onWaClick&&onWaClick({name:c.name,phone:c.phone})}/>}
            {c.email && <IL icon="📧" val={c.email} onClick={()=>onEmailClick&&onEmailClick(c.email)}/>}
            {(c.extraEmails||[]).map((e,i)=> e ? <IL key={i} icon="📧" val={e} onClick={()=>onEmailClick&&onEmailClick(e)}/> : null)}
            {c.city  && <IL icon="📍" val={c.city}/>}
            {c.birthday && <IL icon="🎂" val={fmtBirthday(c.birthday)}/>}
            {c.source && <IL icon="🔗" val={`מקור: ${c.source}`}/>}
            <div style={{marginTop:10,paddingTop:10,borderTop:'1px solid #f1f5f9'}}>
              <div style={{fontSize:11,color:'#94a3b8',marginBottom:6}}>🏷️ תגיות</div>
              {c.tags?.length>0
                ? <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                    {c.tags.map(t=><span key={t} className="pill" style={{fontSize:12}}>{t}</span>)}
                  </div>
                : <div style={{fontSize:12,color:'#cbd5e1',fontStyle:'italic'}}>אין תגיות — ניתן להוסיף בעריכה</div>
              }
            </div>
          </div>
          <div className="card" style={{padding:14,marginBottom:14}}>
            <div className="lbl" style={{marginBottom:7}}>שנה סטטוס</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
              {Object.entries((useContext(ListsCtx)||{allStatus:()=>STATUS}).allStatus()).map(([k,v])=>(
                <button key={k} onClick={()=>onUpdate({status:k})} className="badge"
                  style={{background:c.status===k?v.cl:v.bg,color:c.status===k?'#fff':v.cl,border:'none',cursor:'pointer',fontSize:12,padding:'4px 10px'}}>
                  {v.lbl}
                </button>
              ))}
            </div>
          </div>
          <div className="card" style={{padding:14}}>
            <div className="lbl" style={{marginBottom:6}}>📅 מועד מעקב</div>
            <input type="date" className="inp" value={c.nextFollowUp||''} onChange={e=>onUpdate({nextFollowUp:e.target.value})} style={{fontSize:13}}/>
          </div>
        </div>
        <div className="card">
          <div style={{borderBottom:'1px solid #f1f5f9',padding:'0 14px',display:'flex',gap:2}}>
            <button className={`tab-btn${tab==='info'?' on':''}`} onClick={()=>setTab('info')}>📋 מידע</button>
            <button className={`tab-btn${tab==='conversations'?' on':''}`} onClick={()=>setTab('conversations')}>💬 שיחות ({c.conversations?.length||0})</button>
            <button className={`tab-btn${tab==='emails'?' on':''}`} onClick={()=>{ setTab('emails'); if(emails===null) loadEmails(); }}>📧 מיילים {emails!==null&&!emailsLoading?`(${emails.length})`:''}</button>
            <button className={`tab-btn${tab==='shows'?' on':''}`} onClick={()=>setTab('shows')}>🎭 מופעים ({(c.showHistory?.length||0) + myStandaloneShows.length})</button>
            <button className={`tab-btn${tab==='tasks'?' on':''}`} onClick={()=>setTab('tasks')}>✅ משימות ({cTasks.length})</button>
            <button className={`tab-btn${tab==='quotes'?' on':''}`} onClick={()=>setTab('quotes')}>📄 הצעות {cQuotes.length>0?`(${cQuotes.length})`:''}</button>
            <button className={`tab-btn${tab==='orders'?' on':''}`} onClick={()=>setTab('orders')}>📋 הזמנות {cOrders.length>0?`(${cOrders.length})`:''}</button>
          </div>
          <div style={{padding:18}}>
            {tab==='info' && (
              <div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:org?10:16,padding:'12px 14px',background:'#f8fafc',borderRadius:10,border:'1px solid #f1f5f9'}}>
                  <div>
                    <div style={{fontSize:11,color:'#94a3b8',fontWeight:600,marginBottom:3}}>שם פרטי</div>
                    <div style={{fontSize:15,fontWeight:600,color:'#1e293b'}}>{firstName||'—'}</div>
                  </div>
                  <div>
                    <div style={{fontSize:11,color:'#94a3b8',fontWeight:600,marginBottom:3}}>שם משפחה</div>
                    <div style={{fontSize:15,fontWeight:600,color:'#1e293b'}}>{lastName||'—'}</div>
                  </div>
                </div>
                {org && (
                  <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 12px',background:'#f3e8ff',borderRadius:9,marginBottom:14,border:'1px solid #e9d5ff'}}>
                    <I n="building" s={15} c="#7c3aed"/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11,color:'#9333ea',fontWeight:600,marginBottom:1}}>ארגון</div>
                      <div style={{fontSize:14,fontWeight:700,color:'#6b21a8',cursor:'pointer'}} onClick={()=>go('org-detail',org.id)}>{org.name}</div>
                    </div>
                  </div>
                )}
                {/* ── הערות ── */}
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div className="lbl">הערות ({notesLog.length + (c.notes&&!c.notesLog?1:0)})</div>
                  {!addingNote &&
                    <button className="btn btn-primary btn-xs" onClick={()=>setAddingNote(true)}>
                      + הוסף הערה
                    </button>
                  }
                </div>
                {/* תיבת הוספת הערה */}
                {addingNote && (
                  <div style={{marginBottom:12,background:'#f0f4ff',borderRadius:10,padding:12,border:'1px solid #c7d2fe'}}>
                    <textarea className="inp" rows={3} autoFocus
                      value={newNoteText} onChange={e=>setNewNoteText(e.target.value)}
                      placeholder="כתוב הערה חדשה..."
                      style={{resize:'vertical',marginBottom:8,fontSize:13}}
                      onKeyDown={e=>{ if(e.key==='Enter'&&e.ctrlKey) saveNewNote(); }}/>
                    <div style={{display:'flex',gap:6}}>
                      <button className="btn btn-primary btn-xs" onClick={saveNewNote} disabled={!newNoteText.trim()}>שמור</button>
                      <button className="btn btn-secondary btn-xs" onClick={()=>{setAddingNote(false);setNewNoteText('');}}>ביטול</button>
                      <span style={{fontSize:11,color:'#94a3b8',alignSelf:'center'}}>Ctrl+Enter לשמירה</span>
                    </div>
                  </div>
                )}
                {/* רשימת הערות */}
                {notesLog.length===0 && !c.notes && !addingNote && (
                  <div style={{background:'#f8fafc',borderRadius:8,padding:12,fontSize:13,color:'#94a3b8',textAlign:'center'}}>
                    אין הערות — לחץ "הוסף הערה" להתחיל
                  </div>
                )}
                {/* הערה ישנה (לגאסי — שדה notes רגיל) */}
                {c.notes && !c.notesLog && (
                  <div style={{background:'#fefce8',borderRadius:8,padding:'10px 12px',marginBottom:8,border:'1px solid #fde68a',position:'relative'}}>
                    <div style={{fontSize:13,color:'#1e293b',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{c.notes}</div>
                    <div style={{fontSize:11,color:'#a16207',marginTop:6}}>📌 הערה ישנה (ללא תאריך)</div>
                  </div>
                )}
                {notesLog.map(n=>(
                  <div key={n.id} style={{background:'#f8fafc',borderRadius:8,padding:'10px 12px',marginBottom:8,border:'1px solid #e2e8f0',position:'relative'}}>
                    <div style={{fontSize:13,color:'#1e293b',lineHeight:1.6,whiteSpace:'pre-wrap',paddingLeft:28}}>{n.text}</div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6}}>
                      <span style={{fontSize:11,color:'#94a3b8'}}>🕐 {fmtNoteDate(n.createdAt)}</span>
                      <button onClick={()=>deleteNote(n.id)}
                        style={{background:'none',border:'none',cursor:'pointer',color:'#cbd5e1',fontSize:14,padding:'0 4px',lineHeight:1}}
                        title="מחק הערה"
                        onMouseEnter={e=>e.target.style.color='#ef4444'}
                        onMouseLeave={e=>e.target.style.color='#cbd5e1'}>✕</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {tab==='conversations' && <ConvTab items={c.conversations||[]} onAdd={onAddConv} onDel={onDelConv} onEdit={onEditConv} contactId={c.id}/>}
            {tab==='shows' && (
              <>
                {myStandaloneShows.length > 0 && (
                  <div style={{marginBottom:16}}>
                    <div style={{fontSize:12,color:'#64748b',fontWeight:600,marginBottom:8}}>ארועים</div>
                    {myStandaloneShows.map(sh=>(
                      <div key={sh.id} style={{padding:'10px 14px',background:'#f0fdf4',borderRadius:8,border:'1px solid #86efac',marginBottom:8,display:'flex',alignItems:'center',gap:10}}>
                        <span style={{fontSize:18}}>🎤</span>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:600,fontSize:14}}>{sh.showName||sh.title||'ארוע'}</div>
                          {sh.date && <div style={{fontSize:12,color:'#64748b'}}>{sh.date}</div>}
                        </div>
                        <span style={{fontSize:11,color:'#166534',background:'#dcfce7',padding:'2px 8px',borderRadius:10}}>נרשם</span>
                      </div>
                    ))}
                  </div>
                )}
                <ShowTab items={c.showHistory||[]} onAdd={onAddShow} onEdit={onEditShow} onDel={onDelShow} contacts={contacts||[]} onWaClick={onWaClick}/>
              </>
            )}
