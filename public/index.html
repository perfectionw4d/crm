// ─── Show Templates Manager ───────────────────────────────────────────────────
function ShowTemplatesManager() {
  const [templates, setTemplates] = useState([]);
  const [editing,   setEditing]   = useState(null); // {name:'', description:''} or null
  const [editIdx,   setEditIdx]   = useState(-1);
  const [loading,   setLoading]   = useState(true);
  const [saved,     setSaved]     = useState(false);

  const load = () => api.get('/api/show-templates').then(t=>{ setTemplates(t); setLoading(false); }).catch(()=>setLoading(false));
  useEffect(()=>{ load(); }, []);

  const save = async (list) => {
    await api.put('/api/show-templates', list);
    setTemplates(list); setSaved(true); setTimeout(()=>setSaved(false), 1800);
  };

  const startNew = () => { setEditing({name:'', description:''}); setEditIdx(-1); };
  const startEdit = (i) => { setEditing({...templates[i]}); setEditIdx(i); };

  const confirm = () => {
    if (!editing.name.trim()) return;
    const list = [...templates];
    if (editIdx >= 0) list[editIdx] = editing; else list.push(editing);
    save(list); setEditing(null); setEditIdx(-1);
  };

  const del = (i) => {
    if (!window.confirm('למחוק תבנית זו?')) return;
    const list = templates.filter((_,j)=>j!==i);
    save(list);
  };

  return (
    <div className="card" style={{padding:22,marginBottom:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <h2 style={{fontSize:17,fontWeight:700,margin:0}}>🎤 תבניות מופעים</h2>
        <button className="btn btn-primary btn-sm" onClick={startNew}>+ תבנית חדשה</button>
      </div>
      <p style={{fontSize:13,color:'#64748b',marginBottom:14}}>
        כשבוחרים שם מופע בהצעת מחיר, התיאור ישלף אוטומטית מהתבנית
      </p>
      {loading ? <div style={{color:'#94a3b8'}}>טוען...</div> : (
        <>
          {templates.length === 0 && !editing && (
            <div style={{color:'#94a3b8',fontSize:13,textAlign:'center',padding:'16px 0'}}>אין תבניות — לחץ "+ תבנית חדשה" להוסיף</div>
          )}
          {templates.map((t,i) => (
            <div key={i} style={{border:'1.5px solid #e2e8f0',borderRadius:9,padding:'10px 14px',marginBottom:8,display:'flex',gap:12,alignItems:'flex-start'}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:14,color:'#1e293b',marginBottom:3}}>{t.name}</div>
                {t.description && <div style={{fontSize:12,color:'#64748b',lineHeight:1.5}}>{t.description}</div>}
              </div>
              <div style={{display:'flex',gap:6,flexShrink:0}}>
                <button className="btn btn-secondary btn-xs" onClick={()=>startEdit(i)}>✏️</button>
                <button className="btn btn-danger btn-xs" onClick={()=>del(i)}>🗑️</button>
              </div>
            </div>
          ))}
          {editing && (
            <div style={{border:'2px solid #4f46e5',borderRadius:10,padding:16,marginTop:10,background:'#f5f3ff'}}>
              <div style={{fontWeight:700,fontSize:14,color:'#4f46e5',marginBottom:10}}>{editIdx>=0?'ערוך תבנית':'תבנית חדשה'}</div>
              <div style={{marginBottom:8}}>
                <label className="lbl">שם המופע</label>
                <input className="inp" value={editing.name} onChange={e=>setEditing(p=>({...p,name:e.target.value}))} placeholder="שקוף בחזית, סדנה, הרצאה..."/>
              </div>
              <div style={{marginBottom:12}}>
                <label className="lbl">תיאור (יופיע בהצעת מחיר)</label>
                <textarea className="inp" rows={3} value={editing.description} onChange={e=>setEditing(p=>({...p,description:e.target.value}))}
                  placeholder="תיאור קצר של המופע..." style={{resize:'vertical'}}/>
              </div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-primary btn-sm" onClick={confirm} disabled={!editing.name.trim()}>💾 שמור</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>{setEditing(null);setEditIdx(-1);}}>ביטול</button>
              </div>
            </div>
          )}
          {saved && <div style={{color:'#166534',fontSize:13,marginTop:8}}>✅ נשמר!</div>}
        </>
      )}
    </div>
  );
}

// ─── Help Center ──────────────────────────────────────────────────────────────
function HelpCenter() {
  const [articles, setArticles] = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [search,   setSearch]   = useState('');
  const [tab,      setTab]      = useState('guides'); // guides | qa | pending
  const [viewing,  setViewing]  = useState(null);   // article object
  const [editing,  setEditing]  = useState(null);   // null=closed, {}=new, obj=edit
  const [askQ,     setAskQ]     = useState('');
  const [askState, setAskState] = useState('idle'); // idle | sending | ok
  const [pendingCount, setPendingCount] = useState(0);

  const load = async () => {
    setLoading(true);
    try {
      const data = await api.get('/api/help');
      setArticles(data || []);
      setPendingCount((data||[]).filter(a=>a.status==='pending').length);
    } catch(e) {}
    setLoading(false);
  };

  React.useEffect(() => { load(); }, []);

  const filtered = articles.filter(a => {
    if (tab === 'guides')  return a.type === 'guide'  && a.status === 'published';
    if (tab === 'qa')      return a.type === 'qa'     && a.status === 'published';
    if (tab === 'pending') return a.status === 'pending';
    return false;
  }).filter(a => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (a.title||'').toLowerCase().includes(q) || (a.content||'').toLowerCase().includes(q);
  });

  const askQuestion = async () => {
    if (!askQ.trim()) return;
    setAskState('sending');
    // חפש תשובה קיימת
    const q = askQ.toLowerCase();
    const match = articles.find(a => a.status==='published' &&
      ((a.title||'').toLowerCase().includes(q) || (a.tags||[]).some(t=>t.toLowerCase().includes(q))));
    if (match) {
      setAskState('idle');
      setSearch(askQ);
      setTab(match.type==='guide'?'guides':'qa');
      setViewing(match);
      setAskQ('');
      return;
    }
    // שמור כשאלה ממתינה
    try {
      await api.post('/api/help', { type:'qa', title: askQ, content:'', status:'pending', tags:[] });
      setAskState('ok');
      load();
      setTimeout(()=>{ setAskState('idle'); setAskQ(''); }, 3000);
    } catch(e) { setAskState('idle'); }
  };

  const deleteArticle = async (id) => {
    if (!confirm('למחוק מאמר זה?')) return;
    await api.del(`/api/help/${id}`);
    setViewing(null);
    load();
  };

  const CATS = { contacts:'👤 אנשי קשר', orgs:'🏢 ארגונים', tasks:'📋 משימות', quotes:'📄 הצעות מחיר', whatsapp:'📲 וואטסאפ', settings:'⚙️ הגדרות', general:'💡 כללי' };

  if (viewing) return <ArticleView article={viewing} onBack={()=>setViewing(null)} onEdit={()=>setEditing({...viewing})} onDelete={()=>deleteArticle(viewing.id)} onReload={load}/>;
  if (editing !== null) return <ArticleEditor article={editing} onClose={()=>setEditing(null)} onSaved={()=>{setEditing(null);load();}}/>;

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <h1 style={{fontSize:24,fontWeight:700}}>📚 מרכז הדרכה</h1>
        <button className="btn btn-primary btn-sm" onClick={()=>setEditing({})} style={{display:'flex',alignItems:'center',gap:6}}>
          + מאמר חדש
        </button>
      </div>

      {/* Search */}
      <div className="card" style={{padding:16,marginBottom:16}}>
        <div style={{display:'flex',gap:10,marginBottom:12}}>
          <input className="inp" value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="🔍 חפש מדריך או שאלה..." style={{flex:1}} />
          {search && <button className="btn btn-secondary btn-sm" onClick={()=>setSearch('')}>✕</button>}
        </div>
        {/* Ask question */}
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <input className="inp" value={askQ} onChange={e=>setAskQ(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&askQuestion()}
            placeholder="💬 יש לך שאלה? כתוב אותה כאן..." style={{flex:1}} />
          <button className="btn btn-primary btn-sm" onClick={askQuestion} disabled={askState==='sending'||!askQ.trim()}>
            {askState==='sending'?'מחפש...':askState==='ok'?'✅ נשמר!':'שאל'}
          </button>
        </div>
        {askState==='ok' && <div style={{marginTop:8,fontSize:13,color:'#16a34a'}}>✅ השאלה נשמרה — נענה עליה בקרוב!</div>}
      </div>

      {/* Tabs */}
      <div className="card" style={{marginBottom:16,overflow:'hidden'}}>
        <div style={{display:'flex',borderBottom:'1px solid #f1f5f9'}}>
          {[
            { id:'guides',  label:'📖 מדריכים' },
            { id:'qa',      label:'❓ שאלות ותשובות' },
            { id:'pending', label:`⏳ ממתינות לתשובה${pendingCount>0?` (${pendingCount})`:''}` },
          ].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)}
              style={{padding:'12px 20px',border:'none',background:'none',cursor:'pointer',fontSize:14,fontWeight:600,
                color:tab===t.id?'#4f46e5':'#64748b',borderBottom:tab===t.id?'2px solid #4f46e5':'2px solid transparent',
                whiteSpace:'nowrap'}}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Articles list */}
      {loading ? (
        <div style={{textAlign:'center',padding:40,color:'#94a3b8'}}>טוען...</div>
      ) : filtered.length === 0 ? (
        <div style={{textAlign:'center',padding:40,color:'#94a3b8',background:'white',borderRadius:12}}>
          {search ? `לא נמצאו תוצאות עבור "${search}"` : tab==='pending' ? 'אין שאלות ממתינות 🎉' : 'אין מאמרים עדיין'}
        </div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {filtered.map(a => (
            <div key={a.id} onClick={()=>setViewing(a)}
              style={{background:'white',border:'1.5px solid #e2e8f0',borderRadius:12,padding:'16px 18px',cursor:'pointer',
                transition:'all .15s',display:'flex',alignItems:'flex-start',gap:14}}
              onMouseEnter={e=>e.currentTarget.style.borderColor='#6366f1'}
              onMouseLeave={e=>e.currentTarget.style.borderColor='#e2e8f0'}>
              <div style={{fontSize:24,flexShrink:0,lineHeight:1.2}}>
                {a.type==='guide'?'📖':a.status==='pending'?'⏳':'❓'}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:15,color:'#1e293b',marginBottom:4}}>{a.title}</div>
                {a.category && <div style={{fontSize:12,color:'#6366f1',marginBottom:4}}>{CATS[a.category]||a.category}</div>}
                {a.content && <div style={{fontSize:13,color:'#64748b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.content.replace(/<[^>]+>/g,'').slice(0,120)}</div>}
                {a.status==='pending' && <div style={{marginTop:4,fontSize:12,color:'#f59e0b',fontWeight:600}}>⏳ ממתינה לתשובה</div>}
              </div>
              <div style={{color:'#94a3b8',fontSize:18,flexShrink:0}}>›</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ArticleView({ article, onBack, onEdit, onDelete, onReload }) {
  const [answerMode, setAnswerMode] = useState(false);
  const [answer, setAnswer] = useState(article.content || '');
  const [saving, setSaving] = useState(false);

  const saveAnswer = async () => {
    setSaving(true);
    try {
      await api.put(`/api/help/${article.id}`, { content: answer, status: 'published' });
      onReload();
      onBack();
    } catch(e) {}
    setSaving(false);
  };

  return (
    <div>
      <button className="btn btn-secondary btn-sm" onClick={onBack} style={{marginBottom:16}}>← חזרה</button>

      <div className="card" style={{padding:24}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:16}}>
          <div style={{flex:1}}>
            <div style={{fontSize:12,color:'#6366f1',marginBottom:6}}>
              {article.type==='guide'?'📖 מדריך':'❓ שאלה ותשובה'}
              {article.status==='pending' && ' · ⏳ ממתינה לתשובה'}
            </div>
            <h2 style={{fontSize:20,fontWeight:700,color:'#1e293b'}}>{article.title}</h2>
          </div>
          <div style={{display:'flex',gap:8,flexShrink:0,marginRight:16}}>
            <button className="btn btn-secondary btn-sm" onClick={onEdit}>✏️ ערוך</button>
            <button className="btn btn-secondary btn-sm" onClick={onDelete} style={{color:'#dc2626'}}>🗑️</button>
          </div>
        </div>

        {article.link && (
          <div style={{marginBottom:16,padding:'8px 12px',background:'#eff6ff',borderRadius:8,display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:12,color:'#3b82f6'}}>🔗 קישור ישיר:</span>
            <a href={article.link} style={{fontSize:12,color:'#3b82f6',textDecoration:'underline'}}>{article.link}</a>
          </div>
        )}

        {article.status==='pending' && !answerMode ? (
          <div style={{padding:20,background:'#fffbeb',border:'1px solid #fde68a',borderRadius:10,textAlign:'center'}}>
            <p style={{color:'#92400e',marginBottom:12}}>⏳ שאלה זו עדיין ממתינה לתשובה</p>
            <button className="btn btn-primary btn-sm" onClick={()=>setAnswerMode(true)}>✍️ כתוב תשובה</button>
          </div>
        ) : article.status==='pending' && answerMode ? (
          <div>
            <textarea value={answer} onChange={e=>setAnswer(e.target.value)}
              placeholder="כתוב תשובה..." rows={6}
              style={{width:'100%',padding:12,border:'1.5px solid #e2e8f0',borderRadius:8,fontSize:14,fontFamily:'inherit',resize:'vertical'}}/>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button className="btn btn-primary" onClick={saveAnswer} disabled={saving}>{saving?'שומר...':'💾 פרסם תשובה'}</button>
              <button className="btn btn-secondary" onClick={()=>setAnswerMode(false)}>ביטול</button>
            </div>
          </div>
        ) : (
          <div style={{fontSize:15,color:'#334155',lineHeight:1.8,whiteSpace:'pre-wrap'}}
            dangerouslySetInnerHTML={{__html: (article.content||'').replace(/\n/g,'<br/>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}}/>
        )}

        {article.steps && article.steps.length > 0 && (
          <div style={{marginTop:20}}>
            <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:'#475569'}}>📋 שלבים:</div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {article.steps.map((step,i)=>(
                <div key={i} style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                  <div style={{width:28,height:28,borderRadius:'50%',background:'#6366f1',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,flexShrink:0}}>{i+1}</div>
                  <div style={{flex:1,paddingTop:4,fontSize:14,color:'#334155'}}>{step}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {article.tags && article.tags.length > 0 && (
          <div style={{marginTop:20,display:'flex',flexWrap:'wrap',gap:6}}>
            {article.tags.map(t=><span key={t} style={{fontSize:11,padding:'3px 10px',background:'#f1f5f9',borderRadius:20,color:'#64748b'}}>#{t}</span>)}
          </div>
        )}
      </div>
    </div>
  );
}

function ArticleEditor({ article, onClose, onSaved }) {
  const isNew = !article.id;
  const [form, setForm] = useState({
    type:     article.type     || 'guide',
    category: article.category || 'general',
    title:    article.title    || '',
    content:  article.content  || '',
    steps:    article.steps    || [],
    link:     article.link     || '',
    tags:     (article.tags||[]).join(', '),
    status:   article.status   || 'published',
  });
  const [saving, setSaving] = useState(false);
  const [newStep, setNewStep] = useState('');

  const save = async () => {
    if (!form.title.trim()) return alert('נדרש כותרת');
    setSaving(true);
    const body = { ...form, tags: form.tags.split(',').map(t=>t.trim()).filter(Boolean) };
    try {
      if (isNew) await api.post('/api/help', body);
      else       await api.put(`/api/help/${article.id}`, body);
      onSaved();
    } catch(e) { alert('שגיאה בשמירה'); }
    setSaving(false);
  };

  const addStep = () => {
    if (!newStep.trim()) return;
    setForm(f=>({...f, steps:[...f.steps, newStep.trim()]}));
    setNewStep('');
  };

  const CATS = [
    {v:'contacts',  l:'👤 אנשי קשר'},
    {v:'orgs',      l:'🏢 ארגונים'},
    {v:'tasks',     l:'📋 משימות'},
    {v:'quotes',    l:'📄 הצעות מחיר'},
    {v:'whatsapp',  l:'📲 וואטסאפ'},
    {v:'settings',  l:'⚙️ הגדרות'},
    {v:'general',   l:'💡 כללי'},

  return (
    <div>
      <button className="btn btn-secondary btn-sm" onClick={onClose} style={{marginBottom:16}}>← ביטול</button>
      <div className="card" style={{padding:24}}>
        <h2 style={{fontSize:18,fontWeight:700,marginBottom:20}}>{isNew?'מאמר חדש':'עריכת מאמר'}</h2>

        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div style={{display:'flex',gap:12}}>
            <div style={{flex:1}}>
              <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:5}}>סוג</label>
              <select className="inp" value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
                <option value="guide">📖 מדריך</option>
                <option value="qa">❓ שאלה ותשובה</option>
              </select>
            </div>

              <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:5}}>קטגוריה</label>

                {CATS.map(c=><option key={c.v} value={c.v}>{c.l}</option>)}
              </select>
            </div>
          </div>

          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:5}}>כותרת *</label>
            <input className="inp" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="כותרת המאמר..." />
          </div>

          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:5}}>תוכן / תשובה</label>
            <textarea value={form.content} onChange={e=>setForm(f=>({...f,content:e.target.value}))}
              placeholder="כתוב את התוכן כאן... ניתן להשתמש **טקסט מודגש**" rows={6}
              style={{width:'100%',padding:12,border:'1.5px solid #e2e8f0',borderRadius:8,fontSize:14,fontFamily:'inherit',resize:'vertical'}} />
          </div>

          {form.type==='guide' && (
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:8}}>שלבים (אופציונלי)</label>
              <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:8}}>
                {form.steps.map((s,i)=>(
                  <div key={i} style={{display:'flex',gap:8,alignItems:'center'}}>
                    <div style={{width:24,height:24,borderRadius:'50%',background:'#6366f1',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</div>
                    <input className="inp" value={s} onChange={e=>setForm(f=>({...f,steps:f.steps.map((x,j)=>j===i?e.target.value:x)}))} style={{flex:1}} />
                    <button onClick={()=>setForm(f=>({...f,steps:f.steps.filter((_,j)=>j!==i)}))} style={{background:'none',border:'none',cursor:'pointer',color:'#dc2626',fontSize:16}}>✕</button>
                  </div>
                ))}
              </div>
              <div style={{display:'flex',gap:8}}>
                <input className="inp" value={newStep} onChange={e=>setNewStep(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addStep()} placeholder="הוסף שלב..." style={{flex:1}} />
                <button className="btn btn-secondary btn-sm" onClick={addStep}>+ הוסף</button>
              </div>
            </div>
          )}

          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:5}}>קישור ל-CRM (אופציונלי)</label>
            <input className="inp" value={form.link} onChange={e=>setForm(f=>({...f,link:e.target.value}))} placeholder="לדוגמה: #contacts או https://..." style={{direction:'ltr',textAlign:'left'}} />
          </div>

          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:5}}>תגיות (מופרדות בפסיק)</label>
            <input className="inp" value={form.tags} onChange={e=>setForm(f=>({...f,tags:e.target.value}))} placeholder="איש קשר, הוספה, חדש..." />
          </div>

          <div style={{display:'flex',gap:8,marginTop:8}}>
            <button className="btn btn-primary" onClick={save} disabled={saving} style={{flex:1}}>
              {saving?'שומר...':isNew?'💾 פרסם מאמר':'💾 שמור שינויים'}
            </button>
            <button className="btn btn-secondary" onClick={onClose} style={{padding:'10px 20px'}}>ביטול</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Users Manager ────────────────────────────────────────────────────────────
function UsersManager() {
  const [users,    setUsers]   = useState([]);
  const [loading,  setLoading] = useState(true);
  const [showForm, setShowForm]= useState(false);
  const [editUser, setEditUser]= useState(null); // null=new, obj=edit
  const [contacts, setContacts]= useState([]);
  const [form,     setForm]    = useState({ name:'', email:'', password:'', contactId:'' });
  const [saving,   setSaving]  = useState(false);
  const [msg,      setMsg]     = useState(null);

  const load = async () => {
    setLoading(true);
    try {
      const u = await api.get('/api/users');
      setUsers(u);
    } catch(e) { setMsg({ type:'err', text:'שגיאה בטעינת משתמשים' }); }
    setLoading(false);
  };

  React.useEffect(() => {
    load();
    api.get('/api/contacts').then(c => setContacts(c || [])).catch(()=>{});
  }, []);

  const genPassword = () => {
    const upper  = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const lower  = 'abcdefghjkmnpqrstuvwxyz';
    const digits = '23456789';
    const syms   = '!@#$%^&*';
    const all    = upper + lower + digits + syms;
    let pw = '';
    pw += upper [Math.floor(Math.random()*upper.length)];
    pw += upper [Math.floor(Math.random()*upper.length)];
    pw += digits[Math.floor(Math.random()*digits.length)];
    pw += digits[Math.floor(Math.random()*digits.length)];
    pw += syms  [Math.floor(Math.random()*syms.length)];
    for (let i=0;i<5;i++) pw += all[Math.floor(Math.random()*all.length)];
    // ערבב
    return pw.split('').sort(()=>Math.random()-.5).join('');
  };

  const validatePassword = (pw) => {
    if (!pw) return null;
    if (pw.length < 8)               return 'הסיסמה חייבת להכיל לפחות 8 תווים';
    if (!/[A-Z]/.test(pw))           return 'הסיסמה חייבת להכיל לפחות אות גדולה אחת (A-Z)';
    if (!/[0-9]/.test(pw))           return 'הסיסמה חייבת להכיל לפחות ספרה אחת (0-9)';
    if (!/[!@#$%^&*\-_=+?.]/.test(pw)) return 'הסיסמה חייבת להכיל לפחות סימן מיוחד אחד (!@#$%^&*)';
    return null;
  };

  const openNew = () => {
    setEditUser(null);
    setForm({ name:'', email:'', password:genPassword(), contactId:'' });
    setMsg(null);
    setShowForm(true);
  };

  const openEdit = (u) => {
    setEditUser(u);
    setForm({ name:u.name||'', email:u.email||'', password:'', contactId:u.contactId||'' });
    setMsg(null);
    setShowForm(true);
  };

  const saveUser = async () => {
    setMsg(null);
    if (!form.email) return setMsg({ type:'err', text:'נדרשת כתובת אימייל' });
    if (!editUser && !form.password) return setMsg({ type:'err', text:'נדרשת סיסמה ליצירת משתמש' });
    // ולידציה סיסמה
    const pwToCheck = form.password;
    if (pwToCheck) {
      const pwErr = validatePassword(pwToCheck);
      if (pwErr) return setMsg({ type:'err', text: '🔒 ' + pwErr + ' — הסיסמה חייבת: לפחות 8 תווים, אות גדולה, ספרה וסימן מיוחד' });
    } else if (!editUser) {
      return setMsg({ type:'err', text: 'נדרשת סיסמה' });
    }
    setSaving(true);
    try {
      if (editUser) {
        const body = { name: form.name, email: form.email, contactId: form.contactId || null };
        if (form.password) body.password = form.password;
        await api.put(`/api/users/${editUser.id}`, body);
        setMsg({ type:'ok', text:'✅ המשתמש עודכן בהצלחה' });
      } else {
        const result = await api.post('/api/users', { name: form.name, email: form.email, password: form.password, contactId: form.contactId || null });
        if (result.emailError) {
          setMsg({ type:'warn', text:`✅ המשתמש נוצר! אבל שליחת המייל נכשלה: ${result.emailError}` });
        } else {
          setMsg({ type:'ok', text:'✅ המשתמש נוצר ונשלח לו מייל ברוכים הבאים!' });
        }
      }
      load();
      setTimeout(() => { setShowForm(false); setMsg(null); }, 4000);
    } catch(e) {
      setMsg({ type:'err', text: e.message || 'שגיאה בשמירה' });
    }
    setSaving(false);
  };

  const deleteUser = async (u) => {
    if (!confirm(`למחוק את המשתמש ${u.name || u.email}?`)) return;
    try {
      await api.del(`/api/users/${u.id}`);
      load();
    } catch(e) { alert('שגיאה במחיקה: ' + e.message); }
  };

  const toggleActive = async (u) => {
    try { await api.put(`/api/users/${u.id}`, { active: !u.active }); load(); }
    catch(e) { alert('שגיאה בעדכון'); }
  };

  return (
    <div>
      <div className="card" style={{padding:20,marginBottom:20}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <h2 style={{fontSize:17,fontWeight:700,display:'flex',alignItems:'center',gap:8}}>
            👥 ניהול משתמשים
          </h2>
          <button className="btn btn-primary btn-sm" onClick={openNew} style={{display:'flex',alignItems:'center',gap:6}}>
            + הוסף משתמש
          </button>
        </div>
        <p style={{fontSize:13,color:'#64748b',marginBottom:16}}>
          משתמשים אלה יוכלו להיכנס למערכת עם כתובת האימייל והסיסמה שלהם. בעת יצירה יישלח אליהם מייל ברוכים הבאים עם פרטי הכניסה.
        </p>
        <TestEmailButton/>

        {loading ? (
          <div style={{textAlign:'center',padding:20,color:'#94a3b8'}}>טוען...</div>
        ) : users.length === 0 ? (
          <div style={{textAlign:'center',padding:20,color:'#94a3b8',background:'#f8fafc',borderRadius:10}}>
            אין משתמשים עדיין. לחץ "הוסף משתמש" כדי ליצור את הראשון.
          </div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {users.map(u => (
              <div key={u.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:u.active===false?'#f8fafc':'#f0fdf4',border:`1.5px solid ${u.active===false?'#e2e8f0':'#86efac'}`,borderRadius:10}}>
                <div style={{width:38,height:38,borderRadius:'50%',background:u.active===false?'#e2e8f0':'#dcfce7',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>
                  {u.active===false?'🚫':'👤'}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:14,color:'#1e293b'}}>{u.name || u.email}</div>
                  <div style={{fontSize:12,color:'#64748b'}}>{u.email}</div>
                  {u.contactId && <div style={{fontSize:11,color:'#94a3b8'}}>מקושר לאיש קשר</div>}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{fontSize:11,padding:'3px 8px',borderRadius:20,background:u.active===false?'#fef2f2':'#dcfce7',color:u.active===false?'#dc2626':'#16a34a',fontWeight:600}}>
                    {u.active===false?'מושבת':'פעיל'}
                  </span>
                  <button className="btn btn-secondary btn-sm" onClick={()=>openEdit(u)} style={{fontSize:12,padding:'4px 10px'}}>✏️ ערוך</button>
                  <button className="btn btn-secondary btn-sm" onClick={()=>toggleActive(u)} style={{fontSize:12,padding:'4px 10px',color:u.active===false?'#16a34a':'#dc2626'}}>
                    {u.active===false?'הפעל':'השבת'}
                  </button>
                  <button className="btn btn-secondary btn-sm" onClick={()=>deleteUser(u)} style={{fontSize:12,padding:'4px 10px',color:'#dc2626'}}>🗑️</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Modal: Add / Edit user */}
      {showForm && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
          <div style={{background:'white',borderRadius:16,padding:28,width:'100%',maxWidth:440,maxHeight:'90vh',overflowY:'auto'}}>
            <h3 style={{fontSize:18,fontWeight:700,marginBottom:20}}>{editUser?'ערוך משתמש':'הוסף משתמש חדש'}</h3>

            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div>
                <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:5}}>שם מלא</label>
                <input className="inp" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="שם מלא..." />
              </div>
              <div>
                <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:5}}>כתובת אימייל *</label>
                <input className="inp" type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="email@example.com" style={{direction:'ltr',textAlign:'left'}} />
              </div>
              <div>
                <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:5}}>
                  {editUser ? 'סיסמה חדשה (השאר ריק לאי-שינוי)' : 'סיסמה *'}
                </label>
                <div style={{display:'flex',gap:8}}>
                  <input className="inp" type="text" value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))} placeholder="לפחות 8 תווים..." style={{direction:'ltr',textAlign:'left',flex:1,fontFamily:'monospace'}} />

  const todayStr = today();
  const [waMsgs, setWaMsgs] = React.useState([]);
  const [waLoading, setWaLoading] = React.useState(false);

  React.useEffect(() => {
    if (!contactId) return;
    setWaLoading(true);
    api.get(`/api/wa/messages?contactId=${contactId}`)
      .then(d => setWaMsgs(d))
      .catch(()=>{})
      .finally(()=>setWaLoading(false));
  }, [contactId]);

  // מיזוג שיחות ידניות + הודעות WA, מיון לפי תאריך יורד
  const allItems = [
    ...items.map(cv=>({ _type:'conv', _ts: cv.date ? new Date(cv.date).getTime() : 0, ...cv })),

        if (item._type === 'wa') {

          return (
            <div key={'wa-'+item.id} className="conv-line" style={{borderRightColor:'#22c55e'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>

                  <span style={{fontSize:12,color:'#94a3b8'}}>{new Date(item.timestamp).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>

                </div>

                <span style={{fontSize:12,color:'#94a3b8'}}>{fmtD(cv.date)}</span>
              </div>
              <div style={{display:'flex',gap:4,alignItems:'center'}}>

// ─── Smart Select (dropdown + inline "add new") ───────────────────────────────
function SmartSelect({ value, onChange, listKey, options, emptyLabel }) {
  const ctx = useContext(ListsCtx);
  const [adding, setAdding] = useState(false);
  const [nv, setNv] = useState('');
  const confirm = () => {
    const v = nv.trim(); if (!v) { setAdding(false); return; }
    if (ctx && listKey) ctx.add(listKey, v);
    onChange(v); setAdding(false); setNv('');
  };
  const cancel = () => { setAdding(false); setNv(''); };
  // onMouseDown={e=>e.preventDefault()} on buttons keeps input focused → prevents blur from firing before click
  if (adding) return (
    <div style={{display:'flex',gap:6}}>
      <input className="inp" style={{flex:1}} value={nv} onChange={e=>setNv(e.target.value)} placeholder="ערך חדש..." autoFocus
        onBlur={confirm}
        onKeyDown={e=>{if(e.key==='Enter')confirm();if(e.key==='Escape')cancel();}}/>
      <button type="button" className="btn btn-primary btn-sm" onMouseDown={e=>e.preventDefault()} onClick={confirm}>✓</button>
      <button type="button" className="btn btn-secondary btn-sm" onMouseDown={e=>{e.preventDefault();cancel();}}>✕</button>
    </div>
  );
  return (
    <div style={{display:'flex',gap:6,alignItems:'center'}}>
      <select className="inp" style={{flex:1}} value={value} onChange={e=>onChange(e.target.value)}>
        {emptyLabel!==undefined && <option value="">{emptyLabel}</option>}
        {(options||[]).map(o => typeof o==='string'
          ? <option key={o} value={o}>{o}</option>
          : <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
      <button type="button" onClick={()=>setAdding(true)}
        style={{whiteSpace:'nowrap',fontSize:12,color:'#6366f1',background:'#eef2ff',border:'1px solid #c7d2fe',borderRadius:8,padding:'6px 10px',cursor:'pointer',fontWeight:600,flexShrink:0}}>
        ＋ חדש
      </button>
    </div>
  );
}

// ─── Tag Input (multi-value with pills) ──────────────────────────────────────
function TagInput({ value, onChange }) {
  const ctx = useContext(ListsCtx);
  const tags = Array.isArray(value) ? value : (value?(value+'').split(',').map(t=>t.trim()).filter(Boolean):[]);
  const [adding, setAdding] = useState(false);
  const [nv, setNv] = useState('');
  const suggestions = (ctx ? ctx.get('tags', DEF_TAGS) : DEF_TAGS).filter(t=>!tags.includes(t));
  const addTag = tag => {
    const t=(tag||'').trim(); if(!t||tags.includes(t)) return;
    if(ctx) ctx.add('tags', t);
    onChange([...tags, t]); setAdding(false); setNv('');
  };
  return (
    <div>
      {tags.length>0 && (
        <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:6}}>
          {tags.map(t=>(
            <span key={t} className="pill" style={{display:'inline-flex',alignItems:'center',gap:3}}>
              {t}
              <button type="button" onClick={()=>onChange(tags.filter(x=>x!==t))} style={{border:'none',background:'none',cursor:'pointer',color:'#3730a3',padding:0,fontSize:14,lineHeight:1}}>×</button>
            </span>
          ))}
        </div>
      )}
      {adding ? (
        <div style={{display:'flex',gap:6}}>
          <input className="inp" style={{flex:1}} value={nv} onChange={e=>setNv(e.target.value)} placeholder="תגית חדשה..."
            autoFocus onKeyDown={e=>{if(e.key==='Enter')addTag(nv);if(e.key==='Escape'){setAdding(false);setNv('');}}}/>
          <button type="button" className="btn btn-primary btn-sm" onClick={()=>addTag(nv)}>✓</button>
          <button type="button" className="btn btn-secondary btn-sm" onClick={()=>{setAdding(false);setNv('');}}>✕</button>
        </div>
      ) : (
        <div>
          <button type="button" className="btn btn-secondary btn-sm" onClick={()=>setAdding(true)} style={{marginBottom:5}}>
            <I n="plus" s={11}/>הוסף תגית
          </button>
          {suggestions.length>0 && (
            <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:4}}>
              {suggestions.slice(0,8).map(s=>(
                <button type="button" key={s} onClick={()=>addTag(s)}
                  style={{padding:'2px 8px',border:'1px dashed #cbd5e1',borderRadius:12,background:'none',fontSize:12,cursor:'pointer',color:'#64748b'}}>
                  +{s}
                </button>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

          <div><label className="lbl">מועד מעקב</label><input type="date" className="inp" value={f.nextFollowUp} onChange={e=>set('nextFollowUp',e.target.value)}/></div>
          <div style={{gridColumn:'1/-1'}}><label className="lbl">תגיות</label><TagInput value={f.tags} onChange={v=>set('tags',v)}/></div>
          <div style={{gridColumn:'1/-1'}}><label className="lbl">הערות</label><textarea className="inp" rows={3} value={f.notes} onChange={e=>set('notes',e.target.value)} style={{resize:'vertical'}}/></div>
        </div>
        <ModalFooter onSave={()=>{if(!f.name.trim())return alert('נא להזין שם');onSave({...f,tags:Array.isArray(f.tags)?f.tags:f.tags.split(',').map(t=>t.trim()).filter(Boolean)});}} onClose={onClose}/>
      </div>
    </div>
  );
}

// Multi-value field (phones / emails)
function MultiField({ values, onChange, type='text', placeholder='', dir='rtl' }) {
  const add    = ()    => onChange([...values, '']);
  const update = (i,v) => onChange(values.map((x,j)=>j===i?v:x));
  const remove = (i)   => onChange(values.filter((_,j)=>j!==i));
  return (
    <div style={{display:'flex',flexDirection:'column',gap:5}}>
      {values.map((v,i)=>(
        <div key={i} style={{display:'flex',gap:4,alignItems:'center'}}>
          <input className="inp" type={type} value={v} dir={dir}
            onChange={e=>update(i,e.target.value)}
            onBlur={type==='tel'?e=>update(i,normalizePhone(e.target.value)):undefined}
            placeholder={placeholder}
            style={{flex:1,marginBottom:0}}/>
          <button type="button" onClick={()=>remove(i)}
            style={{flexShrink:0,width:26,height:26,borderRadius:6,border:'1px solid #fca5a5',
              background:'#fff',color:'#ef4444',cursor:'pointer',fontSize:16,lineHeight:1,padding:0}}>
            ×
          </button>
        </div>
      ))}
      <button type="button" onClick={add}
        style={{alignSelf:'flex-start',background:'#f0f9ff',border:'1px dashed #93c5fd',
          color:'#3b82f6',borderRadius:6,padding:'3px 10px',fontSize:12,cursor:'pointer',fontWeight:600}}>
        + הוסף
      </button>
    </div>
  );
}

function ContactModal({ contact, orgs, contacts=[], onSave, onClose, defaultOrgId, onAddOrg }) {
  const ctx = useContext(ListsCtx);
  const allSt  = ctx ? ctx.allStatus() : STATUS;
  const srcOpts = ctx ? ctx.get('source', DEF_SOURCE) : DEF_SOURCE;
  const roleOpts = ctx ? ctx.get('role', DEF_ROLE) : DEF_ROLE;

  const splitName = (name='') => {
    const parts = (name||'').trim().split(/\s+/);
    return { firstName: parts[0]||'', lastName: parts.slice(1).join(' ')||'' };
  };
  const { firstName: initFirst, lastName: initLast } = splitName(contact?.name||'');

  const [f, setF] = useState({
    firstName:initFirst, lastName:initLast,
    organizationId:contact?.organizationId||defaultOrgId||'',
    role:contact?.role||'', phone:contact?.phone||'', email:contact?.email||'',
    extraPhones: Array.isArray(contact?.extraPhones) ? contact.extraPhones : [],
    extraEmails: Array.isArray(contact?.extraEmails) ? contact.extraEmails : [],
    city:contact?.city||'', status:contact?.status||'lead', source:contact?.source||'',
    nextFollowUp:contact?.nextFollowUp||'', birthday:contact?.birthday||'',
    notes:contact?.notes||'', tags:contact?.tags||[]
  });
  const [localOrgs, setLocalOrgs] = useState(orgs);
  const [newOrgMode, setNewOrgMode] = useState(false);
  const [newOrgName, setNewOrgName] = useState('');
  const [dupWarning, setDupWarning] = useState(null);
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  const buildName = () => [f.firstName.trim(), f.lastName.trim()].filter(Boolean).join(' ');

  const doSave = () => {
    const name = buildName();
    const tags = Array.isArray(f.tags) ? f.tags : f.tags.split(',').map(t=>t.trim()).filter(Boolean);
    const extraPhones = (f.extraPhones||[]).map(p=>normalizePhone(p)).filter(Boolean);
    const extraEmails = (f.extraEmails||[]).filter(Boolean);
    onSave({ ...f, name, tags, extraPhones, extraEmails });
  };

  const createOrg = async () => {
    if (!newOrgName.trim()) return;
    try {
      const r = await onAddOrg({ name: newOrgName.trim() });
      setLocalOrgs(p=>[r,...p]);
      set('organizationId', r.id);
      setNewOrgName('');
      setNewOrgMode(false);
    } catch {}
  };

  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <ModalHeader title={contact?'עריכת איש קשר':'איש קשר חדש'} onClose={onClose}/>
        <div style={{padding:22}} className="grid2">
          <div>
            <label className="lbl">שם פרטי *</label>
            <input className="inp" value={f.firstName} onChange={e=>set('firstName',e.target.value)} placeholder="שם פרטי" autoFocus/>
          </div>
          <div>
            <label className="lbl">שם משפחה</label>
            <input className="inp" value={f.lastName} onChange={e=>set('lastName',e.target.value)} placeholder="שם משפחה"/>
          </div>
          <div>
            <label className="lbl" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>ארגון</span>
              <button type="button" onClick={()=>setNewOrgMode(p=>!p)}
                style={{fontSize:11,color:'#6366f1',background:'none',border:'none',cursor:'pointer',padding:'0 2px',fontWeight:600}}>
                {newOrgMode ? '✕ ביטול' : '+ ארגון חדש'}
              </button>
            </label>
            {newOrgMode ? (
              <div style={{display:'flex',gap:6}}>
                <input className="inp" value={newOrgName} onChange={e=>setNewOrgName(e.target.value)}
                  placeholder="שם הארגון..." onKeyDown={e=>e.key==='Enter'&&createOrg()}
                  style={{flex:1}}/>
                <button className="btn btn-primary btn-sm" onClick={createOrg} style={{whiteSpace:'nowrap'}}>צור וקשר</button>
              </div>
            ) : (
              <select className="inp" value={f.organizationId} onChange={e=>set('organizationId',e.target.value)}>
                <option value="">— ללא ארגון —</option>
                {localOrgs.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
              </select>
            )}
          </div>
          <div>
            <label className="lbl">תפקיד</label>
            <SmartSelect value={f.role} onChange={v=>set('role',v)} listKey="role" options={roleOpts} emptyLabel="— בחר תפקיד —"/>
          </div>
          <div>
            <label className="lbl">סטטוס</label>
            <select className="inp" value={f.status} onChange={e=>set('status',e.target.value)}>
              {Object.entries(allSt).map(([k,v])=><option key={k} value={k}>{v.lbl}</option>)}
            </select>
          </div>
          <div>
            <label className="lbl">טלפון ראשי</label>
            <input className="inp" value={f.phone} onChange={e=>set('phone',e.target.value)}
              onBlur={e=>set('phone',normalizePhone(e.target.value))} dir="ltr" style={{marginBottom:6}}/>
            {f.extraPhones.length > 0 && (
              <MultiField values={f.extraPhones} onChange={v=>set('extraPhones',v)}
                type="tel" placeholder="טלפון נוסף" dir="ltr"/>
            )}
            {f.extraPhones.length === 0 && (
              <button type="button" onClick={()=>set('extraPhones',[''])}
                style={{background:'none',border:'none',color:'#3b82f6',fontSize:12,cursor:'pointer',padding:'2px 0',fontWeight:600}}>
                + טלפון נוסף
              </button>
            )}
          </div>
          <div>
            <label className="lbl">אימייל ראשי</label>
            <input className="inp" type="email" value={f.email} onChange={e=>set('email',e.target.value)}
              dir="ltr" style={{marginBottom:6}}/>
            {f.extraEmails.length > 0 && (
              <MultiField values={f.extraEmails} onChange={v=>set('extraEmails',v)}
                type="email" placeholder="אימייל נוסף" dir="ltr"/>
            )}
            {f.extraEmails.length === 0 && (
              <button type="button" onClick={()=>set('extraEmails',[''])}
                style={{background:'none',border:'none',color:'#3b82f6',fontSize:12,cursor:'pointer',padding:'2px 0',fontWeight:600}}>
                + אימייל נוסף
              </button>
            )}
          </div>
          <div><label className="lbl">עיר</label><input className="inp" value={f.city} onChange={e=>set('city',e.target.value)}/></div>
          <div>
            <label className="lbl">מקור</label>
            <SmartSelect value={f.source} onChange={v=>set('source',v)} listKey="source" options={srcOpts} emptyLabel="— בחר מקור —"/>
          </div>
          <div><label className="lbl">מועד מעקב</label><input type="date" className="inp" value={f.nextFollowUp} onChange={e=>set('nextFollowUp',e.target.value)}/></div>
          <div><label className="lbl">🎂 יום הולדת</label><BirthdayPicker value={f.birthday} onChange={v=>set('birthday',v)}/></div>
          <div style={{gridColumn:'1/-1'}}><label className="lbl">תגיות</label><TagInput value={f.tags} onChange={v=>set('tags',v)}/></div>
          <div style={{gridColumn:'1/-1'}}><label className="lbl">הערות</label><textarea className="inp" rows={3} value={f.notes} onChange={e=>set('notes',e.target.value)} style={{resize:'vertical'}}/></div>
        </div>
        {dupWarning && (
          <div style={{margin:'0 22px 14px',padding:'12px 16px',background:'#fef3c7',border:'1px solid #fbbf24',borderRadius:10,fontSize:13}}>
            <div style={{fontWeight:700,color:'#92400e',marginBottom:6}}>⚠️ מספר טלפון קיים כבר אצל: <span style={{fontStyle:'italic'}}>{dupWarning.name}</span></div>
            <div style={{color:'#78350f',marginBottom:10}}>האם להמשיך ולשמור בכל זאת?</div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-primary btn-sm" onClick={()=>{setDupWarning(null);doSave();}}>כן, שמור בכל זאת</button>
              <button className="btn btn-secondary btn-sm" onClick={()=>setDupWarning(null)}>ביטול</button>
            </div>
          </div>
        )}
        <ModalFooter onSave={()=>{
          if(!f.firstName.trim()) return alert('נא להזין שם פרטי');
          const norm = normalizePhone(f.phone);
          if (norm && norm.trim()) {
            const dup = contacts.find(c => c.id !== contact?.id && normalizePhone(c.phone) === norm);
            if (dup) return setDupWarning({name: dup.name, id: dup.id});
          }
          doSave();
        }} onClose={onClose}/>
      </div>
    </div>
  );
}

/* ── Multi-contact picker (tags + search + add new) ── */
function MultiContactField({ contacts=[], values=[], onChange, label='לקוח/ספק מקושר' }) {
  const [q, setQ]           = useState('');
  const [open, setOpen]     = useState(false);
  const [newMode, setNewMode] = useState(false);
  const [newC, setNewC]     = useState({ name:'', phone:'', email:'' });
  const [localContacts, setLocalContacts] = useState(contacts);
  const inputRef = useRef();

  // contacts not already selected
  const available = localContacts.filter(c => !values.includes(c.id));
  const filtered  = q
    ? available.filter(c => c.name.toLowerCase().includes(q.toLowerCase()) || (c.phone||'').includes(q))
    : available;

  const add = (c) => { onChange([...values, c.id]); setQ(''); setOpen(false); };
  const remove = (id) => onChange(values.filter(x => x !== id));

  const create = async () => {
    if (!newC.name.trim()) return;
    try {
      const r = await api.post('/api/contacts', { name: newC.name.trim(), phone: newC.phone.trim(), email: newC.email.trim() });
      setLocalContacts(p => [r, ...p]);
      add(r);
      setNewMode(false);
      setNewC({ name:'', phone:'', email:'' });
    } catch { alert('שגיאה ביצירת איש קשר'); }
  };

  const selectedContacts = values.map(id => localContacts.find(c => c.id === id)).filter(Boolean);

  return (
    <div>
      <label className="lbl" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span>{label}</span>
        <button type="button" onClick={() => setNewMode(p=>!p)}
          style={{fontSize:11,color:'#6366f1',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>
          {newMode ? '✕ ביטול' : '+ ספק/לקוח חדש'}
        </button>
      </label>

      {/* New contact inline form */}
      {newMode && (
        <div style={{display:'flex',gap:5,marginBottom:6,padding:'8px 10px',background:'#f0fdf4',borderRadius:8,border:'1px solid #bbf7d0'}}>
          <input className="inp" value={newC.name} onChange={e=>setNewC(p=>({...p,name:e.target.value}))} placeholder="שם *" style={{flex:2}} autoFocus onKeyDown={e=>e.key==='Enter'&&create()}/>
          <input className="inp" value={newC.phone} onChange={e=>setNewC(p=>({...p,phone:e.target.value}))} placeholder="טלפון" style={{flex:1,direction:'ltr'}} onKeyDown={e=>e.key==='Enter'&&create()}/>
          <input className="inp" value={newC.email} onChange={e=>setNewC(p=>({...p,email:e.target.value}))} placeholder="מייל" style={{flex:1.5,direction:'ltr'}} onKeyDown={e=>e.key==='Enter'&&create()}/>
          <button className="btn btn-primary btn-sm" onClick={create} style={{whiteSpace:'nowrap'}}>צור</button>
        </div>
      )}

      {/* Selected tags */}
      {selectedContacts.length > 0 && (
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:6}}>
          {selectedContacts.map(c => (
            <div key={c.id} style={{display:'inline-flex',alignItems:'center',gap:4,background:'#eef2ff',border:'1px solid #c7d2fe',borderRadius:20,padding:'3px 10px 3px 6px',fontSize:12,fontWeight:600,color:'#4338ca'}}>
              <span style={{width:20,height:20,borderRadius:'50%',background:'#6366f1',color:'#fff',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,flexShrink:0}}>
                {c.name[0]}
              </span>
              {c.name}
              <button type="button" onClick={() => remove(c.id)}
                style={{marginRight:2,background:'none',border:'none',cursor:'pointer',color:'#6366f1',fontSize:14,lineHeight:1,padding:0}}>×</button>
            </div>
          ))}
        </div>
      )}

      {/* Search dropdown */}
      <div style={{position:'relative'}}>
        <input ref={inputRef} className="inp" value={q}
          onChange={e => { setQ(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          onBlur={() => setTimeout(() => setOpen(false), 150)}
          placeholder={selectedContacts.length > 0 ? 'הוסף עוד...' : 'חפש לקוח או ספק...'}
          autoComplete="off"/>
        {open && (
          <div style={{position:'absolute',top:'100%',right:0,left:0,zIndex:200,background:'#fff',border:'1px solid #e2e8f0',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,.1)',maxHeight:180,overflowY:'auto',marginTop:2}}>
            {filtered.length === 0
              ? <div style={{padding:'10px 14px',fontSize:13,color:'#94a3b8'}}>{q ? 'לא נמצאו תוצאות' : 'כל אנשי הקשר כבר נבחרו'}</div>
              : filtered.slice(0, 30).map(c => (
                <div key={c.id} onMouseDown={() => add(c)}
                  style={{padding:'7px 14px',cursor:'pointer',fontSize:13,borderBottom:'1px solid #f8fafc',display:'flex',alignItems:'center',gap:8}}
                  onMouseOver={e => e.currentTarget.style.background='#f1f5f9'}
                  onMouseOut={e => e.currentTarget.style.background='transparent'}>
                  <div style={{width:24,height:24,borderRadius:'50%',background:'#e0e7ff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#4f46e5',flexShrink:0}}>{c.name[0]}</div>
                  <span>{c.name}</span>
                  {c.phone && <span style={{fontSize:11,color:'#94a3b8',direction:'ltr'}}>{c.phone}</span>}
                </div>
              ))
            }
          </div>
        )}
      </div>
    </div>
  );
}

// ─── MultiContactSelect ───────────────────────────────────────────────────────
function MultiContactSelect({ contacts=[], value=[], onChange, label='משתתפים' }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const sel = new Set(value);
  const filtered = contacts.filter(c => !q || c.name?.toLowerCase().includes(q.toLowerCase()) || c.phone?.includes(q));
  const toggle = id => {
    const next = sel.has(id) ? value.filter(x=>x!==id) : [...value, id];
    onChange(next);
  };
  const names = value.map(id=>contacts.find(c=>c.id===id)?.name||'').filter(Boolean);
  return (
    <div style={{position:'relative'}}>
      <label className="lbl">{label}</label>
      <div onClick={()=>setOpen(p=>!p)} style={{border:'1.5px solid #e2e8f0',borderRadius:8,padding:'8px 12px',cursor:'pointer',minHeight:38,display:'flex',flexWrap:'wrap',gap:4,alignItems:'center',background:'#fff'}}>
        {names.length===0 && <span style={{color:'#94a3b8',fontSize:13}}>— הוסף משתתפים —</span>}
        {names.map((n,i)=>(
          <span key={value[i]} style={{background:'#eef2ff',color:'#3730a3',borderRadius:12,padding:'2px 8px',fontSize:12,fontWeight:600,display:'flex',alignItems:'center',gap:4}}>
            {n}
            <span onClick={e=>{e.stopPropagation();toggle(value[i]);}} style={{cursor:'pointer',fontWeight:700,marginRight:2}}>×</span>
          </span>
        ))}
        <span style={{marginRight:'auto',color:'#94a3b8',fontSize:12}}>{open?'▲':'▼'}</span>
      </div>
      {open && (
        <div style={{position:'absolute',top:'100%',right:0,left:0,background:'#fff',border:'1.5px solid #e2e8f0',borderRadius:8,boxShadow:'0 8px 24px rgba(0,0,0,.12)',zIndex:50,maxHeight:220,overflowY:'auto'}}>
          <div style={{padding:'8px 10px',borderBottom:'1px solid #f1f5f9'}}>
            <input autoFocus className="inp" value={q} onChange={e=>setQ(e.target.value)} placeholder="חיפוש..." style={{padding:'5px 10px',fontSize:13}}/>
          </div>
          {filtered.slice(0,30).map(c=>(

  );
}
