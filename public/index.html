// ─── Show Detail Modal ────────────────────────────────────────────────────────
function ShowDetailModal({ show, contacts=[], onClose, onEdit, onGoContact, onDelete, waStatus }) {
  const SC={inquiry:'#dbeafe',proposal:'#fef3c7',scheduled:'#dcfce7',completed:'#e0e7ff',cancelled:'#fee2e2'};
  const ST={inquiry:'#1d4ed8',proposal:'#92400e',scheduled:'#166534',completed:'#3730a3',cancelled:'#991b1b'};
  const contactMap = Object.fromEntries(contacts.map(c=>[c.id,c]));
  const participants = (show.participantContactIds||[]).map(id=>contactMap[id]).filter(Boolean).sort((a,b)=>(a.name||'').localeCompare(b.name||'','he'));
  const withPhone = participants.filter(c=>c.phone);

  // הודעות WA שנשלחו/התקבלו עבור האירוע הזה
  const [showMsgs, setShowMsgs] = useState([]);
  const [msgsTab, setMsgsTab] = useState('participants'); // 'participants' | 'messages'
  React.useEffect(() => {
    if (!show.id) return;
    api.get(`/api/wa/messages?showId=${show.id}`)
      .then(d => setShowMsgs(d.sort((a,b)=>b.timestamp-a.timestamp)))
      .catch(()=>{});
  }, [show.id]);

  // RSVP state
  const [registrants, setRegistrants] = useState([]);
  const [rsvpFilter, setRsvpFilter] = useState('all'); // all|confirmed|declined|pending|waitlist
  const [rsvpLoading, setRsvpLoading] = useState(false);
  const [addRsvpMode, setAddRsvpMode] = useState(false);
  const [newRsvp, setNewRsvp] = useState({ contactId:'', name:'', phone:'', email:'' });
  const [sendingRsvp, setSendingRsvp] = useState(false);

  React.useEffect(() => {
    if (!show.id) return;
    setRsvpLoading(true);
    api.get(`/api/shows/${show.id}/registrants`)
      .then(d=>setRegistrants(Array.isArray(d)?d:[]))
      .catch(()=>setRegistrants([]))
      .finally(()=>setRsvpLoading(false));
  }, [show.id]);

  const rsvpStats = React.useMemo(() => {
    const confirmed = registrants.filter(r=>r.status==='confirmed');
    const declined  = registrants.filter(r=>r.status==='declined');
    const pending   = registrants.filter(r=>r.status==='pending');
    const waitlist  = registrants.filter(r=>r.status==='waitlist');
    return { confirmed, declined, pending, waitlist, total: registrants.length,
      confirmedCount: confirmed.reduce((s,r)=>s+1+(r.guestCount||0),0) };
  }, [registrants]);

  const filteredRsvp = React.useMemo(() => {
    if (rsvpFilter==='all') return registrants;
    return registrants.filter(r=>r.status===rsvpFilter);
  }, [registrants, rsvpFilter]);

  const sendRsvpInvite = async (group='pending') => {
    if (!window.confirm(`שלח בקשת RSVP ל-${group==='all'?'כולם':group==='pending'?'ממתינים':group}?`)) return;
    setSendingRsvp(true);
    try {
      await api.post(`/api/shows/${show.id}/rsvp/send`, { group });
      const d = await api.get(`/api/shows/${show.id}/registrants`);
      setRegistrants(Array.isArray(d)?d:[]);
      alert('✅ בקשות RSVP נשלחו!');
    } catch(e) { alert('שגיאה בשליחת RSVP: '+(e.message||'נסה שוב')); }
    finally { setSendingRsvp(false); }
  };

  const addRegistrant = async () => {
    if (!newRsvp.name.trim() && !newRsvp.contactId) return alert('נא להזין שם או לבחור איש קשר');
    try {
      const d = await api.post(`/api/shows/${show.id}/registrants`, {
        contactId: newRsvp.contactId||null,
        name: newRsvp.name.trim(),
        phone: newRsvp.phone.trim(),
        email: newRsvp.email.trim(),
        status: 'pending'
      });
      setRegistrants(p=>[...p,d]);
      setNewRsvp({ contactId:'', name:'', phone:'', email:'' });
      setAddRsvpMode(false);
    } catch(e) { alert('שגיאה: '+(e.message||'נסה שוב')); }
  };

  const approveWaitlist = async (regId) => {
    try {
      await api.post(`/api/shows/${show.id}/registrants/${regId}/approve-waitlist`);
      const d = await api.get(`/api/shows/${show.id}/registrants`);
      setRegistrants(Array.isArray(d)?d:[]);
    } catch(e) { alert('שגיאה: '+(e.message||'נסה שוב')); }
  };

  const removeRegistrant = async (regId) => {
    if (!window.confirm('הסר רשום מהמופע?')) return;
    try {
      await api.del(`/api/shows/${show.id}/registrants/${regId}`);
      setRegistrants(p=>p.filter(r=>r.id!==regId));
    } catch(e) { alert('שגיאה: '+(e.message||'נסה שוב')); }
  };

  const [waOpen, setWaOpen] = useState(false);
  const [waMsg, setWaMsg] = useState(() => {
    const date = show.date ? fmtD(show.date) : '';
    const time = show.time ? ` בשעה ${show.time}` : '';
    return `שלום,\nרצינו להזכיר לך את המופע "${show.showName||''}"${date?` ב-${date}`:''}${time}${show.venue?` ב${show.venue}`:''}.\nנשמח לראותך! 🎤`;
  });
  const [sending, setSending] = useState(false);
  const [progress, setProgress] = useState(null); // {sent,total,current}
  const [delayMs, setDelayMs] = useState(3000);

  const waConnected = waStatus === 'ready';

  // Send via API (no manual click needed)
  const sendViaApi = async () => {
    if (!waMsg.trim()) return;
    setSending(true);
    setProgress({ sent:0, total:withPhone.length, current:'' });
    try {
      const body = { contacts: withPhone.map(c=>({name:c.name,phone:c.phone,contactId:c.id})), message:waMsg, delayMs, showId: show.id||null };
      const resp = await api.post('/api/wa/broadcast', body);
      // Poll progress
      const id = setInterval(async () => {
        try {
          const s = await api.get('/api/wa/status');
          if (s.broadcast) {
            setProgress({ sent:s.broadcast.sent||0, total:s.broadcast.total||withPhone.length, current:s.broadcast.currentName||'' });
            if (s.broadcast.done) { setSending(false); setProgress(p=>({...p,done:true})); clearInterval(id); }
          }
        } catch { clearInterval(id); setSending(false); }
      }, 1000);
    } catch(e) { setSending(false); alert('שגיאה בשליחה'); }
  };

  // Fallback: open wa.me links (requires manual send click)
  const sendToOne = c => {
    const url = `https://wa.me/${waPhone(c.phone)}${waMsg.trim()?`?text=${encodeURIComponent(waMsg)}`:''}`;
    window.open(url,'_blank');
  };
  const sendToAllLinks = () => {
    withPhone.forEach((c,i) => setTimeout(()=>sendToOne(c), i*600));
  };

  const doPrint = () => {
    const title = show.showName || 'מופע';
    const dateStr = show.date ? fmtD(show.date) + (show.time ? ' ' + show.time : '') : '';
    const rows = participants.map(c=>`
      <tr>
        <td style="padding:8px 12px;border-bottom:1px solid #e2e8f0;font-weight:600">${c.name}</td>
        <td style="padding:8px 12px;border-bottom:1px solid #e2e8f0;direction:ltr;text-align:left">${c.phone||'—'}</td>
        <td style="padding:8px 12px;border-bottom:1px solid #e2e8f0;color:#64748b">${c.role||'—'}</td>
        <td style="padding:8px 12px;border-bottom:1px solid #e2e8f0;color:#64748b">${c.email||'—'}</td>
      </tr>`).join('');
    const win = window.open('','_blank','width=900,height=700');
    win.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">
      <title>${title}</title>
      <style>
        body{font-family:Arial,sans-serif;padding:32px;color:#1e293b;direction:rtl}
        h1{font-size:24px;margin-bottom:4px}
        .meta{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:24px;color:#475569;font-size:14px}
        .meta span{display:flex;align-items:center;gap:4px}
        table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
        th{background:#f8fafc;padding:10px 12px;text-align:right;font-weight:700;border-bottom:2px solid #e2e8f0;color:#475569;font-size:12px;text-transform:uppercase}
        td{vertical-align:middle}
        .notes{background:#f8fafc;border-radius:8px;padding:12px 16px;margin-top:20px;font-size:14px;color:#475569;line-height:1.7}
        .footer{margin-top:32px;font-size:11px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:12px}
        @media print{button{display:none!important}}
      </style>
    </head><body>
      <h1>🎤 ${title}</h1>
      <div class="meta">
        ${dateStr ? `<span>📅 ${dateStr}</span>` : ''}
        ${show.venue ? `<span>🏛 ${show.venue}</span>` : ''}
        ${show.address ? `<span>📍 ${show.address}</span>` : ''}
        ${show.phone ? `<span>📞 ${show.phone}</span>` : ''}
        ${show.fee ? `<span>💰 ₪${show.fee}</span>` : ''}
        ${show._sourceName ? `<span>👤 ${show._sourceName}</span>` : ''}
      </div>
      ${participants.length > 0 ? `
        <h2 style="font-size:16px;margin-bottom:8px">👥 אנשי קשר רשומים (${participants.length})</h2>
        <table>
          <thead><tr>
            <th>שם</th><th>טלפון</th><th>תפקיד</th><th>אימייל</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<p style="color:#94a3b8">אין אנשי קשר משויכים</p>'}
      ${show.notes ? `<div class="notes"><strong>הערות:</strong> ${show.notes}</div>` : ''}
      <div class="footer">הודפס מ-שקוף בחזית CRM · ${new Date().toLocaleDateString('he-IL')}</div>
      <br><button onclick="window.print()" style="padding:10px 24px;background:#4f46e5;color:white;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-family:Arial">🖨️ הדפס</button>
    </body></html>`);
    win.document.close();
  };

  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:600,maxHeight:'90vh',display:'flex',flexDirection:'column'}}>
        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'18px 22px',borderBottom:'1px solid #f1f5f9',flexShrink:0}}>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <span style={{fontSize:24}}>🎤</span>
            <div>
              <div style={{fontWeight:700,fontSize:17}}>{show.showName||'מופע'}</div>
              {show.status&&<span className="badge" style={{background:SC[show.status]||'#f1f5f9',color:ST[show.status]||'#475569',fontSize:11}}>{SHOW_ST[show.status]||show.status}</span>}
            </div>
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
            {onEdit&&<button onClick={onEdit} style={{background:'#eef2ff',border:'none',borderRadius:8,padding:'7px 14px',cursor:'pointer',color:'#4f46e5',fontWeight:600,fontSize:13}}><I n="edit" s={14} c="#4f46e5"/> עריכה</button>}
            {onDelete&&<button onClick={onDelete} style={{background:'#fef2f2',border:'none',borderRadius:8,padding:'7px 14px',cursor:'pointer',color:'#dc2626',fontWeight:600,fontSize:13}} title="מחק מופע"><I n="trash" s={14} c="#dc2626"/> מחק</button>}
            {withPhone.length>0&&<button onClick={()=>setWaOpen(p=>!p)} style={{background:waOpen?'#dcfce7':'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,padding:'7px 14px',cursor:'pointer',color:'#166534',fontWeight:600,fontSize:13}}>💬 WhatsApp</button>}
            <button onClick={doPrint} style={{background:'#f8fafc',border:'none',borderRadius:8,padding:'7px 14px',cursor:'pointer',color:'#475569',fontWeight:600,fontSize:13}}>🖨️ הדפסה</button>
            <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8',padding:'4px 8px'}}>✕</button>
          </div>
        </div>

        {/* Body */}
        <div style={{overflowY:'auto',padding:'20px 22px',flex:1}}>
          {/* Details grid */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 20px',marginBottom:20}}>
            {show.date&&<div><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>תאריך</div><div style={{fontWeight:600}}>📅 {fmtD(show.date)}{show.time?` · ${show.time}`:''}</div></div>}
            {show.venue&&<div><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>מקום</div><div style={{fontWeight:600}}>🏛 {show.venue}</div></div>}
            {show.address&&<div><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>כתובת</div><div>📍 {show.address}</div></div>}
            {show.phone&&<div><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>טלפון</div><div>📞 {show.phone}</div></div>}
            {show.fee&&<div><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>שכר טרחה</div><div style={{fontWeight:600,color:'#166534'}}>💰 ₪{show.fee}</div></div>}
            {show.capacity&&<div><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>קיבולת</div><div>🪑 {show.capacity} מקומות</div></div>}
            {show.type==='virtual'&&<div><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>סוג אירוע</div><div>💻 וירטואלי</div></div>}
            {show.wazeLink&&<div style={{gridColumn:'1/-1'}}><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>{show.type==='virtual'?'קישור זום':'ניווט (Waze)'}</div>
              <a href={show.wazeLink} target="_blank" rel="noreferrer" style={{color:'#4f46e5',fontSize:13,wordBreak:'break-all'}}>{show.type==='virtual'?'🔗 הצטרף לפגישה':'🗺️ פתח ב-Waze'}</a>
            </div>}
            {show.rsvpEnabled&&<div><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>RSVP</div><div style={{color:'#4f46e5',fontWeight:600,fontSize:13}}>✅ פעיל ({show.rsvpDaysBefore||14} ימים לפני)</div></div>}
            {show._sourceName&&<div><div style={{fontSize:11,color:'#94a3b8',marginBottom:2}}>איש קשר ראשי</div>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <span>{show._source==='contact'?'👤':'🏛'} {show._sourceName}</span>
                {onGoContact&&<button onClick={onGoContact} style={{fontSize:11,color:'#6366f1',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>פתח כרטיס</button>}
              </div>
            </div>}
          </div>

          {show.tags?.length>0&&(
            <div style={{marginBottom:16}}>
              <div style={{fontSize:11,color:'#94a3b8',marginBottom:6}}>תגיות</div>
              <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                {show.tags.map(t=><span key={t} className="pill">{t}</span>)}
              </div>
            </div>
          )}

          {show.notes&&(
            <div style={{marginBottom:20,background:'#f8fafc',borderRadius:10,padding:'12px 14px'}}>
              <div style={{fontSize:11,color:'#94a3b8',marginBottom:4}}>הערות</div>
              <div style={{fontSize:14,lineHeight:1.7,color:'#475569'}}>{show.notes}</div>
            </div>
          )}

          {/* WA Compose Panel */}
          {waOpen && (
            <div style={{marginBottom:20,border:'1px solid #bbf7d0',borderRadius:12,padding:'14px 16px',background:'#f0fdf4'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:6}}>
                <div style={{fontWeight:700,fontSize:14,color:'#166534'}}>💬 שליחת WhatsApp למשתתפים</div>
                <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                  <span style={{fontSize:12,color:'#64748b'}}>{withPhone.length} אנשי קשר עם טלפון</span>
                  {!waConnected && <span style={{fontSize:11,background:'#fef3c7',color:'#92400e',borderRadius:6,padding:'2px 7px'}}>⚠️ WA לא מחובר — פתיחה ידנית</span>}
                </div>
              </div>

              <textarea value={waMsg} onChange={e=>setWaMsg(e.target.value)} disabled={sending}
                style={{width:'100%',minHeight:90,padding:'10px 12px',border:'1px solid #bbf7d0',borderRadius:8,fontSize:13,lineHeight:1.6,resize:'vertical',direction:'rtl',boxSizing:'border-box',background:'#fff'}}
                placeholder="כתוב הודעה לשליחה..."/>

              {/* Progress bar */}
              {progress && (
                <div style={{marginTop:10}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#166534',marginBottom:4}}>
                    <span>{progress.done ? '✅ השליחה הושלמה!' : `שולח... ${progress.current}`}</span>
                    <span>{progress.sent}/{progress.total}</span>
                  </div>
                  <div style={{height:6,background:'#bbf7d0',borderRadius:3}}>
                    <div style={{height:'100%',background:'#25D366',borderRadius:3,transition:'width .4s',width:`${(progress.sent/progress.total)*100}%`}}/>
                  </div>
                </div>
              )}

              <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
                {waConnected ? (
                  <>
                    <button onClick={sendViaApi} disabled={sending||!waMsg.trim()||withPhone.length===0}
                      style={{background:'#25D366',color:'#fff',border:'none',borderRadius:8,padding:'8px 16px',cursor:'pointer',fontWeight:700,fontSize:13,opacity:sending?0.6:1}}>
                      {sending ? '⏳ שולח...' : `📲 שלח לכולם אוטומטית (${withPhone.length})`}
                    </button>
                    <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'#64748b'}}>
                      <span>השהיה:</span>
                      <select value={delayMs} onChange={e=>setDelayMs(+e.target.value)} style={{fontSize:12,padding:'3px 6px',borderRadius:6,border:'1px solid #e2e8f0'}}>
                        <option value={2000}>2 שנ׳</option>
                        <option value={3000}>3 שנ׳</option>
                        <option value={5000}>5 שנ׳</option>
                        <option value={8000}>8 שנ׳</option>
                      </select>
                      <span>בין הודעה להודעה</span>
                    </div>
                  </>
                ) : (
                  <button onClick={sendToAllLinks} disabled={withPhone.length===0}
                    style={{background:'#25D366',color:'#fff',border:'none',borderRadius:8,padding:'8px 16px',cursor:'pointer',fontWeight:700,fontSize:13}}>
                    📲 פתח WhatsApp לכולם ({withPhone.length}) — לחץ שלח בכל חלון
                  </button>
                )}
              </div>
              {waConnected && <div style={{fontSize:11,color:'#94a3b8',marginTop:6}}>ניתן גם ללחוץ 💬 ליד שם כדי לשלוח לאיש קשר ספציפי</div>}
            </div>
          )}

          {/* Tabs: participants / messages / rsvp */}
          <div style={{display:'flex',gap:4,borderBottom:'2px solid #f1f5f9',marginBottom:14,flexWrap:'wrap'}}>
            <button onClick={()=>setMsgsTab('participants')}
              style={{padding:'7px 16px',border:'none',borderBottom: msgsTab==='participants'?'2px solid #4f46e5':'2px solid transparent',
                background:'none',cursor:'pointer',fontWeight:msgsTab==='participants'?700:400,color:msgsTab==='participants'?'#4f46e5':'#64748b',fontSize:13,marginBottom:-2}}>
              👥 אנשי קשר ({participants.length})
            </button>
            <button onClick={()=>setMsgsTab('messages')}
              style={{padding:'7px 16px',border:'none',borderBottom: msgsTab==='messages'?'2px solid #22c55e':'2px solid transparent',
                background:'none',cursor:'pointer',fontWeight:msgsTab==='messages'?700:400,color:msgsTab==='messages'?'#16a34a':'#64748b',fontSize:13,marginBottom:-2}}>
              💬 הודעות WA {showMsgs.length>0&&<span style={{background:'#dcfce7',color:'#16a34a',borderRadius:10,padding:'1px 6px',fontSize:11,marginRight:4}}>{showMsgs.length}</span>}
            </button>
            <button onClick={()=>setMsgsTab('rsvp')}
              style={{padding:'7px 16px',border:'none',borderBottom: msgsTab==='rsvp'?'2px solid #f59e0b':'2px solid transparent',
                background:'none',cursor:'pointer',fontWeight:msgsTab==='rsvp'?700:400,color:msgsTab==='rsvp'?'#b45309':'#64748b',fontSize:13,marginBottom:-2}}>
              📋 RSVP {registrants.length>0&&<span style={{background:'#fef3c7',color:'#b45309',borderRadius:10,padding:'1px 6px',fontSize:11,marginRight:4}}>{registrants.length}</span>}
            </button>
          </div>

          {/* Participants table */}
          {msgsTab==='participants' && <div>
            <div style={{fontWeight:700,fontSize:15,marginBottom:10}}>
              👥 אנשי קשר רשומים
              <span style={{fontWeight:400,fontSize:13,color:'#94a3b8',marginRight:8}}>({participants.length})</span>
            </div>
            {participants.length===0
              ? <div style={{color:'#94a3b8',fontSize:13,padding:'12px 0'}}>אין אנשי קשר משויכים</div>
              : <div style={{border:'1px solid #e2e8f0',borderRadius:10,overflow:'hidden'}}>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                    <thead>
                      <tr style={{background:'#f8fafc'}}>
                        <th style={{padding:'9px 14px',textAlign:'right',fontWeight:700,color:'#475569',fontSize:11,borderBottom:'1px solid #e2e8f0'}}>#</th>
                        <th style={{padding:'9px 14px',textAlign:'right',fontWeight:700,color:'#475569',fontSize:11,borderBottom:'1px solid #e2e8f0'}}>שם</th>
                        <th style={{padding:'9px 14px',textAlign:'right',fontWeight:700,color:'#475569',fontSize:11,borderBottom:'1px solid #e2e8f0'}}>טלפון</th>
                        <th style={{padding:'9px 14px',textAlign:'right',fontWeight:700,color:'#475569',fontSize:11,borderBottom:'1px solid #e2e8f0'}}>תפקיד</th>
                        <th style={{padding:'9px 6px',textAlign:'center',fontWeight:700,color:'#475569',fontSize:11,borderBottom:'1px solid #e2e8f0'}}>WA</th>
                      </tr>
                    </thead>
                    <tbody>
                      {participants.map((c,i)=>(
                        <tr key={c.id} style={{background:i%2===0?'#fff':'#fafafa'}}>
                          <td style={{padding:'9px 14px',color:'#94a3b8',borderBottom:'1px solid #f1f5f9'}}>{i+1}</td>
                          <td style={{padding:'9px 14px',fontWeight:600,borderBottom:'1px solid #f1f5f9'}}>
                            <button onClick={()=>onGoContact&&onGoContact(c.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#4f46e5',fontWeight:600,padding:0,textDecoration:'underline',fontSize:13}}>{c.name}</button>
                          </td>
                          <td style={{padding:'9px 14px',direction:'ltr',textAlign:'left',borderBottom:'1px solid #f1f5f9',color:'#475569'}}>{c.phone||'—'}</td>
                          <td style={{padding:'9px 14px',color:'#64748b',borderBottom:'1px solid #f1f5f9'}}>{c.role||'—'}</td>
                          <td style={{padding:'9px 6px',textAlign:'center',borderBottom:'1px solid #f1f5f9'}}>
                            {c.phone
                              ? <button onClick={()=>sendToOne(c)} title={`שלח WhatsApp ל-${c.name}`}
                                  style={{background:'none',border:'none',cursor:'pointer',fontSize:18,lineHeight:1,padding:'2px 4px',borderRadius:6}}
                                  onMouseOver={e=>e.currentTarget.style.background='#dcfce7'} onMouseOut={e=>e.currentTarget.style.background='none'}>
                                  💬
                                </button>
                              : <span style={{color:'#cbd5e1',fontSize:12}}>—</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
            }
          </div>}

          {/* WA Messages log */}
          {msgsTab==='messages' && (
            <div>
              {showMsgs.length===0
                ? <div style={{color:'#94a3b8',fontSize:13,padding:'20px 0',textAlign:'center'}}>אין הודעות WA מתועדות לאירוע זה.<br/>הודעות שישלחו מכאן יופיעו כאן אוטומטית.</div>
                : showMsgs.map(m=>(
                  <div key={m.id} style={{
                    padding:'10px 14px',borderRadius:10,marginBottom:10,
                    background: m.direction==='sent' ? '#f0fdf4' : '#eff6ff',
                    borderRight:`3px solid ${m.direction==='sent'?'#22c55e':'#3b82f6'}`
                  }}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                      <div style={{display:'flex',gap:8,alignItems:'center'}}>
                        <span style={{fontSize:12,fontWeight:600,color:m.direction==='sent'?'#16a34a':'#1d4ed8'}}>
                          {m.direction==='sent' ? '📤 נשלח' : '📩 נכנס'} — {m.name||m.phone}
                        </span>
                        {m.source==='broadcast' && <span style={{fontSize:10,background:'#e0e7ff',color:'#4f46e5',borderRadius:8,padding:'1px 6px'}}>broadcast</span>}
                      </div>
                      <span style={{fontSize:11,color:'#94a3b8'}}>{new Date(m.timestamp).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
                    </div>
                    <p style={{margin:0,fontSize:13,color:'#374151',whiteSpace:'pre-wrap',lineHeight:1.6}}>{m.message}</p>
                  </div>
                ))
              }
            </div>
          )}

          {/* RSVP Tab */}
          {msgsTab==='rsvp' && (
            <div>
              {/* RSVP not enabled notice */}
              {!show.rsvpEnabled && (
                <div style={{background:'#fef3c7',borderRadius:10,padding:'12px 16px',marginBottom:16,border:'1px solid #fde68a',fontSize:13,color:'#92400e'}}>
                  ⚠️ RSVP לא מופעל עבור מופע זה. לחץ <strong>עריכה</strong> כדי להפעיל.
                </div>
              )}

              {/* Stats cards */}
              {registrants.length>0 && (
                <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:16}}>
                  {[
                    {key:'confirmed',label:'אישרו הגעה',count:rsvpStats.confirmed.length,seats:rsvpStats.confirmedCount,color:'#16a34a',bg:'#dcfce7'},
                    {key:'declined', label:'לא מגיעים', count:rsvpStats.declined.length,  seats:null,                    color:'#dc2626',bg:'#fee2e2'},
                    {key:'pending',  label:'ממתינים',   count:rsvpStats.pending.length,   seats:null,                    color:'#b45309',bg:'#fef3c7'},
                    {key:'waitlist', label:'רשימת המתנה',count:rsvpStats.waitlist.length, seats:null,                    color:'#6366f1',bg:'#e0e7ff'},
                  ].map(s=>(
                    <div key={s.key} onClick={()=>setRsvpFilter(rsvpFilter===s.key?'all':s.key)}
                      style={{textAlign:'center',padding:'10px 8px',borderRadius:10,background:rsvpFilter===s.key?s.color:s.bg,
                        color:rsvpFilter===s.key?'#fff':s.color,cursor:'pointer',transition:'all .15s',border:`2px solid ${rsvpFilter===s.key?s.color:'transparent'}`}}>
                      <div style={{fontSize:22,fontWeight:800}}>{s.count}</div>
                      {s.seats!=null&&s.seats!==s.count&&<div style={{fontSize:10,opacity:.8}}>({s.seats} מושבים)</div>}
                      <div style={{fontSize:10,fontWeight:600,marginTop:2}}>{s.label}</div>
                    </div>
                  ))}
                </div>
              )}

              {/* Capacity bar */}
              {show.capacity && registrants.length>0 && (
                <div style={{marginBottom:14}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#64748b',marginBottom:4}}>
                    <span>🪑 תפוסה: {rsvpStats.confirmedCount} / {show.capacity}</span>
                    <span>{Math.round(rsvpStats.confirmedCount/show.capacity*100)}%</span>
                  </div>
                  <div style={{height:8,background:'#e2e8f0',borderRadius:4}}>
                    <div style={{height:'100%',borderRadius:4,background: rsvpStats.confirmedCount>=show.capacity?'#dc2626':'#22c55e',
                      width:`${Math.min(100,rsvpStats.confirmedCount/show.capacity*100)}%`,transition:'width .4s'}}/>
                  </div>
                </div>
              )}

              {/* Actions bar */}
              <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
                <button onClick={()=>setAddRsvpMode(p=>!p)}
                  style={{background:'#eef2ff',border:'1px solid #c7d2fe',borderRadius:8,padding:'6px 14px',cursor:'pointer',color:'#4f46e5',fontWeight:600,fontSize:12}}>
                  {addRsvpMode?'✕ ביטול':'+ הוסף רשום'}
                </button>
                {show.rsvpEnabled && (<>
                  <button onClick={()=>sendRsvpInvite('pending')} disabled={sendingRsvp||rsvpStats.pending.length===0}
                    style={{background:rsvpStats.pending.length===0?'#f1f5f9':'#fef3c7',border:'1px solid #fde68a',borderRadius:8,padding:'6px 14px',cursor:rsvpStats.pending.length===0?'default':'pointer',color:rsvpStats.pending.length===0?'#94a3b8':'#92400e',fontWeight:600,fontSize:12}}>
                    📤 שלח RSVP לממתינים ({rsvpStats.pending.length})
                  </button>
                  <button onClick={()=>sendRsvpInvite('all')} disabled={sendingRsvp||registrants.length===0}
                    style={{background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:8,padding:'6px 14px',cursor:'pointer',color:'#9a3412',fontWeight:600,fontSize:12}}>
                    📤 שלח לכולם ({registrants.length})
                  </button>
                </>)}
                {rsvpFilter!=='all'&&<button onClick={()=>setRsvpFilter('all')} style={{fontSize:11,color:'#94a3b8',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>הצג הכל</button>}
              </div>

              {/* Add registrant form */}
              {addRsvpMode && (
                <div style={{marginBottom:14,padding:'12px 14px',background:'#f0f9ff',borderRadius:10,border:'1px solid #bae6fd'}}>
                  <div style={{fontSize:12,fontWeight:700,color:'#0369a1',marginBottom:10}}>➕ הוסף רשום ידנית</div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                    <div>
                      <label style={{fontSize:11,color:'#64748b',display:'block',marginBottom:3}}>שם מלא *</label>
                      <input className="inp" value={newRsvp.name} onChange={e=>setNewRsvp(p=>({...p,name:e.target.value}))} placeholder="שם מלא" style={{fontSize:13}}/>
                    </div>
                    <div>
                      <label style={{fontSize:11,color:'#64748b',display:'block',marginBottom:3}}>טלפון (לשליחת WA)</label>
                      <input className="inp" value={newRsvp.phone} onChange={e=>setNewRsvp(p=>({...p,phone:e.target.value}))} placeholder="050-..." style={{fontSize:13,direction:'ltr'}}/>
                    </div>
                    <div>
                      <label style={{fontSize:11,color:'#64748b',display:'block',marginBottom:3}}>אימייל (לשליחת מייל)</label>
                      <input className="inp" value={newRsvp.email} onChange={e=>setNewRsvp(p=>({...p,email:e.target.value}))} placeholder="email@..." style={{fontSize:13,direction:'ltr'}}/>
                    </div>
                    <div style={{display:'flex',alignItems:'flex-end'}}>
                      <button onClick={addRegistrant} style={{width:'100%',background:'#0ea5e9',color:'#fff',border:'none',borderRadius:8,padding:'9px 14px',cursor:'pointer',fontWeight:700,fontSize:13}}>
                        ✅ הוסף
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Registrants list */}
              {rsvpLoading
                ? <div style={{textAlign:'center',padding:'20px 0',color:'#94a3b8'}}>טוען...</div>
                : filteredRsvp.length===0
                  ? <div style={{textAlign:'center',padding:'20px 0',color:'#94a3b8',fontSize:13}}>
                      {registrants.length===0 ? 'אין רשומים עדיין. הוסף ידנית או ייבא מרשימת האנשי קשר.' : 'אין רשומים בסינון זה.'}
                    </div>
                  : <div style={{border:'1px solid #e2e8f0',borderRadius:10,overflow:'hidden'}}>
                      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                        <thead>
                          <tr style={{background:'#f8fafc'}}>
                            <th style={{padding:'8px 12px',textAlign:'right',color:'#475569',fontWeight:700,fontSize:11,borderBottom:'1px solid #e2e8f0'}}>#</th>
                            <th style={{padding:'8px 12px',textAlign:'right',color:'#475569',fontWeight:700,fontSize:11,borderBottom:'1px solid #e2e8f0'}}>שם</th>
                            <th style={{padding:'8px 12px',textAlign:'right',color:'#475569',fontWeight:700,fontSize:11,borderBottom:'1px solid #e2e8f0'}}>סטטוס</th>
                            <th style={{padding:'8px 12px',textAlign:'right',color:'#475569',fontWeight:700,fontSize:11,borderBottom:'1px solid #e2e8f0'}}>אורחים</th>
                            <th style={{padding:'8px 12px',textAlign:'right',color:'#475569',fontWeight:700,fontSize:11,borderBottom:'1px solid #e2e8f0'}}>נשלח</th>
                            <th style={{padding:'8px 4px',textAlign:'center',color:'#475569',fontWeight:700,fontSize:11,borderBottom:'1px solid #e2e8f0'}}>פעולות</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filteredRsvp.map((r,i)=>{
                            const stMap={confirmed:{label:'✅ אישר',bg:'#dcfce7',c:'#166534'},declined:{label:'❌ לא מגיע',bg:'#fee2e2',c:'#991b1b'},
                              pending:{label:'⏳ ממתין',bg:'#fef3c7',c:'#92400e'},waitlist:{label:'📋 המתנה',bg:'#e0e7ff',c:'#3730a3'}};
                            const st=stMap[r.status]||{label:r.status,bg:'#f1f5f9',c:'#475569'};
                            return (
                              <tr key={r.id} style={{background:i%2===0?'#fff':'#fafafa'}}>
                                <td style={{padding:'8px 12px',color:'#94a3b8',borderBottom:'1px solid #f1f5f9'}}>{i+1}</td>
                                <td style={{padding:'8px 12px',borderBottom:'1px solid #f1f5f9'}}>
                                  <div style={{fontWeight:600}}>{r.name}</div>
                                  {r.phone&&<div style={{fontSize:10,color:'#94a3b8',direction:'ltr'}}>{r.phone}</div>}
                                </td>
                                <td style={{padding:'8px 12px',borderBottom:'1px solid #f1f5f9'}}>
                                  <span style={{background:st.bg,color:st.c,borderRadius:6,padding:'2px 7px',fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>{st.label}</span>
                                </td>
                                <td style={{padding:'8px 12px',borderBottom:'1px solid #f1f5f9',color:'#475569',textAlign:'center'}}>
                                  {r.guestCount>0 ? `+${r.guestCount}` : '—'}
                                </td>
                                <td style={{padding:'8px 12px',borderBottom:'1px solid #f1f5f9',color:'#94a3b8',fontSize:11}}>
                                  {r.inviteSentAt ? new Date(r.inviteSentAt).toLocaleDateString('he-IL') : '—'}
                                </td>
                                <td style={{padding:'8px 4px',borderBottom:'1px solid #f1f5f9',textAlign:'center'}}>
                                  <div style={{display:'flex',gap:3,justifyContent:'center'}}>
                                    {r.status==='waitlist'&&(
                                      <button onClick={()=>approveWaitlist(r.id)} title="העבר לרשימה הראשית"
                                        style={{fontSize:11,background:'#dcfce7',border:'none',borderRadius:5,padding:'3px 6px',cursor:'pointer',color:'#166534',fontWeight:600}}>
                                        ✔ אשר
                                      </button>
                                    )}
                                    {r.rsvpToken&&(
                                      <button onClick={()=>{navigator.clipboard.writeText(`${window.location.origin}/rsvp/${r.rsvpToken}`);}} title="העתק קישור RSVP"
                                        style={{fontSize:11,background:'#e0e7ff',border:'none',borderRadius:5,padding:'3px 6px',cursor:'pointer',color:'#4f46e5'}}>
                                        🔗
                                      </button>
                                    )}
                                    <button onClick={()=>removeRegistrant(r.id)} title="הסר מהרשימה"
                                      style={{fontSize:11,background:'#fee2e2',border:'none',borderRadius:5,padding:'3px 6px',cursor:'pointer',color:'#dc2626'}}>
                                      ✕
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
              }
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ShowModal({ onSave, onClose, contacts=[], onAddContact, existingShow=null }) {
  const ctx = useContext(ListsCtx);
  const showNameOpts = ctx ? ctx.get('showName', DEF_SHOW_NAME) : DEF_SHOW_NAME;
  const showStatusOpts = [
    ...Object.entries(SHOW_ST).map(([k,v])=>({value:k,label:v})),
    ...(ctx ? ctx.get('showStatus',[]) : []).map(v=>({value:v,label:v})),
  ];
  const [f, setF] = useState(existingShow ? {
    date: existingShow.date||'', time: existingShow.time||'', venue: existingShow.venue||'',
    showName: existingShow.showName||'', address: existingShow.address||'',
    phone: existingShow.phone||'', fee: existingShow.fee||'', notes: existingShow.notes||'',
    participantContactIds: existingShow.participantContactIds||[], tags: existingShow.tags||[],
    status: existingShow.status||'',
    type: existingShow.type||'physical',
    wazeLink: existingShow.wazeLink||'',
    capacity: existingShow.capacity||'',
    rsvpEnabled: existingShow.rsvpEnabled||false,
    rsvpDaysBefore: existingShow.rsvpDaysBefore!=null ? existingShow.rsvpDaysBefore : 14,
    reminder1DaysAfter: existingShow.reminder1DaysAfter!=null ? existingShow.reminder1DaysAfter : 7,
    reminder2DaysBefore: existingShow.reminder2DaysBefore!=null ? existingShow.reminder2DaysBefore : 2,
  } : { date:'', time:'', venue:'', showName:'', address:'', phone:'', fee:'', notes:'', participantContactIds:[], tags:[], status:'',
    type:'physical', wazeLink:'', capacity:'', rsvpEnabled:false, rsvpDaysBefore:14, reminder1DaysAfter:7, reminder2DaysBefore:2 });
  const [contQ, setContQ] = useState('');
  const [localContacts, setLocalContacts] = useState(contacts);
  const [newContactMode, setNewContactMode] = useState(false);
  const [newContact, setNewContact] = useState({ name:'', phone:'', email:'' });
  const [csvResult, setCsvResult] = useState(null); // {added, notFound}
  const csvRef = React.useRef();
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const toggleContact = id => setF(p=>({...p, participantContactIds: p.participantContactIds.includes(id) ? p.participantContactIds.filter(x=>x!==id) : [...p.participantContactIds,id]}));

  const handleCsv = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const lines = ev.target.result.split(/\r?\n/).filter(l=>l.trim());
      const added = [], notFound = [];
      lines.forEach((line, i) => {
        if (i===0 && /שם|name/i.test(line)) return; // skip header
        const cols = line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
        const name = cols[0]||'', phone = normalizePhone(cols[1]||''), email = cols[2]||'';
        if (!name && !phone) return;
        const match = localContacts.find(c=>phone && normalizePhone(c.phone)===phone) || localContacts.find(c=>name && c.name===name);
        if (match) {
          added.push(match);
          setF(p=>({ ...p, participantContactIds: p.participantContactIds.includes(match.id) ? p.participantContactIds : [...p.participantContactIds, match.id] }));
        } else {
          notFound.push({ name, phone, email });
        }
      });
      setCsvResult({ added, notFound });
      e.target.value = '';
    };
    reader.readAsText(file);
  };

  const createFromCsv = async (row) => {
    try {
      const r = await onAddContact({ name:row.name, phone:row.phone, email:row.email });
      setLocalContacts(p=>[r,...p]);
      setF(p=>({...p, participantContactIds:[...p.participantContactIds, r.id]}));
      setCsvResult(p=>({...p, notFound:p.notFound.filter(x=>x!==row), added:[...p.added,r]}));
    } catch(e) { alert('שגיאה ביצירת איש קשר: ' + (e.message||'נסה שוב')); }
  };
  const filteredConts = localContacts.filter(c=>!contQ||c.name.toLowerCase().includes(contQ.toLowerCase())||(c.phone||'').includes(contQ));
  const createContact = async () => {
    if (!newContact.name.trim()) return;
    try {
      const r = await onAddContact({ name: newContact.name.trim(), phone: newContact.phone.trim(), email: newContact.email.trim() });
      setLocalContacts(p=>[r,...p]);
      setF(p=>({...p, participantContactIds:[...p.participantContactIds, r.id]}));
      setNewContact({ name:'', phone:'', email:'' });
      setNewContactMode(false);
    } catch(e) { alert('שגיאה ביצירת איש קשר'); }
  };
  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:560}}>
        <ModalHeader title={existingShow ? 'עריכת מופע / הרצאה' : 'הוסף מופע / הרצאה'} onClose={onClose}/>
        <div style={{padding:22}} className="grid2">
          <div style={{gridColumn:'1/-1'}}>
            <label className="lbl">שם המופע *</label>
            <SmartSelect value={f.showName} onChange={v=>set('showName',v)} listKey="showName" options={showNameOpts}/>
          </div>
          <div style={{gridColumn:'1/-1'}}><label className="lbl">מקום / ארגון מארח</label><input className="inp" value={f.venue} onChange={e=>set('venue',e.target.value)} placeholder="שם האולם / הארגון"/></div>
          <div style={{gridColumn:'1/-1'}}><label className="lbl">כתובת מקום האירוע</label><input className="inp" value={f.address} onChange={e=>set('address',e.target.value)} placeholder="רחוב, עיר..."/></div>
          <div><label className="lbl">טלפון ליצירת קשר</label><input className="inp" value={f.phone} onChange={e=>set('phone',e.target.value)} onBlur={e=>set('phone',normalizePhone(e.target.value))} placeholder="050-1234567"/></div>
          <div><label className="lbl">תאריך</label><input type="date" className="inp" value={f.date} onChange={e=>set('date',e.target.value)}/></div>
          <div><label className="lbl">שעה</label><input type="time" className="inp" value={f.time} onChange={e=>set('time',e.target.value)}/></div>
          <div><label className="lbl">שכר טרחה (₪)</label><input className="inp" type="number" value={f.fee} onChange={e=>set('fee',e.target.value)}/></div>
          <div style={{gridColumn:'1/-1'}}>
            <input type="file" accept=".csv" ref={csvRef} style={{display:'none'}} onChange={handleCsv}/>
            <label className="lbl" style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:4}}>
              <span>👥 אנשי קשר מוזמנים {f.participantContactIds.length>0&&<span style={{color:'#6366f1',fontWeight:700}}>({f.participantContactIds.length} נבחרו)</span>}</span>
              <div style={{display:'flex',gap:6}}>
                <button type="button" onClick={()=>csvRef.current.click()}
                  style={{fontSize:11,color:'#166534',background:'#dcfce7',border:'none',borderRadius:6,padding:'3px 8px',cursor:'pointer',fontWeight:600}}>
                  📂 ייבוא CSV
                </button>
                {onAddContact && (
                  <button type="button" onClick={()=>setNewContactMode(p=>!p)}
                    style={{fontSize:11,color:'#6366f1',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>
                    {newContactMode ? '✕ ביטול' : '+ צור איש קשר חדש'}
                  </button>
                )}
              </div>
            </label>
            {csvResult && (
              <div style={{marginBottom:8,padding:'10px 12px',background:'#f0fdf4',borderRadius:8,border:'1px solid #bbf7d0',fontSize:12}}>
                <div style={{fontWeight:700,marginBottom:6,color:'#166534'}}>✅ נוספו {csvResult.added.length} אנשי קשר מה-CSV</div>
                {csvResult.notFound.length>0&&(
                  <>
                    <div style={{fontWeight:600,color:'#92400e',marginBottom:4}}>⚠️ לא נמצאו {csvResult.notFound.length} רשומות — צור אותן:</div>
                    {csvResult.notFound.map((row,i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'3px 0',borderBottom:'1px solid #d1fae5'}}>
                        <span style={{flex:1,fontWeight:600}}>{row.name}</span>
                        <span style={{direction:'ltr',color:'#64748b'}}>{row.phone}</span>
                        {onAddContact&&<button type="button" onClick={()=>createFromCsv(row)}
                          style={{fontSize:11,background:'#6366f1',color:'#fff',border:'none',borderRadius:5,padding:'2px 8px',cursor:'pointer'}}>צור וצרף</button>}
                      </div>
                    ))}
                  </>
                )}
                <button type="button" onClick={()=>setCsvResult(null)} style={{fontSize:11,color:'#94a3b8',background:'none',border:'none',cursor:'pointer',marginTop:4}}>סגור</button>
              </div>
            )}
            {newContactMode && (
              <div style={{display:'flex',gap:6,marginBottom:8,padding:'10px 12px',background:'#f0fdf4',borderRadius:8,border:'1px solid #bbf7d0'}}>
                <input className="inp" value={newContact.name} onChange={e=>setNewContact(p=>({...p,name:e.target.value}))}
                  placeholder="שם מלא *" style={{flex:2}} autoFocus
                  onKeyDown={e=>e.key==='Enter'&&createContact()}/>
                <input className="inp" value={newContact.phone} onChange={e=>setNewContact(p=>({...p,phone:e.target.value}))}
                  onBlur={e=>setNewContact(p=>({...p,phone:normalizePhone(e.target.value)}))}
                  placeholder="טלפון" style={{flex:1,direction:'ltr'}}
                  onKeyDown={e=>e.key==='Enter'&&createContact()}/>
                <input className="inp" value={newContact.email} onChange={e=>setNewContact(p=>({...p,email:e.target.value}))}
                  placeholder="מייל" style={{flex:1.5,direction:'ltr'}}
                  onKeyDown={e=>e.key==='Enter'&&createContact()}/>
                <button className="btn btn-primary btn-sm" onClick={createContact} style={{whiteSpace:'nowrap'}}>
                  צור וצרף
                </button>
              </div>
            )}
            <input className="inp" value={contQ} onChange={e=>setContQ(e.target.value)} placeholder="חפש איש קשר..." style={{marginBottom:6}}/>
            <div style={{maxHeight:150,overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:8,padding:'6px 10px',background:'#fafafa'}}>
              {filteredConts.length===0 && <div style={{fontSize:12,color:'#94a3b8',padding:'4px 0'}}>לא נמצאו אנשי קשר</div>}
              {filteredConts.slice(0,60).map(c=>(
                <label key={c.id} style={{display:'flex',alignItems:'center',gap:8,padding:'3px 0',cursor:'pointer',fontSize:13}}>
                  <input type="checkbox" checked={f.participantContactIds.includes(c.id)} onChange={()=>toggleContact(c.id)} style={{accentColor:'#6366f1'}}/>
                  <span style={{fontWeight:f.participantContactIds.includes(c.id)?600:400}}>{c.name}</span>
                  {c.phone&&<span style={{color:'#94a3b8',fontSize:11,direction:'ltr'}}>{c.phone}</span>}
                </label>
              ))}
              {filteredConts.length>60&&<div style={{fontSize:11,color:'#94a3b8',padding:'4px 0'}}>עוד {filteredConts.length-60}... צמצם חיפוש</div>}
            </div>
          </div>
          {/* RSVP section */}
          <div style={{gridColumn:'1/-1',background:'#f8fafc',borderRadius:10,padding:'14px 16px',border:'1px solid #e2e8f0',marginTop:4}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:12,color:'#4f46e5'}}>📋 הגדרות אישורי הגעה (RSVP)</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 16px'}}>
              <div>
                <label className="lbl">סוג אירוע</label>
                <select className="inp" value={f.type} onChange={e=>set('type',e.target.value)}>
                  <option value="physical">פיזי — מקום</option>
                  <option value="virtual">וירטואלי — זום / אונליין</option>
                </select>
              </div>
              <div>
                <label className="lbl">קישור Waze / Zoom</label>
                <input className="inp" value={f.wazeLink} onChange={e=>set('wazeLink',e.target.value)} placeholder={f.type==='virtual'?'קישור זום...':'https://waze.com/ul?...'}/>
              </div>
              <div>
                <label className="lbl">קיבולת (מקסימום נרשמים)</label>
                <input className="inp" type="number" value={f.capacity} onChange={e=>set('capacity',e.target.value)} placeholder="ללא הגבלה"/>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:10,paddingTop:22}}>
                <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',userSelect:'none'}}>
                  <div onClick={()=>set('rsvpEnabled',!f.rsvpEnabled)}
                    style={{width:40,height:22,borderRadius:11,background:f.rsvpEnabled?'#6366f1':'#cbd5e1',position:'relative',transition:'background .2s',cursor:'pointer',flexShrink:0}}>
                    <div style={{position:'absolute',top:3,left:f.rsvpEnabled?'auto':'3px',right:f.rsvpEnabled?'3px':'auto',width:16,height:16,borderRadius:'50%',background:'#fff',transition:'left .2s,right .2s'}}/>
                  </div>
                  <span style={{fontWeight:600,fontSize:13,color:f.rsvpEnabled?'#4f46e5':'#64748b'}}>
                    {f.rsvpEnabled ? '✅ RSVP פעיל' : '⭕ RSVP כבוי'}
                  </span>
                </label>
              </div>
              {f.rsvpEnabled && <>
                <div>
                  <label className="lbl">שלח בקשת RSVP (כמה ימים לפני)</label>
                  <input className="inp" type="number" value={f.rsvpDaysBefore} onChange={e=>set('rsvpDaysBefore',+e.target.value)} min={1} max={60}/>
                </div>
                <div>
                  <label className="lbl">תזכורת 1 (כמה ימים אחרי השליחה)</label>
                  <input className="inp" type="number" value={f.reminder1DaysAfter} onChange={e=>set('reminder1DaysAfter',+e.target.value)} min={1} max={30}/>
                </div>
                <div>
                  <label className="lbl">תזכורת 2 (כמה ימים לפני המופע)</label>
                  <input className="inp" type="number" value={f.reminder2DaysBefore} onChange={e=>set('reminder2DaysBefore',+e.target.value)} min={1} max={14}/>
                </div>
              </>}
            </div>
          </div>

          <div style={{gridColumn:'1/-1'}}><label className="lbl">🏷️ תגיות</label><TagInput value={f.tags} onChange={v=>set('tags',v)}/></div>
          <div style={{gridColumn:'1/-1'}}><label className="lbl">הערות</label><textarea className="inp" rows={2} value={f.notes} onChange={e=>set('notes',e.target.value)} style={{resize:'vertical'}}/></div>
        </div>
        <ModalFooter onSave={()=>{if(!f.showName.trim()&&!f.venue.trim())return alert('נא להזין שם מופע');onSave(f);}} onClose={onClose}/>
      </div>
    </div>
  );
}

// ─── Order Modal ──────────────────────────────────────────────────────────────
function OrderModal({ quoteData, contact, onClose, onDone }) {
  const defValidUntil = () => { const d=new Date(); d.setDate(d.getDate()+45); return d.toISOString().split('T')[0]; };
  const fmtHeDate = s => { if(!s) return ''; try { const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('he-IL',{year:'numeric',month:'long',day:'numeric'}); } catch { return s; } };
  const listsCtx = useContext(ListsCtx);
  const showNameOpts = listsCtx ? listsCtx.get('showName', DEF_SHOW_NAME) : DEF_SHOW_NAME;
  const [showTemplates, setShowTemplates] = useState([]);
  useEffect(() => { api.get('/api/show-templates').then(setShowTemplates).catch(()=>{}); }, []);

  // Pre-fill from quote (rawForm has the original unformatted data with prices)
  const rawQForm = quoteData?.rawForm || null;
  const [f, setF] = useState({
    contactId:    quoteData?.contactId     || contact?.id || '',
    travelCost:   rawQForm?.travelCost     || '',
    includeVat:   rawQForm?.includeVat     || false,
    paymentTerms: rawQForm?.paymentTerms   || '50% מקדמה בחתימה, 50% ביום האירוע',
    notes:        rawQForm?.notes          || '',
  });
  const [shows, setShows] = useState(() => {
    const srcShows = rawQForm?.shows;
    return srcShows && srcShows.length > 0
      ? srcShows.map(s => ({ ...s, _id: Math.random().toString(36).slice(2) }))
      : [{ _id: Math.random().toString(36).slice(2), showName:'שקוף בחזית', description:'', eventDateKnown:null, eventDate:'', eventTime:'', locationKnown:null, locationName:'', locationAddress:'', participants:'', duration:'75 דקות', audience:'', price:'' }];
  });
  const [saving, setSaving] = useState(false);
  const [err,    setErr]    = useState('');
  const [result, setResult] = useState(null); // { orderNumber, wpUrl }

  const set     = (k,v) => setF(p=>({...p,[k]:v}));
  const setShow = (i,k,v) => setShows(p=>p.map((s,j)=>j===i?{...s,[k]:v}:s));
  const setShowName = (i, name) => {
    const tmpl = showTemplates.find(t=>t.name===name);
    setShows(p=>p.map((s,j)=>j===i ? {...s, showName:name, ...(tmpl && !s.description ? {description:tmpl.description} : {})} : s));
  };
  const addShow = () => setShows(p=>[...p, { _id:Math.random().toString(36).slice(2), showName:'שקוף בחזית', description:'', eventDateKnown:null, eventDate:'', eventTime:'', locationKnown:null, locationName:'', locationAddress:'', participants:'', duration:'75 דקות', audience:'', price:'' }]);
  const removeShow = i => setShows(p=>p.filter((_,j)=>j!==i));

  const showsTotal = shows.reduce((s,sh)=>s+(parseFloat(sh.price)||0),0);
  const travel     = parseFloat(f.travelCost)||0;
  const vat        = f.includeVat ? Math.round(showsTotal*0.18) : 0;
  const total      = showsTotal + travel + vat;

  const save = async () => {
    if (shows.every(s=>!s.price)) { setErr('יש להזין מחיר לפחות למופע אחד'); return; }
    setSaving(true); setErr('');
    try {
      const payload = {
        ...f,
        contactName:  contact?.name  || '',
        organization: contact?.org   || contact?.company || '',
        contactPhone: contact?.phone || '',
        contactEmail: contact?.email || '',
        quoteNumber:  quoteData?.quoteNumber || '',
        quoteId:      quoteData?.id          || '',
        shows: shows.map(s=>({
          ...s,
          eventDate: s.eventDateKnown===false ? 'תאריך עדיין לא נסגר' : (fmtHeDate(s.eventDate)||s.eventDate),
          eventTime: s.eventDateKnown===false ? '' : s.eventTime,
        })),
        price: showsTotal, total,
      };
      const r = await api.post('/api/orders/generate', payload);
      setResult({ orderNumber: r.orderNumber, wpUrl: r.wpUrl, id: r.id });
    } catch(e) { setErr(e.message); setSaving(false); }
  };

  const secStyle = { fontWeight:700, fontSize:13, color:'#1a5c3a', marginBottom:8, marginTop:16 };
  const boxStyle = { background:'#f8fafc', border:'1.5px solid #e2e8f0', borderRadius:10, padding:'14px 16px', marginBottom:10 };

  if (result) return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:500}}>
        <div style={{padding:'24px',textAlign:'center'}}>
          <div style={{fontSize:48,marginBottom:12}}>✅</div>
          <div style={{fontWeight:700,fontSize:18,marginBottom:8,color:'#166534'}}>ההזמנה נוצרה בהצלחה!</div>
          <div style={{fontSize:14,color:'#475569',marginBottom:16}}>מס׳ הזמנה: <strong>{result.orderNumber}</strong></div>
          {result.wpUrl && (
            <div style={{background:'#f0fdf4',borderRadius:10,padding:'12px',marginBottom:16}}>
              <div style={{fontSize:13,color:'#166534',fontWeight:600,marginBottom:6}}>🌐 קישור לחתימה דיגיטלית:</div>
              <a href={result.wpUrl} target="_blank"
                style={{color:'#4f46e5',fontSize:13,wordBreak:'break-all'}}>{result.wpUrl}</a>
              <div style={{marginTop:10}}>
                <button onClick={()=>{ navigator.clipboard.writeText(result.wpUrl); }}
                  style={{background:'#4f46e5',color:'white',border:'none',borderRadius:8,padding:'8px 18px',fontSize:13,cursor:'pointer',fontWeight:600}}>
                  📋 העתק קישור
                </button>
              </div>
            </div>
          )}
          <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
            <a href={`/api/orders/${result.id}/view`} target="_blank"
              style={{background:'#166534',color:'white',padding:'9px 20px',borderRadius:8,fontSize:13,fontWeight:600,textDecoration:'none'}}>
              🖨️ הדפס הזמנה
            </a>
            <button onClick={()=>onDone(result.id, result.wpUrl)}
              style={{background:'#f1f5f9',color:'#475569',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'9px 20px',fontSize:13,cursor:'pointer',fontWeight:600}}>
              סגור
            </button>
          </div>
        </div>
      </div>
    </div>
  );

  return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:640}}>
        <div style={{padding:'16px 20px',borderBottom:'1px solid #f1f5f9',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontWeight:700,fontSize:17,color:'#166534'}}>📋 הזמנה חדשה</div>
            {quoteData?.quoteNumber && <div style={{fontSize:12,color:'#64748b',marginTop:2}}>מבוסס על הצעה #{quoteData.quoteNumber}</div>}
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8'}}>✕</button>
        </div>
        <div style={{padding:'16px 20px',overflowY:'auto',maxHeight:'78vh'}}>

          {/* נמען */}
          <div style={{background:'#f0fdf4',borderRadius:8,padding:'8px 12px',fontSize:13,marginBottom:14,color:'#166534',fontWeight:600}}>
            👤 {contact?.name || '—'}{contact?.org ? ` · ${contact.org}` : ''}
          </div>

          {/* מופעים */}
          <div style={{...secStyle,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>🎤 מופעים ({shows.length})</span>
            <button className="btn btn-secondary btn-xs" onClick={addShow}>+ הוסף</button>
          </div>
          {shows.map((sh,i)=>(
            <div key={sh._id} style={{...boxStyle,borderColor:i===0?'#bbf7d0':'#e2e8f0'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div style={{fontWeight:700,fontSize:13,color:'#166534'}}>מופע {i+1}</div>
                {shows.length>1 && <button className="btn btn-danger btn-xs" onClick={()=>removeShow(i)}>✕ הסר</button>}
              </div>
              <div className="grid2" style={{marginBottom:8}}>
                <div>
                  <label className="lbl">שם המופע</label>
                  <SmartSelect value={sh.showName} onChange={v=>setShowName(i,v)} listKey="showName" options={showNameOpts}/>
                </div>
                <div>
                  <label className="lbl">מחיר (ש"ח) *</label>
                  <input className="inp" type="number" value={sh.price} onChange={e=>setShow(i,'price',e.target.value)} placeholder="5000"/>
                </div>
              </div>
              <div style={{marginBottom:8}}>
                <label className="lbl">תיאור המופע</label>
                <textarea className="inp" rows={2} value={sh.description||''} onChange={e=>setShow(i,'description',e.target.value)} style={{resize:'vertical'}}/>
              </div>
              {/* תאריך */}
              <div style={{marginBottom:8}}>
                <label className="lbl">תאריך</label>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  {[{v:true,l:'📅 ידוע'},{v:false,l:'❓ לא נסגר'}].map(({v,l})=>(
                    <button key={String(v)} type="button" onClick={()=>setShow(i,'eventDateKnown',v)} className="btn btn-sm"
                      style={{background:sh.eventDateKnown===v?'#166534':'#f1f5f9',color:sh.eventDateKnown===v?'white':'#475569',fontWeight:sh.eventDateKnown===v?700:400}}>
                      {l}
                    </button>
                  ))}
                </div>
                {sh.eventDateKnown===true && (
                  <div className="grid2">
                    <div><label className="lbl">תאריך</label><input className="inp" type="date" value={sh.eventDate} onChange={e=>setShow(i,'eventDate',e.target.value)}/></div>
                    <div><label className="lbl">שעה</label><input className="inp" type="time" value={sh.eventTime} onChange={e=>setShow(i,'eventTime',e.target.value)}/></div>
                  </div>
                )}
                {sh.eventDateKnown===false && (
                  <div style={{background:'#fef3c7',borderRadius:7,padding:'6px 10px',fontSize:12,color:'#92400e'}}>תאריך עדיין לא נסגר — יצוין בהמשך</div>
                )}
              </div>
              {/* מיקום */}
              <div style={{marginBottom:8}}>
                <label className="lbl">מיקום</label>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  {[{v:true,l:'📍 ידוע'},{v:false,l:'❓ לא נסגר'}].map(({v,l})=>(
                    <button key={String(v)} type="button" onClick={()=>setShow(i,'locationKnown',v)} className="btn btn-sm"
                      style={{background:sh.locationKnown===v?'#166534':'#f1f5f9',color:sh.locationKnown===v?'white':'#475569',fontWeight:sh.locationKnown===v?700:400}}>
                      {l}
                    </button>
                  ))}
                </div>
                {sh.locationKnown===true && (
                  <div className="grid2">
                    <div><label className="lbl">שם המקום</label><input className="inp" value={sh.locationName||''} onChange={e=>setShow(i,'locationName',e.target.value)}/></div>
                    <div><label className="lbl">כתובת</label><input className="inp" value={sh.locationAddress||''} onChange={e=>setShow(i,'locationAddress',e.target.value)}/></div>
                  </div>
                )}
                {sh.locationKnown===false && (
                  <div style={{background:'#fef3c7',borderRadius:7,padding:'6px 10px',fontSize:12,color:'#92400e'}}>מיקום עדיין לא נסגר</div>
                )}
              </div>
              <div className="grid2">
                <div><label className="lbl">משך</label><input className="inp" value={sh.duration||''} onChange={e=>setShow(i,'duration',e.target.value)}/></div>
                <div><label className="lbl">משתתפים</label><input className="inp" type="number" value={sh.participants||''} onChange={e=>setShow(i,'participants',e.target.value)} placeholder="50"/></div>
              </div>
            </div>
          ))}

          {/* תמחור */}
          <div style={secStyle}>💰 תמחור</div>
          <div className="grid2" style={{marginBottom:8}}>
            <div>
              <label className="lbl">נסיעות (ש"ח) <span style={{fontWeight:400,color:'#94a3b8',fontSize:11}}>(ללא מע"מ)</span></label>
              <input className="inp" type="number" value={f.travelCost} onChange={e=>set('travelCost',e.target.value)} placeholder="0"/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:22}}>
              <input type="checkbox" id="ovat" checked={f.includeVat} onChange={e=>set('includeVat',e.target.checked)} style={{width:16,height:16}}/>
              <label htmlFor="ovat" style={{cursor:'pointer',fontSize:14}}>מחירי המופעים כוללים מע"מ (18%)</label>
            </div>
          </div>
          <div style={{background:'#f0fdf4',borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:13}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}><span>שכר הופעות:</span><span style={{fontWeight:600}}>{showsTotal.toLocaleString()} ש"ח</span></div>
            {travel>0 && <div style={{display:'flex',justifyContent:'space-between',marginBottom:3,color:'#64748b'}}><span>נסיעות (ללא מע"מ):</span><span>{travel.toLocaleString()} ש"ח</span></div>}
            {f.includeVat && <div style={{display:'flex',justifyContent:'space-between',marginBottom:3,color:'#64748b'}}><span>מע"מ (18%):</span><span>{vat.toLocaleString()} ש"ח</span></div>}
            <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:15,borderTop:'1px solid #bbf7d0',marginTop:6,paddingTop:6,color:'#166534'}}><span>סה"כ:</span><span>{total.toLocaleString()} ש"ח</span></div>
          </div>
          <div style={{marginBottom:10}}>
            <label className="lbl">תנאי תשלום</label>
            <input className="inp" value={f.paymentTerms} onChange={e=>set('paymentTerms',e.target.value)}/>
          </div>
          <div style={{marginBottom:10}}>
            <label className="lbl">הערות</label>
            <textarea className="inp" rows={3} value={f.notes} onChange={e=>set('notes',e.target.value)} style={{resize:'vertical'}}/>
          </div>

          {err && <div style={{color:'#dc2626',fontSize:13,marginBottom:8,background:'#fef2f2',padding:'8px 12px',borderRadius:7}}>{err}</div>}
        </div>
        <div style={{padding:'12px 20px',borderTop:'1px solid #f1f5f9',display:'flex',gap:8}}>
          <button className="btn btn-primary" onClick={save} disabled={saving}
            style={{flex:1,justifyContent:'center',fontSize:14,padding:'10px',background:'#166534',borderColor:'#166534'}}>
            {saving ? '⏳ יוצר ושולח...' : '📋 צור ושלח הזמנה'}
          </button>
          <button className="btn btn-secondary" onClick={onClose}>ביטול</button>
        </div>
      </div>
    </div>
  );
}

function QuoteModal({ contacts: initContacts, onClose, onDone, defaultContactId='', existingQuote=null }) {
  const defValidUntil = () => { const d=new Date(); d.setDate(d.getDate()+45); return d.toISOString().split('T')[0]; };
  const fmtHeDate = s => { if(!s) return ''; try { const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('he-IL',{year:'numeric',month:'long',day:'numeric'}); } catch { return s; } };
  const defShow = () => ({ _id:Math.random().toString(36).slice(2), showName:'שקוף בחזית', description:'', eventDateKnown:null, eventDate:'', eventTime:'', locationKnown:null, locationName:'', locationAddress:'', participants:'', duration:'75 דקות', audience:'', price:'' });

  const isEditMode = !!existingQuote;
  const rawForm = existingQuote?.rawForm || null;

  const listsCtx = useContext(ListsCtx);
  const showNameOpts = listsCtx ? listsCtx.get('showName', DEF_SHOW_NAME) : DEF_SHOW_NAME;
  const [showTemplates, setShowTemplates] = useState([]);
  useEffect(() => { api.get('/api/show-templates').then(setShowTemplates).catch(()=>{}); }, []);

  const [contacts, setContacts] = useState(initContacts);
  const [f, setF] = useState(() => {
    if (rawForm) return {
      contactId:    rawForm.contactId    || defaultContactId,
      eventPurpose: rawForm.eventPurpose || '',
      travelCost:   rawForm.travelCost   || '',
      includeVat:   rawForm.includeVat   || false,
      paymentTerms: rawForm.paymentTerms || '50% מקדמה בחתימה, 50% ביום האירוע',
      notes:        rawForm.notes        || '',
      validUntil:   rawForm.validUntil   || defValidUntil(),
    };
    return {
      contactId: defaultContactId, eventPurpose:'', travelCost:'',
      includeVat:false, paymentTerms:'50% מקדמה בחתימה, 50% ביום האירוע',
      notes:'', validUntil: defValidUntil(),
    };
  });
  const [shows, setShows] = useState(() => {
    if (rawForm && rawForm.shows && rawForm.shows.length) {
      return rawForm.shows.map(s => ({ ...s, _id: s._id || Math.random().toString(36).slice(2) }));
    }
    return [defShow()];
  });
  const [saving, setSaving]         = useState(false);
  const [err, setErr]               = useState('');
  const [addingNew, setAddingNew]   = useState(false);
  const [newC, setNewC]             = useState({ name:'', phone:'', org:'', email:'' });
  const [savingNew, setSavingNew]   = useState(false);

  // Load default notes + payment terms from settings (only for new quotes)
  useEffect(() => {
    if (isEditMode) return;
    api.get('/api/quote-settings').then(s => {
      setF(p => ({
        ...p,
        ...(s.defaultNotes ? { notes: s.defaultNotes } : {}),
        ...(s.defaultPaymentTerms ? { paymentTerms: s.defaultPaymentTerms } : {}),
      }));
    }).catch(() => {});
  }, []);

  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const setShow = (i,k,v) => setShows(p=>p.map((s,j)=>j===i?{...s,[k]:v}:s));
  const setShowName = (i, name) => {
    const tmpl = showTemplates.find(t=>t.name===name);
    setShows(p=>p.map((s,j)=>j===i ? {...s, showName:name, ...(tmpl && !s.description ? {description:tmpl.description} : {})} : s));
  };
  const addShow = () => setShows(p=>[...p, defShow()]);
  const removeShow = i => setShows(p=>p.filter((_,j)=>j!==i));

  const selCont = contacts.find(c=>c.id===f.contactId);

  const createContact = async () => {
    if (!newC.name.trim()) return;
    setSavingNew(true);
    try {
      const res = await api.post('/api/contacts', { name:newC.name, phone:newC.phone, org:newC.org, email:newC.email, status:'lead' });
      setContacts(p=>[...p, res]);
      setF(p=>({...p, contactId:res.id}));
      setAddingNew(false);
      setNewC({name:'',phone:'',org:'',email:''});
    } catch(e) { alert('שגיאה: '+e.message); }
    setSavingNew(false);
  };

  const showsTotal = shows.reduce((s,sh)=>s+(parseFloat(sh.price)||0),0);
  const travel     = parseFloat(f.travelCost)||0;
  // נסיעות תמיד ללא מע"מ
  const vat        = f.includeVat ? Math.round(showsTotal*0.18) : 0;
  const total      = showsTotal + travel + vat;

  const save = async () => {
    if (!f.contactId) { setErr('יש לבחור איש קשר'); return; }
    if (shows.every(s=>!s.price)) { setErr('יש להזין מחיר לפחות למופע אחד'); return; }
    setSaving(true); setErr('');
    try {
      const rawFormData = { ...f, shows: shows.map(s=>({...s})) };
      const payload = {
        ...f,
        validUntil: fmtHeDate(f.validUntil),
        contactName:  selCont?.name||'',
        organization: selCont?.org||selCont?.company||'',
        contactPhone: selCont?.phone||'',
        contactEmail: selCont?.email||'',
        shows: shows.map(s=>({
          ...s,
          eventDate: s.eventDateKnown===false ? 'תאריך עדיין לא נסגר' : (fmtHeDate(s.eventDate)||s.eventDate),
          eventTime: s.eventDateKnown===false ? '' : s.eventTime,
          locationKnown: s.locationKnown,
        })),
        price: showsTotal, total,
        _rawForm: rawFormData,
      };
      if (isEditMode) {
        await api.put(`/api/quotes/${existingQuote.id}`, payload);
      } else {
        await api.post('/api/quotes/generate', payload);
      }
      onDone();
    } catch(e) { setErr(e.message); setSaving(false); }
  };

  const secStyle = { fontWeight:700, fontSize:13, color:'#2d4a7a', marginBottom:8, marginTop:16 };
  const boxStyle = { background:'#f8fafc', border:'1.5px solid #e2e8f0', borderRadius:10, padding:'14px 16px', marginBottom:10 };

  return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:640}}>
        <div style={{padding:'16px 20px',borderBottom:'1px solid #f1f5f9',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontWeight:700,fontSize:17}}>{isEditMode ? '✏️ עריכת הצעת מחיר' : '📄 הצעת מחיר חדשה'}</div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8'}}>✕</button>
        </div>
        <div style={{padding:'16px 20px',overflowY:'auto',maxHeight:'78vh'}}>

          {/* ── נמען ── */}
          <div style={secStyle}>👤 נמען</div>
          <div style={{display:'flex',gap:8,alignItems:'flex-end',marginBottom:6}}>
            <div style={{flex:1}}>
              <label className="lbl">איש קשר *</label>
              <select className="inp" value={f.contactId} onChange={e=>set('contactId',e.target.value)}>
                <option value="">— בחר איש קשר —</option>
                {contacts.map(c=><option key={c.id} value={c.id}>{c.name}{c.org?` (${c.org})`:''}</option>)}
              </select>
            </div>
            <button className="btn btn-secondary btn-sm" onClick={()=>setAddingNew(v=>!v)} style={{whiteSpace:'nowrap',marginBottom:1}}>
              {addingNew ? '✕ ביטול' : '+ איש קשר חדש'}
            </button>
          </div>
          {selCont && !addingNew && (
            <div style={{background:'#f0f4fa',borderRadius:8,padding:'8px 12px',fontSize:13,marginBottom:10,color:'#334155'}}>
              <div style={{display:'flex',gap:16,alignItems:'center',marginBottom: selCont.org ? 4 : 0}}>
                <span style={{fontWeight:700,fontSize:14}}>{selCont.name}</span>
                {selCont.phone && <span style={{color:'#64748b'}}>{selCont.phone}</span>}
              </div>
              {selCont.org && (
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <span style={{fontSize:11,color:'#94a3b8',fontWeight:600}}>ארגון:</span>
                  <span style={{fontWeight:600,color:'#4f46e5',fontSize:13}}>{selCont.org}</span>
                </div>
              )}
            </div>
          )}
          {addingNew && (
            <div style={{background:'#f0fdf4',border:'1.5px solid #bbf7d0',borderRadius:10,padding:'12px 14px',marginBottom:12}}>
              <div style={{fontWeight:600,fontSize:13,marginBottom:10,color:'#166534'}}>✨ איש קשר חדש (יתווסף כ-ליד)</div>
              <div className="grid2" style={{marginBottom:8}}>
                <div><label className="lbl">שם *</label><input className="inp" value={newC.name} onChange={e=>setNewC(p=>({...p,name:e.target.value}))} placeholder="שם מלא"/></div>
                <div><label className="lbl">טלפון</label><input className="inp" value={newC.phone} onChange={e=>setNewC(p=>({...p,phone:e.target.value}))} placeholder="050..."/></div>
                <div><label className="lbl">ארגון</label><input className="inp" value={newC.org} onChange={e=>setNewC(p=>({...p,org:e.target.value}))}/></div>
                <div><label className="lbl">אימייל</label><input className="inp" value={newC.email} onChange={e=>setNewC(p=>({...p,email:e.target.value}))}/></div>
              </div>
              <button className="btn btn-primary btn-sm" onClick={createContact} disabled={savingNew||!newC.name.trim()}>
                {savingNew ? '...' : '✅ הוסף ובחר'}
              </button>
            </div>
          )}

          {/* ── מטרת האירוע (מידע פנימי) ── */}
          <div style={secStyle}>🎯 מטרת האירוע <span style={{fontWeight:400,color:'#94a3b8',fontSize:11}}>(מידע פנימי — לא יופיע בהצעה)</span></div>
          <input className="inp" value={f.eventPurpose} onChange={e=>set('eventPurpose',e.target.value)}
            placeholder="חיזוק הצוות, כנס שנתי, אירוע גיבוש..." style={{marginBottom:10}}/>

          {/* ── מופעים ── */}
          <div style={{...secStyle,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>🎤 מופעים ({shows.length})</span>
            <button className="btn btn-secondary btn-xs" onClick={addShow}>+ הוסף מופע</button>
          </div>

          {shows.map((sh, i) => (
            <div key={sh._id} style={{...boxStyle, borderColor: i===0?'#c7d2fe':'#e2e8f0'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div style={{fontWeight:700,fontSize:13,color:'#4f46e5'}}>מופע {i+1}</div>
                {shows.length > 1 && <button className="btn btn-danger btn-xs" onClick={()=>removeShow(i)}>✕ הסר</button>}
              </div>
              {/* שם המופע + מחיר */}
              <div className="grid2" style={{marginBottom:8}}>
                <div>
                  <label className="lbl">שם המופע</label>
                  <SmartSelect value={sh.showName} onChange={v=>setShowName(i,v)} listKey="showName" options={showNameOpts}/>
                </div>
                <div>
                  <label className="lbl">מחיר (ש"ח) *</label>
                  <input className="inp" type="number" value={sh.price} onChange={e=>setShow(i,'price',e.target.value)} placeholder="5000"/>
                </div>
              </div>
              {/* תיאור המופע — צמוד לשם */}
              <div style={{marginBottom:8}}>
                <label className="lbl">תיאור המופע <span style={{fontWeight:400,color:'#94a3b8',fontSize:11}}>(יופיע בהצעה)</span></label>
                <textarea className="inp" rows={2} value={sh.description} onChange={e=>setShow(i,'description',e.target.value)} placeholder="מופע סיפור אישי מרגש..." style={{resize:'vertical'}}/>
              </div>
              {/* תאריך — ידוע / לא ידוע */}
              <div style={{marginBottom:8}}>
                <label className="lbl">תאריך המופע</label>
