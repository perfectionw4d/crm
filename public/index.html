  const [data, setData] = useState({ orgs:[], contacts:[], tasks:[], shows:[], quotes:[], orders:[], projects:[] });
  const [view, setView] = useState('dashboard');
  const [selOrgId,  setSelOrgId]  = useState(null);
  const [selContId, setSelContId] = useState(null);
  const [selProjId, setSelProjId] = useState(null);
  const [auth, setAuth] = useState({ authenticated:false, googleConfigured:false, lastSync:{} });
  const [loading, setLoading] = useState(true);
  const initialLoadDone = React.useRef(false);
  const [syncing, setSyncing] = useState(null);
  const [wa, setWa] = useState({ status:'disconnected', qr:null, broadcast:null });
  const [overdueModal, setOverdueModal] = useState(null); // {items:[...]}
  const prevWaStatus = React.useRef('disconnected');
  const { show: toast, Toast } = useToast();
  const [sidebarOpen, setSidebarOpen] = useState(false);

  // Modals state
  const [m, setM] = useState({
    addNew:false, editOrg:null, editCont:null, editTask:null,
    addConv:null, addShow:null, showPicker:false, editConv:null, emailPickerFor:null, editShow:null, dupScanner:false, importContacts:false,
    waCompose:null, defaultOrgId:null, defaultContId:null,
  });
  const openM = (k,v=true) => setM(p=>({...p,[k]:v}));
  const closeAll = () => setM({ addNew:false,editOrg:null,editCont:null,editTask:null,addConv:null,addShow:null,showPicker:false,editConv:null,emailPickerFor:null,waCompose:null,defaultOrgId:null,defaultContId:null,editShow:null,dupScanner:false,importContacts:false });

  // Navigation helper
  const go = (v, id=null) => {
    setView(v);
    if (v==='org-detail')      setSelOrgId(id);
    if (v==='contact-detail')  setSelContId(id);
    if (v==='project-detail')  setSelProjId(id);
  };

  // Load data — showSpinner=true only on first load, silent refresh otherwise
  const loadAll = useCallback(async (showSpinner) => {
    const isFirst = !initialLoadDone.current;
    if (isFirst || showSpinner) setLoading(true);
    try {
      const get = url => fetch(url).then(async r => {
        if (r.status === 401) { window.location.href = '/login.html'; throw new Error('פג תוקף — מועבר לדף כניסה'); }
        const text = await r.text();
        try { return JSON.parse(text); }
        catch { throw new Error(`שגיאה בטעינת ${url}: תגובה לא תקינה (${r.status})\n${text.slice(0,200)}`); }
      });
      const [orgs, contacts, tasks, shows, quotes, orders, projects] = await Promise.all([
        get('/api/orgs'), get('/api/contacts'), get('/api/tasks'), get('/api/shows'),
        get('/api/quotes').catch(()=>[]), get('/api/orders').catch(()=>[]),
        get('/api/projects').catch(()=>[]),
      ]);
      const authStatus = await get('/auth/status').catch(()=>({}));
      setData({
        orgs:     Array.isArray(orgs)?orgs:[],
        contacts: Array.isArray(contacts)?contacts:[],
        tasks:    Array.isArray(tasks)?tasks:[],
        shows:    Array.isArray(shows)?shows:[],
        quotes:   Array.isArray(quotes)?quotes:[],
        orders:   Array.isArray(orders)?orders:[],
        projects: Array.isArray(projects)?projects:[],
      });
      setAuth(authStatus);
      initialLoadDone.current = true;
    } catch (e) {
      console.error('loadAll error:', e);
      toast('שגיאה בטעינת נתונים: ' + e.message, true);
    }
    if (isFirst || showSpinner) setLoading(false);
  }, []);

  useEffect(() => { loadAll(true); }, [loadAll]);

  // Auto-refresh every 5 minutes (picks up items pulled from Google)
  useEffect(() => {
    const id = setInterval(() => {
      if (!document.hidden) loadAll();
    }, 5 * 60 * 1000);
    return () => clearInterval(id);
  }, [loadAll]);

  // Check URL params for auth result
  useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    if (p.get('auth')==='success')       { toast('✅ חיבור לגוגל הצליח!'); window.history.replaceState({},'','/'); }
    if (p.get('auth')==='account-added') { toast('✅ חשבון Gmail נוסף: '+p.get('email')); window.history.replaceState({},'','/'); }
    if (p.get('auth')==='error')         { toast('❌ שגיאה בחיבור לגוגל: '+p.get('msg'), true); window.history.replaceState({},'','/'); }
  }, []);

  // WhatsApp status polling — 2s when connecting/qr, 5s when stable
  const waRef = React.useRef({ status:'disconnected' });
  useEffect(() => {
    let tid;
    const pollWa = async () => {
      try {
        const s = await api.get('/api/wa/status');
        setWa(s);
        waRef.current = s;
        if (s.status === 'ready' && prevWaStatus.current !== 'ready' && s.overdue && s.overdue.length > 0) {
          setOverdueModal({ items: s.overdue });
        }
        prevWaStatus.current = s.status;
      } catch {}
      // Poll faster while connecting or waiting for QR
      const delay = (waRef.current.status === 'connecting' || waRef.current.status === 'qr') ? 2000 : 5000;
      tid = setTimeout(pollWa, delay);
    };
    pollWa();
    return () => clearTimeout(tid);
  }, []);

  const doWaConnect = async (endpoint) => {
    setWa(p => ({ ...p, status:'connecting' }));
    waRef.current = { ...waRef.current, status:'connecting' };
    try { await api.post(endpoint); } catch(e) {
      setWa(p => ({ ...p, status:'disconnected' }));
      toast('שגיאת חיבור: ' + e.message, true);
      return;
    }
    try { const s = await api.get('/api/wa/status'); setWa(s); waRef.current = s; } catch {}
  };
  const connectWa    = () => doWaConnect('/api/wa/connect');
  const resetWa      = () => doWaConnect('/api/wa/reset');
  const disconnectWa = async () => { await api.post('/api/wa/disconnect'); setWa(p=>({...p,status:'disconnected',qr:null})); };

  // ── Projects CRUD ────────────────────────────────────────────────────────────
  const addProject = async d => {
    const r = await api.post('/api/projects', d);
    setData(p=>({...p, projects:[r,...p.projects]}));
    toast('✅ פרויקט נוצר');
  };
  const updateProject = async (id, d) => {
    const r = await api.put(`/api/projects/${id}`, d);
    setData(p=>({...p, projects:p.projects.map(pr=>pr.id===id?r:pr)}));
  };
  const deleteProject = async (id) => {
    await api.delete(`/api/projects/${id}`);
    setData(p=>({...p, projects:p.projects.filter(pr=>pr.id!==id)}));
    go('projects');
    toast('🗑 פרויקט נמחק');
  };

  // ── CRUD helpers ─────────────────────────────────────────────────────────────
  const addOrg = async d => {
    const r = await api.post('/api/orgs', { conversations:[], showHistory:[], tags:[], ...d });
    setData(p=>({...p, orgs:[r,...p.orgs]}));
    closeAll(); toast('✅ ארגון נוסף');
  };
  const addOrgQuick = async d => {
    const r = await api.post('/api/orgs', { conversations:[], showHistory:[], tags:[], ...d });
    setData(p=>({...p, orgs:[r,...p.orgs]}));
    toast('✅ ארגון נוסף וקושר');
    return r;
  };
  const addContactQuick = async d => {
    const r = await api.post('/api/contacts', { conversations:[], showHistory:[], tags:[], ...d });
    setData(p=>({...p, contacts:[r,...p.contacts]}));
    toast('✅ איש קשר נוסף');
    return r;
  };
  const updateOrg = async (id, d) => {
    const r = await api.put(`/api/orgs/${id}`, d);
    setData(p=>({...p, orgs:p.orgs.map(o=>o.id===id?r:o)}));
    closeAll(); toast('✅ ארגון עודכן');
  };
  const deleteOrg = async id => {
    if (!confirm('למחוק ארגון?')) return;
    await api.del(`/api/orgs/${id}`);
    setData(p=>({...p, orgs:p.orgs.filter(o=>o.id!==id)}));
    go('orgs'); toast('🗑 ארגון נמחק');
  };

  const addContact = async d => {
    const r = await api.post('/api/contacts', { conversations:[], showHistory:[], tags:[], ...d });
    setData(p=>({...p, contacts:[r,...p.contacts]}));
    closeAll(); toast('✅ איש קשר נוסף');
  };
  const updateContact = async (id, d) => {
    const r = await api.put(`/api/contacts/${id}`, d);
    setData(p=>({...p, contacts:p.contacts.map(c=>c.id===id?r:c)}));
    closeAll(); toast('✅ עודכן');
  };
  const deleteContact = async id => {
    if (!confirm('למחוק איש קשר?')) return;
    await api.del(`/api/contacts/${id}`);
    setData(p=>({...p, contacts:p.contacts.filter(c=>c.id!==id)}));
    go('contacts'); toast('🗑 נמחק');
  };

  const addTask = async d => {
    const r = await api.post('/api/tasks', d);
    setData(p=>({...p, tasks:[r,...p.tasks]}));
    closeAll(); toast('✅ משימה נוספה');
  };
  const updateTask = async (id, d, opts={}) => {
    const oldTask = data.tasks.find(t=>t.id===id);
    const r = await api.put(`/api/tasks/${id}`, d);
    setData(p=>({...p, tasks:p.tasks.map(t=>t.id===id?r:t)}));
    if (d.taskStatus === 'במעקב' && oldTask?.taskStatus !== 'במעקב') {
      const followUp = { title:`מעקב: ${d.title}`, type:'task', taskStatus:'נפתחה',
        contactId:d.contactId||'', organizationId:d.organizationId||'',
        dueDate:'', priority:d.priority||'normal', notes:'', tags:[], completed:false };
      const newTask = await api.post('/api/tasks', followUp);
      setData(p=>({...p, tasks:[newTask,...p.tasks]}));
      toast('✅ משימת מעקב נוצרה אוטומטית');
    }
    if (opts.close) { closeAll(); toast('✅ משימה עודכנה'); }
  };
  const deleteTask = async id => {
    await api.del(`/api/tasks/${id}`);
    setData(p=>({...p, tasks:p.tasks.filter(t=>t.id!==id)}));
    toast('🗑 נמחק');
  };

  // Sub-item helpers (conversations, shows)
  const addConv = async (entityType, entityId, conv) => {
    const endpoint = entityType==='org' ? '/api/orgs' : '/api/contacts';
    const list = entityType==='org' ? data.orgs : data.contacts;
    const item = list.find(i=>i.id===entityId);
    if (!item) return;
    const updated = { ...item, conversations:[{id:Math.random().toString(36).slice(2,9),...conv},...(item.conversations||[])] };
    const r = await api.put(`${endpoint}/${entityId}`, updated);
    if (entityType==='org') setData(p=>({...p, orgs:p.orgs.map(o=>o.id===entityId?r:o)}));
    else setData(p=>({...p, contacts:p.contacts.map(c=>c.id===entityId?r:c)}));
    closeAll(); toast('✅ שיחה נרשמה');
  };
  const delConv = async (entityType, entityId, cvId) => {
    const endpoint = entityType==='org' ? '/api/orgs' : '/api/contacts';
    const list = entityType==='org' ? data.orgs : data.contacts;
    const item = list.find(i=>i.id===entityId);
    if (!item) return;
    const updated = { ...item, conversations:(item.conversations||[]).filter(c=>c.id!==cvId) };
    const r = await api.put(`${endpoint}/${entityId}`, updated);
    if (entityType==='org') setData(p=>({...p, orgs:p.orgs.map(o=>o.id===entityId?r:o)}));
    else setData(p=>({...p, contacts:p.contacts.map(c=>c.id===entityId?r:c)}));
  };
  const updateConv = async (entityType, entityId, cvId, conv) => {
    const endpoint = entityType==='org' ? '/api/orgs' : '/api/contacts';
    const list = entityType==='org' ? data.orgs : data.contacts;
    const item = list.find(i=>i.id===entityId);
    if (!item) return;
    const updated = { ...item, conversations:(item.conversations||[]).map(c=>c.id===cvId?{...c,...conv}:c) };
    const r = await api.put(`${endpoint}/${entityId}`, updated);
    if (entityType==='org') setData(p=>({...p, orgs:p.orgs.map(o=>o.id===entityId?r:o)}));
    else setData(p=>({...p, contacts:p.contacts.map(c=>c.id===entityId?r:c)}));
    closeAll(); toast('✅ שיחה עודכנה');
  };
  const addShow = async (entityType, entityId, show) => {
    if (entityType === 'standalone') {
      const r = await api.post('/api/shows', show);
      setData(p=>({...p, shows:[r,...p.shows]}));
      closeAll(); toast('✅ מופע נוסף');
      return;
    }
    const endpoint = entityType==='org' ? '/api/orgs' : '/api/contacts';
    const list = entityType==='org' ? data.orgs : data.contacts;
    const item = list.find(i=>i.id===entityId);
    if (!item) return;
    const updated = { ...item, showHistory:[{id:Math.random().toString(36).slice(2,9),...show},...(item.showHistory||[])] };
    const r = await api.put(`${endpoint}/${entityId}`, updated);
    if (entityType==='org') setData(p=>({...p, orgs:p.orgs.map(o=>o.id===entityId?r:o)}));
    else setData(p=>({...p, contacts:p.contacts.map(c=>c.id===entityId?r:c)}));
    closeAll(); toast('✅ מופע נוסף');
  };
  const updateShow = async (entityType, entityId, shId, show) => {
    if (entityType === 'standalone') {
      const r = await api.put(`/api/shows/${shId}`, show);
      setData(p=>({...p, shows:p.shows.map(s=>s.id===shId?r:s)}));
      closeAll(); toast('✅ מופע עודכן');
      return;
    }
    const endpoint = entityType==='org' ? '/api/orgs' : '/api/contacts';
    const list = entityType==='org' ? data.orgs : data.contacts;
    const item = list.find(i=>i.id===entityId);
    if (!item) return;
    const updated = { ...item, showHistory:(item.showHistory||[]).map(s=>s.id===shId?{...s,...show}:s) };
    const r = await api.put(`${endpoint}/${entityId}`, updated);
    if (entityType==='org') setData(p=>({...p, orgs:p.orgs.map(o=>o.id===entityId?r:o)}));
    else setData(p=>({...p, contacts:p.contacts.map(c=>c.id===entityId?r:c)}));
    closeAll(); toast('✅ מופע עודכן');
  };
  const delShow = async (entityType, entityId, shId) => {
    if (entityType === 'standalone') {
      await api.del(`/api/shows/${shId}`);
      setData(p=>({...p, shows:p.shows.filter(s=>s.id!==shId)}));
      toast('🗑 מופע נמחק');
      return;
    }
    const endpoint = entityType==='org' ? '/api/orgs' : '/api/contacts';
    const list = entityType==='org' ? data.orgs : data.contacts;
    const item = list.find(i=>i.id===entityId);
    if (!item) return;
    const updated = { ...item, showHistory:(item.showHistory||[]).filter(s=>s.id!==shId) };
    const r = await api.put(`${endpoint}/${entityId}`, updated);
    if (entityType==='org') setData(p=>({...p, orgs:p.orgs.map(o=>o.id===entityId?r:o)}));
    else setData(p=>({...p, contacts:p.contacts.map(c=>c.id===entityId?r:c)}));
  };

  // Google sync
  const doSync = async (type) => {
    setSyncing(type);
    try {
      const r = await api.post(`/api/sync/${type}`, {});
      if (r.error) { toast('❌ '+r.error, true); }
      else {
        toast(`✅ סנכרון הצליח — נשלחו ${r.pushed||0}, עודכנו ${r.updated||0}, נמשכו ${r.pulled||0}`);
        await loadAll();
      }
    } catch (e) { toast('❌ '+e.message, true); }
    setSyncing(null);
  };

  // Sidebar stats
  const allEntities = [...data.orgs, ...data.contacts];
  const sideStats = {
    orgs:       data.orgs.length,
    contacts:   data.contacts.length,
    tasks:      data.tasks.length,
    taskCount:  data.tasks.filter(t=>t.type!=='event').length,
    eventCount: data.tasks.filter(t=>t.type==='event').length,
    leads:      allEntities.filter(i=>i.status==='lead').length,
    warm:       allEntities.filter(i=>i.status==='warm').length,
    followUps:  allEntities.filter(i=>i.nextFollowUp&&i.nextFollowUp<=today()).length,
    vip:        allEntities.filter(i=>i.status==='vip').length,
  };

  const selOrg  = data.orgs.find(o=>o.id===selOrgId);
  const selCont = data.contacts.find(c=>c.id===selContId);

  if (loading) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',flexDirection:'column',gap:16}}>
      <I n="mic" s={40} c="#4f46e5"/>
      <p style={{color:'#64748b',fontSize:16}}>טוען...</p>
    </div>
  );

  return (
    <ListsCtx.Provider value={listOpts}>
    <div style={{display:'flex',minHeight:'100vh'}}>
      {/* Mobile top bar with hamburger */}
      <div className="mobile-topbar">
        <button className="hamburger-btn" onClick={()=>setSidebarOpen(true)}>☰</button>
        <LogoHeader/>
      </div>
      {/* Backdrop for mobile/tablet sidebar */}
      <div className={`sidebar-backdrop${sidebarOpen?' sidebar-open':''}`} onClick={()=>setSidebarOpen(false)}/>
      <Sidebar view={view} go={go} stats={sideStats} onNew={()=>{ openM('addNew'); setSidebarOpen(false); }} isOpen={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
      <main className="main">
        {view==='dashboard'      && <Dashboard data={data} go={go} wa={wa} onNew={()=>openM('addNew')} onEditTask={t=>openM('editTask',t)} onUpdateTask={(id,d)=>updateTask(id,d)}/>}
        {view==='orgs'           && <OrgsList orgs={data.orgs} contacts={data.contacts} go={go} onAdd={()=>openM('editOrg',{})}/>}
        {view==='org-detail' && selOrg && (
          <OrgDetail
            org={selOrg} contacts={data.contacts} tasks={data.tasks} go={go}
            onEdit={()=>openM('editOrg',selOrg)}
            onDelete={()=>deleteOrg(selOrg.id)}
            onUpdate={d=>updateOrg(selOrg.id,{...selOrg,...d})}
            onAddContact={()=>{ openM('editCont',{}); setM(p=>({...p,defaultOrgId:selOrg.id})); }}
            onAddConv={()=>openM('addConv',{entityType:'org',entityId:selOrg.id})}
            onEditConv={cv=>openM('editConv',{entityType:'org',entityId:selOrg.id,conv:cv})}
            onAddShow={()=>openM('addShow',{entityType:'org',entityId:selOrg.id})}
            onEditShow={sh=>setM(p=>({...p,editShow:{...sh,_source:'org',_sourceId:selOrg.id}}))}
            onDelConv={cvId=>delConv('org',selOrg.id,cvId)}
            onDelShow={shId=>delShow('org',selOrg.id,shId)}
            onEmailClick={email=>openM('emailPickerFor',email)}
            onWaClick={c=>openM('waCompose',c)}
            onEditTask={t=>openM('editTask',t)}
          />
        )}
        {view==='contacts'       && <ContactsList contacts={data.contacts} orgs={data.orgs} go={go} onAdd={()=>openM('editCont',{})} onDupScan={()=>setM(p=>({...p,dupScanner:true}))} onUpdate={(id,d)=>updateContact(id,{...data.contacts.find(c=>c.id===id),...d})} onDelete={id=>deleteContact(id)} onEdit={c=>openM('editCont',c)} onEmailClick={email=>openM('emailPickerFor',email)} onImport={()=>setM(p=>({...p,importContacts:true}))}
          onBulkStatus={async (ids,status)=>{ await api.post('/api/contacts/bulk-status',{ids,status}); await loadAll(); toast(`עודכנו ${ids.length} אנשי קשר`); }}
          onBulkDelete={async (ids)=>{ await api.post('/api/contacts/bulk-delete',{ids}); await loadAll(); toast(`נמחקו ${ids.length} אנשי קשר`); }}
        />}
        {view==='contact-detail' && selCont && (
          <ContactDetail
            contact={selCont} orgs={data.orgs} contacts={data.contacts} tasks={data.tasks} standaloneShows={data.shows||[]}
            quotes={data.quotes||[]} orders={data.orders||[]}
            go={go}
            onEdit={()=>openM('editCont',selCont)}
            onDelete={()=>deleteContact(selCont.id)}
            onUpdate={d=>updateContact(selCont.id,{...selCont,...d})}
            onAddConv={()=>openM('addConv',{entityType:'contact',entityId:selCont.id})}
            onEditConv={cv=>openM('editConv',{entityType:'contact',entityId:selCont.id,conv:cv})}
            onAddShow={()=>openM('addShow',{entityType:'contact',entityId:selCont.id})}
            onEditShow={sh=>setM(p=>({...p,editShow:{...sh,_source:'contact',_sourceId:selCont.id}}))}
            onDelConv={cvId=>delConv('contact',selCont.id,cvId)}
            onDelShow={shId=>delShow('contact',selCont.id,shId)}
            onEmailClick={email=>openM('emailPickerFor',email)}
            onWaClick={c=>openM('waCompose',c)}
            onEditTask={t=>openM('editTask',t)}
            onOrderCreated={()=>loadAll()}
          />
        )}
        {view==='projects' && <ProjectsView projects={data.projects} contacts={data.contacts}
            onAdd={addProject} onView={id=>go('project-detail',id)} onDelete={deleteProject}/>}
        {view==='project-detail' && data.projects.find(p=>p.id===selProjId) && (
          <ProjectDetail
            project={data.projects.find(p=>p.id===selProjId)}
            allProjects={data.projects}
            contacts={data.contacts}
            tasks={data.tasks}
            go={go}
            onUpdate={d=>updateProject(selProjId,d)}
            onDelete={()=>deleteProject(selProjId)}
            onAddTask={d=>{ openM('editTask',d); }}
            onAddSubProject={async d=>{ await addProject(d); await loadAll(); }}
            onEditTask={t=>openM('editTask',t)}
          />
        )}
        {view==='conversations' && <ConversationsView data={data} go={go}/>}
        {view==='tasks'  && <TasksList tasks={data.tasks.filter(t=>t.type!=='event')} contacts={data.contacts} orgs={data.orgs}
            defaultType="task" onAdd={()=>{ openM('editTask',{type:'task'}); }} onUpdate={updateTask} onDelete={deleteTask}
            onEdit={t=>openM('editTask',t)}/>}
        {view==='events' && <TasksList tasks={data.tasks.filter(t=>t.type==='event')} contacts={data.contacts} orgs={data.orgs}
            defaultType="event" onAdd={()=>{ openM('editTask',{type:'event'}); }} onUpdate={updateTask} onDelete={deleteTask}
            onEdit={t=>openM('editTask',t)}/>}
        {view==='shows'    && <ShowsView contacts={data.contacts} orgs={data.orgs} shows={data.shows} go={go} onAdd={()=>setM(p=>({...p,showPicker:true}))} onEditShow={sh=>setM(p=>({...p,editShow:sh}))} onDeleteShow={(type,id,shId)=>delShow(type,id,shId)} waStatus={wa.status}/>}
        {view==='quotes'   && <QuotesView contacts={data.contacts} toast={toast}/>}
        {view==='wa'       && <WaBroadcast data={data} wa={wa} onConnectWa={connectWa} onDisconnectWa={disconnectWa} onResetWa={resetWa} toast={toast}/>}
        {view==='help'     && <HelpCenter/>}
        {view==='settings' && <Settings auth={auth} onSync={doSync} syncing={syncing}/>}
      </main>

      {/* Modals */}
      {m.addNew  && <AddNewModal orgs={data.orgs} contacts={data.contacts} onAddOrg={()=>openM('editOrg',{})} onAddContact={()=>openM('editCont',{})} onAddTask={()=>openM('editTask',{})} onAddConv={({entityType,entityId})=>openM('addConv',{entityType,entityId})} onAddShow={({entityType,entityId})=>openM('addShow',{entityType,entityId})} onClose={closeAll}/>}
      {m.editOrg !== null  && <OrgModal org={m.editOrg && m.editOrg.id ? m.editOrg : null} onSave={d=>m.editOrg?.id ? updateOrg(m.editOrg.id,{...m.editOrg,...d}) : addOrg(d)} onClose={closeAll}/>}
      {m.editCont !== null && <ContactModal contact={m.editCont && m.editCont.id ? m.editCont : null} orgs={data.orgs} contacts={data.contacts} defaultOrgId={m.defaultOrgId} onSave={d=>m.editCont?.id ? updateContact(m.editCont.id,{...m.editCont,...d}) : addContact(d)} onClose={closeAll} onAddOrg={addOrgQuick}/>}
      {m.editTask !== null && <TaskModal task={m.editTask?.id ? m.editTask : null} defaultType={m.editTask?.type} contacts={data.contacts} orgs={data.orgs} projects={data.projects} defaultContactId={m.defaultContId} defaultOrgId={m.defaultOrgId} onSave={d=>m.editTask?.id ? updateTask(m.editTask.id,{...m.editTask,...d},{close:true}) : addTask(d)} onClose={closeAll} onAddContact={addContactQuick}/>}
      {m.addConv && <ConvModal onSave={d=>addConv(m.addConv.entityType, m.addConv.entityId, d)} onClose={closeAll}/>}
      {m.editConv && <ConvModal conv={m.editConv.conv} onSave={d=>updateConv(m.editConv.entityType,m.editConv.entityId,m.editConv.conv.id,d)} onClose={closeAll}/>}
      {m.showPicker && <ShowPickerModal orgs={data.orgs} contacts={data.contacts} onPick={({entityType,entityId})=>{setM(p=>({...p,showPicker:false,addShow:{entityType,entityId}}));}} onClose={closeAll}/>}
      {m.addShow && <ShowModal contacts={data.contacts} onAddContact={addContactQuick} onSave={d=>addShow(m.addShow.entityType, m.addShow.entityId, d)} onClose={closeAll}/>}
      {m.editShow && <ShowModal contacts={data.contacts} onAddContact={addContactQuick} existingShow={m.editShow} onSave={d=>updateShow(m.editShow._source, m.editShow._sourceId, m.editShow.id, d)} onClose={closeAll}/>}
      {m.dupScanner && <DuplicateScanner contacts={data.contacts} go={go} onClose={closeAll}/>}
      {m.importContacts && <ImportContactsModal onClose={closeAll} onDone={()=>{ api.get('/api/contacts').then(r=>setData(p=>({...p,contacts:r}))).catch(()=>{}); }}/>}
      {m.emailPickerFor && <EmailPickerModal recipient={m.emailPickerFor} onClose={()=>openM('emailPickerFor',null)}/>}
      {m.waCompose && <WaComposeModal contact={m.waCompose} waStatus={wa.status} onClose={()=>openM('waCompose',null)}/>}

      {/* Overdue Messages Modal */}
      {overdueModal && (
        <div className="modal-overlay" onClick={()=>{}}>
          <div className="modal" style={{maxWidth:440,textAlign:'right'}}>
            <div style={{fontSize:28,marginBottom:8}}>⏰</div>
            <h2 style={{fontSize:18,fontWeight:700,marginBottom:8}}>הודעות שלא נשלחו</h2>
            <p style={{color:'#64748b',fontSize:14,marginBottom:16}}>
              נמצאו <strong>{overdueModal.items.length}</strong> הודעות שתוזמנו לשליחה בזמן שהמחשב היה כבוי.
              האם לשלוח אותן עכשיו?
            </p>
            <div style={{background:'#f8fafc',borderRadius:8,padding:12,marginBottom:18,maxHeight:160,overflowY:'auto'}}>
              {overdueModal.items.map((item,i)=>(
                <div key={i} style={{fontSize:13,padding:'4px 0',borderBottom:'1px solid #e2e8f0',color:'#334155'}}>
                  {item.type==='single' ? `📱 ${item.phone}` : `📢 ברודקאסט (${item.contacts?.length} נמענים)`}
                  {' — '}<span style={{color:'#94a3b8'}}>{new Date(item.scheduleAt).toLocaleString('he-IL')}</span>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button className="btn" onClick={async()=>{
                await api.post('/api/wa/overdue/dismiss');
                setOverdueModal(null);
              }} style={{background:'#f1f5f9',color:'#475569'}}>
                ביטול — לא עכשיו
              </button>
              <button className="btn btn-primary" onClick={async()=>{
                await api.post('/api/wa/overdue/send');
                setOverdueModal(null);
                toast('✅ ההודעות נשלחות...');
              }}>
                ✅ כן, שלח עכשיו
              </button>
            </div>
          </div>
        </div>
      )}

      {Toast}
    </div>
    </ListsCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
