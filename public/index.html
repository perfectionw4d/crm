// ─── WhatsApp Compose Modal ───────────────────────────────────────────────────
function WaComposeModal({ contact, waStatus, onClose }) {
  const [msg,        setMsg]        = useState('');
  const [scheduleAt, setScheduleAt] = useState('');
  const [useSchedule,setUseSchedule]= useState(false);
  const [sending,    setSending]    = useState(false);
  const [sent,       setSent]       = useState(false);
  const [err,        setErr]        = useState('');
  const [sigs,       setSigs]       = useState([]);
  const [selSig,     setSelSig]     = useState('default'); // 'none' | 'default' | sig.id

  useEffect(()=>{
    api.get('/api/signatures').then(list=>{
      const waSigs = list.filter(s => s.channel === 'whatsapp' || s.channel === 'both');
      setSigs(waSigs);
      const def = waSigs.find(s=>s.isDefault);
      if (def) {
        setSelSig(def.id);
        setMsg(p => p || '');
      }
    }).catch(()=>{});
  },[]);

  // Full message = user text + optional signature
  const fullMsg = () => {
    const sigObj = selSig !== 'none' ? sigs.find(s=>s.id===selSig) : null;
    return msg.trim() + (sigObj ? '\n\n--\n' + sigObj.text : '');
  };

  const openWaMe = () => {
    const text = fullMsg();
    const url = `https://wa.me/${waPhone(contact.phone)}${text?`?text=${encodeURIComponent(text)}`:''}`;
    window.open(url, '_blank'); onClose();
  };

  const send = async () => {
    if (!msg.trim()) { setErr('יש להזין הודעה'); return; }
    if (useSchedule && !scheduleAt) { setErr('יש לבחור תאריך ושעה לתזמון'); return; }
    setSending(true); setErr('');
    try {
      const body = { phone: contact.phone, message: fullMsg() };
      if (useSchedule) body.scheduleAt = new Date(scheduleAt).toISOString();
      await api.post('/api/wa/send', body);
      setSent(true);
      setTimeout(onClose, 1600);
    } catch(e) { setErr(e.message || 'שגיאה'); }
    setSending(false);
  };

  // local datetime-local min (now)
  const nowLocal = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);

  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:440}}>
        <ModalHeader title="שלח הודעת WhatsApp" onClose={onClose}/>
        <div style={{padding:20}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,background:'#f0fdf4',borderRadius:10,padding:'10px 14px'}}>
            <span style={{fontSize:22}}>💬</span>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>{contact.name}</div>
              <div style={{fontSize:12,color:'#64748b',direction:'ltr'}}>{contact.phone}</div>
            </div>
          </div>
          <textarea className="inp" rows={4} value={msg} onChange={e=>setMsg(e.target.value)}
            placeholder="כתוב הודעה..." style={{resize:'vertical',marginBottom:10}}/>

          {/* Signature picker */}
          {sigs.length > 0 && (
            <div style={{background:'#faf5ff',border:'1px solid #e9d5ff',borderRadius:8,padding:'10px 12px',marginBottom:10}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:selSig!=='none'?8:0}}>
                <span style={{fontSize:13,fontWeight:600,color:'#7c3aed',whiteSpace:'nowrap'}}>✍️ חתימה:</span>
                <select style={{flex:1,fontSize:13,padding:'4px 8px',borderRadius:6,border:'1px solid #ddd'}}
                  value={selSig} onChange={e=>setSelSig(e.target.value)}>
                  <option value="none">ללא חתימה</option>
                  {sigs.map(s=>(
                    <option key={s.id} value={s.id}>{s.name}{s.isDefault?' (ברירת מחדל)':''}</option>
                  ))}
                </select>
              </div>
              {selSig !== 'none' && sigs.find(s=>s.id===selSig) && (
                <pre style={{fontFamily:'inherit',fontSize:12,color:'#6b7280',whiteSpace:'pre-wrap',
                  margin:0,background:'#f3e8ff',borderRadius:5,padding:'6px 8px',lineHeight:1.5}}>
                  {sigs.find(s=>s.id===selSig).text}
                </pre>
              )}
            </div>
          )}

          {/* Schedule toggle */}
          {waStatus==='ready' && (
            <div style={{background:'#f8fafc',borderRadius:8,padding:'10px 14px',marginBottom:8}}>
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:14,marginBottom:useSchedule?10:0}}>
                <input type="checkbox" checked={useSchedule} onChange={e=>setUseSchedule(e.target.checked)} style={{width:15,height:15}}/>
                ⏰ תזמן שליחה לשעה מסוימת
              </label>
              {useSchedule && (
                <input type="datetime-local" className="inp" min={nowLocal} value={scheduleAt}
                  onChange={e=>setScheduleAt(e.target.value)} style={{marginTop:0}}/>
              )}
            </div>
          )}
          {err  && <p style={{color:'#dc2626',fontSize:13,marginTop:6}}>{err}</p>}
          {sent && <p style={{color:'#16a34a',fontSize:13,marginTop:6}}>{useSchedule?'✅ הודעה תוזמנה!':'✅ ההודעה נשלחה!'}</p>}
        </div>
        {/* Template section */}
        {waStatus==='ready' && (
          <div style={{margin:'0 20px 12px',padding:12,background:'#f0fdf4',borderRadius:10,border:'1.5px solid #86efac'}}>
            <div style={{fontSize:12,fontWeight:600,color:'#15803d',marginBottom:6}}>📋 שלח תבנית ראשונה (first_message_v2)</div>
            <div style={{fontSize:11,color:'#64748b',marginBottom:8,lineHeight:1.5}}>
              כאן ירון אנטניר — מספר סיפורים מהבמה ומהלב.<br/>
              עברתי למספר WhatsApp חדש ורציתי להישאר בקשר.<br/>
              🙏 כדי לאשר — פשוט ענה להודעה זו
            </div>
            <button onClick={async()=>{
              setSending(true);
              try {
                await api.post('/api/wa/send-template',{
                  phone: contact.phone,
                  templateName: 'first_message_v2',
                  langCode: 'he',
                  params: [],
                  contactId: contact.id||null,
                  name: contact.name||'',
                });
                setSent(true);
                setTimeout(onClose,1600);
              } catch(e){ setErr(e.message||'שגיאה בשליחת תבנית'); }
              setSending(false);
            }} disabled={sending}
              style={{background:'#16a34a',color:'white',border:'none',borderRadius:8,padding:'7px 16px',fontSize:13,fontWeight:600,cursor:'pointer',opacity:sending?0.5:1}}>
              {sending?'שולח...':'📋 שלח תבנית'}
            </button>
          </div>
        )}
        <div style={{padding:'14px 22px',borderTop:'1px solid #f1f5f9',display:'flex',gap:8,flexWrap:'wrap'}}>
          {waStatus==='ready' && (
            <button className="btn btn-primary" onClick={send} disabled={sending}
              style={{background:'#22c55e',borderColor:'#16a34a'}}>
              {sending ? '...' : useSchedule ? '⏰ תזמן' : '📲 שלח עכשיו'}
            </button>
          )}
          <button className="btn btn-secondary" onClick={openWaMe}>🌐 פתח WhatsApp Web</button>
          <button className="btn btn-secondary" onClick={onClose}>ביטול</button>
        </div>
      </div>
    </div>
  );
}

// ─── WA Conversations Inbox ────────────────────────────────────────────────────
function WaConversations({ contacts, waReady }) {
  const [msgs,      setMsgs]      = useState([]);
  const [loading,   setLoading]   = useState(true);
  const [selPhone,  setSelPhone]  = useState(null);
  const [replyText, setReplyText] = useState('');
  const [sending,   setSending]   = useState(false);
  const [search,    setSearch]    = useState('');
  const [linking,   setLinking]   = useState(null); // { phone, contactId }
  const threadRef = React.useRef(null);

  const load = React.useCallback(async () => {
    try {
      const d = await api.get('/api/wa/messages');
      setMsgs(Array.isArray(d) ? d : []);
    } catch(e) {}
    setLoading(false);
  }, []);

  React.useEffect(() => { load(); }, [load]);
  // Auto-refresh every 20s
  React.useEffect(() => {
    const id = setInterval(load, 20000);
    return () => clearInterval(id);
  }, [load]);
  // Scroll thread to bottom on selection change or new messages
  React.useEffect(() => {
    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [selPhone, msgs.length]);

  // Group messages into conversations by rawPhone
  const conversations = React.useMemo(() => {
    const byPhone = {};
    msgs.forEach(m => {
      const key = m.rawPhone || m.phone || '?';
      if (!byPhone[key]) byPhone[key] = { phone:key, displayPhone:m.phone||key, name:m.name||'', contactId:m.contactId||null, msgs:[] };
      if (m.name && !byPhone[key].name)           byPhone[key].name      = m.name;
      if (m.contactId && !byPhone[key].contactId) byPhone[key].contactId = m.contactId;
      byPhone[key].msgs.push(m);
    });
    return Object.values(byPhone).map(c => ({
      ...c,
      msgs: c.msgs.sort((a,b)=>a.timestamp-b.timestamp),
      lastMsg: c.msgs.reduce((l,m)=>m.timestamp>(l?.timestamp||0)?m:l, null),
      recvCount: c.msgs.filter(m=>m.direction==='received').length,
    })).sort((a,b)=>(b.lastMsg?.timestamp||0)-(a.lastMsg?.timestamp||0));
  }, [msgs]);

  const filtered = search
    ? conversations.filter(c=>(c.name||'').includes(search)||(c.displayPhone||'').includes(search))
    : conversations;

  const selConv   = conversations.find(c=>c.phone===selPhone);
  const selContact = selConv ? contacts.find(x=>x.id===selConv.contactId) : null;
  const selName    = selContact?.name || selConv?.name || selConv?.displayPhone || '';

  const sendReply = async () => {
    if (!replyText.trim() || !selConv) return;
    setSending(true);
    try {
      await api.post('/api/wa/send', {
        phone:     selConv.displayPhone || selConv.phone,
        message:   replyText.trim(),
        contactId: selConv.contactId || null,
        name:      selConv.name || '',
      });
      setReplyText('');
      await load();
    } catch(e) { alert('שגיאה בשליחה: ' + e.message); }
    setSending(false);
  };

  const [showTmpl,    setShowTmpl]    = useState(false);
  const [tmplParam1,  setTmplParam1]  = useState('');
  const [tmplParam2,  setTmplParam2]  = useState('');
  const [sendingTmpl, setSendingTmpl] = useState(false);

  const openTemplateModal = () => {
    if (!selConv) return;
    setTmplParam1(selName || '');
    setTmplParam2(selConv.displayPhone || selConv.phone || '');
    setShowTmpl(true);
  };

  const sendTemplate = async () => {
    if (!selConv) return;
    setSendingTmpl(true);
    try {
      await api.post('/api/wa/send-template', {
        phone:        selConv.displayPhone || selConv.phone,
        templateName: 'first_message_v2',
        langCode:     'he',
        params:       [],
        contactId:    selConv.contactId || null,
        name:         selConv.name || '',
      });
      setShowTmpl(false);
      await load();
    } catch(e) { alert('שגיאה בשליחת תבנית: ' + e.message); }
    setSendingTmpl(false);
  };

  const linkToContact = async (phone, contactId) => {
    await api.put('/api/wa/messages/link-all', { phone, contactId });
    await load();
    setLinking(null);
  };

  const fmtTime = ts => {
    const d = new Date(ts); const now = new Date();
    const diff = Math.floor((now-d)/86400000);
    if (diff===0) return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    if (diff<7)   return d.toLocaleDateString('he-IL',{weekday:'short'});
    return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
  };
  const fmtFull = ts => new Date(ts).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

  if (loading) return <div style={{padding:40,textAlign:'center',color:'#94a3b8'}}>⏳ טוען שיחות...</div>;

  return (
    <div style={{display:'flex',height:620,border:'1.5px solid #e2e8f0',borderRadius:12,overflow:'hidden',background:'#fff',boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>

      {/* ── Left panel: conversation list ── */}
      <div style={{width:270,borderLeft:'1.5px solid #e2e8f0',display:'flex',flexDirection:'column',flexShrink:0,background:'#fafafa'}}>
        <div style={{padding:'10px 12px',borderBottom:'1px solid #e2e8f0',background:'white'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <span style={{fontWeight:700,fontSize:13,color:'#2d4a7a'}}>💬 שיחות ({conversations.length})</span>
            <button className="btn btn-secondary btn-xs" onClick={load} title="רענן"><I n="sync" s={12}/></button>
          </div>
          <input className="inp" value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="🔍 חיפוש..." style={{margin:0,fontSize:12,padding:'6px 10px'}}/>
        </div>
        <div style={{flex:1,overflowY:'auto'}}>
          {filtered.length===0 && (
            <div style={{padding:30,textAlign:'center',color:'#94a3b8',fontSize:12}}>
              <div style={{fontSize:28,marginBottom:8}}>📭</div>
              {search?'לא נמצאו שיחות':'אין הודעות עדיין'}
            </div>
          )}
          {filtered.map(c=>{
            const ct = contacts.find(x=>x.id===c.contactId);
            const nm = ct?.name || c.name || c.displayPhone;
            const sel = selPhone===c.phone;
            return (
              <div key={c.phone} onClick={()=>setSelPhone(c.phone)}
                style={{padding:'10px 12px',borderBottom:'1px solid #f1f5f9',cursor:'pointer',
                  background:sel?'#eff6ff':'white',
                  borderRight:sel?'3px solid #4f46e5':'3px solid transparent',transition:'background 0.1s'}}>
                <div style={{display:'flex',gap:9,alignItems:'center'}}>
                  <div style={{width:36,height:36,borderRadius:'50%',background:ct?'#4f46e5':'#94a3b8',
                    display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontSize:14,fontWeight:700,flexShrink:0}}>
                    {(nm||'?')[0].toUpperCase()}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontWeight:600,fontSize:12,color:sel?'#1d4ed8':'#1e293b',
                        whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:140}}>
                        {nm}{!ct&&<span style={{fontSize:10,color:'#94a3b8',fontWeight:400}}> ·לא מזוהה</span>}
                      </span>
                      <span style={{fontSize:10,color:'#94a3b8',flexShrink:0,marginRight:4}}>{c.lastMsg&&fmtTime(c.lastMsg.timestamp)}</span>
                    </div>
                    <div style={{fontSize:11,color:'#64748b',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',marginTop:1}}>
                      {c.lastMsg?(c.lastMsg.direction==='sent'?'📤 ':'📩 ')+(c.lastMsg.message||'').slice(0,32):''}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ── Right panel: thread ── */}
      {!selConv ? (
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,color:'#94a3b8',background:'#f8fafc'}}>

              <div style={{width:36,height:36,borderRadius:'50%',background:selContact?'#4f46e5':'#94a3b8',

                <div style={{fontWeight:700,fontSize:14}}>{selName}</div>
                <div style={{fontSize:11,color:'#64748b',direction:'ltr'}}>{selConv.displayPhone}</div>

            </div>
            <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
              {!selConv.contactId && (
                linking?.phone===selConv.phone
                  ? <div style={{display:'flex',gap:6,alignItems:'center'}}>
                      <select className="inp" value={linking.contactId||''} onChange={e=>setLinking(p=>({...p,contactId:e.target.value}))}
                        style={{margin:0,minWidth:160,fontSize:12}}>
                        <option value="">— בחר איש קשר —</option>
                        {contacts.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','he')).map(c=>
                          <option key={c.id} value={c.id}>{c.name}</option>
                        )}

                      <button className="btn btn-primary btn-sm" disabled={!linking.contactId} onClick={()=>linkToContact(selConv.phone,linking.contactId)}>שייך</button>
                      <button className="btn btn-secondary btn-sm" onClick={()=>setLinking(null)}>✕</button>
                    </div>
                  : <button className="btn btn-secondary btn-sm" onClick={()=>setLinking({phone:selConv.phone,contactId:''})}>🔗 שייך לאיש קשר</button>
              )}
              {selContact && (
                <span style={{fontSize:11,background:'#f0fdf4',color:'#16a34a',padding:'3px 9px',borderRadius:8,fontWeight:600}}>✅ {selContact.name}</span>
              )}
            </div>
          </div>

          {/* Messages */}
          <div ref={threadRef} style={{flex:1,overflowY:'auto',padding:'16px',background:'#eef2f7',display:'flex',flexDirection:'column',gap:6}}>
            {selConv.msgs.map((m,idx) => {
              const sent = m.direction==='sent';
              // Date separator
              const showDate = idx===0 || new Date(m.timestamp).toDateString()!==new Date(selConv.msgs[idx-1].timestamp).toDateString();
              return (
                <React.Fragment key={m.id}>
                  {showDate && (
                    <div style={{textAlign:'center',margin:'8px 0 4px'}}>
                      <span style={{fontSize:11,background:'rgba(255,255,255,0.8)',color:'#64748b',padding:'2px 10px',borderRadius:10,fontWeight:600}}>
                        {new Date(m.timestamp).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'})}
                      </span>
                    </div>
                  )}
                  <div style={{display:'flex',justifyContent:sent?'flex-end':'flex-start'}}>
                    <div style={{maxWidth:'72%',background:sent?'#dcfce7':'#ffffff',
                      borderRadius:sent?'12px 2px 12px 12px':'2px 12px 12px 12px',
                      padding:'8px 12px',boxShadow:'0 1px 2px rgba(0,0,0,0.08)'}}>
                      <div style={{fontSize:13,color:'#1e293b',whiteSpace:'pre-wrap',lineHeight:1.55}}>{m.message}</div>
                      <div style={{fontSize:10,color:'#94a3b8',marginTop:3,textAlign:sent?'left':'right'}}>{fmtFull(m.timestamp)}</div>
                    </div>
                  </div>
                </React.Fragment>
              );
            })}
          </div>

          {/* Reply box */}
          <div style={{padding:'10px 14px',borderTop:'1px solid #e2e8f0',background:'white'}}>
            {/* Template modal */}
            {showTmpl && (
              <div style={{marginBottom:10,padding:12,background:'#f0fdf4',borderRadius:10,border:'1.5px solid #86efac'}}>
                <div style={{fontWeight:600,fontSize:13,color:'#15803d',marginBottom:8}}>📋 שלח תבנית: first_message_v2</div>
                <div style={{fontSize:12,color:'#64748b',marginBottom:8,lineHeight:1.6}}>
                  כאן ירון אנטניר — מספר סיפורים מהבמה ומהלב.<br/>
                  עברתי למספר WhatsApp חדש ורציתי להישאר בקשר.<br/>
                  🙏 כדי לאשר — פשוט ענה להודעה זו
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={sendTemplate} disabled={sendingTmpl}
                    style={{background:'#16a34a',color:'white',border:'none',borderRadius:8,padding:'6px 16px',
                      fontSize:13,fontWeight:600,cursor:'pointer',opacity:sendingTmpl||!tmplParam1.trim()?0.5:1}}>
                    {sendingTmpl?'שולח...':'✅ שלח תבנית'}
                  </button>
                  <button onClick={()=>setShowTmpl(false)}
                    style={{background:'#f1f5f9',color:'#64748b',border:'none',borderRadius:8,padding:'6px 14px',fontSize:13,cursor:'pointer'}}>
                    ביטול
                  </button>
                </div>
              </div>
            )}
            <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
              <textarea value={replyText} onChange={e=>setReplyText(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&replyText.trim())sendReply();}}
                placeholder={waReady?'כתוב הודעה... (Ctrl+Enter לשליחה)':'⚠️ WhatsApp לא מחובר'}
                rows={2} disabled={!waReady}
                style={{flex:1,padding:'8px 12px',borderRadius:10,border:'1.5px solid #e2e8f0',fontSize:13,
                  resize:'none',fontFamily:'inherit',lineHeight:1.5,outline:'none',
                  background:waReady?'white':'#f8fafc',color:waReady?'#1e293b':'#94a3b8'}}
              />
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                <button onClick={openTemplateModal} disabled={!waReady||!selConv} title="שלח תבנית first_message"
                  style={{background:'#f0fdf4',color:'#16a34a',border:'1.5px solid #86efac',borderRadius:10,
                    padding:'0 12px',fontSize:12,fontWeight:600,cursor:'pointer',height:19,flexShrink:0,whiteSpace:'nowrap',
                    opacity:!waReady||!selConv?0.4:1,transition:'opacity 0.15s'}}>
                  📋 תבנית
                </button>
                <button onClick={sendReply} disabled={sending||!replyText.trim()||!waReady}
                  style={{background:'#22c55e',color:'white',border:'none',borderRadius:10,
                    padding:'0 18px',fontSize:20,fontWeight:700,cursor:'pointer',height:22,flexShrink:0,
                    opacity:sending||!replyText.trim()||!waReady?0.5:1,transition:'opacity 0.15s'}}>
                  {sending?'⏳':'➤'}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Bot Flow Editor Modal ─────────────────────────────────────────────────────
function FlowEditorModal({ flow, allFlows, onSave, onClose }) {
  const isNew = !flow?.id;
  const [name,    setName]    = useState(flow?.name    || '');
  const [message, setMsg]     = useState(flow?.message || '');
  const [footer,  setFooter]  = useState(flow?.footer  || '');
  const [buttons, setButtons] = useState(flow?.buttons || []);
  const [saving,  setSaving]  = useState(false);

  const addBtn = () => setButtons(p => [...p, { text:'', nextFlowId:'', action:'' }]);
  const delBtn = i => setButtons(p => p.filter((_,idx)=>idx!==i));
  const updBtn = (i, k, v) => setButtons(p => p.map((b,idx)=>idx===i?{...b,[k]:v}:b));

  const save = async () => {
    if (!name.trim())    return alert('הזן שם לפלואו');
    if (!message.trim()) return alert('הזן הודעה');
    setSaving(true);
    const btn2 = buttons.filter(b=>b.text.trim());
    await onSave({ ...flow, name, message, footer, buttons: btn2 });
    setSaving(false);
    onClose();
  };

  return (
    <div className="overlay">
      <div className="modal" style={{maxWidth:580,padding:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <h3 style={{fontWeight:700,fontSize:17}}>{isNew?'➕ פלואו חדש':'✏️ עריכת פלואו'}</h3>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>✕</button>
        </div>

        <div className="lbl">שם הפלואו</div>
        <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder='למשל: "ברוך הבא"' style={{marginBottom:14}}/>

        <div className="lbl">הודעה</div>
        <textarea className="inp" rows={4} value={message} onChange={e=>setMsg(e.target.value)} placeholder="שלום! 👋 כאן ירון אנטניר..." style={{resize:'vertical',marginBottom:10}}/>

        <div className="lbl">כיתוב תחתי (footer — אופציונלי)</div>
        <input className="inp" value={footer} onChange={e=>setFooter(e.target.value)} placeholder="לחץ לבחירה" style={{marginBottom:18}}/>

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div className="lbl" style={{margin:0}}>כפתורים ({buttons.length}/9)</div>
          <button className="btn btn-secondary btn-sm" onClick={addBtn} disabled={buttons.length>=9}><I n="plus" s={13}/>הוסף כפתור</button>
        </div>

        {buttons.length===0 && <p style={{fontSize:13,color:'#94a3b8',marginBottom:14}}>ללא כפתורים — הודעה רגילה בלבד</p>}

        {buttons.map((btn, i) => (
          <div key={i} style={{border:'1.5px solid #e2e8f0',borderRadius:10,padding:12,marginBottom:10,background:'#fafafa'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <span style={{fontWeight:600,fontSize:13,color:'#4f46e5'}}>כפתור {i+1}</span>
              <button className="btn btn-danger btn-xs" style={{marginRight:'auto'}} onClick={()=>delBtn(i)}>הסר</button>
            </div>
            <div className="lbl">טקסט הכפתור</div>
            <input className="inp" value={btn.text} onChange={e=>updBtn(i,'text',e.target.value)} placeholder='למשל: "מידע על המופע"' style={{marginBottom:8}}/>
            <div className="lbl">פעולה</div>
            <select className="inp" value={btn.action||'nextFlow'} onChange={e=>updBtn(i,'action',e.target.value==='nextFlow'?'':e.target.value)} style={{marginBottom:8}}>
              <option value="nextFlow">➡️ פתח פלואו</option>
              <option value="reply">💬 שלח הודעת טקסט</option>
              <option value="link">🔗 שלח לינק (לחיץ)</option>
              <option value="phone">📞 שלח מספר טלפון (לחיץ)</option>
              <option value="collect-lead">📋 אסוף פרטי ליד</option>
            </select>

            {/* ➡️ next flow */}
            {(btn.action===''||btn.action==='nextFlow'||!btn.action) && (
              <><div className="lbl">פלואו להמשך (ריק = סיום)</div>
              <select className="inp" value={btn.nextFlowId||''} onChange={e=>updBtn(i,'nextFlowId',e.target.value)}>
                <option value="">— סיום שיחה —</option>
                {allFlows.filter(f=>f.id!==flow?.id).map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
              </select></>
            )}

            {/* 💬 reply text */}
            {btn.action==='reply' && (
              <><div className="lbl">הודעת התשובה</div>
              <textarea className="inp" rows={3} value={btn.replyText||''} onChange={e=>updBtn(i,'replyText',e.target.value)}
                placeholder={'לדוגמה:\n📞 הטלפון שלי: 054-1234567\n🌐 האתר שלי: https://shakufbahazit.co.il'}
                style={{resize:'vertical',marginBottom:8}}/>
              <div className="lbl">פלואו להמשך אחרי ההודעה (ריק = אין)</div>
              <select className="inp" value={btn.nextFlowId||''} onChange={e=>updBtn(i,'nextFlowId',e.target.value)}>
                <option value="">— ללא המשך —</option>
                {allFlows.filter(f=>f.id!==flow?.id).map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
              </select></>
            )}

            {/* 🔗 link */}
            {btn.action==='link' && (
              <><div className="lbl">כותרת (אופציונלי)</div>
              <input className="inp" value={btn.linkTitle||''} onChange={e=>updBtn(i,'linkTitle',e.target.value)}
                placeholder='לדוגמה: לחץ כאן לדף ההרשמה' style={{marginBottom:8}}/>
              <div className="lbl">כתובת הלינק (URL)</div>
              <input className="inp" value={btn.linkUrl||''} onChange={e=>updBtn(i,'linkUrl',e.target.value)}
                placeholder='https://shakufbahazit.co.il' style={{marginBottom:8}}/>
              <div className="lbl">פלואו להמשך אחרי הלינק (ריק = אין)</div>
              <select className="inp" value={btn.nextFlowId||''} onChange={e=>updBtn(i,'nextFlowId',e.target.value)}>
                <option value="">— ללא המשך —</option>
                {allFlows.filter(f=>f.id!==flow?.id).map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
              </select></>
            )}

            {/* 📞 phone */}
            {btn.action==='phone' && (
              <><div className="lbl">כותרת (אופציונלי)</div>
              <input className="inp" value={btn.phoneTitle||''} onChange={e=>updBtn(i,'phoneTitle',e.target.value)}
                placeholder='לדוגמה: להתקשרות ישירה' style={{marginBottom:8}}/>
              <div className="lbl">מספר הטלפון</div>
              <input className="inp" value={btn.phoneNumber||''} onChange={e=>updBtn(i,'phoneNumber',e.target.value)}
                placeholder='054-1234567' style={{marginBottom:8}}/>
              <div className="lbl">פלואו להמשך (ריק = אין)</div>
              <select className="inp" value={btn.nextFlowId||''} onChange={e=>updBtn(i,'nextFlowId',e.target.value)}>
                <option value="">— ללא המשך —</option>
                {allFlows.filter(f=>f.id!==flow?.id).map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
              </select></>
            )}

            {/* 📋 collect lead */}
            {btn.action==='collect-lead' && (
              <><div className="lbl">פלואו לאחר איסוף (ריק = אין)</div>
              <select className="inp" value={btn.nextFlowId||''} onChange={e=>updBtn(i,'nextFlowId',e.target.value)}>
                <option value="">— אין המשך —</option>
                {allFlows.filter(f=>f.id!==flow?.id).map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
              </select></>
            )}
          </div>
        ))}

        {buttons.length>3 && (
          <div style={{background:'#fffbeb',border:'1px solid #fef08a',borderRadius:8,padding:'8px 12px',fontSize:12,color:'#92400e',marginBottom:12}}>
            ⚠️ יותר מ-3 כפתורים יישלחו כ"רשימה" (list menu) ולא ככפתורים. מומלץ עד 3 כפתורים.
          </div>
        )}

        <div style={{display:'flex',gap:10,marginTop:4}}>
          <button className="btn btn-primary" onClick={save} disabled={saving} style={{flex:1,justifyContent:'center'}}>
            {saving?'שומר...':'💾 שמור פלואו'}
          </button>
          <button className="btn btn-secondary" onClick={onClose}>ביטול</button>
        </div>
      </div>
    </div>
  );
}

// ─── Bot Tab (flow list + trigger + settings) ─────────────────────────────────
function BotTab({ waStatus, data, toast }) {
  const [flows,       setFlows]       = useState([]);
  const [editFlow,    setEditFlow]    = useState(null);   // null | flow obj
  const [newFlow,     setNewFlow]     = useState(false);
  const [trigPhone,   setTrigPhone]   = useState('');
  const [trigFlowId,  setTrigFlowId]  = useState('');
  const [triggering,  setTriggering]  = useState(false);
  const [settings,    setSettings]    = useState({});
  const [savingSet,   setSavingSet]   = useState(false);
  const [webhookUrl]  = useState(() => window.location.origin + '/api/webhook/elementor');

  const load = () => api.get('/api/bot/flows').then(setFlows).catch(()=>{});
  useEffect(() => {
    load();
    api.get('/api/bot/settings').then(setSettings).catch(()=>{});
  }, []);

  const saveFlow = async (fd) => {
    if (fd.id) {
      const updated = await api.put('/api/bot/flows/'+fd.id, fd);
      setFlows(p=>p.map(f=>f.id===fd.id?updated:f));
      toast('✅ הפלואו עודכן');
    } else {
      const created = await api.post('/api/bot/flows', fd);
      setFlows(p=>[created,...p]);
      toast('✅ פלואו נוצר');
    }
  };

  const delFlow = async (id) => {
    if (!confirm('למחוק פלואו זה?')) return;
    await api.del('/api/bot/flows/'+id);
    setFlows(p=>p.filter(f=>f.id!==id));
    toast('🗑️ נמחק');
  };

  const trigger = async () => {
    if (!trigPhone.trim()) { toast('⚠️ הזן מספר טלפון',true); return; }
    if (!trigFlowId)        { toast('⚠️ בחר פלואו',true); return; }
    if (waStatus!=='ready') { toast('⚠️ WhatsApp לא מחובר',true); return; }
    setTriggering(true);
    try {
      await api.post('/api/bot/trigger', { phone: trigPhone, flowId: trigFlowId });
      toast('✅ הפלואו נשלח!');
      setTrigPhone('');
    } catch(e) { toast('שגיאה: '+e.message, true); }
    setTriggering(false);
  };

  const saveSettings = async () => {
    setSavingSet(true);
    try { await api.put('/api/bot/settings', settings); toast('✅ הגדרות נשמרו'); }
    catch(e) { toast('שגיאה: '+e.message, true); }
    setSavingSet(false);
  };

  const copyWebhook = () => { navigator.clipboard.writeText(webhookUrl); toast('✅ הכתובת הועתקה!'); };

  return (
    <div>
      {/* Flow List */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <h3 style={{fontWeight:700,fontSize:16}}>🤖 פלואוים ({flows.length})</h3>
        <button className="btn btn-primary btn-sm" onClick={()=>setNewFlow(true)}><I n="plus" s={14} c="#fff"/>פלואו חדש</button>
      </div>

      {flows.length===0 && <div className="card" style={{padding:24,textAlign:'center',color:'#94a3b8',marginBottom:20}}>אין פלואוים עדיין. צור את הפלואו הראשון שלך!</div>}

      <div style={{marginBottom:20}}>
        {flows.map(f=>(
          <div key={f.id} className="card" style={{padding:14,marginBottom:10,display:'flex',gap:12,alignItems:'flex-start'}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{f.name}</div>
              <div style={{fontSize:13,color:'#475569',marginBottom:6,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:340}}>{f.message}</div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {(f.buttons||[]).map((b,i)=>(
                  <span key={i} style={{fontSize:11,background:'#e0e7ff',color:'#3730a3',borderRadius:6,padding:'2px 8px',fontWeight:500}}>
                    {b.text || '(ריק)'}
                    {b.action==='collect-lead'?' 📋':''}
                  </span>
                ))}
                {(!f.buttons||f.buttons.length===0) && <span style={{fontSize:11,color:'#94a3b8'}}>ללא כפתורים</span>}
              </div>
            </div>
            <div style={{display:'flex',gap:6,flexShrink:0}}>
              <button className="btn btn-secondary btn-xs" onClick={()=>setEditFlow(f)}>✏️ עריכה</button>
              <button className="btn btn-danger btn-xs" onClick={()=>delFlow(f.id)}>🗑️</button>
            </div>
          </div>
        ))}
      </div>

      {/* Trigger */}
      <div className="card" style={{padding:18,marginBottom:20}}>
        <h3 style={{fontWeight:700,fontSize:15,marginBottom:12}}>📤 שלח פלואו למספר</h3>
        <p style={{fontSize:13,color:'#64748b',marginBottom:12}}>שלח הודעת פתיחה עם כפתורים לכל מספר טלפון.</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
          <div>
            <div className="lbl">מספר טלפון</div>
            <input className="inp" value={trigPhone} onChange={e=>setTrigPhone(e.target.value)} onBlur={e=>setTrigPhone(normalizePhone(e.target.value))} placeholder="052-1234567" dir="ltr"/>
          </div>
          <div>
            <div className="lbl">פלואו</div>
            <select className="inp" value={trigFlowId} onChange={e=>setTrigFlowId(e.target.value)}>
              <option value="">— בחר פלואו —</option>
              {flows.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
            </select>
          </div>
        </div>
        <button className="btn btn-primary" onClick={trigger} disabled={triggering||waStatus!=='ready'}
          style={{background:'#7c3aed',width:'100%',justifyContent:'center'}}>
          {triggering?'שולח...':'🤖 שלח פלואו'}
        </button>
        {waStatus!=='ready' && <p style={{fontSize:12,color:'#dc2626',marginTop:6}}>⚠️ WhatsApp לא מחובר</p>}
      </div>

      {/* Elementor Webhook */}
      <div className="card" style={{padding:18,marginBottom:20}}>
        <h3 style={{fontWeight:700,fontSize:15,marginBottom:4}}>🔗 Elementor Webhook</h3>
        <p style={{fontSize:13,color:'#64748b',marginBottom:12}}>הגדר כתובת זו בטופס Elementor → "פעולות לאחר שליחה" → "Webhook". אנשי קשר שיגישו טופס יצורו אוטומטית ב-CRM וישלח להם פלואו.</p>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:14}}>
          <input className="inp" value={webhookUrl} readOnly dir="ltr" style={{flex:1,fontSize:12,color:'#1d4ed8',background:'#eff6ff'}}/>
          <button className="btn btn-secondary btn-sm" onClick={copyWebhook}>העתק</button>
        </div>

        <div className="lbl">פלואו ברירת מחדל לאחר הגשת טופס</div>
        <select className="inp" value={settings.elementorFlowId||''} onChange={e=>setSettings(s=>({...s,elementorFlowId:e.target.value}))} style={{marginBottom:10}}>
          <option value="">— אל תשלח פלואו —</option>
          {flows.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
        </select>
        <p style={{fontSize:12,color:'#64748b',marginBottom:10}}>
          שדות שה-Webhook מצפה לקבל: <code style={{background:'#f1f5f9',padding:'1px 5px',borderRadius:3}}>name</code>, <code style={{background:'#f1f5f9',padding:'1px 5px',borderRadius:3}}>phone</code>, <code style={{background:'#f1f5f9',padding:'1px 5px',borderRadius:3}}>email</code>, <code style={{background:'#f1f5f9',padding:'1px 5px',borderRadius:3}}>flowId</code> (אופציונלי לעקוף ברירת מחדל)
        </p>
        <button className="btn btn-primary btn-sm" onClick={saveSettings} disabled={savingSet}>
          {savingSet?'שומר...':'💾 שמור הגדרות'}
        </button>
      </div>

      {/* Modals */}
      {newFlow && <FlowEditorModal flow={{}} allFlows={flows} onSave={saveFlow} onClose={()=>setNewFlow(false)}/>}
      {editFlow && <FlowEditorModal flow={editFlow} allFlows={flows} onSave={saveFlow} onClose={()=>setEditFlow(null)}/>}
    </div>
  );
}

// ─── WhatsApp Broadcast + Scheduled + Quick Send ──────────────────────────────
function WaBroadcast({ data, wa, onConnectWa, onDisconnectWa, onResetWa, toast }) {
  const ctx = useContext(ListsCtx);
  const allSt = ctx ? ctx.allStatus() : STATUS;

  const [tab,          setTab]         = useState('broadcast');
  const [statusFilter, setStatusFilter] = useState([]);
  const [withPhone,    setWithPhone]    = useState(true);
  const [message,      setMessage]      = useState('');
  const [delayMs,      setDelayMs]      = useState(7);
  const [scheduleAt,   setScheduleAt]   = useState('');
  const [useSchedule,  setUseSchedule]  = useState(false);
  const [sending,      setSending]      = useState(false);
  const [progress,     setProgress]     = useState(null);
  const [quickPhone,   setQuickPhone]   = useState('');
  const [quickMsg,     setQuickMsg]     = useState('');
  const [quickSending, setQuickSending] = useState(false);
  const [quickSent,    setQuickSent]    = useState('');
  const [scheduled,    setScheduled]    = useState(wa.scheduled||[]);
  // WA Inbox (unknown contacts)
  const [inbox,        setInbox]        = useState([]);
  const [inboxLoading, setInboxLoading] = useState(false);

  useEffect(() => { setScheduled(wa.scheduled||[]); }, [wa.scheduled]);

  const loadInbox = () => {
    setInboxLoading(true);
    api.get('/api/wa/inbox').then(d=>setInbox(d)).catch(()=>{}).finally(()=>setInboxLoading(false));
  };
  useEffect(() => { if (tab==='inbox') loadInbox(); }, [tab]);

  const nowLocal = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);

  const contacts = data.contacts.filter(c => {
    if (withPhone && !c.phone) return false;
    if (statusFilter.length > 0 && !statusFilter.includes(c.status)) return false;
    return true;
  });

  useEffect(() => {
    if (!sending) return;
    const id = setInterval(async () => {
      try {
        const s = await api.get('/api/wa/status');
        if (s.broadcast) { setProgress(s.broadcast); if (s.broadcast.done) { setSending(false); clearInterval(id); } }
      } catch {}
    }, 2000);
    return () => clearInterval(id);
  }, [sending]);

  const toggleStatus = s => setStatusFilter(p=>p.includes(s)?p.filter(x=>x!==s):[...p,s]);

  const startBroadcast = async () => {
    if (!message.trim()) { toast('⚠️ הזן הודעה', true); return; }
    const withPhone2 = contacts.filter(c=>c.phone);
    if (!withPhone2.length) { toast('⚠️ אין אנשי קשר עם טלפון', true); return; }
    if (!useSchedule && wa.status!=='ready') { toast('⚠️ WhatsApp לא מחובר', true); return; }
    const body = { contacts:withPhone2.map(c=>({name:c.name,phone:c.phone})), message, delayMs:delayMs*1000 };
    if (useSchedule && scheduleAt) body.scheduleAt = new Date(scheduleAt).toISOString();
    setSending(!useSchedule);
    setProgress(useSchedule?null:{total:body.contacts.length,sent:0,failed:0,done:false,errors:[]});
    try {
      await api.post('/api/wa/broadcast', body);
      if (useSchedule) { toast('✅ ברודקאסט תוזמן!'); const s=await api.get('/api/wa/status'); setScheduled(s.scheduled||[]); setSending(false); }
    } catch(e) { toast('שגיאה: '+e.message, true); setSending(false); }
  };

  const sendQuick = async () => {
    if (!quickPhone.trim()) { toast('⚠️ הזן מספר טלפון', true); return; }
    if (!quickMsg.trim())   { toast('⚠️ הזן הודעה', true); return; }
    if (wa.status!=='ready') { toast('⚠️ WhatsApp לא מחובר', true); return; }
    setQuickSending(true); setQuickSent('');
    try {
      await api.post('/api/wa/send', { phone:quickPhone, message:quickMsg });
      setQuickSent('✅ נשלח!'); setQuickPhone(''); setQuickMsg('');
    } catch(e) { setQuickSent('❌ '+e.message); }
    setQuickSending(false);
  };

  const deleteScheduled = async id => {
    await api.del('/api/wa/scheduled/'+id);
    setScheduled(p=>p.filter(x=>x.id!==id));
  };

  const pct = progress ? Math.round((progress.sent+progress.failed)/progress.total*100) : 0;
  const WA_ST = { disconnected:{l:'⭕ לא מחובר',c:'#dc2626'}, qr:{l:'📱 ממתין לסריקה',c:'#92400e'}, connecting:{l:'🔄 מתחבר...',c:'#1d4ed8'}, ready:{l:'✅ מחובר',c:'#166534'} };
  const waSt = WA_ST[wa.status] || WA_ST.disconnected;

  return (
    <div>
      <h1 style={{fontSize:24,fontWeight:700,marginBottom:20}}>📲 וואטסאפ</h1>

      {/* Connection */}
      {wa.cloudApi ? (
        /* ── Cloud API mode ── */
        <div className="card" style={{padding:20,marginBottom:20,borderRight:'4px solid #16a34a',background:'linear-gradient(135deg,#f0fdf4,#dcfce7)'}}>
          <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
            <div style={{fontSize:36}}>☁️</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,color:'#16a34a',fontSize:17}}>✅ מחובר דרך WhatsApp Cloud API</div>
              <div style={{fontSize:13,color:'#166534',marginTop:3}}>שליחת הודעות פעילה — Meta Business API רשמי</div>
              {wa.phoneNumberId && (
                <div style={{fontSize:12,color:'#15803d',marginTop:4,fontFamily:'monospace',background:'rgba(0,0,0,.06)',display:'inline-block',padding:'2px 8px',borderRadius:5}}>
                  Phone Number ID: {wa.phoneNumberId}
                </div>
              )}
            </div>
            <div style={{fontSize:11,color:'#166534',background:'#bbf7d0',borderRadius:8,padding:'6px 12px',textAlign:'center',lineHeight:1.5}}>
              🔒 טוקן קבוע<br/>ללא סריקת QR
            </div>
          </div>
        </div>
      ) : (
        /* ── Legacy / disconnected mode ── */
        <div className="card" style={{padding:20,marginBottom:20,borderRight:'4px solid '+waSt.c}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
            <div>
              <div style={{fontWeight:700,color:waSt.c,fontSize:16}}>{waSt.l}</div>
              <div style={{fontSize:13,color:'#64748b',marginTop:3}}>
                {wa.status==='ready'    && 'מחובר — ניתן לשלוח הודעות'}
                {wa.status==='connecting'&&'מאתחל חיבור, יכול לקחת עד 30 שניות...'}
                {wa.status==='qr'       && 'סרוק את הQR עם הטלפון שלך'}
                {wa.status==='disconnected'&&'חבר WhatsApp כדי לשלוח הודעות מה-CRM'}
              </div>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {wa.status==='disconnected' && (
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  <button className="btn btn-primary" onClick={onConnectWa} style={{background:'#22c55e',border:'none',fontSize:15,padding:'10px 20px'}}>
                    📱 חבר WhatsApp
                  </button>
                  <button className="btn btn-secondary btn-sm" onClick={onResetWa}>
                    🔄 אפס וחבר מחדש
                  </button>
                </div>
              )}
              {wa.lastError && wa.status==='disconnected' && (
                <div style={{marginTop:10,fontSize:13,color:'#dc2626',background:'#fef2f2',borderRadius:8,padding:'8px 12px'}}>
                  ⚠️ {wa.lastError}
                </div>
              )}
              {(wa.status==='connecting'||wa.status==='qr') && (
                <button className="btn btn-secondary btn-sm" onClick={onDisconnectWa}>ביטול</button>
              )}
              {wa.status==='ready' && (
                <button className="btn btn-secondary btn-sm" onClick={onDisconnectWa}>התנתק</button>
              )}
            </div>
          </div>

          {/* QR Code — prominent display */}
          {(wa.status==='qr' || wa.status==='connecting') && (
            <div style={{marginTop:20,padding:20,background:'#fffbeb',borderRadius:12,border:'2px solid #fef08a',textAlign:'center'}}>
              {wa.status==='connecting' && (
                <div>
                  <div style={{fontSize:28,marginBottom:8}}>⏳</div>
                  <div style={{fontWeight:600,color:'#92400e',fontSize:14}}>מאתחל WhatsApp...</div>
                  <div style={{fontSize:13,color:'#78350f',marginTop:4}}>אנא המתן, זה לוקח כמה שניות</div>
                </div>
              )}
              {wa.status==='qr' && !wa.qr && (
                <div>
                  <div style={{fontSize:28,marginBottom:8}}>🔄</div>
                  <div style={{fontWeight:600,color:'#92400e',fontSize:14}}>מייצר קוד QR...</div>
                </div>
              )}
              {wa.status==='qr' && wa.qr && (
                <div>
                  <div style={{fontWeight:700,color:'#1a1a1a',fontSize:15,marginBottom:12}}>
                    📱 סרוק עם WhatsApp
                  </div>
                  <img src={wa.qr} alt="QR Code" style={{width:240,height:240,border:'4px solid #4f46e5',borderRadius:12,display:'block',margin:'0 auto 12px'}}/>
                  <div style={{fontSize:12,color:'#78350f',lineHeight:1.6}}>
                    פתח WhatsApp → לחץ על ⋮ (תפריט) → <strong>מכשירים מקושרים</strong> → <strong>קשר מכשיר</strong> → סרוק
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* Tabs */}
      <div style={{display:'flex',marginBottom:20,border:'1.5px solid #e2e8f0',borderRadius:10,overflow:'hidden'}}>
        {[['broadcast','📢 שליחה קבוצתית'],['quick','⚡ שלח לכל מספר'],['scheduled','⏰ מתוזמנות ('+scheduled.filter(x=>x.status==='pending').length+')'],['inbox','📥 תיבת דואר'],['bot','🤖 בוט']].map(function(item){
          const v=item[0],l=item[1];
          return React.createElement('button',{key:v,onClick:()=>setTab(v),style:{flex:1,padding:'10px 8px',border:'none',cursor:'pointer',fontSize:13,fontWeight:tab===v?700:400,background:tab===v?(v==='bot'?'#7c3aed':'#4f46e5'):'#fff',color:tab===v?'#fff':'#475569'}},l);
        })}
      </div>

      {tab==='quick' && (
        <div className="card" style={{padding:20}}>
          <h3 style={{fontWeight:700,fontSize:15,marginBottom:4}}>⚡ שלח הודעה לכל מספר</h3>
          <p style={{fontSize:13,color:'#64748b',marginBottom:16}}>ניתן לשלוח גם למי שאינו באנשי קשר</p>
          <div className="lbl">מספר טלפון</div>
          <input className="inp" value={quickPhone} onChange={e=>setQuickPhone(e.target.value)} onBlur={e=>setQuickPhone(normalizePhone(e.target.value))} placeholder="052-1234567" dir="ltr" style={{marginBottom:12}}/>
          <div className="lbl">הודעה</div>
          <textarea className="inp" rows={5} value={quickMsg} onChange={e=>setQuickMsg(e.target.value)} placeholder="כתוב הודעה..." style={{resize:'vertical',marginBottom:12}}/>
          {quickSent && <p style={{fontSize:13,color:quickSent.startsWith('✅')?'#16a34a':'#dc2626',marginBottom:8}}>{quickSent}</p>}
          <button className="btn btn-primary" onClick={sendQuick} disabled={quickSending||wa.status!=='ready'} style={{background:'#22c55e',borderColor:'#16a34a'}}>
            {quickSending?'שולח...':'📲 שלח עכשיו'}
          </button>
          {wa.status!=='ready' && <p style={{fontSize:12,color:'#f59e0b',marginTop:8}}>{wa.cloudApi?'בעיה בחיבור ל-Cloud API':'יש לחבר WhatsApp תחילה'}</p>}
        </div>
      )}

      {tab==='scheduled' && (
        <div className="card" style={{padding:20}}>
          <h3 style={{fontWeight:700,fontSize:15,marginBottom:16}}>⏰ הודעות מתוזמנות</h3>
          {!scheduled.length ? <p style={{color:'#94a3b8',fontSize:14}}>אין הודעות מתוזמנות</p> : scheduled.map(item=>(
            <div key={item.id} style={{borderBottom:'1px solid #f1f5f9',padding:'12px 0',display:'flex',gap:12,alignItems:'flex-start'}}>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                  <span style={{fontWeight:600,fontSize:13}}>{item.type==='single'?'📱 '+item.phone:'📢 ברודקאסט ('+(item.contacts&&item.contacts.length)+' נמענים)'}</span>
                  <span style={{fontSize:11,padding:'1px 7px',borderRadius:10,fontWeight:600,background:item.status==='pending'?'#eff6ff':item.status==='sent'?'#f0fdf4':'#fef2f2',color:item.status==='pending'?'#1d4ed8':item.status==='sent'?'#16a34a':'#dc2626'}}>
                    {item.status==='pending'?'ממתין':item.status==='sent'?'נשלח':'נכשל'}
                  </span>
                </div>
                <div style={{fontSize:12,color:'#64748b'}}>⏰ {new Date(item.scheduleAt).toLocaleString('he-IL')}</div>
                <div style={{fontSize:12,color:'#94a3b8',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:300}}>{item.message}</div>
              </div>
              {item.status==='pending' && <button className="btn btn-danger btn-xs" onClick={()=>deleteScheduled(item.id)} title="בטל"><I n="trash" s={12}/></button>}
            </div>
          ))}
        </div>
      )}

      {tab==='inbox' && (
        <WaConversations contacts={data.contacts} waReady={wa.status==='ready'}/>
      )}

      {tab==='broadcast' && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
          <div className="card" style={{padding:18}}>
            <h3 style={{fontWeight:700,fontSize:15,marginBottom:14}}>🎯 סינון נמענים</h3>
            <div className="lbl" style={{marginBottom:8}}>סטטוס (ריק = הכל):</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
              {Object.entries(allSt).map(([k,v])=>(
                <button key={k} onClick={()=>toggleStatus(k)} className="btn btn-sm"
                  style={{background:statusFilter.includes(k)?v.bg:'#f1f5f9',color:statusFilter.includes(k)?v.cl:'#475569',border:statusFilter.includes(k)?'1.5px solid '+v.cl:'1.5px solid transparent',fontWeight:statusFilter.includes(k)?700:400}}>
                  {v.lbl}
                </button>
              ))}
            </div>
            <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:14,marginBottom:14}}>
              <input type="checkbox" checked={withPhone} onChange={e=>setWithPhone(e.target.checked)} style={{width:16,height:16}}/>
              רק אנשי קשר עם טלפון
            </label>
            <div style={{background:'#f8fafc',borderRadius:8,padding:'10px 14px'}}>
              <div style={{fontWeight:700,fontSize:13}}>נמענים: {contacts.filter(c=>c.phone).length}</div>
              <div style={{maxHeight:160,overflowY:'auto',marginTop:8}}>
                {contacts.filter(c=>c.phone).slice(0,50).map(c=>(
                  <div key={c.id} style={{display:'flex',gap:6,padding:'3px 0',fontSize:12,borderBottom:'1px solid #f1f5f9'}}>
                    <span style={{flex:1,fontWeight:500}}>{c.name}</span>
                    <span style={{color:'#16a34a',direction:'ltr'}}>{c.phone}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div>
            <div className="card" style={{padding:18,marginBottom:14}}>
              <h3 style={{fontWeight:700,fontSize:15,marginBottom:10}}>✍️ הודעה</h3>
              <div style={{fontSize:12,color:'#64748b',marginBottom:6}}>
                <code style={{background:'#f1f5f9',padding:'1px 5px',borderRadius:4}}>{'{{name}}'}</code> יוחלף בשם
              </div>
              <textarea className="inp" rows={5} value={message} onChange={e=>setMessage(e.target.value)} placeholder={'שלום {{name}},\n\nרציתי להזמין אותך ל...'} style={{resize:'vertical',marginBottom:10}}/>
              {message && contacts.find(c=>c.phone) && (
                <div style={{background:'#f0fdf4',borderRadius:8,padding:'8px 12px',fontSize:12,color:'#166534'}}>
                  <div style={{fontWeight:600,fontSize:11,color:'#94a3b8',marginBottom:3}}>תצוגה מקדימה:</div>
                  {message.replace(/\{\{name\}\}/g, (contacts.find(c=>c.phone)||{}).name||'')}
                </div>
              )}
            </div>

            <div className="card" style={{padding:18,marginBottom:14}}>
              <h3 style={{fontWeight:700,fontSize:15,marginBottom:12}}>⚙️ הגדרות שליחה</h3>
              <label style={{fontSize:13,display:'flex',flexDirection:'column',gap:4,marginBottom:14}}>
                <span>השהייה: <strong>{delayMs} שניות</strong> בין הודעות</span>
                <input type="range" min={5} max={20} value={delayMs} onChange={e=>setDelayMs(+e.target.value)}/>
                <span style={{fontSize:11,color:'#94a3b8'}}>5 שניות = מהיר · 20 שניות = בטוח יותר</span>
              </label>
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13,marginBottom:useSchedule?10:0}}>
                <input type="checkbox" checked={useSchedule} onChange={e=>setUseSchedule(e.target.checked)} style={{width:15,height:15}}/>
                ⏰ תזמן שליחה לזמן מסוים
              </label>
              {useSchedule && <input type="datetime-local" className="inp" min={nowLocal} value={scheduleAt} onChange={e=>setScheduleAt(e.target.value)}/>}
            </div>

            {progress && !useSchedule && (
              <div className="card" style={{padding:14,marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>{progress.done?'✅ הסתיים':'📤 שולח '+pct+'%'}</div>
                <div style={{background:'#e2e8f0',borderRadius:99,height:7,overflow:'hidden',marginBottom:6}}>
                  <div style={{width:pct+'%',height:'100%',background:'#22c55e',transition:'width .4s'}}/>
                </div>
                <div style={{display:'flex',gap:12,fontSize:12}}>
                  <span style={{color:'#16a34a'}}>✅ {progress.sent}</span>
                  <span style={{color:'#dc2626'}}>❌ {progress.failed}</span>
                  <span style={{color:'#64748b'}}>/ {progress.total}</span>
                </div>
              </div>
            )}

            <button className="btn btn-primary" onClick={startBroadcast}
              disabled={sending||(!useSchedule&&wa.status!=='ready')||!contacts.filter(c=>c.phone).length}
              style={{width:'100%',justifyContent:'center',padding:'12px',fontSize:14,background:'#22c55e',borderColor:'#16a34a'}}>
              {sending?'📤 שולח ('+(progress&&progress.sent||0)+'/'+(progress&&progress.total||0)+')...':useSchedule?'⏰ תזמן ל-'+contacts.filter(c=>c.phone).length+' נמענים':'📲 שלח עכשיו ל-'+contacts.filter(c=>c.phone).length+' נמענים'}
            </button>
          </div>
        </div>
      )}

      {tab==='bot' && (
        <BotTab waStatus={wa.status} data={data} toast={toast}/>
      )}
    </div>
  );
}
// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
