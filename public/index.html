<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM | שקוף בחזית</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;direction:rtl;color:#1e293b}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
input,textarea,select,button{font-family:inherit;direction:rtl}
button{cursor:pointer}
a{text-decoration:none}
.sidebar{width:232px;min-height:100vh;background:linear-gradient(160deg,#1e1b4b,#312e81);position:fixed;right:0;top:0;bottom:0;z-index:200;display:flex;flex-direction:column;box-shadow:-2px 0 12px rgba(0,0,0,.25);transition:transform .25s ease}
.main{margin-right:232px;min-height:100vh;padding:28px}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199}
.mobile-topbar{display:none;position:fixed;top:0;right:0;left:0;height:52px;background:linear-gradient(160deg,#1e1b4b,#312e81);z-index:198;align-items:center;padding:0 14px;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hamburger-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;display:flex;align-items:center}
@media(max-width:900px){
  .sidebar{transform:translateX(110%)}
  .sidebar.sidebar-open{transform:translateX(0)}
  .sidebar-backdrop.sidebar-open{display:block}
  .main{margin-right:0;padding:70px 16px 24px}
  .mobile-topbar{display:flex}
}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn{padding:8px 18px;border-radius:8px;border:none;font-size:14px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#4f46e5;color:#fff}.btn-primary:hover{background:#4338ca}
.btn-secondary{background:#e2e8f0;color:#475569}.btn-secondary:hover{background:#cbd5e1}
.btn-danger{background:#fee2e2;color:#dc2626}.btn-danger:hover{background:#fecaca}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-xs{padding:3px 8px;font-size:12px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.inp{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;color:#1e293b;outline:none;transition:border-color .15s}
.inp:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
select.inp{appearance:none;background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:left 10px center;background-size:16px;padding-left:32px}
.lbl{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:5px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.tab-btn{padding:9px 18px;border:none;background:none;font-size:14px;font-weight:500;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab-btn.on{color:#4f46e5;border-bottom-color:#4f46e5}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;border-radius:8px;margin:2px 8px;font-size:14px;font-weight:500;color:rgba(255,255,255,.72);transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.on{background:rgba(255,255,255,.16);color:#fff}
.row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .12s}
.row:hover{background:#f8fafc}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.conv-line{border-right:3px solid #e2e8f0;padding:10px 14px;margin-bottom:8px;border-radius:0 8px 8px 0;background:#f8fafc}
.show-line{border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 16px;margin-bottom:8px;background:#f8fafc}
.task-line{border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 16px;margin-bottom:8px;background:#f8fafc;display:flex;align-items:flex-start;gap:10px}
.toast{position:fixed;bottom:24px;left:24px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:500;animation:slideUp .25s;box-shadow:0 4px 16px rgba(0,0,0,.3)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;background:#e0e7ff;color:#3730a3}
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo, createContext, useContext } = React;

// ─── Config ───────────────────────────────────────────────────────────────────
const STATUS = {
  lead:           { lbl:'ליד',          bg:'#dbeafe', cl:'#1d4ed8' },
  warm:           { lbl:'חם',           bg:'#ffedd5', cl:'#c2410c' },
  booked:         { lbl:'הוזמן',        bg:'#dcfce7', cl:'#166534' },
  completed:      { lbl:'הושלם',        bg:'#f1f5f9', cl:'#475569' },
  vip:            { lbl:'VIP',          bg:'#f3e8ff', cl:'#7e22ce' },
  'not-interested':{ lbl:'לא מעוניין', bg:'#fee2e2', cl:'#991b1b' },
};
const CONV_T  = { call:'שיחת טלפון', email:'אימייל', meeting:'פגישה', whatsapp:'וואטסאפ', other:'אחר' };
const SHOW_ST = { inquiry:'פנייה', proposal:'הצעה נשלחה', scheduled:'מתוכנן', completed:'הושלם', cancelled:'בוטל' };
const PRIO    = { high:'גבוהה', normal:'רגילה', low:'נמוכה' };
const PRIO_CL = { high:'#dc2626', normal:'#4f46e5', low:'#94a3b8' };

// ─── Custom List Defaults ─────────────────────────────────────────────────────
const DEF_SOURCE      = ['המלצה','אתר','פייסבוק','אינסטגרם','לינקדאין','דוא"ל','פסטיבל','תערוכה','קול קורא','אחר'];
const DEF_ROLE        = ['מנהל תרבות','מנהל משאבי אנוש','מנכ"ל','מנהל','רכז','כלכלית','מרצה','מנחה','אחר'];
const MONTHS_HE       = ['','ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const fmtBirthday     = bd => { if(!bd) return ''; const [m,d]=bd.split('-'); return `${parseInt(d)} ב${MONTHS_HE[parseInt(m)]||''}`; };
const BirthdayPicker  = ({value, onChange, style={}}) => {
  const [m,d] = (value||'').split('-');
  const mon = parseInt(m)||0, day = parseInt(d)||0;
  const daysInMonth = mon ? new Date(2000,mon,0).getDate() : 31;
  const setMon = v => { const nd = Math.min(day||1, new Date(2000,parseInt(v),0).getDate()); onChange(v ? `${String(v).padStart(2,'0')}-${String(nd).padStart(2,'0')}` : ''); };
  const setDay = v => { onChange(mon ? `${String(mon).padStart(2,'0')}-${String(v).padStart(2,'0')}` : ''); };
  return (
    <div style={{display:'flex',gap:6,...style}}>
      <select className="inp" value={mon||''} onChange={e=>setMon(e.target.value)} style={{flex:1}}>
        <option value="">— חודש —</option>
        {MONTHS_HE.slice(1).map((n,i)=><option key={i+1} value={i+1}>{n}</option>)}
      </select>
      <select className="inp" value={day||''} onChange={e=>setDay(e.target.value)} style={{width:80}} disabled={!mon}>
        <option value="">— יום —</option>
        {Array.from({length:daysInMonth},(_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}
      </select>
    </div>
  );
};
const DEF_SHOW_NAME   = ['שקוף בחזית','מופע רגיל','הרצאה','סדנה','מופע פרטי','פסטיבל','כנס','אחר'];
const DEF_TAGS        = ['VIP','קהל נאמן','תרבות','עסקים','חינוך','קיבוץ','עירייה','בריאות'];
const DEF_TASK_STATUS = ['נפתחה','עתידית','בביצוע','במעקב','הושלמה'];
const DEF_TASK_TYPE   = ['יצירת קשר טלפוני','לשלוח הודעת דוא"ל','לקבוע פגישה','מעקב הצעת מחיר'];
const TASK_ST_COL     = { 'נפתחה':{bg:'#dbeafe',cl:'#1d4ed8'}, 'עתידית':{bg:'#fef3c7',cl:'#92400e'}, 'בביצוע':{bg:'#dcfce7',cl:'#166534'}, 'במעקב':{bg:'#fff7ed',cl:'#c2410c'}, 'הושלמה':{bg:'#f1f5f9',cl:'#64748b'} };
// ─── Meeting types (events) ───────────────────────────────────────────────────
const DEF_MEETING_TYPES = ['פגישת לקוח','הצגה / פרזנטציה','זום / וידאו','הכשרה / סדנה','פגישה אישית','ראיון'];
const MTG_TYPE_PAL = [
  {c:'#4f46e5',bg:'#eef2ff'}, {c:'#7c3aed',bg:'#f3e8ff'}, {c:'#0891b2',bg:'#e0f2fe'},
  {c:'#059669',bg:'#dcfce7'}, {c:'#d97706',bg:'#fef3c7'}, {c:'#dc2626',bg:'#fee2e2'},
  {c:'#db2777',bg:'#fce7f3'}, {c:'#0d9488',bg:'#ccfbf1'},
];
function getMtgTypeStyle(typeName, allTypes) {
  if (!typeName) return { c:'#7c3aed', bg:'#f3e8ff' };
  const idx = allTypes.indexOf(typeName);
  return MTG_TYPE_PAL[(idx >= 0 ? idx : typeName.split('').reduce((h,ch)=>h+ch.charCodeAt(0),0)) % MTG_TYPE_PAL.length];
}
const STATUS_PAL      = [['#e0e7ff','#3730a3'],['#fce7f3','#9d174d'],['#cffafe','#0e7490'],['#fef3c7','#92400e'],['#d1fae5','#065f46'],['#fff7ed','#c2410c'],['#f0fdf4','#15803d'],['#ede9fe','#5b21b6']];
const ListsCtx = createContext(null);

// ─── Utils ────────────────────────────────────────────────────────────────────
const uid   = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().split('T')[0];
const fmtD  = d => d ? new Date(d).toLocaleDateString('he-IL') : '—';
const fmtDT = d => d ? new Date(d).toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit'}) : '—';
const ini   = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const waPhone = phone => { let d=(phone||'').replace(/\D/g,''); if(d.startsWith('0'))d='972'+d.slice(1); else if(!d.startsWith('972'))d='972'+d; return d; };
const normalizePhone = v => {
  if (!v || !v.trim()) return v;
  let d = v.replace(/\D/g, '');
  if (d.startsWith('972') && d.length >= 11) d = '0' + d.slice(3);
  if (d.length === 10) return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;  // mobile 052-510-5100
  if (d.length === 9)  return `${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`;  // landline 03-123-4567
  return v;
};
const COLS  = ['#4f46e5','#0891b2','#059669','#d97706','#dc2626','#7c3aed','#db2777'];
const col   = n => COLS[(n||'?').charCodeAt(0) % COLS.length];

// ─── API layer ────────────────────────────────────────────────────────────────
const api = {
  _parse: async r => {
    const body = await r.json().catch(()=>null);
    if (!r.ok) throw new Error((body && body.error) || `שגיאת שרת (${r.status})`);
    return body;
  },
  get:  url    => fetch(url).then(r=>r.json()),
  post: (url,b)=> fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>api._parse(r)),
  put:  (url,b)=> fetch(url,{method:'PUT', headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>api._parse(r)),
  del:  url    => fetch(url,{method:'DELETE'}).then(r=>api._parse(r)),
};

// ─── List Options (persisted to localStorage) ─────────────────────────────────
function useListOptions() {
  const STORE = 'shakuf_crm_lists_v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } };
  const [C, setC] = useState(load);
  const save = d => { localStorage.setItem(STORE, JSON.stringify(d)); setC(d); };
  const get  = (key, defs) => {
    const deleted = new Set((C.deletedDefs || {})[key] || []);
    return [...defs.filter(v => !deleted.has(v)), ...(C[key]||[]).filter(v => !defs.includes(v))];
  };
  const add    = (key, val) => { const v=(val||'').trim(); if(!v) return; save({...C,[key]:[...(C[key]||[]).filter(x=>x!==v),v]}); };
  const del    = (key, val) => save({...C,[key]:(C[key]||[]).filter(v=>v!==val)});
  const delDef = (key, val) => {
    const prev = C.deletedDefs || {};
    save({...C, deletedDefs: {...prev, [key]: [...(prev[key]||[]).filter(v=>v!==val), val]}});
  };
  const allStatus = () => {
    const deleted = new Set(C.deletedStatuses || []);
    const overrides = C.statusLabels || {};
    const m = {};
    Object.entries(STATUS).forEach(([k,v]) => { if (!deleted.has(k)) m[k] = {...v, lbl: overrides[k] || v.lbl}; });
    (C.customStatus||[]).forEach(s=>{ m[s.k]={lbl: overrides[s.k] || s.l, bg:s.bg, cl:s.cl}; });
    return m;
  };
  const addStatus         = (k,l,bg,cl) => { if(!k||!l) return; save({...C,customStatus:[...(C.customStatus||[]).filter(s=>s.k!==k),{k,l,bg,cl}]}); };
  const delStatus         = k => save({...C,customStatus:(C.customStatus||[]).filter(s=>s.k!==k)});
  const delBuiltinStatus  = k => save({...C, deletedStatuses: [...(C.deletedStatuses||[]).filter(v=>v!==k), k]});
  const renameStatus      = (k, newLabel) => { if(!k||!newLabel.trim()) return; save({...C, statusLabels:{...(C.statusLabels||{}), [k]: newLabel.trim()}}); };
  return { C, get, add, del, delDef, allStatus, addStatus, delStatus, delBuiltinStatus, renameStatus };
}

    calendar:<><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
    settings:<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,

    link:    <><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></>,
    google:  <><path d="M12 11h8.53c.11.65.19 1.3.19 2 0 5.52-3.72 9.44-9 9.44A9.44 9.44 0 0 1 2.28 13 9.44 9.44 0 0 1 11.72 3.56c2.54 0 4.67.91 6.3 2.42L15.66 8.3C14.55 7.3 13.23 6.7 11.72 6.7c-3.7 0-6.72 3-6.72 6.7s3.02 6.7 6.72 6.7c3.26 0 5.52-1.97 6.13-4.7H12v-3.4z" fill="currentColor" stroke="none"/></>,
    bell:    <><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>,
    sync:    <><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>,

    doc:     <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></>,
    help:    <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
    folder:  <><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></>,
  };
  return (

// ─── Toast ────────────────────────────────────────────────────────────────────
function useToast() {
  const [msg, setMsg] = useState(null);
  const show = useCallback((m, err=false) => {
    setMsg({ m, err });
    setTimeout(() => setMsg(null), 3500);
  }, []);
  const Toast = msg ? (
    <div className="toast" style={{background:msg.err?'#dc2626':'#1e293b'}}>{msg.m}</div>
  ) : null;
  return { show, Toast };
}

function PipelineBoard({ contacts=[], quotes=[], onRefresh }) {
  const [cards, setCards]         = useState([]);
  const [loading, setLoading]     = useState(true);
  const [addModal, setAddModal]   = useState(false);
  const [convertCard, setConvertCard] = useState(null);
  const [draggingId, setDraggingId]   = useState(null);
  const [dragOverStage, setDragOverStage] = useState(null);
  const [showClosed, setShowClosed]   = useState(false);
  const [collapsed, setCollapsed]     = useState(false);

  const load = () => api.get('/api/pipeline').then(d=>{ setCards(Array.isArray(d)?d:[]); setLoading(false); }).catch(()=>setLoading(false));
  useEffect(()=>{ load(); }, []);

  const contactMap = useMemo(()=>{ const m={}; contacts.forEach(c=>m[c.id]=c); return m; }, [contacts]);

  const openCards   = cards.filter(c=>c.stage!=='closed');
  const closedCards = cards.filter(c=>c.stage==='closed');
  const totalValue  = openCards.reduce((s,c)=>s+(parseFloat(c.value)||0),0);
  const wonCards    = closedCards.filter(c=>c.closedReason==='won');

  // Drag & Drop
  const onDragStart = (e, id) => { setDraggingId(id); e.dataTransfer.effectAllowed='move'; };
  const onDragOver  = (e, stageId) => { e.preventDefault(); e.dataTransfer.dropEffect='move'; setDragOverStage(stageId); };
  const onDragLeave = () => setDragOverStage(null);
  const onDrop = async (e, stageId) => {
    e.preventDefault(); setDragOverStage(null);
    if (!draggingId) return;
    const card = cards.find(c=>c.id===draggingId);
    if (!card || card.stage===stageId) { setDraggingId(null); return; }
    setCards(p=>p.map(c=>c.id===draggingId?{...c,stage:stageId}:c));
    setDraggingId(null);
    await api.put(`/api/pipeline/${draggingId}`, {stage:stageId}).catch(()=>{});
  };
  const onDragEnd = () => { setDraggingId(null); setDragOverStage(null); };

  // Close (lost)
  const closeCard = async (id) => {
    setCards(p=>p.map(c=>c.id===id?{...c,stage:'closed',closedReason:'lost'}:c));
    await api.put(`/api/pipeline/${id}`, {stage:'closed',closedReason:'lost'}).catch(()=>{});
  };

  // Convert to show (won)
  const handleConvert = async (showData) => {
    if (!convertCard) return;
    await api.post(`/api/pipeline/${convertCard.id}/convert`, { ...showData, contactId: convertCard.contactId }).catch(()=>{});
    setCards(p=>p.map(c=>c.id===convertCard.id?{...c,stage:'closed',closedReason:'won'}:c));
    setConvertCard(null);
    if (onRefresh) onRefresh();
  };

  // Add card
  const handleAdd = async (data) => {
    const card = await api.post('/api/pipeline', data).catch(()=>null);
    if (card) { setCards(p=>[card,...p]); setAddModal(false); }
  };

  const fmtILS = v => v>0 ? '₪'+Number(v).toLocaleString('he-IL') : '';

  if (collapsed) return (
    <div className="card" style={{padding:'14px 20px',marginBottom:20,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <span style={{fontSize:18}}>🚀</span>
        <span style={{fontWeight:700,fontSize:15}}>פייפליין מכירות</span>
        <span className="badge" style={{background:'#eef2ff',color:'#4f46e5'}}>{openCards.length} עסקאות פתוחות</span>
        {totalValue>0&&<span className="badge" style={{background:'#dcfce7',color:'#16a34a'}}>{fmtILS(totalValue)}</span>}
      </div>
      <button className="btn btn-secondary btn-sm" onClick={()=>setCollapsed(false)}>הצג ▼</button>
    </div>
  );

  return (
    <div style={{marginBottom:20}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:20}}>🚀</span>
          <span style={{fontWeight:700,fontSize:16}}>פייפליין מכירות</span>
          <span className="badge" style={{background:'#eef2ff',color:'#4f46e5'}}>{openCards.length} פתוחות</span>
          {totalValue>0&&<span className="badge" style={{background:'#dcfce7',color:'#16a34a'}}>{fmtILS(totalValue)}</span>}
          {wonCards.length>0&&<span className="badge" style={{background:'#fef3c7',color:'#d97706'}}>🏆 {wonCards.length} נסגרו</span>}
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary btn-sm" onClick={()=>setShowClosed(p=>!p)}>
            {showClosed?'הסתר סגורות':'הצג סגורות'} ({closedCards.length})
          </button>
          <button className="btn btn-primary btn-sm" onClick={()=>setAddModal(true)}>
            <I n="plus" s={13} c="#fff"/> הוסף עסקה
          </button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCollapsed(true)}>▲</button>
        </div>
      </div>

      {/* Kanban columns */}
      <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8,alignItems:'flex-start'}}>
        {PIPE_STAGES.map(stage=>{
          const stageCards = (showClosed&&stage.id==='interested'
            ? [...openCards.filter(c=>c.stage===stage.id)]
            : openCards.filter(c=>c.stage===stage.id));
          const stageVal = stageCards.reduce((s,c)=>s+(parseFloat(c.value)||0),0);
          const isOver = dragOverStage===stage.id;

          return (
            <div key={stage.id}
              style={{minWidth:180,maxWidth:220,flex:'0 0 190px'}}
              onDragOver={e=>onDragOver(e,stage.id)}
              onDragLeave={onDragLeave}
              onDrop={e=>onDrop(e,stage.id)}>
              {/* Column header */}
              <div style={{background:stage.bg,border:`1.5px solid ${stage.border}`,borderRadius:'10px 10px 0 0',padding:'8px 12px',marginBottom:0}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span>{stage.emoji}</span>
                    <span style={{fontSize:12,fontWeight:700,color:stage.color}}>{stage.lbl}</span>
                  </div>
                  <span style={{fontSize:11,background:'rgba(0,0,0,.08)',borderRadius:10,padding:'1px 7px',color:stage.color,fontWeight:700}}>{stageCards.length}</span>
                </div>
                {stageVal>0&&<div style={{fontSize:11,color:stage.color,marginTop:2,fontWeight:600}}>{fmtILS(stageVal)}</div>}
              </div>

              {/* Drop zone + cards */}
              <div style={{
                minHeight:120, background: isOver?stage.bg+'cc':'#f8fafc',
                border:`1.5px solid ${isOver?stage.color:stage.border}`,
                borderTop:'none', borderRadius:'0 0 10px 10px',
                padding:8, display:'flex', flexDirection:'column', gap:6,
                transition:'background .15s,border .15s',
              }}>
                {stageCards.map(card=>{
                  const cont = contactMap[card.contactId];
                  const isDragging = draggingId===card.id;
                  return (
                    <div key={card.id}
                      draggable
                      onDragStart={e=>onDragStart(e,card.id)}
                      onDragEnd={onDragEnd}
                      style={{
                        background:'#fff', borderRadius:8, padding:'10px 11px',
                        boxShadow:'0 1px 3px rgba(0,0,0,.1)',
                        border:`1px solid ${stage.border}`,
                        opacity: isDragging?.5:1,
                        cursor:'grab',
                        transition:'opacity .15s, box-shadow .15s',
                      }}>
                      {/* Contact name */}
                      <div style={{fontWeight:600,fontSize:13,color:'#1e293b',marginBottom:3,display:'flex',alignItems:'center',gap:6}}>
                        <span style={{fontSize:15}}>👤</span>
                        {cont?.name||'—'}
                      </div>
                      {/* Show name */}
                      {card.showName&&<div style={{fontSize:12,color:'#475569',marginBottom:3}}>🎤 {card.showName}</div>}
                      {/* Value */}
                      {card.value>0&&<div style={{fontSize:12,fontWeight:600,color:'#16a34a',marginBottom:3}}>💰 {fmtILS(card.value)}</div>}
                      {/* Notes */}
                      {card.notes&&<div style={{fontSize:11,color:'#94a3b8',marginBottom:6,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{card.notes}</div>}
                      {/* Actions */}
                      <div style={{display:'flex',gap:5,marginTop:4}}>
                        {stage.id==='interested'&&(
                          <button className="btn btn-sm" onClick={()=>setConvertCard(card)}
                            style={{flex:1,justifyContent:'center',fontSize:11,background:'#16a34a',color:'#fff',padding:'4px 6px'}}>
                            🎉 צור הזמנה
                          </button>
                        )}
                        <button onClick={()=>closeCard(card.id)} title="לא מעוניין"
                          style={{background:'#fee2e2',border:'none',borderRadius:6,color:'#dc2626',fontSize:11,padding:'3px 8px',cursor:'pointer',fontWeight:600}}>
                          ✕ לא מעוניין
                        </button>
                      </div>
                    </div>
                  );
                })}
                {stageCards.length===0&&(
                  <div style={{textAlign:'center',color:'#cbd5e1',fontSize:12,padding:'20px 0'}}>
                    גרור כרטיס לכאן
                  </div>
                )}
              </div>
            </div>
          );
        })}

        {/* Closed column — only when showClosed */}
        {showClosed&&(
          <div style={{minWidth:180,maxWidth:220,flex:'0 0 190px'}}>
            <div style={{background:'#f1f5f9',border:'1.5px solid #e2e8f0',borderRadius:'10px 10px 0 0',padding:'8px 12px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{fontSize:12,fontWeight:700,color:'#64748b'}}>🔒 סגורות</span>
                <span style={{fontSize:11,background:'rgba(0,0,0,.08)',borderRadius:10,padding:'1px 7px',color:'#64748b',fontWeight:700}}>{closedCards.length}</span>
              </div>
            </div>
            <div style={{minHeight:80,background:'#f8fafc',border:'1.5px solid #e2e8f0',borderTop:'none',borderRadius:'0 0 10px 10px',padding:8,display:'flex',flexDirection:'column',gap:6}}>
              {closedCards.map(card=>{
                const cont = contactMap[card.contactId];
                const won = card.closedReason==='won';
                return (
                  <div key={card.id} style={{background:'#fff',borderRadius:8,padding:'9px 11px',border:'1px solid #e2e8f0',opacity:.75}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2}}>
                      <span>{won?'🏆':'❌'}</span>
                      <span style={{fontWeight:600,fontSize:12,color:'#475569'}}>{cont?.name||'—'}</span>
                    </div>
                    {card.showName&&<div style={{fontSize:11,color:'#94a3b8'}}>{card.showName}</div>}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* Modals */}
      {addModal&&<PipelineAddModal contacts={contacts} quotes={quotes} onSave={handleAdd} onClose={()=>setAddModal(false)}/>}
      {convertCard&&<PipelineConvertModal card={convertCard} contactName={contactMap[convertCard.contactId]?.name||''} onSave={handleConvert} onClose={()=>setConvertCard(null)}/>}
    </div>
  );
}

// ─── CalendarWidget ───────────────────────────────────────────────────────────
function CalendarWidget({ tasks=[], shows=[], onEditTask }) {
  const ctx = useContext(ListsCtx);
  const mtgTypes = ctx ? ctx.get('meetingType', DEF_MEETING_TYPES) : DEF_MEETING_TYPES;
  const [calView, setCalView] = useState('week');
  const [anchor,  setAnchor]  = useState(() => new Date());

  const DAYS_S  = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  const DAYS_F  = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const MONTHS_N= ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const toYMD   = d => { const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
  const todayYMD= toYMD(new Date());

  // ── gather all calendar items ──
  const allItems = React.useMemo(() => {
    const items = [];
    tasks.filter(t=>t.type==='event'&&t.dueDate).forEach(t=>{
      const timeStr = t.dueTime || (t.startDateTime&&t.startDateTime.includes('T') ? t.startDateTime.split('T')[1].slice(0,5) : '');
      const style = getMtgTypeStyle(t.meetingType, mtgTypes);
      items.push({ id:'ev-'+t.id, title:t.title, date:t.dueDate, time:timeStr,
        color:style.c, bg:style.bg, border:style.c+'55', kind:'event',
        meetingType:t.meetingType, raw:t });
    });
    (shows||[]).filter(s=>s.date).forEach(s=>{
      items.push({ id:'sh-'+s.id, title:s.showName||'מופע', date:s.date, time:s.time||'',
        color:'#0891b2', bg:'#cffafe', border:'#67e8f9', kind:'show', raw:s });
    });
    return items;
  }, [tasks, shows, mtgTypes]);

  const onDate = ymd => allItems.filter(e=>e.date===ymd).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  // ── navigation ──
  const wkStart = d => { const r=new Date(d); r.setDate(r.getDate()-r.getDay()); return r; };
  const moStart = d => new Date(d.getFullYear(), d.getMonth(), 1);

  const move = delta => {
    setAnchor(prev => {
      const d = new Date(prev);
      if (calView==='day')   d.setDate(d.getDate()+delta);
      else if (calView==='week') d.setDate(d.getDate()+7*delta);
      else d.setMonth(d.getMonth()+delta);
      return d;
    });
  };

  const periodLabel = () => {
    if (calView==='day') return `${DAYS_F[anchor.getDay()]} ${anchor.getDate()} ${MONTHS_N[anchor.getMonth()]} ${anchor.getFullYear()}`;
    if (calView==='week') {
      const ws=wkStart(anchor), we=new Date(ws); we.setDate(we.getDate()+6);
      return ws.getMonth()===we.getMonth()
        ? `${ws.getDate()}–${we.getDate()} ${MONTHS_N[ws.getMonth()]} ${ws.getFullYear()}`
        : `${ws.getDate()} ${MONTHS_N[ws.getMonth()]} – ${we.getDate()} ${MONTHS_N[we.getMonth()]}`;
    }
    return `${MONTHS_N[anchor.getMonth()]} ${anchor.getFullYear()}`;
  };

  const EventChip = ({ev, compact=false}) => (
    <div onClick={()=>ev.kind==='event'&&onEditTask&&onEditTask(ev.raw)}
      title={`${ev.time?ev.time+' · ':''}${ev.title}`}
      style={{background:ev.bg,color:ev.color,fontSize:compact?9:10,fontWeight:600,borderRadius:4,
        padding:compact?'1px 4px':'2px 5px',marginBottom:2,cursor:ev.kind==='event'?'pointer':'default',
        whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',
        borderRight:`2.5px solid ${ev.color}`,lineHeight:1.4,
        display:'flex',alignItems:'center',gap:3}}>
      {ev.kind==='show'?'🎭':'📅'}
      {ev.time&&!compact&&<span style={{opacity:.7,fontSize:9}}>{ev.time}</span>}
      <span style={{overflow:'hidden',textOverflow:'ellipsis'}}>{ev.title}</span>
    </div>
  );

  // ── WEEK VIEW ──
  const renderWeek = () => {
    const ws = wkStart(anchor);
    const days = Array.from({length:7},(_,i)=>{ const d=new Date(ws); d.setDate(d.getDate()+i); return d; });
    return (
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:5}}>
        {days.map(d=>{
          const ymd=toYMD(d), isToday=ymd===todayYMD, evs=onDate(ymd);
          return (
            <div key={ymd} style={{background:isToday?'#eef2ff':'#fafafa',
              border:isToday?'1.5px solid #4f46e5':'1px solid #f1f5f9',
              borderRadius:8,minHeight:96,padding:'5px 4px 4px',
              cursor:'pointer',transition:'box-shadow .12s'}}
              onClick={()=>{setAnchor(new Date(ymd));setCalView('day');}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
                <span style={{fontSize:10,color:'#94a3b8',fontWeight:600}}>{DAYS_S[d.getDay()]}</span>
                <span style={{fontSize:13,fontWeight:isToday?800:500,
                  background:isToday?'#4f46e5':'transparent',
                  color:isToday?'#fff':'#1e293b',
                  width:22,height:22,borderRadius:'50%',
                  display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  {d.getDate()}
                </span>
              </div>
              {evs.slice(0,3).map(ev=><EventChip key={ev.id} ev={ev}/>)}
              {evs.length>3&&<div style={{fontSize:9,color:'#94a3b8',textAlign:'center',fontWeight:600}}>+{evs.length-3} עוד</div>}
            </div>
          );
        })}
      </div>
    );
  };

  // ── MONTH VIEW ──
  const renderMonth = () => {
    const ms=moStart(anchor);
    const firstDow=ms.getDay();
    const daysInMo=new Date(ms.getFullYear(),ms.getMonth()+1,0).getDate();
    const cells=[]; for(let i=0;i<firstDow;i++) cells.push(null);
    for(let d=1;d<=daysInMo;d++) cells.push(d);
    while(cells.length%7!==0) cells.push(null);
    const z=n=>String(n).padStart(2,'0');
    return (
      <div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:4}}>
          {DAYS_S.map(d=><div key={d} style={{textAlign:'center',fontSize:11,color:'#94a3b8',fontWeight:700,padding:'3px 0'}}>{d}</div>)}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
          {cells.map((d,i)=>{
            if(!d) return <div key={'p'+i}/>;
            const ymd=`${ms.getFullYear()}-${z(ms.getMonth()+1)}-${z(d)}`;
            const isToday=ymd===todayYMD, evs=onDate(ymd);
            return (
              <div key={ymd} onClick={()=>{setAnchor(new Date(ymd));setCalView('day');}}
                style={{background:isToday?'#eef2ff':'#fafafa',
                  border:isToday?'1.5px solid #4f46e5':'1px solid #f1f5f9',
                  borderRadius:7,minHeight:62,padding:'4px 3px',cursor:'pointer'}}>
                <div style={{textAlign:'center',marginBottom:3}}>
                  <span style={{fontSize:12,fontWeight:isToday?800:500,
                    background:isToday?'#4f46e5':'transparent',
                    color:isToday?'#fff':'#1e293b',
                    width:20,height:20,borderRadius:'50%',
                    display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
                    {d}
                  </span>
                </div>
                {evs.slice(0,2).map(ev=><EventChip key={ev.id} ev={ev} compact/>)}
                {evs.length>2&&<div style={{fontSize:9,color:'#94a3b8',textAlign:'center'}}>+{evs.length-2}</div>}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ── DAY VIEW ──
  const renderDay = () => {
    const evs=onDate(toYMD(anchor));
    if(!evs.length) return <div style={{textAlign:'center',padding:'32px 0',color:'#94a3b8',fontSize:14}}>אין פגישות ביום זה 📭</div>;
    return evs.map(ev=>(
      <div key={ev.id} onClick={()=>ev.kind==='event'&&onEditTask&&onEditTask(ev.raw)}
        style={{display:'flex',gap:14,padding:'12px 16px',marginBottom:8,
          background:ev.bg,borderRadius:10,
          border:`1px solid ${ev.border}`,
          borderRight:`4px solid ${ev.color}`,
          cursor:ev.kind==='event'?'pointer':'default'}}>
        <div style={{fontSize:22}}>{ev.kind==='event'?'📅':'🎭'}</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:15,color:ev.color,marginBottom:3}}>{ev.title}</div>
          {ev.time&&<div style={{fontSize:13,color:'#64748b'}}>⏰ {ev.time}</div>}
          {ev.raw?.location&&<div style={{fontSize:13,color:'#64748b'}}>📍 {ev.raw.location}</div>}
          {ev.raw?.venue&&<div style={{fontSize:13,color:'#64748b'}}>🏛 {ev.raw.venue}</div>}
          {ev.raw?.notes&&<div style={{fontSize:12,color:'#94a3b8',marginTop:4}}>{ev.raw.notes}</div>}
        </div>
        <span style={{fontSize:11,color:ev.color,fontWeight:600,background:ev.bg,padding:'2px 8px',borderRadius:8,height:'fit-content'}}>{ev.kind==='show'?'מופע':ev.meetingType||'פגישה'}</span>
      </div>
    ));
  };

  return (
    <div className="card" style={{padding:0,marginBottom:20,overflow:'hidden'}}>
      {/* ── Header ── */}
      <div style={{padding:'12px 18px',borderBottom:'1.5px solid #e2e8f0',display:'flex',justifyContent:'space-between',alignItems:'center',background:'#fafafa',flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',gap:8}}>
          <span style={{fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>
            <I n="calendar" s={16} c="#4f46e5"/>לוח שנה
          </span>
          <div style={{display:'flex',gap:3}}>
            {[['day','יום'],['week','שבוע'],['month','חודש']].map(([v,l])=>(
              <button key={v} onClick={()=>setCalView(v)}
                style={{padding:'4px 12px',borderRadius:6,border:'none',fontSize:12,fontWeight:600,cursor:'pointer',
                  background:calView===v?'#4f46e5':'#e2e8f0',color:calView===v?'#fff':'#64748b',transition:'all .15s'}}>
                {l}
              </button>
            ))}
          </div>
          {/* legend */}
          <div style={{display:'flex',gap:10,marginRight:4}}>
            <span style={{fontSize:11,color:'#64748b',display:'flex',alignItems:'center',gap:4}}>
              <span style={{width:10,height:10,background:'#f3e8ff',border:'2px solid #7c3aed',borderRadius:2,display:'inline-block'}}/>פגישות
            </span>
            <span style={{fontSize:11,color:'#64748b',display:'flex',alignItems:'center',gap:4}}>
              <span style={{width:10,height:10,background:'#cffafe',border:'2px solid #0891b2',borderRadius:2,display:'inline-block'}}/>מופעים
            </span>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:13,fontWeight:600,color:'#475569',minWidth:140,textAlign:'center'}}>{periodLabel()}</span>
          <button onClick={()=>move(-1)} style={{width:28,height:28,borderRadius:6,border:'1px solid #e2e8f0',background:'#fff',cursor:'pointer',fontSize:15,display:'flex',alignItems:'center',justifyContent:'center'}}>‹</button>
          <button onClick={()=>{setAnchor(new Date());}} style={{padding:'4px 10px',borderRadius:6,border:'1px solid #e2e8f0',background:'#fff',cursor:'pointer',fontSize:12,fontWeight:600}}>היום</button>
          <button onClick={()=>move(1)}  style={{width:28,height:28,borderRadius:6,border:'1px solid #e2e8f0',background:'#fff',cursor:'pointer',fontSize:15,display:'flex',alignItems:'center',justifyContent:'center'}}>›</button>
        </div>
      </div>
      {/* ── Body ── */}
      <div style={{padding:'14px 16px 16px'}}>
        {calView==='week' && renderWeek()}
        {calView==='month' && renderMonth()}
        {calView==='day' && renderDay()}
      </div>
    </div>
  );
}

function ProjectModal({ project, contacts=[], orgs=[], projects=[], onSave, onClose }) {
  const isEdit = !!project?.id;
  const ctx = useContext(ListsCtx);
  const typeOpts  = [
    ...Object.entries(PROJ_TYPES).map(([k,v])=>({ value:k, label:v.emoji+' '+v.lbl })),
    ...(ctx ? ctx.get('projectType',[]) : []).map(v=>({ value:v, label:'📁 '+v })),
  ];
  const statusOpts = [
    ...Object.entries(PROJ_STATUS).map(([k,v])=>({ value:k, label:v.lbl })),
    ...(ctx ? ctx.get('projectStatus',[]) : []).map(v=>({ value:v, label:v })),
  ];
  // backward compat: old projects had contactId (string), new have contactIds (array)
  const initContactIds = project?.contactIds
    || (project?.contactId ? [project.contactId] : []);
  const [f, setF] = useState({
    name: project?.name||'', description: project?.description||'',
    type: project?.type||'other', status: project?.status||'active',

  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:500}}>
        <div style={{padding:'20px 24px 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <h3 style={{fontWeight:700,fontSize:17}}>{isEdit?'עריכת פרויקט':'פרויקט חדש'}</h3>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8'}}>✕</button>
        </div>
        <div style={{padding:'18px 24px 24px',display:'flex',flexDirection:'column',gap:13}}>
          <div><label className="lbl">שם הפרויקט *</label>
            <input className="inp" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="שם הפרויקט"/></div>
          <div className="grid2">
            <div><label className="lbl">סוג</label>
              <SmartSelect listKey="projectType" value={f.type} onChange={v=>set('type',v)}
                options={typeOpts} emptyLabel="בחר סוג..."/></div>
            <div><label className="lbl">סטטוס</label>
              <SmartSelect listKey="projectStatus" value={f.status} onChange={v=>set('status',v)}
                options={statusOpts} emptyLabel="בחר סטטוס..."/></div>
          </div>
          <div><label className="lbl">תת-פרויקט של</label>
            <select className="inp" value={f.parentProjectId} onChange={e=>set('parentProjectId',e.target.value)}>
              <option value="">— פרויקט עצמאי —</option>
              {parentOptions.map(p=><option key={p.id} value={p.id}>{getProjType(p.type).emoji} {p.name}</option>)}
            </select></div>
          <div className="grid2">
            <div><label className="lbl">תאריך התחלה</label>
              <input className="inp" type="date" value={f.startDate} onChange={e=>set('startDate',e.target.value)}/></div>
            <div><label className="lbl">תאריך יעד</label>
              <input className="inp" type="date" value={f.dueDate} onChange={e=>set('dueDate',e.target.value)}/></div>
          </div>
          <div><label className="lbl">תקציב מתוכנן (₪)</label>
            <input className="inp" type="number" value={f.budget} onChange={e=>set('budget',e.target.value)} placeholder="0"/></div>
          <MultiContactField contacts={contacts} values={f.contactIds} onChange={v=>set('contactIds',v)}/>
          <div><label className="lbl">תיאור / הערות</label>
            <textarea className="inp" rows={2} value={f.notes} onChange={e=>set('notes',e.target.value)} style={{resize:'vertical'}}/></div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary" onClick={onClose}>ביטול</button>
            <button className="btn btn-primary" disabled={!f.name.trim()} onClick={()=>onSave(f)}>
              {isEdit?'שמור שינויים':'צור פרויקט'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProjectProductsTab({ project, contacts, onUpdate }) {
  const [addProd, setAddProd] = useState(false);
  const [newProd, setNewProd] = useState({ name:'', budgetAllocated:'' });
  const [addQuote, setAddQuote] = useState(null); // productId
  const [newQuote, setNewQuote] = useState({ supplierName:'', supplierId:'', price:'', notes:'' });
  const [addPayment, setAddPayment] = useState(null); // {productId, quoteId}
  const [newPayment, setNewPayment] = useState({ amount:'', date:'', notes:'' });
  const [contQ, setContQ] = useState('');

  const save = (products) => onUpdate({ ...project, products });
  const products = project.products || [];

  const addProduct = () => {
    if (!newProd.name.trim()) return;
    save([...products, { id: Date.now()+'', name: newProd.name, budgetAllocated: parseFloat(newProd.budgetAllocated)||0, quotes:[] }]);
    setNewProd({ name:'', budgetAllocated:'' }); setAddProd(false);
  };
  const deleteProduct = (pid) => { if (!window.confirm('למחוק מוצר/שירות זה?')) return; save(products.filter(p=>p.id!==pid)); };

  const addSupplierQuote = (pid) => {
    if (!newQuote.supplierName.trim() && !newQuote.supplierId) return;
    const supContact = contacts.find(c=>c.id===newQuote.supplierId);
    const quote = {
      id: Date.now()+'', isWinner: false, paymentStatus:'pending', payments:[],
      supplierName: supContact?.name || newQuote.supplierName,
      supplierId: newQuote.supplierId || null,
      supplierPhone: supContact?.phone || '',
      price: parseFloat(newQuote.price)||0, notes: newQuote.notes,
      date: new Date().toISOString().split('T')[0],
    };
    save(products.map(p=>p.id===pid?{...p,quotes:[...p.quotes,quote]}:p));
    setNewQuote({ supplierName:'', supplierId:'', price:'', notes:'' }); setAddQuote(null);
  };
  const setWinner = (pid, qid) => {
    save(products.map(p=>p.id!==pid?p:{...p,quotes:p.quotes.map(q=>({...q,isWinner:q.id===qid}))}));
  };
  const updatePayStatus = (pid, qid, status) => {
    save(products.map(p=>p.id!==pid?p:{...p,quotes:p.quotes.map(q=>q.id!==qid?q:{...q,paymentStatus:status})}));
  };
  const addPaymentRow = (pid, qid) => {
    if (!newPayment.amount || !newPayment.date) return;
    const pay = { id: Date.now()+'', amount: parseFloat(newPayment.amount)||0, date: newPayment.date, isPaid: false, notes: newPayment.notes };
    save(products.map(p=>p.id!==pid?p:{...p,quotes:p.quotes.map(q=>q.id!==qid?q:{...q,payments:[...q.payments,pay]})}));
    setNewPayment({ amount:'', date:'', notes:'' }); setAddPayment(null);
  };
  const togglePayment = (pid, qid, payId) => {
    save(products.map(p=>p.id!==pid?p:{...p,quotes:p.quotes.map(q=>q.id!==qid?q:{...q,payments:q.payments.map(pay=>pay.id===payId?{...pay,isPaid:!pay.isPaid}:pay)})}));
  };
  const fmtILS = v => v>0?'₪'+Number(v).toLocaleString('he-IL'):'—';
  const filteredCont = contacts.filter(c=>!contQ||c.name.includes(contQ)||(c.phone||'').includes(contQ));

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h3 style={{fontWeight:700,fontSize:15}}>מוצרים ושירותים</h3>
        <button className="btn btn-primary btn-sm" onClick={()=>setAddProd(true)}><I n="plus" s={13} c="#fff"/> הוסף</button>
      </div>

      {addProd&&(
        <div className="card" style={{padding:14,marginBottom:12,background:'#f8fafc'}}>
          <div className="grid2" style={{gap:8,marginBottom:8}}>
            <input className="inp" placeholder="שם מוצר / שירות *" value={newProd.name} onChange={e=>setNewProd(p=>({...p,name:e.target.value}))}/>
            <input className="inp" type="number" placeholder="תקציב מוקצה (₪)" value={newProd.budgetAllocated} onChange={e=>setNewProd(p=>({...p,budgetAllocated:e.target.value}))}/>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-secondary btn-sm" onClick={()=>setAddProd(false)}>ביטול</button>
            <button className="btn btn-primary btn-sm" onClick={addProduct}>הוסף</button>
          </div>
        </div>
      )}

      {products.length===0&&!addProd&&(
        <div style={{textAlign:'center',color:'#94a3b8',padding:'32px 0'}}>אין מוצרים / שירותים עדיין</div>
      )}

      {products.map(prod=>{
        const winner = prod.quotes.find(q=>q.isWinner);
        const totalPaid = winner ? winner.payments.filter(p=>p.isPaid).reduce((s,p)=>s+p.amount,0) : 0;
        const totalRemain = winner ? winner.price - totalPaid : 0;
        return (
          <div key={prod.id} className="card" style={{padding:16,marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
              <div>
                <div style={{fontWeight:700,fontSize:15}}>{prod.name}</div>
                {prod.budgetAllocated>0&&<div style={{fontSize:12,color:'#64748b'}}>תקציב: {fmtILS(prod.budgetAllocated)}</div>}
              </div>
              <div style={{display:'flex',gap:6}}>
                <button className="btn btn-secondary btn-xs" onClick={()=>{setAddQuote(prod.id);setContQ('');}}>+ הצעת ספק</button>
                <button onClick={()=>deleteProduct(prod.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#dc2626',fontSize:13}}>🗑</button>
              </div>
            </div>

            {/* Supplier quotes table */}
            {prod.quotes.length>0&&(
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13,marginBottom:10}}>
                <thead>
                  <tr style={{background:'#f8fafc'}}>
                    {['ספק','מחיר','הערות','זוכה','תשלום'].map(h=>(
                      <th key={h} style={{padding:'6px 10px',textAlign:'right',fontWeight:600,color:'#64748b',borderBottom:'1px solid #e2e8f0'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {prod.quotes.map(q=>(
                    <tr key={q.id} style={{background:q.isWinner?'#f0fdf4':'#fff',borderBottom:'1px solid #f1f5f9'}}>
                      <td style={{padding:'8px 10px'}}>
                        <div style={{fontWeight:q.isWinner?700:400}}>{q.supplierName}</div>
                        {q.supplierPhone&&<div style={{fontSize:11,color:'#94a3b8'}}>{q.supplierPhone}</div>}
                      </td>
                      <td style={{padding:'8px 10px',fontWeight:600,color:q.isWinner?'#16a34a':'#1e293b'}}>{fmtILS(q.price)}</td>
                      <td style={{padding:'8px 10px',color:'#64748b',fontSize:12}}>{q.notes||'—'}</td>
                      <td style={{padding:'8px 10px',textAlign:'center'}}>
                        {q.isWinner ? <span style={{color:'#16a34a',fontSize:16}}>✅</span>
                          : <button className="btn btn-xs btn-secondary" onClick={()=>setWinner(prod.id,q.id)}>בחר</button>}
                      </td>
                      <td style={{padding:'8px 10px'}}>
                        {q.isWinner?(
                          <select className="inp" value={q.paymentStatus} onChange={e=>updatePayStatus(prod.id,q.id,e.target.value)}
                            style={{padding:'3px 6px',fontSize:12,width:'auto',minWidth:120,
                              background:PAY_STATUS[q.paymentStatus]?.bg,color:PAY_STATUS[q.paymentStatus]?.cl}}>
                            {Object.entries(PAY_STATUS).map(([k,v])=><option key={k} value={k}>{v.lbl}</option>)}
                          </select>
                        ):'—'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}

            {/* Add quote form */}
            {addQuote===prod.id&&(
              <div style={{background:'#f8fafc',borderRadius:8,padding:12,marginBottom:10}}>
                <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:'#475569'}}>הוסף הצעת ספק</div>
                <input className="inp" style={{marginBottom:6}} placeholder="חפש ספק קיים..." value={contQ} onChange={e=>setContQ(e.target.value)}/>
                <select className="inp" style={{marginBottom:6}} value={newQuote.supplierId} onChange={e=>setNewQuote(p=>({...p,supplierId:e.target.value,supplierName:''}))}>
                  <option value="">— ספק חדש (מלא שם למטה) —</option>
                  {filteredCont.map(c=><option key={c.id} value={c.id}>{c.name}{c.phone?' · '+c.phone:''}</option>)}
                </select>
                {!newQuote.supplierId&&<input className="inp" style={{marginBottom:6}} placeholder="שם ספק חדש *" value={newQuote.supplierName} onChange={e=>setNewQuote(p=>({...p,supplierName:e.target.value}))}/>}
                <div className="grid2" style={{gap:6,marginBottom:6}}>
                  <input className="inp" type="number" placeholder="מחיר (₪)" value={newQuote.price} onChange={e=>setNewQuote(p=>({...p,price:e.target.value}))}/>
                  <input className="inp" placeholder="הערות" value={newQuote.notes} onChange={e=>setNewQuote(p=>({...p,notes:e.target.value}))}/>
                </div>
                <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                  <button className="btn btn-secondary btn-sm" onClick={()=>setAddQuote(null)}>ביטול</button>
                  <button className="btn btn-primary btn-sm" onClick={()=>addSupplierQuote(prod.id)}>הוסף הצעה</button>
                </div>
              </div>
            )}

            {/* Payment schedule for winner */}
            {winner&&winner.paymentStatus==='partial'&&(
              <div style={{background:'#eff6ff',borderRadius:8,padding:12,marginTop:4}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div style={{fontSize:13,fontWeight:700,color:'#3b82f6'}}>לוח תשלומים</div>
                  <button className="btn btn-xs btn-secondary" onClick={()=>setAddPayment({productId:prod.id,quoteId:winner.id})}>+ תשלום</button>
                </div>
                {winner.payments.map(pay=>(
                  <div key={pay.id} style={{display:'flex',alignItems:'center',gap:10,padding:'5px 0',borderBottom:'1px solid #bfdbfe',fontSize:13}}>
                    <input type="checkbox" checked={pay.isPaid} onChange={()=>togglePayment(prod.id,winner.id,pay.id)} style={{cursor:'pointer'}}/>
                    <span style={{fontWeight:600,color:pay.isPaid?'#16a34a':'#1e293b'}}>{fmtILS(pay.amount)}</span>
                    <span style={{color:'#64748b'}}>{pay.date}</span>
                    {pay.notes&&<span style={{color:'#94a3b8',fontSize:12}}>{pay.notes}</span>}
                    <span style={{marginRight:'auto',fontSize:11,color:pay.isPaid?'#16a34a':'#d97706',fontWeight:600}}>{pay.isPaid?'✅ שולם':'⏳ עתידי'}</span>
                  </div>
                ))}
                {addPayment?.productId===prod.id&&addPayment?.quoteId===winner.id&&(
                  <div style={{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
                    <input className="inp" type="number" placeholder="סכום (₪)" value={newPayment.amount} onChange={e=>setNewPayment(p=>({...p,amount:e.target.value}))} style={{flex:1,minWidth:100}}/>
                    <input className="inp" type="date" value={newPayment.date} onChange={e=>setNewPayment(p=>({...p,date:e.target.value}))} style={{flex:1,minWidth:120}}/>
                    <input className="inp" placeholder="הערה" value={newPayment.notes} onChange={e=>setNewPayment(p=>({...p,notes:e.target.value}))} style={{flex:2,minWidth:120}}/>
                    <button className="btn btn-primary btn-sm" onClick={()=>addPaymentRow(prod.id,winner.id)}>הוסף</button>
                    <button className="btn btn-secondary btn-sm" onClick={()=>setAddPayment(null)}>ביטול</button>
                  </div>
                )}
                <div style={{marginTop:8,fontSize:12,display:'flex',gap:16}}>
                  <span style={{color:'#16a34a',fontWeight:600}}>שולם: {fmtILS(totalPaid)}</span>
                  <span style={{color:'#dc2626',fontWeight:600}}>נותר: {fmtILS(totalRemain)}</span>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ProjectDetail({ project, allProjects, contacts, tasks, onUpdate, onDelete, onAddTask, onAddSubProject, onEditTask, go }) {
  const [tab, setTab] = useState('overview');
  const [editModal, setEditModal] = useState(false);
  const [addSubProjModal, setAddSubProjModal] = useState(false);
  const subProjects = allProjects.filter(p=>p.parentProjectId===project.id);
  const projectTasks = tasks.filter(t=>t.projectId===project.id);
  const completedTasks = projectTasks.filter(t=>t.completed);
  const progress = projectTasks.length>0 ? Math.round((completedTasks.length/projectTasks.length)*100) : 0;
  // support both old contactId and new contactIds array
  const contactIds = project.contactIds || (project.contactId ? [project.contactId] : []);
  const projectContacts = contactIds.map(id => contacts.find(c=>c.id===id)).filter(Boolean);
  const pt = getProjType(project.type);
  const ps = getProjStatus(project.status);

  // Budget calculations
  const products = project.products||[];
  const winnerTotal = products.reduce((s,p)=>{
    const w=p.quotes.find(q=>q.isWinner); return s+(w?w.price:0);
  },0);
  const paidTotal = products.reduce((s,p)=>{
    const w=p.quotes.find(q=>q.isWinner); if(!w) return s;
    return s+w.payments.filter(pay=>pay.isPaid).reduce((a,pay)=>a+pay.amount,0);
  },0);
  const fmtILS = v => v>0?'₪'+Number(v).toLocaleString('he-IL'):'—';

  const tabs = [
    { id:'overview',    lbl:'סקירה' },
    { id:'tasks',       lbl:`משימות (${projectTasks.length})` },
    { id:'subprojects', lbl:`תת-פרויקטים (${subProjects.length})` },
    { id:'products',    lbl:`רכש (${products.length})` },
  ];

  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
        <button onClick={()=>go('projects')} className="btn btn-secondary btn-sm"><I n="back" s={14} c="#475569"/> חזור</button>
        <div style={{flex:1}}>
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <span style={{fontSize:22}}>{pt.emoji}</span>
            <h2 style={{fontWeight:700,fontSize:20,margin:0}}>{project.name}</h2>
            <span className="badge" style={{background:ps.bg,color:ps.cl}}>{ps.lbl}</span>
            {project.parentProjectId&&<span className="badge" style={{background:'#f3e8ff',color:'#7c3aed'}}>
              תת-פרויקט של: {allProjects.find(p=>p.id===project.parentProjectId)?.name||''}
            </span>}
          </div>
          {project.notes&&<div style={{fontSize:13,color:'#64748b',marginTop:4}}>{project.notes}</div>}
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary btn-sm" onClick={()=>setEditModal(true)}><I n="edit" s={13} c="#475569"/> עריכה</button>
          <button className="btn btn-danger btn-sm" onClick={()=>{ if(window.confirm('למחוק פרויקט זה?')) onDelete(); }}>🗑</button>
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:'flex',gap:0,borderBottom:'2px solid #e2e8f0',marginBottom:20}}>
        {tabs.map(t=>(
          <button key={t.id} className={`tab-btn${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>{t.lbl}</button>
        ))}
      </div>

      {/* Overview */}
      {tab==='overview'&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          {/* Progress */}
          <div className="card" style={{padding:18,gridColumn:'1/-1'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
              <span style={{fontWeight:600,fontSize:14}}>התקדמות</span>
              <span style={{fontWeight:700,color:'#4f46e5'}}>{progress}%</span>
            </div>
            <div style={{background:'#e2e8f0',borderRadius:99,height:10,overflow:'hidden'}}>
              <div style={{width:progress+'%',background:'#4f46e5',height:'100%',borderRadius:99,transition:'width .4s'}}/>
            </div>
            <div style={{display:'flex',gap:16,marginTop:8,fontSize:12,color:'#64748b'}}>
              <span>סה"כ: {projectTasks.length} משימות</span>
              <span style={{color:'#16a34a'}}>הושלמו: {completedTasks.length}</span>
              <span style={{color:'#d97706'}}>פתוחות: {projectTasks.length-completedTasks.length}</span>
            </div>
          </div>
          {/* Timeline */}
          <div className="card" style={{padding:18}}>
            <div style={{fontWeight:600,fontSize:14,marginBottom:10}}>לוח זמנים</div>
            <div style={{fontSize:13,color:'#475569',display:'flex',flexDirection:'column',gap:6}}>
              {project.startDate&&<div>🟢 התחלה: <strong>{project.startDate}</strong></div>}
              {project.dueDate&&<div>🏁 יעד: <strong>{project.dueDate}</strong></div>}
              {!project.startDate&&!project.dueDate&&<div style={{color:'#94a3b8'}}>לא הוגדרו תאריכים</div>}
            </div>
          </div>
          {/* Budget */}
          <div className="card" style={{padding:18}}>
            <div style={{fontWeight:600,fontSize:14,marginBottom:10}}>תקציב</div>
            <div style={{fontSize:13,color:'#475569',display:'flex',flexDirection:'column',gap:6}}>
              {project.budget>0&&<div>📋 מתוכנן: <strong>{fmtILS(project.budget)}</strong></div>}
              {winnerTotal>0&&<div>🤝 ספקים זוכים: <strong>{fmtILS(winnerTotal)}</strong></div>}
              {paidTotal>0&&<div style={{color:'#16a34a'}}>✅ שולם: <strong>{fmtILS(paidTotal)}</strong></div>}
              {winnerTotal>paidTotal&&<div style={{color:'#dc2626'}}>⏳ נותר: <strong>{fmtILS(winnerTotal-paidTotal)}</strong></div>}
            </div>
          </div>
          {/* Linked contacts */}
          {projectContacts.length>0&&(
            <div className="card" style={{padding:18,gridColumn:'1/-1'}}>
              <div style={{fontWeight:600,fontSize:14,marginBottom:10}}>לקוח/ספק מקושר</div>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {projectContacts.map(client=>(
                  <div key={client.id} style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:34,height:34,borderRadius:'50%',background:'#eef2ff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,color:'#4f46e5',fontSize:14,flexShrink:0}}>
                      {client.name[0]}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:600,fontSize:13}}>{client.name}</div>
                      {client.phone&&<div style={{fontSize:11,color:'#64748b'}}>{client.phone}</div>}
                    </div>
                    <button className="btn btn-secondary btn-sm" onClick={()=>go('contact-detail',client.id)}>פתח כרטיס</button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* Tasks */}
      {tab==='tasks'&&(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <h3 style={{fontWeight:700,fontSize:15}}>משימות הפרויקט</h3>
            <button className="btn btn-primary btn-sm" onClick={()=>onAddTask({type:'task',projectId:project.id})}>
              <I n="plus" s={13} c="#fff"/> הוסף משימה
            </button>
          </div>
          {projectTasks.length===0&&(
            <div style={{textAlign:'center',color:'#94a3b8',padding:'32px 0'}}>אין משימות עדיין</div>
          )}
          {projectTasks.map(t=>(
            <div key={t.id} className="task-line" style={{cursor:'pointer',opacity:t.completed?.6:1}} onClick={()=>onEditTask(t)}>
              <div style={{width:18,height:18,borderRadius:'50%',border:'2px solid '+(t.completed?'#16a34a':'#cbd5e1'),background:t.completed?'#16a34a':'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                {t.completed&&<span style={{color:'#fff',fontSize:10}}>✓</span>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:500,fontSize:14,color:t.completed?'#94a3b8':'#1e293b',textDecoration:t.completed?'line-through':'none'}}>{t.title}</div>
                {t.dueDate&&<div style={{fontSize:12,color:'#64748b'}}>{t.dueDate}{t.dueTime?' · '+t.dueTime:''}</div>}
              </div>
              {t.taskType&&<span className="pill" style={{fontSize:11}}>{t.taskType}</span>}
            </div>
          ))}
        </div>
      )}

      {/* Sub-projects */}
      {tab==='subprojects'&&(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <h3 style={{fontWeight:700,fontSize:15}}>תת-פרויקטים</h3>
            <button className="btn btn-primary btn-sm" onClick={()=>setAddSubProjModal(true)}>
              <I n="plus" s={13} c="#fff"/> הוסף תת-פרויקט
            </button>
          </div>
          {subProjects.length===0&&(
            <div style={{textAlign:'center',color:'#94a3b8',padding:'32px 0'}}>אין תת-פרויקטים עדיין</div>
          )}
          {subProjects.map(sp=>{
            const spTasks = tasks.filter(t=>t.projectId===sp.id);
            const spDone  = spTasks.filter(t=>t.completed).length;
            const spProg  = spTasks.length>0?Math.round(spDone/spTasks.length*100):0;
            const sps = getProjStatus(sp.status);
            return (
              <div key={sp.id} className="card" style={{padding:16,marginBottom:10,cursor:'pointer'}} onClick={()=>go('project-detail',sp.id)}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                  <span>{PROJ_TYPES[sp.type]?.emoji||'📁'}</span>
                  <span style={{fontWeight:600,fontSize:14,flex:1}}>{sp.name}</span>
                  <span className="badge" style={{background:sps.bg,color:sps.cl,fontSize:11}}>{sps.lbl}</span>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div style={{flex:1,background:'#e2e8f0',borderRadius:99,height:6,overflow:'hidden'}}>
                    <div style={{width:spProg+'%',background:'#4f46e5',height:'100%',borderRadius:99}}/>
                  </div>
                  <span style={{fontSize:12,color:'#64748b',whiteSpace:'nowrap'}}>{spDone}/{spTasks.length} משימות · {spProg}%</span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Products */}
      {tab==='products'&&(
        <ProjectProductsTab project={project} contacts={contacts} onUpdate={onUpdate}/>
      )}

      {editModal&&<ProjectModal project={project} contacts={contacts} projects={allProjects} onSave={d=>{onUpdate({...project,...d});setEditModal(false);}} onClose={()=>setEditModal(false)}/>}
      {addSubProjModal&&<ProjectModal contacts={contacts} projects={allProjects} onSave={async d=>{ await onAddSubProject({...d,parentProjectId:project.id}); setAddSubProjModal(false); }} onClose={()=>setAddSubProjModal(false)}/>}
    </div>
  );
}
