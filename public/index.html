            {tab==='tasks' && <TasksTab tasks={cTasks} onGoTasks={()=>go('tasks')} onEdit={onEditTask}/>}

            {tab==='quotes' && <ContactQuotesTab quotes={cQuotes} contact={c} contacts={contacts||[]} onOrderCreated={onOrderCreated} onQuoteCreated={onOrderCreated}/>}
            {tab==='orders' && <ContactOrdersTab orders={cOrders} contact={c}/>}

            {tab==='emails' && (
              <div>
                {/* Header */}
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,gap:8,flexWrap:'wrap'}}>
                  <div style={{fontSize:14,fontWeight:600,color:'#1e293b'}}>📧 תכתובת מייל עם {c.name}</div>
                  <div style={{display:'flex',gap:6}}>
                    <button className="btn btn-secondary btn-sm" onClick={()=>{ loadAccounts(); setShowAcctMgr(v=>!v); }}
                      style={{fontSize:12}}>⚙️ חשבונות Gmail</button>
                    <button className="btn btn-secondary btn-sm" onClick={loadEmails} disabled={emailsLoading}>
                      {emailsLoading ? '⏳' : '🔄 רענן'}
                    </button>
                  </div>
                </div>

                {/* Account manager panel */}
                {showAcctMgr && (
                  <div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'12px 14px',marginBottom:14,fontSize:13}}>
                    <div style={{fontWeight:600,marginBottom:10,color:'#1e293b'}}>חשבונות Gmail מחוברים</div>
                    {accounts===null && <div style={{color:'#94a3b8'}}>⏳ טוען...</div>}
                    {accounts!==null && accounts.length===0 && <div style={{color:'#94a3b8'}}>אין חשבונות — חבר לגוגל בהגדרות</div>}
                    {accounts!==null && accounts.map(a=>(
                      <div key={a.email} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,padding:'6px 8px',background:'#fff',borderRadius:7,border:'1px solid #e2e8f0'}}>
                        <span style={{width:8,height:8,borderRadius:'50%',background:acctColor(a.email),flexShrink:0,display:'inline-block'}}/>
                        <div style={{flex:1}}>
                          <div style={{fontWeight:600,fontSize:12,color:'#1e293b'}}>{a.name}</div>
                          <div style={{fontSize:11,color:'#94a3b8'}}>{a.email}</div>
                        </div>
                        {a.isPrimary && <span style={{fontSize:11,color:'#4f46e5',fontWeight:600}}>ראשי</span>}
                        {!a.isPrimary && (
                          <button className="btn btn-danger btn-sm" style={{fontSize:11,padding:'2px 8px'}}
                            disabled={acctLoading} onClick={()=>deleteAccount(a.email)}>הסר</button>
                        )}
                      </div>
                    ))}
                    <a href="/auth/google/add" className="btn btn-secondary btn-sm"
                      style={{display:'inline-block',marginTop:6,fontSize:12,textDecoration:'none'}}>
                      ➕ הוסף חשבון Gmail
                    </a>
                  </div>
                )}

                {!c.email && (
                  <div style={{textAlign:'center',padding:32,color:'#94a3b8'}}>
                    <div style={{fontSize:32,marginBottom:8}}>📧</div>
                    <div>אין כתובת מייל לאיש קשר זה</div>
                  </div>
                )}
                {c.email && emailsLoading && (
                  <div style={{textAlign:'center',padding:32,color:'#94a3b8'}}>⏳ טוען מיילים מכל החשבונות...</div>
                )}
                {c.email && !emailsLoading && emails!==null && emails.length===0 && (
                  <div style={{textAlign:'center',padding:32,color:'#94a3b8'}}>
                    <div style={{fontSize:32,marginBottom:8}}>📭</div>
                    <div>לא נמצאו מיילים עם {c.email}</div>
                    <div style={{fontSize:12,marginTop:6}}>אם זו הפעם הראשונה — יש לחבר מחדש את גוגל כדי לאשר הרשאת Gmail</div>
                  </div>
                )}
                {c.email && !emailsLoading && emails && emails.length>0 && React.createElement(React.Fragment, null,
                  (() => {
                    const visibleEmails = emails.filter(em=>!dismissedEmails.has(em.id));
                    const visibleIds = visibleEmails.map(em=>em.id);
                    return (
                      <div>
                        {/* Bulk action bar */}
                        {selectedEmails.size>0 && (
                          <div style={{background:'#4f46e5',color:'#fff',padding:'8px 14px',borderRadius:8,marginBottom:10,display:'flex',alignItems:'center',gap:10}}>
                            <input type="checkbox"
                              checked={selectedEmails.size===visibleIds.length}
                              ref={el=>{if(el) el.indeterminate=selectedEmails.size>0&&selectedEmails.size<visibleIds.length;}}
                              onChange={()=>toggleAllEmails(visibleIds)}
                              style={{cursor:'pointer',width:15,height:15}}/>
                            <span style={{fontWeight:700,fontSize:13}}>{selectedEmails.size} נבחרו</span>
                            <button onClick={()=>setSelectedEmails(new Set())}
                              style={{background:'rgba(255,255,255,0.2)',border:'none',color:'#fff',cursor:'pointer',borderRadius:6,padding:'2px 10px',fontSize:12}}>
                              ✕ ביטול
                            </button>
                            <button onClick={dismissSelected}
                              style={{marginRight:'auto',background:'#ef4444',border:'none',color:'#fff',cursor:'pointer',borderRadius:6,padding:'4px 14px',fontSize:13,fontWeight:600}}>
                              🗑️ הסתר נבחרים
                            </button>
                          </div>
                        )}
                        {/* Select-all header row */}
                        {visibleEmails.length>0 && (
                          <div style={{display:'flex',alignItems:'center',gap:8,padding:'4px 4px 8px',borderBottom:'2px solid #f1f5f9',marginBottom:4}}>
                            <input type="checkbox"
                              checked={visibleIds.length>0 && selectedEmails.size===visibleIds.length}
                              ref={el=>{if(el) el.indeterminate=selectedEmails.size>0&&selectedEmails.size<visibleIds.length;}}
                              onChange={()=>toggleAllEmails(visibleIds)}
                              style={{cursor:'pointer',width:14,height:14}}/>
                            <span style={{fontSize:12,color:'#94a3b8'}}>
                              {selectedEmails.size>0 ? `${selectedEmails.size} נבחרו` : 'בחר הכל'}
                            </span>
                          </div>
                        )}
                        {/* Signature picker for email compose */}
                        {emailSigs.length > 0 && (
                          <div style={{background:'#faf5ff',border:'1px solid #e9d5ff',borderRadius:8,padding:'8px 12px',marginBottom:10,display:'flex',alignItems:'center',gap:10}}>
                            <span style={{fontSize:12,fontWeight:600,color:'#7c3aed',whiteSpace:'nowrap'}}>✍️ חתימה להשב/להעביר:</span>
                            <select style={{flex:1,fontSize:12,padding:'3px 8px',borderRadius:6,border:'1px solid #ddd'}}
                              value={selEmailSig} onChange={e=>setSelEmailSig(e.target.value)}>
                              <option value="none">ללא חתימה</option>
                              {emailSigs.map(s=>(
                                <option key={s.id} value={s.id}>{s.name}{s.isDefault?' (ברירת מחדל)':''}</option>
                              ))}
                            </select>
                          </div>
                        )}
                        {/* Email rows */}
                        {visibleEmails.map(em => {
                          const sigObj = selEmailSig !== 'none' ? emailSigs.find(s=>s.id===selEmailSig) : null;
                          const sigBody = sigObj ? encodeURIComponent('\n\n--\n' + sigObj.text) : '';
                          const replyUrl = `https://mail.google.com/mail/u/?authuser=${encodeURIComponent(em.account||'')}&view=cm&fs=1&to=${encodeURIComponent(c.email)}&subject=${encodeURIComponent('Re: '+(em.subject||''))}&body=${sigBody}`;
                          const fwdUrl   = `https://mail.google.com/mail/u/?authuser=${encodeURIComponent(em.account||'')}&view=cm&fs=1&su=${encodeURIComponent('Fwd: '+(em.subject||''))}&body=${sigBody}`;
                          const isSel = selectedEmails.has(em.id);
                          return (
                            <div key={em.id} style={{borderBottom:'1px solid #f1f5f9',padding:'10px 4px',borderRadius:8,
                              background:isSel?'#eef2ff':expandedEmail===em.id?'#f8fafc':'transparent',transition:'background 0.1s'}}
                              onMouseEnter={e=>{if(!isSel&&expandedEmail!==em.id) e.currentTarget.style.background='#f8fafc';}}
                              onMouseLeave={e=>{if(!isSel&&expandedEmail!==em.id) e.currentTarget.style.background='transparent';}}>
                              {/* Row: checkbox + summary */}
                              <div style={{display:'flex',alignItems:'center',gap:8}}>
                                <input type="checkbox" checked={isSel}
                                  onChange={e=>toggleEmailSelect(em.id,e)}
                                  onClick={e=>e.stopPropagation()}
                                  style={{cursor:'pointer',width:14,height:14,flexShrink:0}}/>
                                <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer',flex:1}}
                                  onClick={()=>setExpandedEmail(expandedEmail===em.id?null:em.id)}>
                                  <span style={{fontSize:16}}>{em.direction==='out'?'📤':'📥'}</span>
                                  <div style={{flex:1,minWidth:0}}>
                                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,flexWrap:'wrap'}}>
                                      <span style={{fontWeight:600,fontSize:13,color:'#1e293b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:240}}>{em.subject}</span>
                                      {em.account && (
                                        <span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:acctColor(em.account)+'22',color:acctColor(em.account),fontWeight:600,whiteSpace:'nowrap',border:`1px solid ${acctColor(em.account)}44`}}>
                                          {acctLabel(em.account)}
                                        </span>
                                      )}
                                      <span style={{fontSize:11,color:'#94a3b8',whiteSpace:'nowrap',marginRight:'auto'}}>{fmtEmailDate(em.date)}</span>
                                    </div>
                                    <div style={{fontSize:12,color:'#64748b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                                      <span style={{color:em.direction==='out'?'#4f46e5':'#059669',fontWeight:600,marginLeft:4}}>
                                        {em.direction==='out'?'שלחת':'קיבלת'}
                                      </span>
                                      {em.snippet}
                                    </div>
                                  </div>
                                </div>
                              </div>
                              {/* Expanded detail */}
                              {expandedEmail===em.id && (
                                <div style={{marginTop:10,padding:'10px 12px',background:'#f1f5f9',borderRadius:8,fontSize:13,marginRight:22}}>
                                  <div style={{marginBottom:4,color:'#475569'}}><b>מאת:</b> {em.from}</div>
                                  <div style={{marginBottom:4,color:'#475569'}}><b>אל:</b> {em.to}</div>
                                  {em.account && <div style={{marginBottom:8,color:'#475569'}}><b>דרך:</b> <span style={{color:acctColor(em.account),fontWeight:600}}>{em.account}</span></div>}
                                  <div style={{color:'#1e293b',lineHeight:1.6,marginBottom:10}}>{em.snippet}</div>
                                  <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                                    <a href={replyUrl} target="_blank" rel="noreferrer"
                                      className="btn btn-primary btn-sm" style={{fontSize:12,textDecoration:'none'}}>↩ השב</a>
                                    <a href={fwdUrl} target="_blank" rel="noreferrer"
                                      className="btn btn-secondary btn-sm" style={{fontSize:12,textDecoration:'none'}}>↪ העבר</a>
                                    <a href={`https://mail.google.com/mail/u/?authuser=${encodeURIComponent(em.account||'')}#search/${em.id}`}
                                      target="_blank" rel="noreferrer"
                                      style={{fontSize:12,color:'#4f46e5',textDecoration:'none',fontWeight:600,alignSelf:'center'}}>
                                      📬 פתח ב-Gmail ←
                                    </a>
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()
                )}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Tasks List ───────────────────────────────────────────────────────────────
function TasksList({ tasks, contacts, orgs, onAdd, onUpdate, onDelete, onEdit, defaultType }) {
  const ctx = useContext(ListsCtx);
  const taskStatuses = ctx ? ctx.get('taskStatus', DEF_TASK_STATUS) : DEF_TASK_STATUS;
  const [tf,       setTf]       = useState(defaultType||'all');
  const [sf,       setSf]       = useState('all');   // task status filter
  const [noDate,   setNoDate]   = useState(false);
  const [showPast, setShowPast] = useState(false);
  const [q,        setQ]        = useState('');
  const orgMap  = Object.fromEntries(orgs.map(o=>[o.id,o]));
  const contMap = Object.fromEntries(contacts.map(c=>[c.id,c]));

  const isEventsView = defaultType==='event';
  const isTasksView  = defaultType==='task';
  const todayStr = today();

  const filtered = tasks.filter(t=>{
    const qm=!q||t.title.toLowerCase().includes(q.toLowerCase());
    const tm=tf==='all'||t.type===tf;
    const sm=sf==='all'||(sf==='__done__'&&t.completed)||(sf!=='__done__'&&!t.completed&&(!t.taskStatus||t.taskStatus===sf||sf==='all'));
    const dm=!noDate||!t.dueDate;
    const pm=!isEventsView||showPast||!t.dueDate||t.dueDate>=todayStr;
    return qm&&tm&&sm&&dm&&pm;
  }).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));

  const title = isEventsView ? '🎭 אירועים' : isTasksView ? '📋 משימות' : 'משימות ואירועים';
  const addLabel = isEventsView ? 'הוסף אירוע' : isTasksView ? 'הוסף משימה' : 'הוסף חדשה';
  const emptyMsg = isEventsView ? 'אין אירועים' : 'אין משימות';

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h1 style={{fontSize:24,fontWeight:700}}>{title}</h1>
        <button className="btn btn-primary" onClick={onAdd}><I n="plus" s={15} c="#fff"/>{addLabel}</button>
      </div>
      <div className="card" style={{padding:14,marginBottom:14}}>
        <div style={{position:'relative',marginBottom:10}}>
          <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)'}}><I n="search" s={15} c="#94a3b8"/></span>
          <input className="inp" value={q} onChange={e=>setQ(e.target.value)} placeholder={`חיפוש ${isEventsView?'אירוע':'משימה'}...`} style={{paddingRight:36}}/>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {!isEventsView && !isTasksView && <>
            <FBtn l="הכל" a={tf==='all'} onClick={()=>setTf('all')}/>
            <FBtn l="📋 משימות" a={tf==='task'} onClick={()=>setTf(tf==='task'?'all':'task')}/>
            <FBtn l="🎭 אירועים" a={tf==='event'} onClick={()=>setTf(tf==='event'?'all':'event')}/>
            <div style={{borderRight:'1px solid #e2e8f0',margin:'0 2px'}}/>
          </>}
          {!isEventsView && <>
            <FBtn l="הכל" a={sf==='all'} onClick={()=>setSf('all')} cnt={tasks.filter(t=>t.type!=='event').length}/>
            {taskStatuses.map(s=>{
              const col=TASK_ST_COL[s]||{bg:'#f1f5f9',cl:'#475569'};
              return <FBtn key={s} l={s} a={sf===s} onClick={()=>setSf(s)}
                cnt={tasks.filter(t=>t.type!=='event'&&(t.taskStatus===s||(s==='נפתחה'&&!t.taskStatus&&!t.completed))).length}
                bg={col.bg} cl={col.cl}/>;
            })}
            <div style={{borderRight:'1px solid #e2e8f0',margin:'0 2px'}}/>
            <FBtn l="⏳ ללא תאריך" a={noDate} onClick={()=>setNoDate(p=>!p)}/>
          </>}
          {isEventsView && <>
            <FBtn l="📅 קרובים" a={!showPast} onClick={()=>setShowPast(false)}/>
            <FBtn l="🗂 שהתקיימו" a={showPast} onClick={()=>setShowPast(true)}/>
          </>}
        </div>
      </div>
      <div className="card" style={{padding:14}}>
        {filtered.length===0 ? <EmptyState icon={isEventsView?'calendar':'check'} msg={emptyMsg}/> : filtered.map(t=>{
          const cont = contMap[t.contactId];
          const org  = orgMap[t.organizationId];
          const isPast = t.dueDate && t.dueDate < todayStr;
          const isToday = t.dueDate === todayStr;
          const overdue = !t.completed && !isEventsView && t.dueDate && isPast;
          const evtDT      = t.startDateTime ? new Date(t.startDateTime) : null;
          const evtTimeStr = evtDT ? evtDT.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) : null;
          const evtDateLbl = isToday ? 'היום' : t.dueDate ? fmtD(t.dueDate) : null;
          const evtDateStr = evtTimeStr
            ? (evtDateLbl ? `${evtDateLbl} · ${evtTimeStr}` : evtTimeStr)
            : evtDateLbl;
          return (
            <div key={t.id} className="task-line" style={{opacity:t.completed||isPast?0.75:1,borderColor:overdue?'#fecaca':t.type==='event'?'#e0e7ff':'#e2e8f0'}}>
              <div style={{paddingTop:2}}>
                <input type="checkbox" checked={!!t.completed} onChange={e=>onUpdate(t.id,{...t,completed:e.target.checked})}
                  style={{width:18,height:18,cursor:'pointer',accentColor:'#4f46e5'}}/>
              </div>
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3,flexWrap:'wrap'}}>
                  <span style={{fontWeight:600,fontSize:14,textDecoration:t.completed?'line-through':'none',color:t.completed?'#94a3b8':'#1e293b'}}>{t.title}</span>
                  {!isEventsView && !isTasksView && (
                    <span style={{fontSize:11,background:t.type==='event'?'#e0e7ff':'#f0fdf4',color:t.type==='event'?'#3730a3':'#166534',padding:'1px 7px',borderRadius:10,fontWeight:600}}>
                      {t.type==='event'?'🎭 אירוע':'📋 משימה'}
                    </span>
                  )}
                  {isEventsView && evtDateStr && (
                    <span style={{fontSize:12,background:isToday?'#fef3c7':isPast?'#f1f5f9':'#e0e7ff',color:isToday?'#92400e':isPast?'#94a3b8':'#3730a3',padding:'2px 9px',borderRadius:10,fontWeight:700}}>
                      {isPast ? `🗂 ${evtDateStr}` : `📅 ${evtDateStr}`}
                    </span>
                  )}
                  <span style={{fontSize:11,color:PRIO_CL[t.priority]||'#94a3b8',fontWeight:600}}>{PRIO[t.priority]||''}</span>
                </div>
                <div style={{display:'flex',gap:12,flexWrap:'wrap',fontSize:12,color:overdue?'#dc2626':'#64748b'}}>
                  {!isEventsView && t.dueDate && <span>🗓 {fmtD(t.dueDate)}</span>}
                  {t.location && <span>📍 {t.location}</span>}
                  {cont && <span style={{color:'#4f46e5'}}>👤 {cont.name}</span>}
                  {org  && <span style={{color:'#7c3aed'}}>🏢 {org.name}</span>}
                  {t.fromGoogle && <span style={{color:'#0891b2'}}>🔄 מגוגל</span>}
                </div>
                {t.notes && <p style={{fontSize:12,color:'#64748b',marginTop:4,fontStyle:'italic'}}>{t.notes}</p>}
              </div>
              <div style={{display:'flex',gap:5,flexShrink:0}}>
                <button onClick={()=>onEdit&&onEdit(t)} className="btn btn-secondary btn-xs" title="ערוך"><I n="edit" s={12}/></button>
                <button onClick={()=>onDelete(t.id)} className="btn btn-danger btn-xs" title="מחק"><I n="trash" s={12}/></button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Lists Manager (Settings section) ────────────────────────────────────────
function ListsManager() {
  const ctx = useContext(ListsCtx);
  if (!ctx) return null;
  const { C, get, add, del, delDef, allStatus, addStatus, delStatus, delBuiltinStatus, renameStatus } = ctx;
  const [ni, setNi] = useState({});
  const [ns, setNs] = useState({ l:'', pi:0 });
  const [editingStatusKey, setEditingStatusKey] = useState(null);
  const [editingStatusVal, setEditingStatusVal] = useState('');
  const setN = (k,v) => setNi(p=>({...p,[k]:v}));
  const doAdd = k => { add(k,(ni[k]||'').trim()); setN(k,''); };
  const sections = [
    { key:'source',   label:'מקורות' ,  defs: DEF_SOURCE },
    { key:'role',     label:'תפקידים',  defs: DEF_ROLE },
    { key:'showName', label:'שמות מופעים / הרצאות', defs: DEF_SHOW_NAME },
    { key:'tags',     label:'תגיות',    defs: DEF_TAGS },
    { key:'convType', label:'סוגי שיחות נוספים', defs: [] },
    { key:'showStatus', label:'סטטוסי מופע נוספים', defs: [] },
    { key:'taskStatus',   label:'סטטוסי משימה',    defs: DEF_TASK_STATUS },
    { key:'taskType',     label:'סוגי משימה',      defs: DEF_TASK_TYPE },
    { key:'meetingType',   label:'סוגי פגישה 📅',    defs: DEF_MEETING_TYPES },
    { key:'projectType',   label:'סוגי פרויקט 📁',   defs: Object.values(PROJ_TYPES).map(v=>v.lbl) },
    { key:'projectStatus', label:'סטטוסי פרויקט 📁', defs: Object.values(PROJ_STATUS).map(v=>v.lbl) },
  ];
  const customStatuses = C.customStatus || [];
  const deletedStatuses = new Set(C.deletedStatuses || []);
  return (
    <div className="card" style={{padding:22,marginBottom:20}}>
      <h2 style={{fontSize:17,fontWeight:700,marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
        <I n="tag" s={18} c="#4f46e5"/>ניהול רשימות
      </h2>
      <p style={{fontSize:13,color:'#64748b',marginBottom:20}}>לחץ ✕ למחיקת פריט. <span style={{color:'#166534',background:'#dcfce7',padding:'1px 6px',borderRadius:8,fontSize:12}}>ירוק = הוספה שלך</span> · <span style={{color:'#3730a3',background:'#e0e7ff',padding:'1px 6px',borderRadius:8,fontSize:12}}>כחול = ברירת מחדל</span></p>

      {sections.map(({key,label,defs})=>{
        const all = get(key, defs);
        const custom = C[key]||[];
        return (
          <div key={key} style={{marginBottom:18,paddingBottom:18,borderBottom:'1px solid #f1f5f9'}}>
            <div className="lbl" style={{marginBottom:8}}>{label}</div>
            {all.length>0 && (
              <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:8}}>
                {all.map(item=>{
                  const isCustom = custom.includes(item);
                  return (
                    <span key={item} className="pill" style={{background:isCustom?'#dcfce7':'#e0e7ff',color:isCustom?'#166534':'#3730a3',display:'inline-flex',alignItems:'center',gap:3}}>
                      {item}
                      <button type="button"
                        onClick={()=> isCustom ? del(key,item) : delDef(key,item)}
                        style={{border:'none',background:'none',cursor:'pointer',color:'#dc2626',padding:'0 1px',fontSize:14,lineHeight:1,opacity:0.7}}
                        title="מחק">✕</button>
                    </span>
                  );
                })}
              </div>
            )}
            <div style={{display:'flex',gap:6}}>
              <input className="inp" style={{flex:1,fontSize:13}} value={ni[key]||''} onChange={e=>setN(key,e.target.value)}
                placeholder={`הוסף ${label}...`} onKeyDown={e=>e.key==='Enter'&&doAdd(key)}/>
              <button type="button" className="btn btn-primary btn-sm" onClick={()=>doAdd(key)}>הוסף</button>
            </div>
          </div>
        );
      })}

      {/* Status management */}
      <div>
        <div className="lbl" style={{marginBottom:8}}>סטאטוס לקוח</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
          {Object.entries(STATUS).filter(([k])=>!deletedStatuses.has(k)).map(([k,v])=>{
            const overriddenLabel = (C.statusLabels||{})[k] || v.lbl;
            const isEditing = editingStatusKey === k;
            return (
              <span key={k} className="badge" style={{background:v.bg,color:v.cl,display:'inline-flex',alignItems:'center',gap:3,paddingLeft:4}}>
                {isEditing ? (
                  <input autoFocus value={editingStatusVal}
                    onChange={e=>setEditingStatusVal(e.target.value)}
                    onKeyDown={e=>{ if(e.key==='Enter'){renameStatus(k,editingStatusVal);setEditingStatusKey(null);} if(e.key==='Escape')setEditingStatusKey(null); }}
                    style={{border:'none',background:'rgba(255,255,255,0.6)',borderRadius:4,padding:'1px 4px',fontSize:12,width:80,color:v.cl,outline:'1px solid '+v.cl}}/>
                ) : overriddenLabel}
                {isEditing ? (
                  <button type="button" onClick={()=>{renameStatus(k,editingStatusVal);setEditingStatusKey(null);}}
                    style={{border:'none',background:'none',cursor:'pointer',color:v.cl,padding:'0 1px',fontSize:12,opacity:0.9}} title="שמור">✓</button>
                ) : (
                  <button type="button" onClick={()=>{setEditingStatusKey(k);setEditingStatusVal(overriddenLabel);}}
                    style={{border:'none',background:'none',cursor:'pointer',color:v.cl,padding:'0 1px',fontSize:11,opacity:0.6}} title="ערוך שם">✏️</button>
                )}
                <button type="button" onClick={()=>{if(editingStatusKey===k)setEditingStatusKey(null);delBuiltinStatus(k);}}
                  style={{border:'none',background:'none',cursor:'pointer',color:v.cl,padding:'0 1px',fontSize:13,opacity:0.7}} title="מחק">✕</button>
              </span>
            );
          })}
          {customStatuses.map(s=>{
            const overriddenLabel = (C.statusLabels||{})[s.k] || s.l;
            const isEditing = editingStatusKey === s.k;
            return (
              <span key={s.k} className="badge" style={{background:s.bg,color:s.cl,display:'inline-flex',alignItems:'center',gap:3,paddingLeft:4}}>
                {isEditing ? (
                  <input autoFocus value={editingStatusVal}
                    onChange={e=>setEditingStatusVal(e.target.value)}
                    onKeyDown={e=>{ if(e.key==='Enter'){renameStatus(s.k,editingStatusVal);setEditingStatusKey(null);} if(e.key==='Escape')setEditingStatusKey(null); }}
                    style={{border:'none',background:'rgba(255,255,255,0.6)',borderRadius:4,padding:'1px 4px',fontSize:12,width:80,color:s.cl,outline:'1px solid '+s.cl}}/>
                ) : overriddenLabel}
                {isEditing ? (
                  <button type="button" onClick={()=>{renameStatus(s.k,editingStatusVal);setEditingStatusKey(null);}}
                    style={{border:'none',background:'none',cursor:'pointer',color:s.cl,padding:'0 1px',fontSize:12,opacity:0.9}} title="שמור">✓</button>
                ) : (
                  <button type="button" onClick={()=>{setEditingStatusKey(s.k);setEditingStatusVal(overriddenLabel);}}
                    style={{border:'none',background:'none',cursor:'pointer',color:s.cl,padding:'0 1px',fontSize:11,opacity:0.6}} title="ערוך שם">✏️</button>
                )}
                <button type="button" onClick={()=>{if(editingStatusKey===s.k)setEditingStatusKey(null);delStatus(s.k);}}
                  style={{border:'none',background:'none',cursor:'pointer',color:s.cl,padding:'0 1px',fontSize:13,opacity:0.7}} title="מחק">✕</button>
              </span>
            );
          })}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <input className="inp" style={{flex:1,minWidth:140,fontSize:13}} value={ns.l} onChange={e=>setNs(p=>({...p,l:e.target.value}))} placeholder="שם סטטוס חדש..."/>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <span style={{fontSize:12,color:'#64748b'}}>צבע:</span>
            {STATUS_PAL.map(([bg,cl],i)=>(
              <button key={i} type="button" onClick={()=>setNs(p=>({...p,pi:i}))}
                style={{width:22,height:22,borderRadius:'50%',background:bg,border:`2px solid ${ns.pi===i?cl:'#e2e8f0'}`,cursor:'pointer'}}/>
            ))}
          </div>
          <button type="button" className="btn btn-primary btn-sm" onClick={()=>{
            if(!ns.l.trim()) return;
            const k='cs_'+Date.now();
            const [bg,cl]=STATUS_PAL[ns.pi];
            addStatus(k,ns.l.trim(),bg,cl);
            setNs({l:'',pi:0});
          }}>הוסף סטטוס</button>
        </div>
      </div>
    </div>
  );
}

// ─── Shows View (all shows across contacts & orgs) ───────────────────────────
function ShowsView({ contacts, orgs, shows=[], go, onAdd, onEditShow, onDeleteShow, waStatus }) {
  const [q, setQ] = useState('');
  const [sf, setSf] = useState('all');
  const [detailShow, setDetailShow] = useState(null);
  const SC={inquiry:'#dbeafe',proposal:'#fef3c7',scheduled:'#dcfce7',completed:'#e0e7ff',cancelled:'#fee2e2'};
  const ST={inquiry:'#1d4ed8',proposal:'#92400e',scheduled:'#166534',completed:'#3730a3',cancelled:'#991b1b'};
  // Collect all shows from contacts, orgs, and standalone
  const allShows = [
    ...contacts.flatMap(c=>(c.showHistory||[]).map(sh=>({...sh,_source:'contact',_sourceName:c.name,_sourceId:c.id}))),
    ...orgs.flatMap(o=>(o.showHistory||[]).map(sh=>({...sh,_source:'org',_sourceName:o.name,_sourceId:o.id}))),
    ...shows.map(sh=>({...sh,_source:'standalone',_sourceName:'',_sourceId:sh.id})),
  ].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const filtered = allShows.filter(sh=>{
    const qm=!q||(sh.showName||'').includes(q)||(sh.venue||'').includes(q)||(sh._sourceName||'').includes(q);
    const fm=sf==='all'||sh.status===sf;
    return qm&&fm;
  });
  const statuses = [...new Set(allShows.map(sh=>sh.status).filter(Boolean))];
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h1 style={{fontSize:24,fontWeight:700}}>🎤 מופעים</h1>
        <button className="btn btn-primary" onClick={onAdd}><I n="plus" s={15} c="#fff"/>מופע חדש</button>
      </div>
      <div className="card" style={{padding:16,marginBottom:14}}>
        <div style={{position:'relative',marginBottom:10}}>
          <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)'}}><I n="search" s={15} c="#94a3b8"/></span>
          <input className="inp" placeholder="חיפוש לפי שם מופע, מקום, איש קשר..." value={q} onChange={e=>setQ(e.target.value)} style={{paddingRight:36}}/>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <FBtn l="הכל" a={sf==='all'} onClick={()=>setSf('all')} cnt={allShows.length}/>
          {statuses.map(s=><FBtn key={s} l={SHOW_ST[s]||s} a={sf===s} onClick={()=>setSf(s)} cnt={allShows.filter(sh=>sh.status===s).length} bg={SC[s]} cl={ST[s]}/>)}
        </div>
      </div>
      {detailShow && (
        <ShowDetailModal
          show={detailShow}
          contacts={contacts}
          waStatus={waStatus}
          onClose={()=>setDetailShow(null)}
          onEdit={()=>{ onEditShow&&onEditShow(detailShow); setDetailShow(null); }}
          onGoContact={detailShow._source==='standalone' ? null : (id)=>{ setDetailShow(null); go('contact-detail', id||detailShow._sourceId); }}
          onDelete={onDeleteShow ? ()=>{
            if (!window.confirm(`למחוק את המופע "${detailShow.showName||'מופע'}"?`)) return;
            onDeleteShow(detailShow._source, detailShow._sourceId, detailShow.id);
            setDetailShow(null);
          } : null}
        />
      )}
      <div className="card">
        {filtered.length===0 ? <EmptyState icon="mic" msg="לא נמצאו מופעים"/> : filtered.map(sh=>(
          <div key={sh.id+sh._sourceId} className="row" style={{cursor:'pointer'}}
            onClick={()=>setDetailShow(sh)}>
            <div style={{width:40,height:40,borderRadius:10,background:'#f3e8ff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>🎤</div>
            <div style={{flex:1,marginRight:12}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3,flexWrap:'wrap'}}>
                <span style={{fontWeight:600,fontSize:15}}>{sh.showName||sh.showType||'מופע'}</span>
                {sh.status&&<span className="badge" style={{background:SC[sh.status]||'#f1f5f9',color:ST[sh.status]||'#475569',fontSize:11}}>{SHOW_ST[sh.status]||sh.status}</span>}
                {sh.tags?.map(t=><span key={t} className="pill" style={{fontSize:11}}>{t}</span>)}
              </div>
              <div style={{fontSize:12,color:'#64748b',display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}}>
                {sh._source==='standalone'
                  ? <span style={{color:'#166534',fontWeight:500}}>🎤 מופע עצמאי</span>
                  : <span style={{color:'#7c3aed',fontWeight:500}}>{sh._source==='contact'?'👤':'🏛'} {sh._sourceName}</span>
                }
                {sh.date&&<span>📅 {fmtD(sh.date)}{sh.time?` · ${sh.time}`:''}</span>}
                {sh.venue&&<span>🏛 {sh.venue}</span>}
                {sh.fee&&<span>💰 ₪{sh.fee}</span>}
                {sh.participantContactIds?.length>0&&(
                  <span style={{background:'#e0e7ff',color:'#3730a3',borderRadius:10,padding:'1px 7px',fontSize:11,fontWeight:600}}>
                    👥 {sh.participantContactIds.length} אנשי קשר
                  </span>
                )}
              </div>
            </div>
            {onEditShow && (
              <button onClick={e=>{e.stopPropagation();onEditShow(sh);}}
                style={{background:'none',border:'none',cursor:'pointer',padding:'6px 8px',borderRadius:8,color:'#94a3b8',flexShrink:0}}
                title="עריכת מופע">
                <I n="edit" s={16} c="#6366f1"/>
              </button>
            )}
            {onDeleteShow && (
              <button onClick={e=>{e.stopPropagation(); if(!window.confirm(`למחוק "${sh.showName||'מופע'}"?`)) return; onDeleteShow(sh._source,sh._sourceId,sh.id);}}
                style={{background:'none',border:'none',cursor:'pointer',padding:'6px 8px',borderRadius:8,color:'#94a3b8',flexShrink:0}}
                title="מחק מופע"
                onMouseOver={e=>e.currentTarget.style.color='#dc2626'} onMouseOut={e=>e.currentTarget.style.color='#94a3b8'}>
                <I n="x" s={16} c="currentColor"/>
              </button>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Import Contacts Modal ────────────────────────────────────────────────────
const IMPORT_CRM_FIELDS = [
  { key:'_skip',     label:'— לא לייבא —' },
  { key:'firstName', label:'שם פרטי' },
  { key:'lastName',  label:'שם משפחה' },
  { key:'phone',     label:'טלפון' },
  { key:'email',     label:'מייל' },
  { key:'role',      label:'תפקיד' },
  { key:'org',       label:'ארגון' },
  { key:'city',      label:'עיר' },
  { key:'source',    label:'מקור' },
  { key:'status',    label:'סטטוס' },
  { key:'birthday',  label:'יום הולדת' },
  { key:'tags',      label:'תגיות' },
  { key:'notes',     label:'הערות' },
];

function ImportContactsModal({ onClose, onDone }) {
  const [stage, setStage] = useState('upload'); // upload | mapping | preview | done
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [file, setFile] = useState(null);           // File object stored for re-upload
  const [analysis, setAnalysis] = useState(null);   // { headers, sampleRow, map, unrecognized }
  const [userMap, setUserMap] = useState({});        // { colIndex: fieldKey|'_skip' }
  const [preview, setPreview] = useState(null);
  const [skipDups, setSkipDups] = useState(true);
  const [result, setResult] = useState(null);
  const [shows, setShows] = useState([]);         // available standalone shows
  const [linkShowId, setLinkShowId] = useState(''); // show to link contacts to
  const fileRef = React.useRef();

  // Load standalone shows for picker
  React.useEffect(() => {
    fetch('/api/shows').then(r=>r.json()).then(d=>setShows(Array.isArray(d)?d:[])).catch(()=>{});
  }, []);

  const StatusPill = ({label, color, bg}) => (
    <span style={{fontSize:11,fontWeight:700,color,background:bg,padding:'2px 8px',borderRadius:10,whiteSpace:'nowrap'}}>{label}</span>
  );

  // Build { colIndex: fieldKey } from analysis.map
  const buildInitialUserMap = (an) => {
    const m = {};
    an.headers.forEach((h, i) => {
      const fieldKey = Object.keys(an.map).find(k => an.map[k] === i) || '_skip';
      m[i] = fieldKey;
    });
    return m;
  };

  // Build customMap { fieldKey: colIndex } from userMap (exclude _skip)
  const buildCustomMap = () => {
    const cm = {};
    Object.entries(userMap).forEach(([colIdx, fieldKey]) => {
      if (fieldKey && fieldKey !== '_skip') cm[fieldKey] = parseInt(colIdx);
    });
    return cm;
  };

  const callPreview = async (f, customMap) => {
    const fd = new FormData();
    fd.append('file', f);
    if (customMap) fd.append('customMap', JSON.stringify(customMap));
    const r = await fetch('/api/import-contacts/preview', { method:'POST', body:fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'שגיאה');
    return data;
  };

  const handleFile = async e => {
    const f = e.target.files[0]; if (!f) return;
    setFile(f); setLoading(true); setError('');
    try {
      const fd = new FormData(); fd.append('file', f);
      const r = await fetch('/api/import-contacts/analyze', { method:'POST', body:fd });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'שגיאה');

      // Always store analysis so user can go back to mapping from preview
      setAnalysis(data);
      setUserMap(buildInitialUserMap(data));

      if (data.unrecognized && data.unrecognized.length > 0) {
        // Has unrecognized columns → show mapping stage so user can assign them
        setStage('mapping');
      } else {
        // All columns recognized → go directly to preview (skip mapping stage)
        const pdata = await callPreview(f, null);
        setPreview(pdata); setStage('preview');
      }
    } catch(err) { setError(err.message); }
    finally { setLoading(false); e.target.value=''; }
  };

  const doPreviewWithMapping = async () => {
    setLoading(true); setError('');
    try {
      const pdata = await callPreview(file, buildCustomMap());
      setPreview(pdata); setStage('preview');
    } catch(err) { setError(err.message); }
    finally { setLoading(false); }
  };

  const doImport = async () => {
    setLoading(true); setError('');
    try {
      // שלח גם כפולים כשמקשרים למופע — השרת לא יוסיף אותם אבל יקשר למופע
      const rows = preview.rows.filter(r => !r._duplicate || !skipDups || !!linkShowId);
      const r = await fetch('/api/import-contacts/confirm', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ rows, skipDuplicates: skipDups, linkToShowId: linkShowId || null })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'שגיאה');
      setResult(data); setStage('done');
    } catch(err) { setError(err.message); }
    finally { setLoading(false); }
  };

  // Detect which column indices are "unrecognized" for highlighting
  const unrecognizedIdxSet = React.useMemo(() => {
    if (!analysis) return new Set();
    return new Set((analysis.unrecognized || []).map(u => u.index));
  }, [analysis]);

  // Check for duplicate field assignments in userMap
  const fieldUsageCount = React.useMemo(() => {
    const counts = {};
    Object.values(userMap).forEach(f => { if (f && f !== '_skip') counts[f] = (counts[f]||0) + 1; });
    return counts;
  }, [userMap]);

  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:820,maxHeight:'90vh',display:'flex',flexDirection:'column'}}>
        <ModalHeader title="📂 ייבוא אנשי קשר מ-Excel" onClose={onClose}/>

        {/* UPLOAD STAGE */}
        {stage==='upload' && (
          <div style={{padding:32,textAlign:'center'}}>
            <div style={{fontSize:48,marginBottom:12}}>📊</div>
            <div style={{fontWeight:700,fontSize:17,marginBottom:8}}>בחר קובץ Excel או XLS לייבוא</div>
            <div style={{color:'#64748b',fontSize:13,marginBottom:24,lineHeight:1.7}}>
              המערכת תזהה אוטומטית את העמודות, תתקן טלפון/מייל מוחלפים,<br/>
              שגיאות כתיב במייל, תווים בלתי נראים ומספרים בינלאומיים.
            </div>
            <input type="file" accept=".xlsx,.xls,.csv" ref={fileRef} style={{display:'none'}} onChange={handleFile}/>
            <button className="btn btn-primary" onClick={()=>fileRef.current.click()} disabled={loading} style={{fontSize:15,padding:'10px 28px'}}>
              {loading ? '⏳ מנתח...' : '📂 בחר קובץ'}
            </button>
            {error && <div style={{marginTop:16,color:'#dc2626',fontSize:13,background:'#fef2f2',padding:'10px 16px',borderRadius:8}}>{error}</div>}
          </div>
        )}

        {/* MAPPING STAGE */}
        {stage==='mapping' && analysis && (
          <>
            {/* Header banner */}
            {analysis.unrecognized.length > 0 ? (
              <div style={{padding:'12px 22px',background:'#fffbeb',borderBottom:'1px solid #fde68a',fontSize:13,color:'#92400e',display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:18}}>⚠️</span>
                <div>
                  <strong>נמצאו {analysis.unrecognized.length} עמודות לא מוכרות.</strong>{' '}
                  רק השורות המסומנות בצהוב דורשות בחירה. <strong>אין לשנות</strong> את השורות הירוקות — הן זוהו אוטומטית בצורה נכונה.
                </div>
              </div>
            ) : (
              <div style={{padding:'12px 22px',background:'#f0fdf4',borderBottom:'1px solid #86efac',fontSize:13,color:'#166534',display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:18}}>✅</span>
                <div>כל העמודות זוהו אוטומטית בצורה נכונה. ניתן לשנות שיוך רק אם נדרש.</div>
              </div>
            )}

            {/* Column mapping table */}
            <div style={{overflowY:'auto',flex:1}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                <thead style={{position:'sticky',top:0,background:'#f8fafc',zIndex:1}}>
                  <tr>
                    {['סטטוס','עמודה בקובץ','דוגמה מהשורה הראשונה','→ שדה ב-CRM'].map(h=>(
                      <th key={h} style={{padding:'10px 12px',textAlign:'right',fontSize:11,color:'#64748b',fontWeight:600,borderBottom:'2px solid #e2e8f0'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {analysis.headers.map((hdr, i) => {
                    const isUnknown = unrecognizedIdxSet.has(i);
                    const selectedField = userMap[i] || '_skip';
                    const isDuplicated = selectedField !== '_skip' && (fieldUsageCount[selectedField]||0) > 1;
                    const sample = analysis.sampleRow[i] || '';
                    const fieldLabel = IMPORT_CRM_FIELDS.find(f=>f.key===selectedField)?.label || '—';
                    return (
                      <tr key={i} style={{background: isUnknown ? '#fffbeb' : '#f0fdf4', borderBottom:'1px solid #e2e8f0'}}>
                        {/* Status */}
                        <td style={{padding:'8px 12px',textAlign:'center',width:60}}>
                          {isUnknown
                            ? <span style={{fontSize:18}} title="נדרש בחירה">⚠️</span>
                            : <span style={{fontSize:18}} title="זוהה אוטומטית — נעול">🔒</span>
                          }
                        </td>
                        {/* Column name */}
                        <td style={{padding:'8px 12px',fontWeight:700,color: isUnknown?'#92400e':'#166534'}}>
                          {hdr}
                          {isUnknown && <div style={{fontSize:10,color:'#d97706',fontWeight:400,marginTop:2}}>לא מוכר — בחר שדה</div>}
                          {!isUnknown && <div style={{fontSize:10,color:'#4ade80',fontWeight:400,marginTop:2}}>זוהה אוטומטית — נעול</div>}
                        </td>
                        {/* Sample data */}
                        <td style={{padding:'8px 12px',color:'#475569',fontStyle: sample?'normal':'italic',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',direction:'ltr',textAlign:'right'}}>
                          {sample || <span style={{color:'#cbd5e1',fontStyle:'italic'}}>אין דוגמה</span>}
                        </td>
                        {/* CRM field selector */}
                        <td style={{padding:'8px 12px',width:220}}>
                          {isUnknown ? (
                            <>
                              <select
                                value={selectedField}
                                onChange={ev => setUserMap(p => ({...p, [i]: ev.target.value}))}
                                style={{
                                  width:'100%', padding:'6px 10px', borderRadius:6, fontSize:13,
                                  border: isDuplicated ? '2px solid #f59e0b' : '2px solid #fbbf24',
                                  background: selectedField==='_skip' ? '#fef9c3' : '#f0fdf4',
                                  color: selectedField==='_skip' ? '#92400e' : '#166534',
                                  fontWeight: 600,
                                }}
                              >
                                {IMPORT_CRM_FIELDS.map(f => (
                                  <option key={f.key} value={f.key}>{f.label}</option>
                                ))}
                              </select>
                              {isDuplicated && <div style={{fontSize:10,color:'#d97706',marginTop:2}}>⚠️ שדה זה כבר משויך לעמודה אחרת</div>}
                            </>
                          ) : (
                            <div style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',borderRadius:6,background:'#dcfce7',border:'1px solid #86efac'}}>
                              <span style={{fontSize:13,fontWeight:700,color:'#166534',flex:1}}>{fieldLabel}</span>
                              <span style={{fontSize:11,color:'#4ade80'}}>נעול</span>
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* Summary preview of what will be imported */}
            <div style={{padding:'10px 22px',background:'#f8fafc',borderTop:'1px solid #e2e8f0',fontSize:12,color:'#64748b'}}>
              <strong style={{color:'#334155'}}>תצוגה מקדימה של שורה ראשונה לפי השיוך הנוכחי:</strong>
              <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:6}}>
                {Object.entries(buildCustomMap()).map(([field, colIdx]) => {
                  const fieldLabel = IMPORT_CRM_FIELDS.find(f=>f.key===field)?.label || field;
                  const sample = analysis.sampleRow[colIdx] || '';
                  return (
                    <span key={field} style={{background:'#e0f2fe',color:'#0369a1',padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:600}}>
                      {fieldLabel}: <span style={{fontWeight:400,direction:'ltr'}}>{sample || '—'}</span>
                    </span>
                  );
                })}
              </div>
            </div>

            {error && <div style={{margin:'0 22px',color:'#dc2626',fontSize:13}}>{error}</div>}
            <div style={{padding:'14px 22px',borderTop:'1px solid #f1f5f9',display:'flex',gap:10,alignItems:'center'}}>
              <button className="btn btn-primary" onClick={doPreviewWithMapping} disabled={loading} style={{padding:'8px 24px'}}>
                {loading ? '⏳ מנתח...' : '▶ המשך לתצוגה מקדימה'}
              </button>
              <button className="btn btn-secondary" onClick={()=>{ setUserMap(buildInitialUserMap(analysis)); }} disabled={loading} title="חזור לזיהוי האוטומטי">
                🔄 אפס
              </button>
              <button className="btn btn-secondary" onClick={()=>setStage('upload')} disabled={loading}>בחר קובץ אחר</button>
              <button className="btn btn-secondary" onClick={onClose} disabled={loading}>ביטול</button>
            </div>
          </>
        )}

        {/* PREVIEW STAGE */}
        {stage==='preview' && preview && (
          <>
            <div style={{display:'flex',gap:10,padding:'12px 22px',background:'#f8fafc',borderBottom:'1px solid #f1f5f9',flexWrap:'wrap',alignItems:'center'}}>
              <StatusPill label={`${preview.total} רשומות`} color="#1e293b" bg="#e2e8f0"/>
              {preview.fixCount>0  && <StatusPill label={`✅ ${preview.fixCount} תוקנו אוטומטית`} color="#166534" bg="#dcfce7"/>}
              {preview.warnCount>0 && <StatusPill label={`⚠️ ${preview.warnCount} אזהרות`} color="#92400e" bg="#fef3c7"/>}
              {preview.dupCount>0  && <StatusPill label={`🔁 ${preview.dupCount} כפילויות`} color="#6d28d9" bg="#ede9fe"/>}
              <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer'}}>
                <input type="checkbox" checked={skipDups} onChange={e=>setSkipDups(e.target.checked)}/>
                דלג על כפילויות
              </label>
              {shows.length > 0 && (
                <div style={{display:'flex',alignItems:'center',gap:6,marginRight:'auto'}}>
                  <span style={{fontSize:12,color:'#64748b',whiteSpace:'nowrap'}}>🎭 קשר לארוע:</span>
                  <select value={linkShowId} onChange={e=>setLinkShowId(e.target.value)}
                    style={{fontSize:12,padding:'4px 8px',borderRadius:6,border:'1px solid #e2e8f0',background:'#fff',maxWidth:220}}>
                    <option value="">— ללא —</option>
                    {shows.map(s=>(
                      <option key={s.id} value={s.id}>{s.showName || s.title || s.id}</option>
                    ))}
                  </select>
                </div>
              )}
            </div>
            <div style={{overflowY:'auto',flex:1}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                <thead style={{position:'sticky',top:0,background:'#f8fafc',zIndex:1}}>
                  <tr>
                    {['#','שם פרטי','שם משפחה','טלפון','מייל','תגיות','תיקונים / אזהרות'].map(h=>(
                      <th key={h} style={{padding:'8px 10px',textAlign:'right',fontSize:11,color:'#64748b',fontWeight:600,borderBottom:'2px solid #e2e8f0'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {preview.rows.map((row, i) => {
                    const hasFix  = row._fixes?.length > 0;
                    const hasWarn = row._warnings?.length > 0;
                    const isDup   = !!row._duplicate;
                    const bg = isDup ? '#faf5ff' : hasWarn ? '#fffbeb' : hasFix ? '#f0fdf4' : i%2===0?'#fff':'#f8fafc';
                    return (
                      <tr key={i} style={{background:bg,borderBottom:'1px solid #f1f5f9'}}>
                        <td style={{padding:'6px 10px',color:'#94a3b8'}}>{row._row}</td>
                        <td style={{padding:'6px 10px',fontWeight:600}}>{row.firstName||'—'}</td>
                        <td style={{padding:'6px 10px'}}>{row.lastName||'—'}</td>
                        <td style={{padding:'6px 10px',direction:'ltr',textAlign:'right'}}>{row.phone||'—'}</td>
                        <td style={{padding:'6px 10px',direction:'ltr',textAlign:'right'}}>{row.email||'—'}</td>
                        <td style={{padding:'6px 10px'}}>{(row.tags||[]).join(', ')||'—'}</td>
                        <td style={{padding:'6px 10px'}}>
                          {isDup   && <span style={{color:'#7c3aed',fontSize:11}}>🔁 {row._duplicate} </span>}
                          {hasFix  && row._fixes.map((f,j)=><span key={j} style={{color:'#166534',fontSize:11,display:'block'}}>✅ {f}</span>)}
                          {hasWarn && row._warnings.map((w,j)=><span key={j} style={{color:'#92400e',fontSize:11,display:'block'}}>⚠️ {w}</span>)}
                          {!isDup&&!hasFix&&!hasWarn&&<span style={{color:'#94a3b8',fontSize:11}}>תקין</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            {error && <div style={{margin:'0 22px',color:'#dc2626',fontSize:13}}>{error}</div>}
            <div style={{padding:'14px 22px',borderTop:'1px solid #f1f5f9',display:'flex',gap:10,alignItems:'center'}}>
              <button className="btn btn-primary" onClick={doImport} disabled={loading} style={{padding:'8px 24px'}}>
                {loading ? '⏳ מייבא...' : `✅ ייבא ${skipDups ? preview.rows.filter(r=>!r._duplicate).length : preview.total} אנשי קשר`}
              </button>
              {analysis && <button className="btn btn-secondary" onClick={()=>setStage('mapping')} disabled={loading}>ערוך שיוך שדות</button>}
              <button className="btn btn-secondary" onClick={()=>setStage('upload')} disabled={loading}>בחר קובץ אחר</button>
              <button className="btn btn-secondary" onClick={onClose} disabled={loading}>ביטול</button>
            </div>
          </>
        )}

        {/* DONE STAGE */}
        {stage==='done' && result && (
          <div style={{padding:40,textAlign:'center'}}>
            <div style={{fontSize:52,marginBottom:12}}>🎉</div>
            <div style={{fontWeight:700,fontSize:20,marginBottom:8,color:'#166534'}}>הייבוא הושלם בהצלחה!</div>
            <div style={{fontSize:15,color:'#475569',marginBottom:6}}>נוספו <strong>{result.added}</strong> אנשי קשר חדשים</div>
            {result.skipped>0 && <div style={{fontSize:13,color:'#94a3b8'}}>דולגו {result.skipped} כפילויות</div>}
            {result.linkedToShow && linkShowId && (
              <div style={{fontSize:13,color:'#6d28d9',marginTop:6,background:'#ede9fe',padding:'6px 16px',borderRadius:8,display:'inline-block'}}>
                🎭 {result.added} אנשי קשר קושרו לארוע
              </div>
            )}
            <div style={{marginTop:28,display:'flex',gap:10,justifyContent:'center'}}>
              <button className="btn btn-primary" onClick={()=>{onDone&&onDone();onClose();}}>סגור ורענן</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Duplicate Contacts Scanner ───────────────────────────────────────────────
function DuplicateScanner({ contacts, go, onClose }) {

  const groups = React.useMemo(() => {
    const map = {};
    contacts.forEach(c => {
      const norm = normalizePhone(c.phone);
      if (!norm || !norm.trim()) return;
      if (!map[norm]) map[norm] = [];
      map[norm].push(c);
    });
    return Object.entries(map).filter(([,arr])=>arr.length>1).sort((a,b)=>b[1].length-a[1].length);
  }, [contacts]);

  // ── מסך ראשי ──────────────────────────────────────────────────────────────────
  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:580,maxHeight:'85vh',display:'flex',flexDirection:'column'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'18px 22px',borderBottom:'1px solid #f1f5f9',flexShrink:0}}>
          <div style={{fontWeight:700,fontSize:17}}>🔍 בדיקת כפילויות לפי טלפון</div>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'#94a3b8'}}>✕</button>
        </div>
        <div style={{overflowY:'auto',padding:'18px 22px',flex:1}}>
          {groups.length===0
            ? <div style={{textAlign:'center',padding:'40px 0',color:'#64748b'}}>
                <div style={{fontSize:40,marginBottom:12}}>✅</div>
                <div style={{fontWeight:600,fontSize:16}}>לא נמצאו כפילויות</div>
                <div style={{fontSize:12,color:'#94a3b8',marginTop:6}}>כל מספרי הטלפון ייחודיים</div>
              </div>
            : <>
                <div style={{marginBottom:16,padding:'10px 14px',background:'#fef3c7',borderRadius:8,fontSize:13,color:'#92400e'}}>
                  נמצאו <strong>{groups.length}</strong> מספרי טלפון עם יותר מכרטיס אחד
                </div>
                {groups.map(([phone, arr])=>(
                  <div key={phone} style={{border:'1px solid #e2e8f0',borderRadius:10,marginBottom:12,overflow:'hidden'}}>
                    <div style={{background:'#fef3c7',padding:'8px 14px',fontWeight:700,fontSize:13,color:'#92400e',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <span>📞</span><span style={{direction:'ltr'}}>{phone}</span>
                        <span style={{fontWeight:400,fontSize:12,color:'#78350f'}}>— {arr.length} כרטיסים</span>
                      </div>
                    </div>
                    {arr.map(c=>(
                      <div key={c.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderBottom:'1px solid #f8fafc',background:'#fff'}}>
                        <div>
                          <div style={{fontWeight:600,fontSize:14}}>{c.name}</div>
                          <div style={{fontSize:12,color:'#64748b',display:'flex',gap:10,flexWrap:'wrap',marginTop:2}}>
                            {c.role&&<span>{c.role}</span>}
                            {c.email&&<span>{c.email}</span>}
                            {(c.conversations||[]).length>0&&<span>💬 {c.conversations.length}</span>}
                            {(c.showHistory||[]).length>0&&<span>🎤 {c.showHistory.length}</span>}
                          </div>
                        </div>
                        <button onClick={()=>{onClose();go('contact-detail',c.id);}}
                          style={{fontSize:12,color:'#6366f1',background:'#eef2ff',border:'none',borderRadius:6,padding:'4px 10px',cursor:'pointer',fontWeight:600}}>
                          פתח כרטיס
                        </button>
                      </div>
                    ))}
                  </div>
                ))}
              </>
          }
        </div>
      </div>
    </div>
  );
}

// ─── Settings / Google Sync ───────────────────────────────────────────────────
function GmailAccountsSection() {
  const [accounts, setAccounts] = React.useState(null);
  const [loading, setLoading] = React.useState(false);

  const load = async () => {
    try { const d = await (await fetch('/api/auth/accounts')).json(); setAccounts(d.accounts||[]); } catch { setAccounts([]); }
  };
  React.useEffect(() => { load(); }, []);

  const remove = async (email) => {
    if (!confirm(`למחוק את החשבון ${email}?`)) return;
    setLoading(true);
    await fetch(`/api/auth/accounts/${encodeURIComponent(email)}`, { method:'DELETE' });
    await load();
    setLoading(false);
  };

  const acctColor = (email) => {
    const palette = ['#4f46e5','#0891b2','#059669','#d97706','#dc2626','#7c3aed'];
    let h = 0; for (const ch of (email||'')) h = (h*31+ch.charCodeAt(0))&0xffff;
    return palette[h % palette.length];
  };

  return (
    <div className="card" style={{padding:22,marginBottom:20}}>
      <h2 style={{fontSize:17,fontWeight:700,marginBottom:6,display:'flex',alignItems:'center',gap:8}}>
        📧 חשבונות Gmail לקריאת מיילים
      </h2>
      <p style={{fontSize:13,color:'#64748b',marginBottom:16,lineHeight:1.6}}>
        הוסף עד 3 חשבונות Gmail — המערכת תחפש תכתובות עם לקוחות בכולם.
        החשבון הראשי (tony@thezebra.co.il) מחובר אוטומטית דרך כפתור "התחבר עם Google" למעלה.
      </p>
      {accounts===null && <div style={{color:'#94a3b8',fontSize:13}}>⏳ טוען...</div>}
      {accounts!==null && accounts.map(a => (
        <div key={a.email} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'#f8fafc',borderRadius:8,border:'1px solid #e2e8f0',marginBottom:8}}>
          <span style={{width:10,height:10,borderRadius:'50%',background:acctColor(a.email),flexShrink:0,display:'inline-block'}}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:13}}>{a.name}</div>
            <div style={{fontSize:12,color:'#94a3b8'}}>{a.email}</div>
          </div>
          {a.isPrimary
            ? <span style={{fontSize:11,color:'#4f46e5',fontWeight:600,background:'#eef2ff',padding:'2px 8px',borderRadius:8}}>ראשי</span>
            : <button className="btn btn-danger btn-sm" style={{fontSize:12}} disabled={loading} onClick={()=>remove(a.email)}>הסר</button>
          }
        </div>
      ))}
      {accounts!==null && (
        <a href="/auth/google/add" className="btn btn-secondary" style={{display:'inline-flex',alignItems:'center',gap:8,textDecoration:'none',marginTop:4,fontSize:13}}>
          <I n="plus" s={14} c="#4f46e5"/>הוסף חשבון Gmail
        </a>
      )}
    </div>
  );
}

// ─── Signatures Manager ───────────────────────────────────────────────────────
function SignaturesManager() {
  const [sigs, setSigs]       = useState([]);
  const [editing, setEditing] = useState(null);  // { id, name, text, channel } | 'new'
  const [loading, setLoading] = useState(true);

  const load = async () => {
    try { setSigs(await api.get('/api/signatures')); }
    catch(e) { console.error(e); }
    finally { setLoading(false); }
  };
  useEffect(()=>{ load(); }, []);

  const startNew = () => setEditing({ id:'', name:'', text:'', channel:'both', isDefault:false });

  const save = async () => {
    if (!editing.name.trim()) return;
    if (editing.id) {
      await api.put(`/api/signatures/${editing.id}`, editing);
    } else {
      await api.post('/api/signatures', editing);
    }
    setEditing(null); load();
  };

  const del = async (id) => {
    if (!confirm('למחוק חתימה זו?')) return;
    await api.del(`/api/signatures/${id}`);
    load();
  };

  const setDefault = async (id) => {
    await api.put(`/api/signatures/${id}/set-default`, {});
    load();
  };

  const CHANNEL_LABELS = { both:'שניהם', email:'מייל בלבד', whatsapp:'WhatsApp בלבד' };

  if (loading) return <div style={{padding:16,color:'#94a3b8'}}>טוען חתימות...</div>;

  return (
    <div className="card" style={{padding:22,marginBottom:20}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <h2 style={{fontSize:17,fontWeight:700,margin:0,display:'flex',alignItems:'center',gap:8}}>
          ✍️ ניהול חתימות
        </h2>
        <button className="btn btn-primary btn-sm" onClick={startNew}>+ חתימה חדשה</button>
      </div>

      {/* Signature list */}
      {sigs.length === 0 && !editing && (
        <p style={{color:'#94a3b8',fontSize:14}}>אין חתימות שמורות.</p>
      )}
      {sigs.map(s => (
        <div key={s.id} style={{border:'1.5px solid #e2e8f0',borderRadius:10,padding:14,marginBottom:10,
          ...(s.isDefault?{borderColor:'#6366f1',background:'#f5f3ff'}:{})}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,flexWrap:'wrap'}}>
            {s.isDefault && <span style={{background:'#6366f1',color:'#fff',fontSize:11,padding:'2px 8px',borderRadius:12}}>ברירת מחדל</span>}
            <span style={{fontWeight:700,fontSize:14}}>{s.name}</span>
            <span style={{fontSize:11,color:'#94a3b8',marginRight:'auto'}}>{CHANNEL_LABELS[s.channel]||s.channel}</span>
          </div>
          <pre style={{fontFamily:'inherit',fontSize:13,color:'#475569',whiteSpace:'pre-wrap',margin:'0 0 10px',
            background:'#f8fafc',borderRadius:6,padding:'8px 10px',lineHeight:1.6}}>{s.text}</pre>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {!s.isDefault && (
              <button className="btn btn-sm" style={{background:'#ede9fe',color:'#7c3aed',border:'none'}}
                onClick={()=>setDefault(s.id)}>⭐ הגדר כברירת מחדל</button>
            )}
            <button className="btn btn-secondary btn-sm" onClick={()=>setEditing({...s})}>✏️ ערוך</button>
            <button className="btn btn-sm" style={{background:'#fee2e2',color:'#dc2626',border:'none'}}
              onClick={()=>del(s.id)}>🗑️ מחק</button>
          </div>
        </div>
      ))}

      {/* Edit / New form */}
      {editing && (
        <div style={{border:'2px solid #6366f1',borderRadius:12,padding:18,marginTop:12,background:'#f5f3ff'}}>
          <h3 style={{fontSize:15,fontWeight:700,marginBottom:14,color:'#4f46e5'}}>
            {editing.id ? 'ערוך חתימה' : 'חתימה חדשה'}
          </h3>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:13,fontWeight:600,display:'block',marginBottom:4}}>שם החתימה</label>
            <input className="inp" value={editing.name} onChange={e=>setEditing(p=>({...p,name:e.target.value}))}
              placeholder="למשל: חתימה ראשית" style={{marginBottom:0}}/>
          </div>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:13,fontWeight:600,display:'block',marginBottom:4}}>תוכן החתימה</label>
            <textarea className="inp" rows={5} value={editing.text}
              onChange={e=>setEditing(p=>({...p,text:e.target.value}))}
              placeholder="כתוב את תוכן החתימה..." style={{resize:'vertical',marginBottom:0}}/>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:13,fontWeight:600,display:'block',marginBottom:4}}>ערוץ</label>
            <select className="inp" style={{marginBottom:0}} value={editing.channel}
              onChange={e=>setEditing(p=>({...p,channel:e.target.value}))}>
              <option value="both">שניהם (מייל + WhatsApp)</option>
              <option value="email">מייל בלבד</option>
              <option value="whatsapp">WhatsApp בלבד</option>
            </select>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary btn-sm" onClick={save}>💾 שמור</button>
            <button className="btn btn-secondary btn-sm" onClick={()=>setEditing(null)}>ביטול</button>
          </div>
        </div>
      )}
    </div>
  );
}

function WpConnectionCard() {
  const [status,      setStatus]      = useState(null);
  const [msg,         setMsg]         = useState('');
  const [polling,     setPolling]     = useState(false);
  const [pollResult,  setPollResult]  = useState(null);

  const check = async () => {
    setStatus('checking'); setMsg('');
    try {
      const r = await api.get('/api/wp/ping');
      setStatus('ok');
      setMsg('✅ חיבור תקין! WordPress מגיב.');
    } catch(e) {
      setStatus('error');
      setMsg('❌ ' + e.message);
    }
  };

  const pollNow = async () => {
    setPolling(true); setPollResult(null);
    try {
      const r = await api.post('/api/wp/poll-now', {});
      setPollResult({ ok: true, msg: r.message, events: r.events || [] });
    } catch(e) {
      setPollResult({ ok: false, msg: e.message });
    }
    setPolling(false);
  };

  return (
    <div className="card" style={{padding:22,marginBottom:20}}>
      <h2 style={{fontSize:17,fontWeight:700,marginBottom:4,display:'flex',alignItems:'center',gap:8}}>
        🌐 חיבור WordPress
      </h2>
      <p style={{fontSize:13,color:'#64748b',marginBottom:14}}>
        בדוק חיבור לאתר, או הפעל סריקה ידנית לאירועים חדשים (חתימות, צפיות).
      </p>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button className="btn btn-secondary btn-sm" onClick={check} disabled={status==='checking'}>
          {status==='checking' ? '⏳ בודק...' : '🔌 בדוק חיבור'}
        </button>
        <button className="btn btn-primary btn-sm" onClick={pollNow} disabled={polling}>
          {polling ? '⏳ סורק...' : '🔄 סרוק עכשיו'}
        </button>
        <button className="btn btn-secondary btn-sm" onClick={async()=>{
          try { const r=await api.post('/api/wp/test-wa',{}); alert('✅ ' + r.message); }
          catch(e) { alert('❌ ' + e.message); }
        }}>📱 בדוק WhatsApp</button>
      </div>
      {msg && (
        <div style={{marginTop:10,padding:'8px 12px',borderRadius:8,fontSize:13,
          background: status==='ok' ? '#f0fdf4' : '#fef2f2',
          color:      status==='ok' ? '#166534'  : '#dc2626',
          border:     `1px solid ${status==='ok' ? '#bbf7d0' : '#fecaca'}`}}>
          {msg}
        </div>
      )}
      {pollResult && (
        <div style={{marginTop:10,padding:'10px 12px',borderRadius:8,fontSize:13,
          background: pollResult.ok ? '#f0fdf4' : '#fef2f2',
          color:      pollResult.ok ? '#166534'  : '#dc2626',
          border:     `1px solid ${pollResult.ok ? '#bbf7d0' : '#fecaca'}`}}>
          {pollResult.msg}
          {pollResult.events?.length > 0 && (
            <div style={{marginTop:6,fontSize:12}}>
              {pollResult.events.map((e,i) => (
                <div key={i}>• {e.event_type} | {e.ref_id} | {e.created_at}</div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
