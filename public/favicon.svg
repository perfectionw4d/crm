<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#1e1b4b"/>
  <!-- body / torso orange -->
  <polygon points="28,28 36,28 38,42 26,42" fill="#f97316"/>
  <!-- head blue -->
  <circle cx="32" cy="20" r="7" fill="#38bdf8"/>
  <!-- left arm -->
  <line x1="28" y1="32" x2="16" y2="26" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- right arm raised -->
  <line x1="36" y1="30" x2="50" y2="20" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- left leg -->
  <line x1="28" y1="42" x2="22" y2="56" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- right leg -->
  <line x1="36" y1="42" x2="44" y2="54" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- sparkle dots -->
  <circle cx="54" cy="16" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="58" cy="26" r="1.8" fill="#38bdf8" opacity="0.5"/>
  <circle cx="50" cy="10" r="1.5" fill="#f97316" opacity="0.7"/>
</svg>
